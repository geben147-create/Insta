name: Kukppong Wine 2 Episodes - Edge TTS Audio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research-hub-20261108/kukppong-wine-scripts-20261116/edge_tts_generate.py'
      - 'research-hub-20261108/kukppong-wine-scripts-20261116/data/ep03.json'
      - 'research-hub-20261108/kukppong-wine-scripts-20261116/data/ep04.json'
      - '.github/workflows/kukppong-wine-edge-tts-20261116.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free Edge TTS client
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts
          ffmpeg -version | head -n 1
      - name: Synthesize Korean narration 8 sections for EP03 and EP04
        run: |
          python research-hub-20261108/kukppong-wine-scripts-20261116/edge_tts_generate.py
      - name: Publish actual MP3 files to repo for GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-hub-20261108/kukppong-wine-scripts-20261116/audio/
          if git diff --cached --quiet; then
            echo 'No new audio files'
          else
            git commit -m "Publish validated Edge-TTS Korean narration MP3s EP03 EP04"
            git push origin HEAD:main
          fi
