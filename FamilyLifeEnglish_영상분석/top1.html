<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1위</title><style>
:root{--bg:#fbfaf7;--fg:#1d1d1f;--mut:#6b6b70;--card:#fff;--line:#e4e2dc;--acc:#2f6fd6;--acc2:#e0553d;--chip:#eef3fc;--code:#f4f2ec}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141416;--fg:#ececef;--mut:#a0a0a8;--card:#1d1d21;--line:#303036;--acc:#7aa7ff;--acc2:#ff8a70;--chip:#22304a;--code:#26262b}}
:root[data-theme=dark]{--bg:#141416;--fg:#ececef;--mut:#a0a0a8;--card:#1d1d21;--line:#303036;--acc:#7aa7ff;--acc2:#ff8a70;--chip:#22304a;--code:#26262b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "Pretendard","Malgun Gothic",system-ui,sans-serif}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
header.top a{color:var(--acc);text-decoration:none;font-weight:600}header.top .sp{flex:1}
main{max-width:1180px;margin:0 auto;padding:16px}h1{font-size:24px;margin:8px 0 4px}h2{font-size:20px;margin:28px 0 8px;border-left:4px solid var(--acc);padding-left:8px}
h3{font-size:17px;margin:18px 0 6px}.mut{color:var(--mut)}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.chips span{display:inline-block;background:var(--chip);border-radius:99px;padding:1px 9px;margin:2px 4px 2px 0;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}.kpi{font-size:22px;font-weight:700}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border-bottom:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:top}
th{background:var(--card);position:sticky;top:0}td.n{white-space:nowrap}
img{max-width:100%;height:auto;border-radius:6px;display:block}.strip{display:flex;gap:4px;overflow-x:auto}.strip img{width:150px;flex:0 0 auto}
.cutimgs{display:flex;gap:3px}.cutimgs img{width:110px}
.pr{display:flex;gap:6px;align-items:flex-start;margin:4px 0}.pl{flex:0 0 auto;font-size:12px;color:var(--mut);min-width:44px}
code.prompt{flex:1;background:var(--code);border-radius:6px;padding:4px 7px;font-size:12.5px;white-space:pre-wrap;word-break:break-word}
button.cp,.bigcp{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:2px 8px;cursor:pointer;font-size:12px}
.bigcp{font-size:14px;padding:6px 12px;margin:4px 6px 4px 0}
.ytlink{font-size:12px;color:var(--acc);white-space:nowrap}
svg.emo{width:100%;max-width:720px;height:auto}svg.emo polyline{fill:none;stroke:var(--acc2);stroke-width:2.5}svg.emo .axis{stroke:var(--line)}
svg.emo circle{fill:var(--acc2)}svg.emo text{font-size:11px;fill:var(--mut);text-anchor:middle}
details>summary{cursor:pointer;font-weight:600;padding:4px 0}.sel{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.bar{height:8px;background:var(--acc);border-radius:4px}.tag{font-size:12px;border-radius:4px;padding:0 5px;background:var(--chip)}
.warn{border-left:4px solid var(--acc2)}
@media (max-width:640px){main{padding:12px 16px}.cutimgs img{width:84px}h1{font-size:20px}}
</style></head><body><header class="top"><a href="index.html">채널 개요</a> <a href="hook.html">🎣 훅 분석(20편)</a> <a href="top1.html">1위</a> <a href="top2.html">2위</a> <a href="top3.html">3위</a> <a href="summary.html">4~8위 요약</a><span class="sp"></span><span class="mut" style="font-size:12px">공개판 · 원본 사진·자막 원문 없음(유튜브 해당 초 링크)</span></header><main><h1>1위 — 분석 준비 중</h1></main><script>
const ANIMALS=[{"id": "otter", "ko": "수달", "noun": "otter"}, {"id": "chinchilla", "ko": "친칠라", "noun": "chinchilla"}, {"id": "chipmunk", "ko": "다람쥐", "noun": "chipmunk"}, {"id": "kitten", "ko": "아기 고양이", "noun": "kitten"}, {"id": "puppy", "ko": "말티즈 강아지", "noun": "puppy"}, {"id": "penguin", "ko": "아기 펭귄", "noun": "penguin chick"}, {"id": "bunny", "ko": "토끼", "noun": "bunny"}, {"id": "redpanda", "ko": "레서판다", "noun": "red panda cub"}, {"id": "capybara", "ko": "카피바라", "noun": "baby capybara"}, {"id": "guineapig", "ko": "기니피그", "noun": "guinea pig"}, {"id": "hedgehog", "ko": "고슴도치", "noun": "hedgehog"}];const STYLES=[{"id": "anim3d", "ko": "3D 애니(원본과 같은 결)", "en": "3D animated family film still, soft global illumination, warm cozy lighting, rounded shapes, 16:9"}, {"id": "mini", "ko": "실사 미니어처", "en": "photorealistic miniature diorama photo, real fur texture, shallow depth of field, soft natural light, 16:9"}];
function expand(raw,a,s){const n=a.noun;return raw.replaceAll('{BOY}','a little '+n+' boy').replaceAll('{GIRL}','a little '+n+' girl with a tiny red hair bow')
 .replaceAll('{MOM}','a '+n+' mom').replaceAll('{DAD}','a '+n+' dad').replaceAll('{PET}','a tiny pet puppy')+(raw.length>40?', '+s.en:'');}
function applyAll(){const a=ANIMALS.find(x=>x.id===document.getElementById('animal')?.value)||ANIMALS[0];
 const s=STYLES.find(x=>x.id===document.getElementById('style')?.value)||STYLES[0];
 document.querySelectorAll('code.prompt').forEach(c=>c.textContent=expand(c.dataset.raw,a,s));
 try{localStorage.setItem('fle_animal',a.id);localStorage.setItem('fle_style',s.id);}catch(e){}}
async function copyText(t,b){try{await navigator.clipboard.writeText(t);const o=b.textContent;b.textContent='복사됨';setTimeout(()=>b.textContent=o,1200);}catch(e){alert('복사 실패');}}
document.addEventListener('click',e=>{if(e.target.matches('button.cp')){copyText(e.target.previousElementSibling.textContent,e.target);}
 if(e.target.matches('.bigcp')){const sc=document.getElementById(e.target.dataset.scope)||document;const t=[...sc.querySelectorAll('code.prompt')].map(c=>c.textContent).join('\n\n');copyText(t,e.target);}});
document.addEventListener('DOMContentLoaded',()=>{const A=document.getElementById('animal'),S=document.getElementById('style');
 if(A){A.innerHTML=ANIMALS.map(a=>`<option value="${a.id}">${a.ko}</option>`).join('');S.innerHTML=STYLES.map(s=>`<option value="${s.id}">${s.ko}</option>`).join('');
 try{A.value=localStorage.getItem('fle_animal')||'kitten';S.value=localStorage.getItem('fle_style')||'anim3d';}catch(e){A.value='kitten';}
 A.onchange=S.onchange=applyAll;applyAll();}});
</script></body></html>
