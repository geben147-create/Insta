<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>표·문서 보기</title><style>
body{margin:0;background:#0f1115;color:#e8eaf0;font-family:"Malgun Gothic",system-ui,sans-serif;font-size:13px}a{color:#7cc4ff}
.top{position:sticky;top:0;background:#0f1115f2;padding:8px 12px;border-bottom:1px solid #2a2f3a;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:3}input,button,select{background:#181b22;color:#e8eaf0;border:1px solid #2a2f3a;border-radius:6px;padding:5px 8px}
table{border-collapse:collapse;width:max-content;min-width:100%}th{position:sticky;top:44px;background:#222733;cursor:pointer;text-align:left;white-space:nowrap}td,th{border-bottom:1px solid #2a2f3a;padding:4px 8px;vertical-align:top;max-width:420px}td.n{text-align:right;color:#ff6b6b;font-variant-numeric:tabular-nums}.md{max-width:900px;margin:0 auto;padding:16px 20px;line-height:1.7}.md pre{background:#0a0d13;padding:12px;border-radius:8px;overflow:auto;white-space:pre-wrap}.md code{background:#1f2430;padding:1px 5px;border-radius:4px}.md table{width:auto}.md h1,.md h2{border-bottom:1px solid #2a2f3a;padding-bottom:4px}.btn{background:#ff6d00;border-color:#ff6d00;color:#fff;font-weight:700}
</style></head><body><div class="top" id="top"><b id="t"></b></div><div id="o"></div><script>
var q=new URLSearchParams(location.search),f=q.get('f')||'',o=document.getElementById('o'),top=document.getElementById('top');document.getElementById('t').textContent=decodeURIComponent(f);
function esc(s){return String(s).replace(/[<>&]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;'}[c]})}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s,)"]+)/g,'<a href="$1" target="_blank">$1</a>')}
function parseCsv(s){var rows=[],row=[],fl='',qq=false;if(s.charCodeAt(0)===65279)s=s.slice(1);for(var i=0;i<s.length;i++){var c=s[i];if(qq){if(c==='"'){if(s[i+1]==='"'){fl+='"';i++}else qq=false}else fl+=c}else{if(c==='"')qq=true;else if(c===','){row.push(fl);fl=''}else if(c==='\n'){row.push(fl);rows.push(row);row=[];fl=''}else if(c!=='\r')fl+=c}}if(fl||row.length){row.push(fl);rows.push(row)}return rows}
function md(s){var out=[],lines=s.split('\n'),i=0,inc=false,buf=[];function inl(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')}
 for(;i<lines.length;i++){var l=lines[i];if(/^```/.test(l)){if(inc){out.push('<pre>'+esc(buf.join('\n'))+'</pre>');buf=[];inc=false}else inc=true;continue}if(inc){buf.push(l);continue}
 var m;if(m=l.match(/^(#{1,4})\s+(.*)/)){out.push('<h'+m[1].length+'>'+inl(m[2])+'</h'+m[1].length+'>')}else if(/^\|.*\|\s*$/.test(l)&&/^\|[\s:|-]+\|\s*$/.test(lines[i+1]||'')){var h=l.split('|').slice(1,-1);var t='<table><tr>'+h.map(function(x){return'<th>'+inl(x.trim())+'</th>'}).join('')+'</tr>';i+=2;while(i<lines.length&&/^\|/.test(lines[i])){t+='<tr>'+lines[i].split('|').slice(1,-1).map(function(x){return'<td>'+inl(x.trim())+'</td>'}).join('')+'</tr>';i++}i--;out.push(t+'</table>')}else if(/^\s*[-*]\s+/.test(l)){out.push('<div>• '+inl(l.replace(/^\s*[-*]\s+/,''))+'</div>')}else if(l.trim()===''){out.push('<br>')}else out.push('<p style="margin:4px 0">'+inl(l)+'</p>')}
 return out.join('\n')}
fetch(decodeURIComponent(f)).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
 if(/\.md$/i.test(f)){o.innerHTML='<div class="md">'+md(t)+'</div>';return}
 var rows=parseCsv(t.replace(/\t/g,f.match(/\.tsv$/)?'\t':'\t'));var hdr=rows.shift();var page=0,PER=300,sortC=-1,asc=false,filt='';
 top.insertAdjacentHTML('beforeend','<input id="s" placeholder="검색" style="width:180px"><span id="c"></span><button id="pv">◀</button><button id="nx">▶</button><a class="btn" style="padding:5px 10px;border-radius:6px;text-decoration:none" href="'+f+'" download>⬇ CSV 받기</a>');
 function draw(){var a=rows.filter(function(r){return!filt||r.join(' ').toLowerCase().indexOf(filt)>=0});if(sortC>=0)a.sort(function(x,y){var X=x[sortC],Y=y[sortC],nx=parseFloat(X),ny=parseFloat(Y);var r=(!isNaN(nx)&&!isNaN(ny))?nx-ny:String(X).localeCompare(String(Y));return asc?r:-r});
  var pages=Math.max(1,Math.ceil(a.length/PER));if(page>=pages)page=pages-1;document.getElementById('c').textContent=a.length.toLocaleString()+'행 · '+(page+1)+'/'+pages+'쪽';
  var numCol=hdr.map(function(h){return/조회|좋아요|댓글$|순위/.test(h)&&!/률/.test(h)});
  o.innerHTML='<table><tr>'+hdr.map(function(h,i){return'<th data-i="'+i+'">'+esc(h)+(sortC===i?(asc?' ▲':' ▼'):'')+'</th>'}).join('')+'</tr>'+a.slice(page*PER,page*PER+PER).map(function(r){return'<tr>'+hdr.map(function(h,i){var v=r[i]==null?'':r[i];return'<td class="'+(numCol[i]&&/조회/.test(h)?'n':'')+'">'+(numCol[i]&&v!==''&&!isNaN(v)&&/조회|좋아요|댓글/.test(h)?Number(v).toLocaleString():linkify(v))+'</td>'}).join('')+'</tr>'}).join('')+'</table>';
  o.querySelectorAll('th').forEach(function(th){th.onclick=function(){var i=+th.dataset.i;if(sortC===i)asc=!asc;else{sortC=i;asc=false}draw()}})}
 document.getElementById('s').oninput=function(e){filt=e.target.value.trim().toLowerCase();page=0;draw()};document.getElementById('pv').onclick=function(){if(page>0){page--;draw()}};document.getElementById('nx').onclick=function(){page++;draw()};draw();
}).catch(function(){o.innerHTML='<p style="padding:20px">파일을 불러오지 못했습니다: '+esc(f)+'</p>'});
</script></body></html>
