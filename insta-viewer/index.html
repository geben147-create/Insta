<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>인스타 카드뉴스·릴스 벤치마크 뷰어</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f1115;color:#eee;font-family:"Malgun Gothic",sans-serif;--sw:150px}
#side{position:fixed;left:0;top:0;bottom:0;width:var(--sw);background:#151922;border-right:1px solid #2b3040;overflow:auto;z-index:8;padding:6px 0;font-size:12px;transition:transform .15s}
#rs{position:fixed;left:calc(var(--sw) - 3px);top:0;bottom:0;width:6px;cursor:col-resize;z-index:9}#rs:hover{background:#ffd16688}
#edge{position:fixed;left:0;top:0;bottom:0;width:10px;z-index:7;display:none}
body.unpin #side{transform:translateX(calc(-1 * var(--sw)))}body.unpin.open #side{transform:none;box-shadow:4px 0 14px #000}body.unpin #rs{display:none}body.unpin.open #rs{display:block}body.unpin #edge{display:block}
#main{margin-left:var(--sw)}body.unpin #main{margin-left:0}
.ttl{padding:2px 8px 4px;font-weight:700;font-size:12px;display:flex;justify-content:space-between;align-items:center}.grp{color:#ffd166;font-size:10px;padding:8px 8px 2px;font-weight:700}
.mi{display:block;padding:4px 8px;cursor:pointer;color:#ccd;border-left:3px solid transparent;line-height:1.25}.mi:hover{background:#1d2330}.mi.on{background:#232b3c;border-left-color:#ffd166;color:#fff}
#bar{position:sticky;top:0;background:#0f1115f2;z-index:4;padding:6px 10px;border-bottom:1px solid #2b3040;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12px}
button,select,input[type=text],input[type=date]{background:#1a1d24;color:#eee;border:1px solid #2b3040;border-radius:6px;padding:3px 8px;font-size:12px}button,select{cursor:pointer}button.on{background:#ffd166;color:#000;font-weight:700}
#t{font-weight:700;font-size:13px}.lab{color:#9aa}label{cursor:pointer}input[type=range]{width:120px;vertical-align:middle}.row{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;width:100%}
#g{display:grid;gap:5px;padding:8px 10px 40px;align-items:start}
.c{background:#1a1d24;border-radius:6px;overflow:hidden;border:1px solid #2b3040;position:relative}.c img{width:100%;display:block;background:#000}
body.crop .c img{aspect-ratio:4/5;object-fit:cover}
.tag{position:absolute;top:2px;left:2px;background:#000b;border-radius:3px;padding:0 4px;font-size:10px}
.b{padding:3px 4px;font-size:10.5px;line-height:1.35;overflow:hidden}.r1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.k{color:#ffd166;font-weight:700}.ko{color:#9fe3a8}.ja{color:#778;font-size:9.5px}.rl{color:#ff9b9b}
.txt{display:none;margin-top:2px;word-break:break-all}body.showtxt .txt{display:block}
a{color:#8ab4ff;text-decoration:none}.acc{cursor:pointer;color:#8ab4ff}.go{float:right;color:#ffd166}
#tg{position:fixed;left:6px;bottom:8px;z-index:10;opacity:.9;font-size:14px}
</style></head><body class="crop">
<div id="edge"></div><div id="side"></div><div id="rs"></div>
<div id="main"><div id="bar">
<div class="row"><button id="tgb">☰ 메뉴</button><button id="pinb" class="on">📌 고정</button><span id="t"></span>
<span class="lab">열</span><input type="range" id="rg" min="2" max="14" step="1"><b id="cn"></b><span id="cols"></span>
<label><input type="checkbox" id="stx"> 제목·본문</label><label><input type="checkbox" id="crp"> 4:5 자르기</label></div>
<div class="row"><span class="lab">정렬</span><select id="key"><option value="d">최신순(날짜)</option><option value="l">좋아요</option><option value="m">댓글</option><option value="cr">댓글율(댓글/좋아요)</option><option value="p">조회수(릴스)</option></select><button id="dir">내림 ▼</button>
<span class="lab">형식</span><select id="fmt"><option value="">전체</option><option value="사진">사진</option><option value="캐러셀">캐러셀</option><option value="릴스">릴스</option></select>
<select id="rl"><option value="">실사+카드형</option><option value="card">카드·그래픽형만</option><option value="real">실사만</option></select>
<span class="lab">검색</span><input type="text" id="q" placeholder="제목/계정" size="12"><button id="qc">계정해제</button></div>
<div class="row"><span class="lab">기간</span><span id="per"></span>
<input type="date" id="d1"><span class="lab">~</span><input type="date" id="d2"><button id="dok">적용</button><button id="dx">기간해제</button><span id="cnt" class="lab"></span></div>
</div><div id="g"></div></div>
<script>
const MENU=[["인스타 사진·카드",[["A","AI창업·지원금"],["B","주식·ETF·경제"],["C","부동산"],["F","총정리·TOP형"]]],["릴스·고조회",[["G","국내 섹터 릴스"],["D","해외 릴스"]]],["해외·일본",[["E","해외 사진·카드"],["H","일본(한글번역)"]]]];
const $=id=>document.getElementById(id);
let cur=null,cols=+localStorage.cols||6,desc=true,key='d',pf={m:0,d1:'',d2:'',mode:''},acc='';
if(localStorage.sw)document.body.style.setProperty('--sw',localStorage.sw+'px');
$('side').innerHTML='<div class="ttl"><span>인스타 수익화 연구소</span></div>'+MENU.map(([g,a])=>'<div class="grp">'+g+'</div>'+a.map(([k,n])=>'<a class="mi" data-k="'+k+'">'+n+'</a>').join('')).join('');
[3,4,6,8,10].forEach(n=>{const b=document.createElement('button');b.textContent=n;b.dataset.n=n;b.onclick=()=>setCols(n);$('cols').appendChild(b)});
function setCols(n){cols=+n;localStorage.cols=cols;$('rg').value=cols;$('cn').textContent=cols;document.querySelectorAll('#cols button').forEach(b=>b.classList.toggle('on',+b.dataset.n===cols));$('g').style.gridTemplateColumns='repeat('+cols+',1fr)'}
$('rg').oninput=e=>setCols(e.target.value);
const PER=[['전체',0,''],['1개월',1],['2개월',2],['3개월',3],['4개월',4],['5개월',5],['6개월',6],['1년',12],['1년 이상 전','','old'],['작년','','last']];
PER.forEach(p=>{const b=document.createElement('button');b.textContent=p[0];b.dataset.i=PER.indexOf(p);b.onclick=()=>{pf={m:p[1]||0,d1:'',d2:'',mode:p[2]||''};$('d1').value='';$('d2').value='';render()};$('per').appendChild(b)});
$('dok').onclick=()=>{pf={m:0,d1:$('d1').value,d2:$('d2').value,mode:''};render()};
$('dx').onclick=()=>{pf={m:0,d1:'',d2:'',mode:''};$('d1').value='';$('d2').value='';render()};
['key','fmt','rl'].forEach(i=>$(i).onchange=()=>{key=$('key').value;render()});
$('q').oninput=()=>render();$('qc').onclick=()=>{acc='';$('q').value='';render()};
$('dir').onclick=()=>{desc=!desc;render()};
function setPin(p){document.body.classList.toggle('unpin',!p);document.body.classList.remove('open');$('pinb').classList.toggle('on',p);localStorage.pin=p?1:0}
$('pinb').onclick=()=>setPin(document.body.classList.contains('unpin'));
$('tgb').onclick=()=>{if(document.body.classList.contains('unpin'))document.body.classList.toggle('open');else setPin(false)};
$('edge').onmouseenter=()=>document.body.classList.add('open');
$('side').onmouseleave=()=>{if(document.body.classList.contains('unpin'))document.body.classList.remove('open')};
$('stx').onchange=e=>document.body.classList.toggle('showtxt',e.target.checked);
$('crp').onchange=e=>document.body.classList.toggle('crop',e.target.checked);document.body.classList.remove('crop');
if(localStorage.pin==='0')setPin(false);
let drag=false;$('rs').onmousedown=()=>{drag=true;document.body.style.userSelect='none'};
window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};
window.onmousemove=e=>{if(!drag)return;const w=Math.max(90,Math.min(320,e.clientX));document.body.style.setProperty('--sw',w+'px');localStorage.sw=w};
function fmtN(n){if(n==null)return'-';return n>=1e8?(n/1e8).toFixed(1)+'억':n>=1e4?(n/1e4).toFixed(1)+'만':n.toLocaleString()}
function dec(s){return String(s||'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')}
function esc(s){return dec(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function load(k){return new Promise(r=>{if(window.DATA&&DATA[k])return r();const s=document.createElement('script');s.src='data_'+k+'.js';s.onload=r;document.body.appendChild(s)})}
async function open_(k){cur=k;acc='';document.querySelectorAll('.mi').forEach(e=>e.classList.toggle('on',e.dataset.k===k));$('g').innerHTML='<div style="padding:30px">불러오는 중...</div>';await load(k);location.hash=k;
 DATA[k].forEach(x=>{x.cr=x.l?(x.m||0)/x.l:0});
 if(k==='G'||k==='D')key='p';else if(key==='p')key='l';$('key').value=key;render();
 if(document.body.classList.contains('unpin'))document.body.classList.remove('open')}
function inPeriod(x){if(!x.d)return !(pf.m||pf.d1||pf.d2||pf.mode);const d=x.d,now=new Date();
 if(pf.m){const c=new Date(now);c.setMonth(c.getMonth()-pf.m);return d>=c.toISOString().slice(0,10)}
 if(pf.mode==='old'){const c=new Date(now);c.setFullYear(c.getFullYear()-1);return d<c.toISOString().slice(0,10)}
 if(pf.mode==='last'){return d.slice(0,4)===String(now.getFullYear()-1)}
 if(pf.d1&&d<pf.d1)return false;if(pf.d2&&d>pf.d2)return false;return true}
function render(){if(!cur)return;let arr=[...DATA[cur]];
 const f=$('fmt').value,rl=$('rl').value,q=$('q').value.trim().toLowerCase();
 arr=arr.filter(x=>inPeriod(x)&&(!f||(x.t||'').startsWith(f))&&(!rl||(rl==='real'?x.x:!x.x))&&(!acc||x.a===acc)&&(!q||(x.a+' '+dec(x.h)+' '+dec(x.ko)).toLowerCase().includes(q)));
 const v=x=>x[key]==null?(key==='d'?'':-1):x[key];
 arr.sort((a,b)=>{const A=v(a),B=v(b);const c=A<B?-1:A>B?1:0;return desc?-c:c});
 $('t').textContent=MENU.flatMap(m=>m[1]).find(x=>x[0]===cur)[1];$('cnt').textContent=arr.length+' / '+DATA[cur].length+'개'+(acc?' · @'+acc:'');
 $('dir').textContent=desc?'내림 ▼':'오름 ▲';setCols(cols);
 document.querySelectorAll('#per button').forEach(b=>{const p=PER[+b.dataset.i];b.classList.toggle('on',!pf.d1&&!pf.d2&&(p[2]||'')===pf.mode&&(p[1]||0)===pf.m)});
 $('g').innerHTML=arr.map((x,i)=>'<div class="c"><span class="tag">'+(i+1)+(x.t?' '+esc(x.t):'')+'</span><a href="'+x.u+'" target="_blank" rel="noopener"><img loading="lazy" src="'+x.i+'"></a><div class="b"><div class="r1">'+(x.p?'<span class="k">▶'+fmtN(x.p)+'</span> ':'')+'♥'+fmtN(x.l)+' 💬'+fmtN(x.m)+' <span title="댓글율">('+Math.round(x.cr*100)+'%)</span><a class="go" href="'+x.u+'" target="_blank" rel="noopener">열기↗</a></div><div class="r1">'+esc((x.d||'').slice(2))+' <span class="acc" data-a="'+esc(x.a)+'">@'+esc(x.a)+'</span>'+(x.x?' <span class="rl">실사</span>':'')+'</div><div class="txt">'+(x.ko?'<div class="ko">'+esc(x.ko)+'</div><div class="ja">'+esc(x.ja)+'</div>':'<div>'+esc(x.h)+'</div>')+(x.r?'<div class="k">예상수익 ₩'+esc(x.r)+'</div>':'')+'</div></div></div>').join('')}
$('g').onclick=e=>{const a=e.target.closest('.acc');if(a){acc=a.dataset.a;render();window.scrollTo(0,0)}};
document.querySelectorAll('.mi').forEach(e=>e.onclick=()=>open_(e.dataset.k));
open_(location.hash.slice(1)||'A');
</script></body></html>
