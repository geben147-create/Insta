<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>인스타 카드뉴스·릴스 벤치마크 뷰어</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f1115;color:#eee;font-family:"Malgun Gothic",sans-serif;--sw:150px}
#side{position:fixed;left:0;top:0;bottom:0;width:var(--sw);background:#151922;border-right:1px solid #2b3040;overflow:auto;z-index:5;padding:6px 0;font-size:12px}
#rs{position:fixed;left:calc(var(--sw) - 3px);top:0;bottom:0;width:6px;cursor:col-resize;z-index:6}#rs:hover{background:#ffd16688}
body.hide #side,body.hide #rs{display:none}#main{margin-left:var(--sw)}body.hide #main{margin-left:0}
.ttl{padding:2px 8px 4px;font-weight:700;font-size:12px}.grp{color:#ffd166;font-size:10px;padding:8px 8px 2px;font-weight:700}
.mi{display:block;padding:4px 8px;cursor:pointer;color:#ccd;border-left:3px solid transparent;line-height:1.25}.mi:hover{background:#1d2330}.mi.on{background:#232b3c;border-left-color:#ffd166;color:#fff}
#bar{position:sticky;top:0;background:#0f1115f2;z-index:4;padding:6px 10px;border-bottom:1px solid #2b3040;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px}
button,select{background:#1a1d24;color:#eee;border:1px solid #2b3040;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:12px}button.on{background:#ffd166;color:#000;font-weight:700}
#t{font-weight:700;font-size:13px}.lab{color:#9aa}label{cursor:pointer}input[type=range]{width:130px;vertical-align:middle}
#g{display:grid;gap:5px;padding:8px 10px 40px;align-items:start}
.c{background:#1a1d24;border-radius:6px;overflow:hidden;border:1px solid #2b3040;position:relative}.c img{width:100%;display:block;background:#000}
body.crop .c img{aspect-ratio:4/5;object-fit:cover}
.tag{position:absolute;top:2px;left:2px;background:#000b;border-radius:3px;padding:0 4px;font-size:10px}
.b{padding:3px 4px;font-size:10.5px;line-height:1.35;overflow:hidden}.b .r1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.k{color:#ffd166;font-weight:700}.ko{color:#9fe3a8}.ja{color:#778;font-size:9.5px}.rl{color:#ff9b9b}.nr{color:#9fe3a8}
.txt{display:none;margin-top:2px;word-break:break-all}body.showtxt .txt{display:block}
a{color:#8ab4ff;text-decoration:none}#tg{position:fixed;left:6px;bottom:8px;z-index:7;opacity:.85}
</style></head><body class="crop">
<div id="side"></div><div id="rs"></div>
<div id="main"><div id="bar"><button id="tg">☰</button><span id="t"></span>
<span class="lab">열</span><input type="range" id="rg" min="2" max="14" step="1"><b id="cn"></b>
<span id="cols"></span>
<span class="lab">정렬</span><select id="key"><option value="d">날짜</option><option value="l">좋아요</option><option value="m">댓글</option><option value="p">조회수(릴스)</option></select>
<button id="dir">내림 ▼</button>
<label><input type="checkbox" id="stx"> 제목·본문 보기</label>
<label><input type="checkbox" id="crp"> 4:5 자르기</label>
<label><input type="checkbox" id="pin" checked> 메뉴 고정</label></div>
<div id="g"></div></div>
<script>
const MENU=[["인스타 사진·카드",[["A","AI창업·지원금"],["B","주식·ETF·경제"],["C","부동산"],["F","총정리·TOP형"]]],["릴스·고조회",[["G","국내 섹터 릴스"],["D","해외 릴스"]]],["해외·일본",[["E","해외 사진·카드"],["H","일본(한글번역)"]]]];
let cur=null,cols=+localStorage.cols||6,desc=true,key='d';
const $=id=>document.getElementById(id);
if(localStorage.sw)document.body.style.setProperty('--sw',localStorage.sw+'px');
$('side').innerHTML='<div class="ttl">인스타 수익화 연구소</div>'+MENU.map(([g,a])=>'<div class="grp">'+g+'</div>'+a.map(([k,n])=>'<a class="mi" data-k="'+k+'">'+n+'</a>').join('')).join('');
[3,4,6,8,10].forEach(n=>{const b=document.createElement('button');b.textContent=n;b.dataset.n=n;b.onclick=()=>setCols(n);$('cols').appendChild(b)});
function setCols(n){cols=+n;localStorage.cols=cols;$('rg').value=cols;$('cn').textContent=cols;document.querySelectorAll('#cols button').forEach(b=>b.classList.toggle('on',+b.dataset.n===cols));$('g').style.gridTemplateColumns='repeat('+cols+',1fr)'}
$('rg').oninput=e=>setCols(e.target.value);
$('key').onchange=e=>{key=e.target.value;render()};
$('dir').onclick=()=>{desc=!desc;render()};
$('tg').onclick=()=>document.body.classList.toggle('hide');
$('pin').onchange=e=>{if(!e.target.checked)document.body.classList.add('hide')};
$('stx').onchange=e=>document.body.classList.toggle('showtxt',e.target.checked);
$('crp').onchange=e=>document.body.classList.toggle('crop',e.target.checked);
document.body.classList.remove('crop');
// sidebar width drag
let drag=false;$('rs').onmousedown=()=>{drag=true;document.body.style.userSelect='none'};
window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};
window.onmousemove=e=>{if(!drag)return;const w=Math.max(90,Math.min(320,e.clientX));document.body.style.setProperty('--sw',w+'px');localStorage.sw=w};
function fmt(n){if(n==null)return'-';return n>=1e8?(n/1e8).toFixed(1)+'억':n>=1e4?(n/1e4).toFixed(1)+'만':n.toLocaleString()}
function dec(s){return String(s||'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')}
function esc(s){return dec(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function load(k){return new Promise(r=>{if(window.DATA&&DATA[k])return r();const s=document.createElement('script');s.src='data_'+k+'.js';s.onload=r;document.body.appendChild(s)})}
async function open_(k){cur=k;document.querySelectorAll('.mi').forEach(e=>e.classList.toggle('on',e.dataset.k===k));$('g').innerHTML='<div style="padding:30px">불러오는 중...</div>';await load(k);location.hash=k;
 if(k==='G'||k==='D'){key='p'}else if(key==='p'){key='l'}$('key').value=key;render();
 if(!$('pin').checked)document.body.classList.add('hide')}
function render(){if(!cur)return;const arr=[...DATA[cur]];const v=x=>x[key]==null?(key==='d'?'':-1):x[key];
 arr.sort((a,b)=>{const A=v(a),B=v(b);const c=A<B?-1:A>B?1:0;return desc?-c:c});
 $('t').textContent=MENU.flatMap(m=>m[1]).find(x=>x[0]===cur)[1]+' ('+arr.length+')';
 $('dir').textContent=desc?'내림 ▼':'오름 ▲';setCols(cols);
 $('g').innerHTML=arr.map((x,i)=>'<div class="c"><span class="tag">'+(i+1)+(x.t?' '+esc(x.t):'')+'</span><a href="'+x.u+'" target="_blank"><img loading="lazy" src="'+x.i+'"></a><div class="b"><div class="r1">'+(x.p?'<span class="k">▶'+fmt(x.p)+'</span> ':'')+'♥'+fmt(x.l)+' 💬'+fmt(x.m)+'</div><div class="r1">'+esc((x.d||'').slice(2))+' <a href="'+x.u+'" target="_blank">@'+esc(x.a)+'</a>'+(x.x?' <span class="rl">실사</span>':'')+'</div><div class="txt">'+(x.ko?'<div class="ko">'+esc(x.ko)+'</div><div class="ja">'+esc(x.ja)+'</div>':'<div>'+esc(x.h)+'</div>')+(x.r?'<div class="k">예상수익 ₩'+esc(x.r)+'</div>':'')+'</div></div></div>').join('')}
document.querySelectorAll('.mi').forEach(e=>e.onclick=()=>open_(e.dataset.k));
open_(location.hash.slice(1)||'A');
</script></body></html>
