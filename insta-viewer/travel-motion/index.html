:root{color-scheme:light dark;font:15px/1.55 system-ui;--card:#f5f7fa;--line:#d0d7df;--accent:#075c9b}@media(prefers-color-scheme:dark){:root{--card:#17212e;--line:#42536a;--accent:#8cd2ff}}body{max-width:1250px;margin:0 auto;padding:18px}h1{margin:.2em 0}.muted{opacity:.8}a{color:var(--accent)}button,select{font:inherit;padding:.35rem .55rem}label{display:inline-flex;gap:.35rem;align-items:center;margin:.25rem .5rem .25rem 0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:580px}th,td{text-align:left;padding:.5rem;border-bottom:1px solid var(--line)}th{background:var(--card)}article{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0;scroll-margin:10px}article:target{outline:2px solid var(--accent)}h2,h3{margin:.25rem 0}summary{cursor:pointer;font-weight:650}details{margin:.65em 0}img{max-width:100%;height:auto;display:block;border-radius:7px}.cover{width:155px;max-height:190px;object-fit:cover;object-position:center}.top{display:flex;gap:16px;align-items:start}.shot{display:grid;grid-template-columns:minmax(150px,440px) minmax(260px,1fr);gap:14px;border-top:1px solid var(--line);padding:.7em 0}.shot p{margin:.3em 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:transparent;border-left:3px solid var(--line);padding-left:.8em;font:inherit}.links a{margin-right:.7em}.shot img{background:#111827}.chip{padding:.15em .5em;background:var(--card);border:1px solid var(--line);border-radius:8px}#status{min-height:1.5em}@media(max-width:700px){body{padding:10px}.shot{display:block}.top{gap:9px}.cover{width:90px}}
</style><main><h1>🔴 여행 동작·컷 분석</h1><p>인스타 여행 릴스의 <b>동작 시작 → 변화 → 정지</b>와 <b>인물의 뒷모습·동선·카메라</b>를 원본 프레임으로 비교합니다. 제작 프롬프트는 원본 인물이 아닌 가상의 여행자용입니다.</p><p class="muted">좋아요 순위는 이 표본 안의 순위입니다. 임베드 조회와 별도 화면의 재생 수는 합치지 않습니다. 🔴는 Watch/OpenCV 또는 세부 검수 미확보를 뜻합니다. 연속 샷의 동작 구간은 편집 컷이 아닙니다.</p><label>좋아요 <select id="threshold"><option value="0">전체</option><option value="100000">10만 이상</option><option value="400000">40만 이상</option><option value="500000">50만 이상</option></select></label><label>정렬 <select id="sort"><option value="likes">좋아요</option><option value="date">최신</option><option value="views">임베드 조회</option><option value="comments">댓글</option></select></label><label><input type="checkbox" id="reviewed"> 컷·동작 상세만 보기</label><p id="status" aria-live="polite"></p><div class="scroll"><table><thead><tr><th scope="col">순번</th><th scope="col">영상 / 게시일</th><th scope="col">좋아요</th><th scope="col">임베드 조회</th><th scope="col">댓글</th><th scope="col">분석</th></tr></thead><tbody id="ranking"></tbody></table></div><section id="cards" aria-label="영상별 분석"></section><p><a href="../reels-benchmark/?topic=travel-scenic" target="_blank" rel="noopener">기존 여행 릴스 격자 ↗</a> · <a href="../../ai-influencer-krjp/scenic-benchmark/" target="_blank" rel="noopener">기존 풍경 벤치마크 ↗</a></p></main><script src="app.js?v=motion1" defer></script></html>
