<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0}
.wrap{display:flex;gap:12px;height:760px}
.list{width:250px;flex:none;overflow:auto;border:1px solid var(--border,#d9d9de);border-radius:10px}
.list button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;border-bottom:1px solid var(--border,#d9d9de);background:none;color:var(--foreground,#1d1d1f);font:inherit;font-size:13px;cursor:pointer}
.list button.on{background:var(--accent,#2a9d5c);color:#fff}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;border:1px solid var(--border,#d9d9de);border-radius:10px}
.tabs{display:flex;border-bottom:1px solid var(--border,#d9d9de)}
.tabs button{flex:1;padding:10px;border:0;background:none;color:var(--muted-foreground,#6b6b70);font:inherit;font-weight:600;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:var(--foreground,#1d1d1f);border-bottom-color:var(--accent,#2a9d5c)}
.body{padding:14px 16px;overflow:auto;font-size:14px;line-height:1.7}
h2{margin:0 0 8px;font-size:17px}h3{margin:16px 0 6px;font-size:14px}
.card{border:1px solid var(--border,#d9d9de);border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--card,#ffffff)}
.src{font-size:12px;color:var(--muted-foreground,#6b6b70)}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:9px;margin-right:4px;border:1px solid var(--border,#d9d9de)}
.draft{border-left:4px solid #e6a700}.none{border-left:4px solid #d33}.ok{border-left:4px solid #2a9d5c}
.vf{background:#fff3c4;color:#7a5600;padding:0 3px;border-radius:3px;font-size:12px}
.legend{font-size:12px;color:var(--muted-foreground,#6b6b70);margin-bottom:8px}
pre{white-space:pre-wrap;margin:0;font:inherit}
.clip{background:rgba(42,157,92,.12);border-left:3px solid #2a9d5c;padding:3px 8px;margin:4px 0;font-weight:600}.memo{color:var(--muted-foreground,#6b6b70);font-size:12px;margin:4px 0 10px}.tbl{font-family:monospace;font-size:12px;white-space:pre-wrap}.script div{margin:2px 0}</style></head><body>

<script>
const E=[{"n": 1, "title": "반도체 — \"일본 반도체는 끝났다\"", "v3": ["①🟢 \"한국은 이미 일본보다 앞서 있다.\" (BV1qqk5BkEar 01:22.920~01:24.800)", "②🟢 \"실제로 이미 일본을 넘어섰다.\" (같은 영상 01:31.360~01:33.400)", "③📰 그런데 미국 전략국제문제연구소(CSIS)가 반도체 공급망을 뜯어보자, 핵심 소재 14종에서 일본 기업이 절반 넘는 점유율을 쥐고 있다는 숫자가 나왔습니다.", "④ 칩은 한국과 대만이 만드는데, 그 칩을 만드는 재료는 누가 대고 있었던 걸까요?", "⑤❓ 일본은 정말 진 걸까요, 아니면 싸움의 자리를 바꾼 걸까요?", "🎬 0~4초 원음 클립 → 반도체 웨이퍼 B-roll + 헤드라인 \"일본 반도체 = 끝?\" → CSIS 그래프 카드. 감정 E01"], "orig": [{"src": "붙여넣기①(13:53) 50편 V2 훅 강화본", "title": "일본 반도체가 끝났다고?", "text": "일본 반도체? 이제 한국하고 대만한테 밀렸잖아. 옛날에나 잘나갔지.\n그런데 미국 전략국제문제연구소가 반도체 공급망을 조사하면서 우리가 놓친 숫자가 드러났습니다. 일본 기업들이 핵심 반도체 소재 14종에서 각각 절반이 넘는 시장을 차지하고 있다는 분석이었는데요. 도대체 반도체를 만드는 나라들은 왜 여전히 일본 기술을 필요로 하는 걸까요?"}, {"src": "붙여넣기③(13:55) 50편 실제 기획안", "title": "반도체에서 밀려난 일본이 여전히 필요한 이유", "text": "한국과 대만이 반도체의 중심에 섰습니다. 한때 일본이 차지했던 자리였죠. 그런데 완성된 반도체가 아니라 그것을 만드는 재료를 보면 이야기가 달라집니다. 미국 의회 조사자료는 일본의 반도체 소재 점유율을 약 50%로 설명합니다. 일본은 정말 반도체 경쟁에서 사라진 걸까요?"}, {"src": "붙여넣기④(13:56) 50편 V2 해외 평가 반전형", "title": "반도체에서 패배한 일본, 세계가 여전히 일본을 찾는 이유", "text": "미국 전략국제문제연구소는 일본 반도체 산업이 세계 선두 기술에 뒤처졌다고 평가했습니다.\n한때 세계 시장의 절반 이상을 차지했던 일본의 점유율은 2022년 9%까지 떨어졌습니다.\n그런데 같은 미국의 연구기관은 전혀 다른 숫자도 공개했습니다.\n반도체를 만드는 소재 시장에서는 일본이 여전히 약 절반을 차지한다는 겁니다.\n일본은 정말 패배한 것일까요, 아니면 우리가 바라보는 경쟁의 기준이 잘못된 것일까요?"}], "outline": "과거 영광 → 쇠퇴 → 한국의 성장 → 소재 점유율 → 장비의 역할 → 공급망 추적 → 숨은 기술력 → 재평가. D03+D08", "question": "⑤❓ 일본은 정말 진 걸까요, 아니면 싸움의 자리를 바꾼 걸까요?", "answer": ["답부터 말씀드리면, 일본은 반도체 싸움에서 사라진 게 아니라 싸우는 자리를 옮겼습니다.", "완성 반도체, 그러니까 메모리와 시스템 칩을 직접 만들어 파는 시장에서 일본의 몫은 크게 줄었습니다. 한때 세계 시장의 절반을 넘던 점유율이 2022년에는 9% 안팎까지 내려왔다는 분석이 있습니다. [검증 필요: CSIS 원문 수치·연도]", "그런데 그 칩을 찍어내는 공장 안으로 들어가면 이야기가 달라집니다. 웨이퍼 위에 회로를 그리는 포토레지스트, 회로를 깎고 씻어내는 고순도 불화수소, 칩의 바탕이 되는 실리콘 웨이퍼 같은 핵심 소재에서는 일본 기업들이 여전히 세계 시장의 큰 몫을 쥐고 있거든요. [검증 필요: '핵심 소재 14종 중 절반 이상' 원문 대조 전]", "완성 칩이 요리라면, 소재는 재료입니다. 한국과 대만은 세계 최고의 요리사가 됐지만, 그 주방에 들어가는 재료 상당수는 아직 일본에서 옵니다.", "2019년 일본이 반도체 소재 세 가지의 수출 심사를 강화했을 때 한국 업계가 크게 긴장했던 이유도 바로 여기에 있었죠. 완성품 시장에서는 밀렸지만, 남이 만든 칩이 돌아가려면 일본의 재료가 필요한 구조였던 겁니다.", "그렇다면 일본은 왜 완성품 대신 재료와 장비라는 자리를 택하게 됐을까요?"], "script": "# EP01 · 반도체에서 패배한 일본, 세계가 여전히 일본을 찾는 이유 — 본편 대본 v1\n\n- 기반: 훅 V3(EP01) · 붙여넣기③ 전개 \"과거 영광 → 쇠퇴 → 한국의 성장 → 소재 점유율 → 장비의 역할 → 공급망 추적 → 숨은 기술력 → 재평가 (D03+D08)\" · 붙여넣기④ 전개 \"쇠퇴의 역사 → 한국·대만의 성장 → 억울함 → 소재 시장의 반전 → 제조장비라는 두 번째 발견 → 한일 수출규제의 실제 영향 → 공급망의 재해석 → 기술에 대한 자긍심\" · 감정선 E01 억울함 역전형 · STEP 4 규칙\n- 표기: 일반 문장 = 내레이션(N) · `▶` = 외국인 원음(C, GitHub SRT 실재 타임코드) · `🎬` = 화면 메모(낭독 안 함) · `[검증 필요]` = 수치·출처 원문 미대조\n- 원음 원본: BV1qqk5BkEar(중국어 해설, \"1인당 GDP 일본 추월, 삼성이 소니를 넘었다\") · BILI-125(BV19WGg6SEoe 계열 중국 반도체 해설) · BILI-126 — 원어 대조·권리 미검증 🟡\n- 목표 길이: 1.2배속 후 17:35 ±30초 → 길이 추정은 맨 아래\n\n---\n\n## S1 🟥 훅 (0:00~0:30)\n\n▶ [중국어 해설 · BV1qqk5BkEar · 01:22.920–01:24.800] \"한국은 이미 일본보다 앞서 있다.\"\n▶ [같은 해설 · 01:31.360–01:33.400] \"실제로 이미 일본을 넘어섰다.\"\n▶ [같은 해설 · 01:53.400–01:56.600] \"삼성전자는 이미 소니를 넘어섰다.\"\n\n중국의 한 경제 해설자는 이렇게 단언했습니다.\n일본은 이제 한국에 밀린 나라라고요.\n반도체만 놓고 보면 틀린 말도 아닙니다.\n한때 세계 시장의 절반을 쥐었던 일본의 몫은, 이제 열 개 중 하나 정도로 줄었습니다. [검증 필요: 1988년 약 50% → 2022년 약 9%, CSIS·업계 통계]\n그런데 미국의 한 전략연구소가 반도체 공급망을 한 단계씩 뜯어보자, 전혀 다른 숫자가 튀어나왔습니다.\n칩을 만드는 데 꼭 필요한 핵심 소재들에서, 일본 기업들이 여전히 절반 안팎을 쥐고 있었던 겁니다. [검증 필요: CSIS '핵심 소재 14종 중 다수에서 50% 이상' 원문 대조]\n이게 진짜일까요?\n일본은 정말 반도체 싸움에서 진 걸까요, 아니면 싸우는 자리를 바꾼 걸까요?\n\n🎬 0~4초 원음 3컷 연속 → 헤드라인 \"일본 반도체 = 끝?\" → 회색 그래프 카드 [ 세계 반도체 점유율 · 일본 ] 50% → 9% → 질문 자막(노랑 q)\n\n## S2 🟥 과거의 영광 — 세계를 지배했던 일본 (0:30~2:00)\n\n시계를 1980년대 후반으로 돌려 보겠습니다.\n그때 세계 반도체 매출 순위표의 맨 위는 미국 회사가 아니었습니다.\n엔이씨, 도시바, 히타치. 일본 이름들이 상위권을 거의 다 차지하고 있었죠. [검증 필요: 1980년대 후반 세계 반도체 매출 순위]\n특히 컴퓨터의 기억을 담당하는 디램 시장에서는, 일본산이 사실상 표준이었습니다.\n일본 공장에서 나온 칩은 불량률이 낮기로 유명했거든요.\n미국 기업들이 일본 칩을 뜯어 보고 품질 차이에 놀랐다는 이야기가 지금도 업계에 전해질 정도입니다. [검증 필요: 1980년 휴렛팩커드 품질 비교 사례]\n너무 잘나갔던 게 문제였을까요?\n미국은 일본 반도체를 국가적인 위협으로 보기 시작했습니다.\n1986년, 두 나라는 미일 반도체 협정을 맺습니다.\n일본 시장을 외국 칩에 더 열고, 일본 칩의 가격을 감시하겠다는 내용이었죠. [검증 필요: 협정 세부 조항]\n이듬해 미국은 일부 일본 전자제품에 백 퍼센트 관세까지 매겼습니다. [검증 필요: 1987년 약 3억 달러 규모 보복관세]\n세계 최고였던 산업이, 기술이 아니라 정치에 발목을 잡힌 겁니다.\n그런데 일본 반도체를 무너뜨린 건 미국만이 아니었습니다.\n\n1979년, 미국 하버드대 교수 에즈라 보겔은 『재팬 애즈 넘버원』이라는 책을 냈습니다.\n제목 그대로, 일본이 세계 일등이 될 거라는 내용이었죠.\n그 예언이 가장 먼저 현실이 된 곳이 바로 반도체였습니다.\n일본 기업들은 미국에서 시작된 기술을 들여와, 더 싸고 더 튼튼하게 만들었습니다.\n공장의 먼지를 줄이고, 불량을 한 개라도 더 잡아내는 데 집착했거든요.\n그 집착이 숫자로 돌아왔습니다.\n세계 반도체 시장의 절반이 일본 차지가 된 겁니다. [검증 필요: 1988년 점유율]\n미국 실리콘밸리에서는 일본 때문에 문을 닫는 회사가 속출했습니다.\n인텔조차 메모리 사업을 접고 마이크로프로세서로 방향을 틀었을 정도였죠. [검증 필요: 1985년 인텔 디램 철수]\n\n일본 반도체의 강점은 단순히 공장 하나가 아니었습니다.\n칩을 만드는 회사 옆에는 재료 회사가 있었고, 그 옆에는 기계를 만드는 회사가 있었습니다.\n서로 같은 동네에서, 같은 기술자들과, 수십 년 동안 문제를 함께 풀어 왔죠.\n이 생태계가 바로 일본이 가진 진짜 무기였습니다.\n그리고 이 무기는, 완성품 시장에서 밀려난 뒤에도 사라지지 않았습니다.\n\n🎬 1980년대 일본 공장 자료화면(권리 확인) · 연표 카드 1986 협정 → 1987 관세 · 형광 빨강 c \"기술이 아니라 정치\"\n\n## S3 🟥🟨 몰락, 그리고 한국과 대만의 시대 (2:00~4:30)\n\n1990년대 들어 한국 기업들이 무섭게 따라왔습니다.\n과감하게 공장을 짓고, 불황에도 투자를 멈추지 않았죠.\n일본 기업들이 경기를 보며 머뭇거리는 사이, 메모리의 왕좌는 서울 남쪽으로 넘어갔습니다.\n대만은 또 다른 길을 열었습니다.\n설계는 남이 하고, 생산만 대신 맡아 주는 파운드리라는 방식이었는데요.\n이 방식이 세계 반도체 산업의 지도를 바꿔 놓았습니다.\n그리고 2012년, 일본에 남은 마지막 디램 회사 엘피다가 파산합니다.\n일본 정부가 공들여 살려 보려 했던 회사였기에 충격은 더 컸습니다.\n엘피다는 결국 미국의 마이크론에 넘어갔습니다.\n\n▶ [중국어 해설 · BV1qqk5BkEar · 01:48.080–01:53.360] \"일본은 예전엔 정말 많았는데, 친숙한 대형 브랜드와 제품… 그런데 지금도 거기 있나요?\"\n\n바깥에서 보면 이 말이 정답처럼 들립니다.\n매장 진열대에서 일본 칩의 이름은 거의 사라졌으니까요.\n일본 안에서도 '잃어버린 30년'이라는 말과 함께, 반도체는 실패한 산업의 상징처럼 이야기됐습니다.\n억울한 대목은 여기서부터입니다.\n정말 일본의 반도체 기술은 그때 함께 사라졌을까요?\n\n일본은 왜 이렇게 빨리 밀려났을까요?\n첫 번째는 돈의 가치였습니다.\n1985년 플라자 합의 이후 엔화 가치가 크게 뛰었습니다.\n같은 칩을 팔아도, 일본산은 갑자기 비싼 물건이 돼 버렸죠.\n두 번째는 결정의 속도였습니다.\n일본의 반도체 사업부는 대부분 거대한 전기 회사 안의 한 부서였습니다.\n가전, 발전기, 철도 차량까지 만드는 회사가, 반도체에만 수조 원을 걸기는 쉽지 않았습니다.\n반면 한국 기업들은 총수가 결단하면 불황 한가운데서도 공장을 올렸습니다.\n일본은 뒤늦게 회사들을 합쳐 살길을 찾았습니다.\n엔이씨와 히타치의 디램 부문이 합쳐 엘피다가 됐고, 여러 회사의 시스템 반도체 부문이 모여 르네사스가 됐습니다. [검증 필요: 1999 엘피다 / 2010 르네사스 출범 연도]\n하지만 흐름을 되돌리기에는 이미 늦었습니다.\n\n🎬 연표: 1990s 한국 메모리 성장 → 1987 대만 파운드리 → 2012 엘피다 파산 · 헤드라인 \"일본 반도체 = 실패?\"\n\n## S4 🟩 첫 번째 반전 — 칩을 만드는 '재료' (4:30~6:30)\n\n반도체 한 장이 만들어지는 과정을 떠올려 보겠습니다.\n먼저 둥글고 얇은 실리콘 판, 웨이퍼가 필요합니다.\n그 위에 빛으로 회로를 그리려면, 빛에 반응하는 특수한 약품을 발라야 하죠.\n이 약품을 포토레지스트라고 부릅니다.\n회로를 깎아 내고 깨끗하게 씻어 내는 데는, 아주 순도 높은 가스와 약품이 쓰입니다.\n그런데 이 단계마다, 낯익은 일본 회사 이름이 등장합니다.\n웨이퍼는 신에쓰화학과 섬코 두 회사가 세계 시장의 절반을 훌쩍 넘게 공급합니다. [검증 필요: 2사 합산 점유율 약 50~60%]\n포토레지스트는 제이에스알, 도쿄오카공업, 신에쓰화학 같은 일본 기업들이 시장의 대부분을 쥐고 있습니다. [검증 필요: 일본 기업 점유율 약 80~90%]\n특히 가장 미세한 회로를 그리는 최첨단 공정용 약품일수록, 일본 의존도는 더 높아진다는 분석이 많습니다. [검증 필요: EUV용 레지스트 점유율]\n미국 의회 조사국 보고서도 일본을 반도체 소재 분야의 핵심 공급국으로 꼽았습니다. [검증 필요: CRS R47558 해당 대목 원문]\n완성된 칩이 요리라면, 소재는 재료입니다.\n한국과 대만은 세계 최고의 요리사가 됐습니다.\n하지만 그 주방에 들어가는 재료의 상당수는, 아직도 일본에서 오고 있었던 거죠.\n진열대에서 사라진 건 일본의 브랜드였지, 일본의 기술이 아니었습니다.\n\n이 재료들이 왜 그렇게 어려운지, 하나만 예를 들어 보겠습니다.\n반도체 공장에서 쓰는 불화수소는 순도가 소수점 아래로 아홉 자리, 열 자리가 넘어가야 합니다. [검증 필요: 고순도 불화수소 순도 '트웰브 나인' 표기]\n불순물이 백억 분의 일만 섞여도, 머리카락보다 수천 배 가는 회로가 망가질 수 있거든요.\n이 순도를 맞추는 데에는 화학식이 아니라 시간이 필요합니다.\n공장 온도, 배관 재질, 용기 세척 방법까지, 수십 년 동안 쌓인 경험이 모여야 하죠.\n일본의 소재 회사들 중에는 창업한 지 백 년이 넘은 곳도 적지 않습니다. [검증 필요: 해당 기업 창업 연도]\n반도체가 생기기 훨씬 전부터 비료와 약품, 화학 원료를 만들던 회사들이었죠.\n그들은 반도체라는 새 손님이 나타나자, 원래 하던 일을 백 배 더 정밀하게 해냈습니다.\n\n이 회사들은 한국과 대만 공장 바로 옆에 자기 공장을 짓기도 했습니다.\n고객이 새 공정을 개발할 때, 처음부터 함께 실험하기 위해서였죠.\n고객사의 연구소 안에 일본 회사의 기술자가 상주하는 경우도 흔합니다. [검증 필요]\n칩을 만드는 회사가 바뀌어도, 재료를 대는 회사는 바뀌지 않았던 이유입니다.\n\n🎬 웨이퍼 → 감광액 도포 → 노광 → 식각 공정 애니메이션(자체 그래픽) · 그래프 카드 [ 실리콘 웨이퍼 점유율 ] [ 포토레지스트 점유율 ] 큰 숫자 + 출처 · 형광 초록 g \"요리사는 한국·대만, 재료는 일본\"\n\n## S5 🟨 아직 풀리지 않은 의문 (6:30~8:30)\n\n그런데 여기서 고개를 갸웃하게 되는 분들도 계실 겁니다.\n재료 몇 가지 판다고, 정말 그게 큰 힘이 될까요?\n소재는 결국 납품업체 아닌가요?\n이 의문에 답을 준 사건이 있었습니다.\n2019년 7월, 일본 정부는 반도체 소재 세 가지의 한국 수출 심사를 강화했습니다.\n불화수소, 포토레지스트, 그리고 화면용 소재인 불화 폴리이미드였죠.\n한 달 뒤에는 한국을 수출 절차 우대국 명단에서도 뺐습니다.\n양국 관계가 얼어붙었던 시기였고, 한국에서는 불매운동까지 벌어졌습니다.\n이 결정이 옳았는지는 지금도 두 나라에서 평가가 엇갈립니다.\n다만 이 사건이 세계에 보여 준 사실 하나는 분명했습니다.\n세계 최대 메모리 회사들이 있는 나라의 공장이, 일본의 약품 세 가지에 긴장했다는 겁니다.\n\n▶ [중국어 해설 · BILI-125 · 14:03.784–14:07.799] \"장비·소재·EDA 소프트웨어·인재 4위일체의 입체 포위를 가했습니다.\"\n\n이건 중국 반도체 업계가 미국과 동맹국들의 수출 통제를 겪으며 내놓은 표현입니다.\n반도체를 막으려면 칩이 아니라 장비와 소재를 막는다는 거죠.\n반도체 싸움의 급소가, 완성품이 아니라 그 앞단에 있다는 뜻입니다.\n그렇다면 앞단에는 소재만 있을까요?\n\n한국 산업계는 그때 처음으로 이 숫자를 피부로 느꼈습니다.\n일부 공장에서는 남은 재고가 몇 달 치인지 매일 계산했다는 보도까지 나왔죠. [검증 필요: 당시 국내 보도]\n미국과 유럽 언론도 이 사건을 크게 다뤘습니다.\n세계 공급망이 생각보다 훨씬 가늘고 촘촘한 실로 엮여 있다는 걸 보여 줬기 때문입니다.\n\n이 사건 이후 세계 각국은 앞다퉈 공급망 지도를 다시 그렸습니다.\n미국은 자국 안에 반도체 공장을 짓기 위해 막대한 보조금을 내걸었고, 유럽도 뒤따랐습니다.\n그런데 공장을 새로 지으려는 나라마다, 같은 문제에 부딪혔습니다.\n건물은 지을 수 있는데, 그 안에 넣을 재료와 기계는 결국 일본에서 사 와야 했던 겁니다.\n미국 정부가 일본을 반도체 동맹의 핵심 파트너로 부르기 시작한 것도 이 무렵이었습니다. [검증 필요: 미일 반도체 협력 발표 시점]\n삼십여 년 전 일본 반도체를 견제하던 바로 그 나라가, 이제는 일본에 손을 내밀고 있는 거죠.\n\n🎬 2019.07.04 / 2019.08 / 2023 복원 연표 카드 · 말풍선 대신 헤드라인(실제 댓글 아님) \"약품 세 가지에 멈칫\"\n\n## S6 🟥 반대 증거 — 한국은 일본 없이도 해냈다 (8:30~10:00)\n\n공정하게 짚고 넘어가야 할 부분이 있습니다.\n2019년 이후 한국은 빠르게 움직였습니다.\n일부 소재를 국산화했고, 수입처도 다른 나라로 넓혔습니다.\n고순도 불화수소의 일본 의존도는 크게 낮아졌다는 보도가 이어졌죠. [검증 필요: 한국 무역통계·수입 비중 변화]\n그래서 한국에서는 이런 말이 나왔습니다.\n'일본 소재, 생각보다 별거 아니었다'고요.\n실제로 그 시기 한국 반도체 생산은 멈추지 않았습니다.\n그런데 국제 학술지에 실린 한 연구는, 이 사건을 조금 다르게 봤습니다. [검증 필요: Elsevier 학술논문 S0889158324000327 결론 대조]\n대체가 쉬운 소재와, 대체가 거의 불가능한 소재가 따로 있었다는 겁니다.\n그리고 가장 앞선 공정으로 갈수록, 대체하기 어려운 쪽이 늘어난다는 분석이 많았습니다. [검증 필요]\n결국 2023년, 두 나라는 수출 규제를 풀고 서로를 다시 우대국 명단에 올렸습니다.\n싸움으로 확인한 건, 두 나라 반도체가 서로 떨어질 수 없는 한 몸이라는 사실이었죠.\n그런데 진짜 놀라운 이야기는, 소재 다음 단계에 숨어 있습니다.\n\n한국의 국산화 노력 자체는 분명히 대단한 일이었습니다.\n몇 년 걸릴 일을 몇 달 만에 해낸 부분도 있었으니까요.\n하지만 그 과정에서 한국 업계 스스로가 확인한 사실도 있었습니다.\n일본 소재가 왜 그렇게 오래 쓰였는지, 직접 만들어 보고 나서야 알게 됐다는 거죠.\n똑같은 화학식으로 만들어도, 공장에 넣으면 수율이 달라졌습니다. [검증 필요: 국산화 초기 수율 관련 보도]\n실험실에서 만드는 것과, 하루 수만 장의 웨이퍼에 똑같이 쓰는 것은 완전히 다른 문제였으니까요.\n\n🎬 한국 국산화 뉴스 헤드라인 타이핑 효과(기사 원문 확인 후) · 2023.03 규제 해제 / 2023.07 화이트리스트 복원 카드\n\n## S7 🟦🟩 두 번째 반전 — 칩을 찍어 내는 '기계' (10:00~13:30)\n\n반도체 공장에는 수백 단계의 공정이 있습니다.\n그 공정 하나하나를 맡는 것은 사람 키보다 큰 기계들입니다.\n세계에서 가장 유명한 기계는 네덜란드 회사의 노광 장비일 겁니다.\n빛으로 회로를 그리는, 한 대에 수천억 원짜리 기계죠.\n그런데 그 기계가 회로를 그리기 직전과 직후에, 반드시 거쳐야 하는 기계가 따로 있습니다.\n웨이퍼에 약품을 고르게 바르고, 빛을 받은 뒤 현상하는 장비입니다.\n이 장비를 사실상 독점에 가깝게 공급하는 회사가, 일본의 도쿄일렉트론입니다. [검증 필요: 최첨단 노광 공정용 코터·디벨로퍼 점유율 약 90% 이상]\n가장 미세한 회로를 그리는 공장이라면, 어느 나라든 이 일본 기계를 거쳐야 한다는 얘기입니다.\n회로를 새긴 원판, 마스크에 먼지 하나 없는지 검사하는 장비도 있습니다.\n이 분야 최첨단 검사 장비는, 일본의 레이저텍이 사실상 홀로 공급해 왔습니다. [검증 필요: 레이저텍 EUV 마스크블랭크 검사 점유율]\n웨이퍼를 자르고, 깎고, 닦는 장비에서도 일본 회사 이름이 줄줄이 나옵니다. [검증 필요: 디스코 등 후공정 장비 점유율]\n한번 생각해 보시죠.\n세계에서 가장 앞선 칩은 대만과 한국 공장에서 나옵니다.\n하지만 그 공장의 문을 열고 들어가면, 곳곳에 일본 기계가 서 있습니다.\n\n▶ [중국어 해설 · BILI-125 · 14:19.843–14:27.027] \"핵심 수입 식각 장비 한 대가, 아주 작은 기계 밸브 하나가 노후했다는 이유만으로 멈춰 섰습니다.\"\n\n장비 한 대가 멈추면, 공장 전체의 생산이 흔들립니다.\n그 기계를 만드는 나라가 반도체 싸움에서 '진 나라'일 수 있을까요?\n일본은 완성품의 무대에서 내려온 대신, 무대 뒤의 조명과 음향을 모두 맡은 셈입니다.\n관객은 배우만 기억하지만, 공연은 무대 뒤가 없으면 열리지 않죠.\n\n이 회사들의 시작을 보면 더 놀랍습니다.\n도쿄일렉트론은 1963년, 미국 장비를 들여와 팔던 작은 무역 회사로 출발했습니다. [검증 필요: 창업 연도·초기 업종]\n남의 기계를 팔던 회사가, 이제는 세계가 사 가는 기계를 만드는 회사가 된 겁니다.\n레이저텍은 원래 엑스레이 텔레비전 카메라를 만들던 작은 회사였습니다. [검증 필요]\n웨이퍼 절단 장비로 유명한 디스코는, 1930년대 공업용 숫돌을 만들던 회사에서 시작했죠. [검증 필요: 1937년 창업]\n숫돌을 갈던 기술이, 반도체를 머리카락 두께보다 얇게 자르는 기술로 이어진 겁니다.\n이들은 화려한 광고를 하지 않습니다.\n일반인은 이름조차 잘 모르죠.\n하지만 세계의 반도체 공장들은, 이 회사들의 납기 일정에 맞춰 공장 증설 계획을 짭니다.\n\n🎬 공장 내부 B-roll(권리 확인 소스) · 장비 계통도 카드: 노광(네덜란드) 앞뒤로 코터/디벨로퍼(일본) 하이라이트 · 형광 초록 g \"무대 뒤는 일본\"\n\n## S7-2 🟩 숫자 뒤의 사람들 (13:00~13:30 확장 구간)\n\n숫자 뒤에는 늘 사람이 있습니다.\n반도체 소재 공장의 하루는 생각보다 단조롭습니다.\n같은 약품을, 같은 온도에서, 같은 순서로, 수천 번 반복해서 만듭니다.\n조금이라도 달라지면 처음부터 다시 시작해야 하죠.\n일본의 한 소재 회사 기술자는, 한 가지 제품의 순도를 올리는 데 십 년이 걸렸다고 말하기도 합니다. [검증 필요: 인터뷰 원문·인물 확인 전 사용 금지 — 확인 안 되면 이 문장 삭제]\n고객사는 그 결과만 받아 봅니다.\n불량이 없으면 아무 말이 없고, 문제가 생기면 그때 처음 이름이 불리죠.\n일본 사람들은 이런 일을 '모노즈쿠리', 물건 만들기라고 부릅니다.\n빨리 많이 만드는 것보다, 한 번 만든 물건을 끝까지 믿을 수 있게 만드는 일입니다.\n반도체에서 일본이 버틴 자리는, 바로 이 모노즈쿠리가 가장 빛나는 자리였습니다.\n남보다 먼저가 아니라, 남보다 정확하게.\n그 원칙 하나로, 일본 기업들은 세계 공급망의 가장 깊은 곳에 뿌리를 내렸습니다.\n\n🎬 공장 클린룸 B-roll(권리 확인) · 헤드라인 \"모노즈쿠리 · 먼저가 아니라 정확하게\" · 음악 낮춤\n\n## S8 🟩 다시 무대로 — 일본의 반격 (13:30~16:00)\n\n그리고 지금, 일본은 다시 무대 위로 올라오려 하고 있습니다.\n2024년 2월, 구마모토에 세계 최대 파운드리 회사의 일본 공장이 문을 열었습니다.\n일본 정부는 이 공장에 대규모 보조금을 지원했습니다. [검증 필요: 최대 4,760억 엔]\n같은 시기 일본은 반도체 소재 회사 제이에스알을 정부계 펀드를 통해 사들이는 결정까지 내렸습니다. [검증 필요: JIC 인수 규모·완료 시점]\n'재료'를 나라의 전략 자산으로 지키겠다는 선언이었죠.\n홋카이도에서는 라피더스라는 새 회사가, 2나노미터라는 최첨단 칩 양산에 도전하고 있습니다.\n목표 시점은 2027년입니다. [검증 필요: 라피더스 양산 목표 최신 발표]\n삼십 년 전 무대에서 내려왔던 나라가, 무대 뒤에서 쌓은 힘으로 다시 올라오려는 겁니다.\n\n▶ [중국어 해설 · BILI-126 · 05:03.770–05:10.385] \"일본 메모리 업체 키옥시아 주가가 한때 50배 폭등해, 도요타를 넘어 일본 시총 1위 기업이 됐습니다.\" [검증 필요: 발언자 주장 — 시가총액 순위·상승 배수 원문 확인 전 사용 보류 가능]\n\n이 말이 정확한지는 숫자로 다시 확인해야 합니다.\n그래도 분명한 건, 일본에는 여전히 낸드 플래시라는 메모리를 만드는 회사가 살아 있다는 사실입니다.\n일본 반도체는 사라진 적이 없었습니다.\n조용히, 남들이 쉽게 따라올 수 없는 자리로 옮겨 갔을 뿐입니다.\n\n일본 정부도 반도체를 다시 국가 전략의 한가운데에 올려놓았습니다.\n2030년까지 국내 반도체 관련 매출을 크게 늘리겠다는 목표도 내걸었죠. [검증 필요: 경제산업성 목표치]\n해외 언론은 이 움직임을 '일본 반도체의 부활'이라는 제목으로 다루기 시작했습니다. [검증 필요: 해외 보도 원문 링크]\n물론 쉽지만은 않습니다.\n최첨단 칩을 직접 양산하는 일은, 소재나 장비와는 또 다른 전쟁이니까요.\n하지만 이번에는 출발선이 다릅니다.\n일본은 세계에서 거의 유일하게, 재료와 기계와 기술자를 모두 안방에 가진 상태로 다시 도전하고 있습니다.\n\n🎬 구마모토 공장 외관(보도자료 이미지 권리 확인) · 라피더스 지도 카드(홋카이도 지토세) · 키옥시아 클립은 사실 확인 전 BLOCKED_FOR_FACT_CHECK\n\n## S8-2 🟦 세계가 일본에 열쇠를 맡긴 날 — 장비 수출 통제 (15:30~16:00 확장 구간)\n\n2023년 3월, 일본 정부는 반도체 제조 장비 스물세 종류를 수출 허가 대상으로 묶겠다고 발표했습니다.\n그리고 그해 7월 23일부터 실제로 시행에 들어갔죠.\n미국이 중국의 첨단 칩 개발을 늦추려고 동맹국들에게 협력을 요청한 결과였습니다.\n이때 미국이 가장 먼저 손을 내민 나라는 두 곳이었습니다.\n노광 장비의 네덜란드, 그리고 나머지 핵심 장비를 쥔 일본이었죠.\n세계 최대 반도체 시장을 묶는 열쇠를, 일본이 함께 쥐고 있었다는 뜻입니다.\n중국 업계가 '장비와 소재의 포위'라고 불렀던 바로 그 장면이기도 합니다.\n물론 일본 기업들에게도 쉬운 결정은 아니었습니다.\n중국은 일본 장비 회사들의 가장 큰 고객 가운데 하나였거든요. [검증 필요: 도쿄일렉트론 등 중국 매출 비중]\n그런데도 이 통제가 효과를 가질 수 있었던 이유는 단순합니다.\n일본 장비를 대신할 곳이 거의 없었기 때문입니다.\n쉽게 대체할 수 있는 나라였다면, 애초에 부탁할 필요도 없었겠죠.\n삼십 년 전 패배자로 불리던 나라가, 이제는 세계 반도체 질서의 문지기 가운데 하나가 된 겁니다.\n\n🎬 연표 카드 2023.03.31 발표 → 2023.07.23 시행(일본 경제산업성 · 23개 품목) · 지도 카드 미국–네덜란드–일본 3국 연결선 · 형광 파랑 e \\\"대신할 곳이 없다\\\" · 출처: Reuters 2023-03-31, Hogan Lovells 2023\n\n## S9 🟩🟩 결말 — Triple Ending (16:00~17:35)\n\n처음 질문으로 돌아가 보겠습니다.\n일본은 반도체 싸움에서 진 걸까요?\n완성품의 점유율로만 보면, 일본은 분명히 졌습니다.\n하지만 반도체를 '만드는 능력'으로 보면, 이야기가 완전히 달라집니다.\n세계 최고의 칩을 만드는 나라들조차, 일본의 재료와 기계 없이는 공장을 돌리기 어렵습니다.\n이긴다는 건 무엇일까요?\n진열대에 이름을 올리는 것일까요, 아니면 그 진열대를 세우는 데 없어서는 안 되는 존재가 되는 것일까요?\n\n삼십 년 동안 일본 반도체는 패배자로 불렸습니다.\n신문은 실패를 분석했고, 회사들은 문을 닫거나 합쳐졌습니다.\n그 사이에도 누군가는 공장에 남아, 약품의 순도를 한 자리 더 올리고, 기계의 오차를 한 단계 더 줄였습니다.\n아무도 박수를 쳐 주지 않던 시간이었죠.\n그 시간이 쌓여서, 지금 세계는 일본 없이 첨단 칩을 만들기 어려운 상태가 됐습니다.\n\n세계는 오랫동안 일본 반도체를 '한물간 산업'이라고 불렀습니다.\n그런데 그 한물간 산업이 없으면, 지금 손에 들고 계신 스마트폰도, 인공지능 서버도 만들어질 수 없습니다.\n지는 법을 배운 사람이, 결국 가장 오래 남는 법을 알게 된 건지도 모릅니다. → 2022년 약 9%, CSIS·업계 통계]\n그런데 미국의 한 전략연구소가 반도체 공급망을 한 단계씩 뜯어보자, 전혀 다른 숫자가 튀어나왔습니다.\n칩을 만드는 데 꼭 필요한 핵심 소재들에서, 일본 기업들이 여전히 절반 안팎을 쥐고 있었던 겁니다. [검증 필요: CSIS '핵심 소재 14종 중 다수에서 50% 이상' 원문 대조]\n이게 진짜일까요?\n일본은 정말 반도체 싸움에서 진 걸까요, 아니면 싸우는 자리를 바꾼 걸까요?\n\n🎬 0~4초 원음 3컷 연속 → 헤드라인 \"일본 반도체 = 끝?\" → 회색 그래프 카드 [ 세계 반도체 점유율 · 일본 ] 50% → 9% → 질문 자막(노랑 q)\n\n## S2 🟥 과거의 영광 — 세계를 지배했던 일본 (0:30~2:00)\n\n시계를 1980년대 후반으로 돌려 보겠습니다.\n그때 세계 반도체 매출 순위표의 맨 위는 미국 회사가 아니었습니다.\n엔이씨, 도시바, 히타치. 일본 이름들이 상위권을 거의 다 차지하고 있었죠. [검증 필요: 1980년대 후반 세계 반도체 매출 순위]\n특히 컴퓨터의 기억을 담당하는 디램 시장에서는, 일본산이 사실상 표준이었습니다.\n일본 공장에서 나온 칩은 불량률이 낮기로 유명했거든요.\n미국 기업들이 일본 칩을 뜯어 보고 품질 차이에 놀랐다는 이야기가 지금도 업계에 전해질 정도입니다. [검증 필요: 1980년 휴렛팩커드 품질 비교 사례]\n너무 잘나갔던 게 문제였을까요?\n미국은 일본 반도체를 국가적인 위협으로 보기 시작했습니다.\n1986년, 두 나라는 미일 반도체 협정을 맺습니다.\n일본 시장을 외국 칩에 더 열고, 일본 칩의 가격을 감시하겠다는 내용이었죠. [검증 필요: 협정 세부 조항]\n이듬해 미국은 일부 일본 전자제품에 백 퍼센트 관세까지 매겼습니다. [검증 필요: 1987년 약 3억 달러 규모 보복관세]\n세계 최고였던 산업이, 기술이 아니라 정치에 발목을 잡힌 겁니다.\n그런데 일본 반도체를 무너뜨린 건 미국만이 아니었습니다.\n\n1979년, 미국 하버드대 교수 에즈라 보겔은 『재팬 애즈 넘버원』이라는 책을 냈습니다.\n제목 그대로, 일본이 세계 일등이 될 거라는 내용이었죠.\n그 예언이 가장 먼저 현실이 된 곳이 바로 반도체였습니다.\n일본 기업들은 미국에서 시작된 기술을 들여와, 더 싸고 더 튼튼하게 만들었습니다.\n공장의 먼지를 줄이고, 불량을 한 개라도 더 잡아내는 데 집착했거든요.\n그 집착이 숫자로 돌아왔습니다.\n세계 반도체 시장의 절반이 일본 차지가 된 겁니다. [검증 필요: 1988년 점유율]\n미국 실리콘밸리에서는 일본 때문에 문을 닫는 회사가 속출했습니다.\n인텔조차 메모리 사업을 접고 마이크로프로세서로 방향을 틀었을 정도였죠. [검증 필요: 1985년 인텔 디램 철수]\n\n일본 반도체의 강점은 단순히 공장 하나가 아니었습니다.\n칩을 만드는 회사 옆에는 재료 회사가 있었고, 그 옆에는 기계를 만드는 회사가 있었습니다.\n서로 같은 동네에서, 같은 기술자들과, 수십 년 동안 문제를 함께 풀어 왔죠.\n이 생태계가 바로 일본이 가진 진짜 무기였습니다.\n그리고 이 무기는, 완성품 시장에서 밀려난 뒤에도 사라지지 않았습니다.\n\n🎬 1980년대 일본 공장 자료화면(권리 확인) · 연표 카드 1986 협정 → 1987 관세 · 형광 빨강 c \"기술이 아니라 정치\"\n\n## S3 🟥🟨 몰락, 그리고 한국과 대만의 시대 (2:00~4:30)\n\n1990년대 들어 한국 기업들이 무섭게 따라왔습니다.\n과감하게 공장을 짓고, 불황에도 투자를 멈추지 않았죠.\n일본 기업들이 경기를 보며 머뭇거리는 사이, 메모리의 왕좌는 서울 남쪽으로 넘어갔습니다.\n대만은 또 다른 길을 열었습니다.\n설계는 남이 하고, 생산만 대신 맡아 주는 파운드리라는 방식이었는데요.\n이 방식이 세계 반도체 산업의 지도를 바꿔 놓았습니다.\n그리고 2012년, 일본에 남은 마지막 디램 회사 엘피다가 파산합니다.\n일본 정부가 공들여 살려 보려 했던 회사였기에 충격은 더 컸습니다.\n엘피다는 결국 미국의 마이크론에 넘어갔습니다.\n\n▶ [중국어 해설 · BV1qqk5BkEar · 01:48.080–01:53.360] \"일본은 예전엔 정말 많았는데, 친숙한 대형 브랜드와 제품… 그런데 지금도 거기 있나요?\"\n\n바깥에서 보면 이 말이 정답처럼 들립니다.\n매장 진열대에서 일본 칩의 이름은 거의 사라졌으니까요.\n일본 안에서도 '잃어버린 30년'이라는 말과 함께, 반도체는 실패한 산업의 상징처럼 이야기됐습니다.\n억울한 대목은 여기서부터입니다.\n정말 일본의 반도체 기술은 그때 함께 사라졌을까요?\n\n일본은 왜 이렇게 빨리 밀려났을까요?\n첫 번째는 돈의 가치였습니다.\n1985년 플라자 합의 이후 엔화 가치가 크게 뛰었습니다.\n같은 칩을 팔아도, 일본산은 갑자기 비싼 물건이 돼 버렸죠.\n두 번째는 결정의 속도였습니다.\n일본의 반도체 사업부는 대부분 거대한 전기 회사 안의 한 부서였습니다.\n가전, 발전기, 철도 차량까지 만드는 회사가, 반도체에만 수조 원을 걸기는 쉽지 않았습니다.\n반면 한국 기업들은 총수가 결단하면 불황 한가운데서도 공장을 올렸습니다.\n일본은 뒤늦게 회사들을 합쳐 살길을 찾았습니다.\n엔이씨와 히타치의 디램 부문이 합쳐 엘피다가 됐고, 여러 회사의 시스템 반도체 부문이 모여 르네사스가 됐습니다. [검증 필요: 1999 엘피다 / 2010 르네사스 출범 연도]\n하지만 흐름을 되돌리기에는 이미 늦었습니다.\n\n🎬 연표: 1990s 한국 메모리 성장 → 1987 대만 파운드리 → 2012 엘피다 파산 · 헤드라인 \"일본 반도체 = 실패?\"\n\n## S4 🟩 첫 번째 반전 — 칩을 만드는 '재료' (4:30~6:30)\n\n반도체 한 장이 만들어지는 과정을 떠올려 보겠습니다.\n먼저 둥글고 얇은 실리콘 판, 웨이퍼가 필요합니다.\n그 위에 빛으로 회로를 그리려면, 빛에 반응하는 특수한 약품을 발라야 하죠.\n이 약품을 포토레지스트라고 부릅니다.\n회로를 깎아 내고 깨끗하게 씻어 내는 데는, 아주 순도 높은 가스와 약품이 쓰입니다.\n그런데 이 단계마다, 낯익은 일본 회사 이름이 등장합니다.\n웨이퍼는 신에쓰화학과 섬코 두 회사가 세계 시장의 절반을 훌쩍 넘게 공급합니다. [검증 필요: 2사 합산 점유율 약 50~60%]\n포토레지스트는 제이에스알, 도쿄오카공업, 신에쓰화학 같은 일본 기업들이 시장의 대부분을 쥐고 있습니다. [검증 필요: 일본 기업 점유율 약 80~90%]\n특히 가장 미세한 회로를 그리는 최첨단 공정용 약품일수록, 일본 의존도는 더 높아진다는 분석이 많습니다. [검증 필요: EUV용 레지스트 점유율]\n미국 의회 조사국 보고서도 일본을 반도체 소재 분야의 핵심 공급국으로 꼽았습니다. [검증 필요: CRS R47558 해당 대목 원문]\n완성된 칩이 요리라면, 소재는 재료입니다.\n한국과 대만은 세계 최고의 요리사가 됐습니다.\n하지만 그 주방에 들어가는 재료의 상당수는, 아직도 일본에서 오고 있었던 거죠.\n진열대에서 사라진 건 일본의 브랜드였지, 일본의 기술이 아니었습니다.\n\n이 재료들이 왜 그렇게 어려운지, 하나만 예를 들어 보겠습니다.\n반도체 공장에서 쓰는 불화수소는 순도가 소수점 아래로 아홉 자리, 열 자리가 넘어가야 합니다. [검증 필요: 고순도 불화수소 순도 '트웰브 나인' 표기]\n불순물이 백억 분의 일만 섞여도, 머리카락보다 수천 배 가는 회로가 망가질 수 있거든요.\n이 순도를 맞추는 데에는 화학식이 아니라 시간이 필요합니다.\n공장 온도, 배관 재질, 용기 세척 방법까지, 수십 년 동안 쌓인 경험이 모여야 하죠.\n일본의 소재 회사들 중에는 창업한 지 백 년이 넘은 곳도 적지 않습니다. [검증 필요: 해당 기업 창업 연도]\n반도체가 생기기 훨씬 전부터 비료와 약품, 화학 원료를 만들던 회사들이었죠.\n그들은 반도체라는 새 손님이 나타나자, 원래 하던 일을 백 배 더 정밀하게 해냈습니다.\n\n이 회사들은 한국과 대만 공장 바로 옆에 자기 공장을 짓기도 했습니다.\n고객이 새 공정을 개발할 때, 처음부터 함께 실험하기 위해서였죠.\n고객사의 연구소 안에 일본 회사의 기술자가 상주하는 경우도 흔합니다. [검증 필요]\n칩을 만드는 회사가 바뀌어도, 재료를 대는 회사는 바뀌지 않았던 이유입니다.\n\n🎬 웨이퍼 → 감광액 도포 → 노광 → 식각 공정 애니메이션(자체 그래픽) · 그래프 카드 [ 실리콘 웨이퍼 점유율 ] [ 포토레지스트 점유율 ] 큰 숫자 + 출처 · 형광 초록 g \"요리사는 한국·대만, 재료는 일본\"\n\n## S5 🟨 아직 풀리지 않은 의문 (6:30~8:30)\n\n그런데 여기서 고개를 갸웃하게 되는 분들도 계실 겁니다.\n재료 몇 가지 판다고, 정말 그게 큰 힘이 될까요?\n소재는 결국 납품업체 아닌가요?\n이 의문에 답을 준 사건이 있었습니다.\n2019년 7월, 일본 정부는 반도체 소재 세 가지의 한국 수출 심사를 강화했습니다.\n불화수소, 포토레지스트, 그리고 화면용 소재인 불화 폴리이미드였죠.\n한 달 뒤에는 한국을 수출 절차 우대국 명단에서도 뺐습니다.\n양국 관계가 얼어붙었던 시기였고, 한국에서는 불매운동까지 벌어졌습니다.\n이 결정이 옳았는지는 지금도 두 나라에서 평가가 엇갈립니다.\n다만 이 사건이 세계에 보여 준 사실 하나는 분명했습니다.\n세계 최대 메모리 회사들이 있는 나라의 공장이, 일본의 약품 세 가지에 긴장했다는 겁니다.\n\n▶ [중국어 해설 · BILI-125 · 14:03.784–14:07.799] \"장비·소재·EDA 소프트웨어·인재 4위일체의 입체 포위를 가했습니다.\"\n\n이건 중국 반도체 업계가 미국과 동맹국들의 수출 통제를 겪으며 내놓은 표현입니다.\n반도체를 막으려면 칩이 아니라 장비와 소재를 막는다는 거죠.\n반도체 싸움의 급소가, 완성품이 아니라 그 앞단에 있다는 뜻입니다.\n그렇다면 앞단에는 소재만 있을까요?\n\n한국 산업계는 그때 처음으로 이 숫자를 피부로 느꼈습니다.\n일부 공장에서는 남은 재고가 몇 달 치인지 매일 계산했다는 보도까지 나왔죠. [검증 필요: 당시 국내 보도]\n미국과 유럽 언론도 이 사건을 크게 다뤘습니다.\n세계 공급망이 생각보다 훨씬 가늘고 촘촘한 실로 엮여 있다는 걸 보여 줬기 때문입니다.\n\n이 사건 이후 세계 각국은 앞다퉈 공급망 지도를 다시 그렸습니다.\n미국은 자국 안에 반도체 공장을 짓기 위해 막대한 보조금을 내걸었고, 유럽도 뒤따랐습니다.\n그런데 공장을 새로 지으려는 나라마다, 같은 문제에 부딪혔습니다.\n건물은 지을 수 있는데, 그 안에 넣을 재료와 기계는 결국 일본에서 사 와야 했던 겁니다.\n미국 정부가 일본을 반도체 동맹의 핵심 파트너로 부르기 시작한 것도 이 무렵이었습니다. [검증 필요: 미일 반도체 협력 발표 시점]\n삼십여 년 전 일본 반도체를 견제하던 바로 그 나라가, 이제는 일본에 손을 내밀고 있는 거죠.\n\n🎬 2019.07.04 / 2019.08 / 2023 복원 연표 카드 · 말풍선 대신 헤드라인(실제 댓글 아님) \"약품 세 가지에 멈칫\"\n\n## S6 🟥 반대 증거 — 한국은 일본 없이도 해냈다 (8:30~10:00)\n\n공정하게 짚고 넘어가야 할 부분이 있습니다.\n2019년 이후 한국은 빠르게 움직였습니다.\n일부 소재를 국산화했고, 수입처도 다른 나라로 넓혔습니다.\n고순도 불화수소의 일본 의존도는 크게 낮아졌다는 보도가 이어졌죠. [검증 필요: 한국 무역통계·수입 비중 변화]\n그래서 한국에서는 이런 말이 나왔습니다.\n'일본 소재, 생각보다 별거 아니었다'고요.\n실제로 그 시기 한국 반도체 생산은 멈추지 않았습니다.\n그런데 국제 학술지에 실린 한 연구는, 이 사건을 조금 다르게 봤습니다. [검증 필요: Elsevier 학술논문 S0889158324000327 결론 대조]\n대체가 쉬운 소재와, 대체가 거의 불가능한 소재가 따로 있었다는 겁니다.\n그리고 가장 앞선 공정으로 갈수록, 대체하기 어려운 쪽이 늘어난다는 분석이 많았습니다. [검증 필요]\n결국 2023년, 두 나라는 수출 규제를 풀고 서로를 다시 우대국 명단에 올렸습니다.\n싸움으로 확인한 건, 두 나라 반도체가 서로 떨어질 수 없는 한 몸이라는 사실이었죠.\n그런데 진짜 놀라운 이야기는, 소재 다음 단계에 숨어 있습니다.\n\n한국의 국산화 노력 자체는 분명히 대단한 일이었습니다.\n몇 년 걸릴 일을 몇 달 만에 해낸 부분도 있었으니까요.\n하지만 그 과정에서 한국 업계 스스로가 확인한 사실도 있었습니다.\n일본 소재가 왜 그렇게 오래 쓰였는지, 직접 만들어 보고 나서야 알게 됐다는 거죠.\n똑같은 화학식으로 만들어도, 공장에 넣으면 수율이 달라졌습니다. [검증 필요: 국산화 초기 수율 관련 보도]\n실험실에서 만드는 것과, 하루 수만 장의 웨이퍼에 똑같이 쓰는 것은 완전히 다른 문제였으니까요.\n\n🎬 한국 국산화 뉴스 헤드라인 타이핑 효과(기사 원문 확인 후) · 2023.03 규제 해제 / 2023.07 화이트리스트 복원 카드\n\n## S7 🟦🟩 두 번째 반전 — 칩을 찍어 내는 '기계' (10:00~13:30)\n\n반도체 공장에는 수백 단계의 공정이 있습니다.\n그 공정 하나하나를 맡는 것은 사람 키보다 큰 기계들입니다.\n세계에서 가장 유명한 기계는 네덜란드 회사의 노광 장비일 겁니다.\n빛으로 회로를 그리는, 한 대에 수천억 원짜리 기계죠.\n그런데 그 기계가 회로를 그리기 직전과 직후에, 반드시 거쳐야 하는 기계가 따로 있습니다.\n웨이퍼에 약품을 고르게 바르고, 빛을 받은 뒤 현상하는 장비입니다.\n이 장비를 사실상 독점에 가깝게 공급하는 회사가, 일본의 도쿄일렉트론입니다. [검증 필요: 최첨단 노광 공정용 코터·디벨로퍼 점유율 약 90% 이상]\n가장 미세한 회로를 그리는 공장이라면, 어느 나라든 이 일본 기계를 거쳐야 한다는 얘기입니다.\n회로를 새긴 원판, 마스크에 먼지 하나 없는지 검사하는 장비도 있습니다.\n이 분야 최첨단 검사 장비는, 일본의 레이저텍이 사실상 홀로 공급해 왔습니다. [검증 필요: 레이저텍 EUV 마스크블랭크 검사 점유율]\n웨이퍼를 자르고, 깎고, 닦는 장비에서도 일본 회사 이름이 줄줄이 나옵니다. [검증 필요: 디스코 등 후공정 장비 점유율]\n한번 생각해 보시죠.\n세계에서 가장 앞선 칩은 대만과 한국 공장에서 나옵니다.\n하지만 그 공장의 문을 열고 들어가면, 곳곳에 일본 기계가 서 있습니다.\n\n▶ [중국어 해설 · BILI-125 · 14:19.843–14:27.027] \"핵심 수입 식각 장비 한 대가, 아주 작은 기계 밸브 하나가 노후했다는 이유만으로 멈춰 섰습니다.\"\n\n장비 한 대가 멈추면, 공장 전체의 생산이 흔들립니다.\n그 기계를 만드는 나라가 반도체 싸움에서 '진 나라'일 수 있을까요?\n일본은 완성품의 무대에서 내려온 대신, 무대 뒤의 조명과 음향을 모두 맡은 셈입니다.\n관객은 배우만 기억하지만, 공연은 무대 뒤가 없으면 열리지 않죠.\n\n이 회사들의 시작을 보면 더 놀랍습니다.\n도쿄일렉트론은 1963년, 미국 장비를 들여와 팔던 작은 무역 회사로 출발했습니다. [검증 필요: 창업 연도·초기 업종]\n남의 기계를 팔던 회사가, 이제는 세계가 사 가는 기계를 만드는 회사가 된 겁니다.\n레이저텍은 원래 엑스레이 텔레비전 카메라를 만들던 작은 회사였습니다. [검증 필요]\n웨이퍼 절단 장비로 유명한 디스코는, 1930년대 공업용 숫돌을 만들던 회사에서 시작했죠. [검증 필요: 1937년 창업]\n숫돌을 갈던 기술이, 반도체를 머리카락 두께보다 얇게 자르는 기술로 이어진 겁니다.\n이들은 화려한 광고를 하지 않습니다.\n일반인은 이름조차 잘 모르죠.\n하지만 세계의 반도체 공장들은, 이 회사들의 납기 일정에 맞춰 공장 증설 계획을 짭니다.\n\n🎬 공장 내부 B-roll(권리 확인 소스) · 장비 계통도 카드: 노광(네덜란드) 앞뒤로 코터/디벨로퍼(일본) 하이라이트 · 형광 초록 g \"무대 뒤는 일본\"\n\n## S7-2 🟩 숫자 뒤의 사람들 (13:00~13:30 확장 구간)\n\n숫자 뒤에는 늘 사람이 있습니다.\n반도체 소재 공장의 하루는 생각보다 단조롭습니다.\n같은 약품을, 같은 온도에서, 같은 순서로, 수천 번 반복해서 만듭니다.\n조금이라도 달라지면 처음부터 다시 시작해야 하죠.\n일본의 한 소재 회사 기술자는, 한 가지 제품의 순도를 올리는 데 십 년이 걸렸다고 말하기도 합니다. [검증 필요: 인터뷰 원문·인물 확인 전 사용 금지 — 확인 안 되면 이 문장 삭제]\n고객사는 그 결과만 받아 봅니다.\n불량이 없으면 아무 말이 없고, 문제가 생기면 그때 처음 이름이 불리죠.\n일본 사람들은 이런 일을 '모노즈쿠리', 물건 만들기라고 부릅니다.\n빨리 많이 만드는 것보다, 한 번 만든 물건을 끝까지 믿을 수 있게 만드는 일입니다.\n반도체에서 일본이 버틴 자리는, 바로 이 모노즈쿠리가 가장 빛나는 자리였습니다.\n남보다 먼저가 아니라, 남보다 정확하게.\n그 원칙 하나로, 일본 기업들은 세계 공급망의 가장 깊은 곳에 뿌리를 내렸습니다.\n\n🎬 공장 클린룸 B-roll(권리 확인) · 헤드라인 \"모노즈쿠리 · 먼저가 아니라 정확하게\" · 음악 낮춤\n\n## S8 🟩 다시 무대로 — 일본의 반격 (13:30~16:00)\n\n그리고 지금, 일본은 다시 무대 위로 올라오려 하고 있습니다.\n2024년 2월, 구마모토에 세계 최대 파운드리 회사의 일본 공장이 문을 열었습니다.\n일본 정부는 이 공장에 대규모 보조금을 지원했습니다. [검증 필요: 최대 4,760억 엔]\n같은 시기 일본은 반도체 소재 회사 제이에스알을 정부계 펀드를 통해 사들이는 결정까지 내렸습니다. [검증 필요: JIC 인수 규모·완료 시점]\n'재료'를 나라의 전략 자산으로 지키겠다는 선언이었죠.\n홋카이도에서는 라피더스라는 새 회사가, 2나노미터라는 최첨단 칩 양산에 도전하고 있습니다.\n목표 시점은 2027년입니다. [검증 필요: 라피더스 양산 목표 최신 발표]\n삼십 년 전 무대에서 내려왔던 나라가, 무대 뒤에서 쌓은 힘으로 다시 올라오려는 겁니다.\n\n▶ [중국어 해설 · BILI-126 · 05:03.770–05:10.385] \"일본 메모리 업체 키옥시아 주가가 한때 50배 폭등해, 도요타를 넘어 일본 시총 1위 기업이 됐습니다.\" [검증 필요: 발언자 주장 — 시가총액 순위·상승 배수 원문 확인 전 사용 보류 가능]\n\n이 말이 정확한지는 숫자로 다시 확인해야 합니다.\n그래도 분명한 건, 일본에는 여전히 낸드 플래시라는 메모리를 만드는 회사가 살아 있다는 사실입니다.\n일본 반도체는 사라진 적이 없었습니다.\n조용히, 남들이 쉽게 따라올 수 없는 자리로 옮겨 갔을 뿐입니다.\n\n일본 정부도 반도체를 다시 국가 전략의 한가운데에 올려놓았습니다.\n2030년까지 국내 반도체 관련 매출을 크게 늘리겠다는 목표도 내걸었죠. [검증 필요: 경제산업성 목표치]\n해외 언론은 이 움직임을 '일본 반도체의 부활'이라는 제목으로 다루기 시작했습니다. [검증 필요: 해외 보도 원문 링크]\n물론 쉽지만은 않습니다.\n최첨단 칩을 직접 양산하는 일은, 소재나 장비와는 또 다른 전쟁이니까요.\n하지만 이번에는 출발선이 다릅니다.\n일본은 세계에서 거의 유일하게, 재료와 기계와 기술자를 모두 안방에 가진 상태로 다시 도전하고 있습니다.\n\n🎬 구마모토 공장 외관(보도자료 이미지 권리 확인) · 라피더스 지도 카드(홋카이도 지토세) · 키옥시아 클립은 사실 확인 전 BLOCKED_FOR_FACT_CHECK\n\n## S8-2 🟦 세계가 일본에 열쇠를 맡긴 날 — 장비 수출 통제 (15:30~16:00 확장 구간)\n\n2023년 3월, 일본 정부는 반도체 제조 장비 스물세 종류를 수출 허가 대상으로 묶겠다고 발표했습니다.\n그리고 그해 7월 23일부터 실제로 시행에 들어갔죠.\n미국이 중국의 첨단 칩 개발을 늦추려고 동맹국들에게 협력을 요청한 결과였습니다.\n이때 미국이 가장 먼저 손을 내민 나라는 두 곳이었습니다.\n노광 장비의 네덜란드, 그리고 나머지 핵심 장비를 쥔 일본이었죠.\n세계 최대 반도체 시장을 묶는 열쇠를, 일본이 함께 쥐고 있었다는 뜻입니다.\n중국 업계가 '장비와 소재의 포위'라고 불렀던 바로 그 장면이기도 합니다.\n물론 일본 기업들에게도 쉬운 결정은 아니었습니다.\n중국은 일본 장비 회사들의 가장 큰 고객 가운데 하나였거든요. [검증 필요: 도쿄일렉트론 등 중국 매출 비중]\n그런데도 이 통제가 효과를 가질 수 있었던 이유는 단순합니다.\n일본 장비를 대신할 곳이 거의 없었기 때문입니다.\n쉽게 대체할 수 있는 나라였다면, 애초에 부탁할 필요도 없었겠죠.\n삼십 년 전 패배자로 불리던 나라가, 이제는 세계 반도체 질서의 문지기 가운데 하나가 된 겁니다.\n\n🎬 연표 카드 2023.03.31 발표 → 2023.07.23 시행(일본 경제산업성 · 23개 품목) · 지도 카드 미국–네덜란드–일본 3국 연결선 · 형광 파랑 e \\\"대신할 곳이 없다\\\" · 출처: Reuters 2023-03-31, Hogan Lovells 2023\n\n## S9 🟩🟩 결말 — Triple Ending (16:00~17:35)\n\n처음 질문으로 돌아가 보겠습니다.\n일본은 반도체 싸움에서 진 걸까요?\n완성품의 점유율로만 보면, 일본은 분명히 졌습니다.\n하지만 반도체를 '만드는 능력'으로 보면, 이야기가 완전히 달라집니다.\n세계 최고의 칩을 만드는 나라들조차, 일본의 재료와 기계 없이는 공장을 돌리기 어렵습니다.\n이긴다는 건 무엇일까요?\n진열대에 이름을 올리는 것일까요, 아니면 그 진열대를 세우는 데 없어서는 안 되는 존재가 되는 것일까요?\n\n삼십 년 동안 일본 반도체는 패배자로 불렸습니다.\n신문은 실패를 분석했고, 회사들은 문을 닫거나 합쳐졌습니다.\n그 사이에도 누군가는 공장에 남아, 약품의 순도를 한 자리 더 올리고, 기계의 오차를 한 단계 더 줄였습니다.\n아무도 박수를 쳐 주지 않던 시간이었죠.\n그 시간이 쌓여서, 지금 세계는 일본 없이 첨단 칩을 만들기 어려운 상태가 됐습니다.\n\n세계는 오랫동안 일본 반도체를 '한물간 산업'이라고 불렀습니다.\n그런데 그 한물간 산업이 없으면, 지금 손에 들고 계신 스마트폰도, 인공지능 서버도 만들어질 수 없습니다.\n지는 법을 배운 사람이, 결국 가장 오래 남는 법을 알게 된 건지도 모릅니다.\n\n▶ [중국어 해설 · BV1qqk5BkEar · 01:22.920–01:24.800] \"한국은 이미 일본보다 앞서 있다.\"\n\n다시 들어도, 반쯤은 맞는 말입니다.\n다만 그 '앞선' 칩 한 장 안에는, 오늘도 일본 장인들이 만든 재료와 기계의 흔적이 남아 있습니다.\n수십 년 동안 무대 뒤를 지켜 온 사람들 덕분이죠.\n그렇다면 일본이 다시 무대 앞으로 나서는 날, 세계는 어떤 표정을 짓게 될까요?\n\n🎬 첫 원음 재생 → 의미 재정의 헤드라인 \"진열대 vs 진열대를 세우는 손\" → 칩 단면에 소재·장비 아이콘이 일본 국기 색으로 켜지는 그래픽 → 마지막 질문 자막\n\n---\n\n## READ 표 (숫자 한글 읽기)\n| 표기 | 읽기 |\n|---|---|\n| 1980년대 | 천구백팔십년대 |\n| 1986년 | 천구백팔십육 년 |\n| 2012년 | 이천십이 년 |\n| 2019년 7월 | 이천십구 년 칠월 |\n| 2나노미터 | 이 나노미터 |\n| 2027년 | 이천이십칠 년 |\n| 4위일체 | 사위일체 |\n| 50배 | 오십 배 |\n| 9% | 구 퍼센트 |\n\n## 원음 목록 (C)\n| # | 소스 | IN | OUT | 길이 | 상태 |\n|---|---|---|---|---|---|\n| 1 | BV1qqk5BkEar | 01:22.920 | 01:24.800 | 1.9s | 🟡 3초 미만 → 앞 '경제적으로' 컷 01:18.440 포함 검토 |\n| 2 | BV1qqk5BkEar | 01:31.360 | 01:33.400 | 2.0s | 🟡 01:29.520부터 붙이면 3.9s |\n| 3 | BV1qqk5BkEar | 01:53.400 | 01:56.600 | 3.2s | ✅ |\n| 4 | BV1qqk5BkEar | 01:48.080 | 01:53.360 | 5.3s | ✅ |\n| 5 | BILI-125 | 14:03.784 | 14:07.799 | 4.0s | ✅ |\n| 6 | BILI-125 | 14:19.843 | 14:27.027 | 7.2s | 🟡 6초 초과 → 두 컷 분할 |\n| 7 | BILI-126 | 05:03.770 | 05:10.385 | 6.6s | 🔴 사실 확인 전 보류 |\n| 8 | BV1qqk5BkEar (회수) | 01:22.920 | 01:24.800 | 1.9s | 🟡 |\n- 원음 합계 약 32초 → 규칙(원음 약 35~40%) 대비 **크게 부족**. 추가 후보: 일본 소재·장비 해외 보도 영상(CNBC·Bloomberg·NHK World 등) 자막 추출 필요.\n\n", "prod_file": "prod/EP01_PRODUCTION_PROMPT.md"}, {"n": 2, "title": "로봇 — \"로봇 강국도 옛말\"", "v3": ["①🟧 \"공장 자동화? 이제 한국이 더 앞서잖아.\"", "②🟧 \"일본 로봇 강국? 그거 다 옛날 얘기야.\"", "③📰 그런데 독일에 본부를 둔 국제로봇연맹(IFR)은 2023년 세계 로봇 생산의 38%를 일본이 차지했다고 발표했습니다.", "④ 로봇을 가장 많이 쓰는 나라와, 그 로봇을 만들어 파는 나라는 달랐던 겁니다.", "⑤❓ 이게 진짜일까요? 세계 공장들은 왜 아직도 일본 로봇을 들여놓는 걸까요?"], "orig": [{"src": "붙여넣기①(13:53) 50편 V2 훅 강화본", "title": "한국의 로봇 강국 타이틀 뒤에 숨은 일본", "text": "공장 자동화는 이제 한국이 더 앞서지 않아? 일본은 로봇 강국이라는 말도 옛날 얘기 같은데.\n그런데 독일에 본부를 둔 국제로봇연맹은 2023년 세계 로봇 생산량의 38%를 일본이 차지했다고 발표했습니다. 로봇을 많이 사용하는 나라와 로봇을 만들어 세계에 공급하는 나라는 서로 달랐던 겁니다. 세계의 공장들은 왜 일본 로봇을 선택해 왔을까요?"}, {"src": "붙여넣기③(13:55) 50편 실제 기획안", "title": "로봇을 잘 쓰는 나라와 잘 만드는 나라", "text": "한국 공장의 자동화 수준은 대단합니다. 그렇다면 로봇 산업에서도 같은 결론이 나올까요? 국제로봇연맹은 2024년 일본 공장의 가동 로봇을 약 45만 대로 집계했습니다. 그런데 진짜 중요한 숫자는 따로 있습니다. 세계 공장에 들어가는 로봇은 누가 만드는 걸까요?"}, {"src": "붙여넣기④(13:56) 50편 V2 해외 평가 반전형", "title": "로봇", "text": "국제로봇연맹은 일본을 세계적인 로봇 생산국으로 평가했습니다. 2023년 세계 로봇 생산의 38%를 일본이 차지했습니다. 그런데 공장 자동화 경쟁에서는 한국도 강력한 성과를 거두고 있습니다. 로봇을 많이 사용하는 것과 만드는 것은 같은 경쟁력일까요? 세계 공장 뒤에 숨어 있는 일본 기술을 찾아봅니다."}], "outline": "한국 자동화 → 비교 기준 → 일본 제조업 → 로봇 생산 → 해외 공장 → 부품 기술 → 두 번째 발견 → 일본의 역할. D04+D06", "question": "⑤❓ 이게 진짜일까요? 세계 공장들은 왜 아직도 일본 로봇을 들여놓는 걸까요?", "answer": ["로봇을 가장 많이 쓰는 나라와 로봇을 만들어 파는 나라는 다릅니다.", "직원 수 대비 산업용 로봇을 가장 촘촘하게 쓰는 나라는 한국입니다. [검증 필요: IFR 로봇 밀도 최신 수치]", "하지만 그 로봇을 만들어 세계 공장에 공급하는 쪽으로 가면 일본 이름이 앞에 섭니다. 국제로봇연맹은 2023년 세계 산업용 로봇 생산의 38%가 일본이었다고 밝혔습니다. [검증 필요: IFR 원문]", "로봇 팔을 정밀하게 움직이는 감속기 같은 핵심 부품도 일본 기업들이 오래 강세를 보여온 분야입니다. [검증 필요: 부품 점유율 출처]", "그러니까 세계 공장이 일본 로봇을 들여놓는 건 유행이 아니라, 오래 쌓인 부품과 정밀 제어 기술 때문일 가능성이 큽니다. 그 기술은 어디서 시작됐을까요?"], "script": "# EP02 · 로봇을 잘 쓰는 나라와 잘 만드는 나라 — 본편 대본 v1\n\n- 기반: 훅 V3(EP02) · 붙여넣기③ 전개 \"한국 자동화 → 비교 기준 → 일본 제조업 → 로봇 생산 → 해외 공장 → 부품 기술 → 두 번째 발견 → 일본의 역할 (D04+D06)\" · 붙여넣기④ \"비교 → 의심 → 생산 기술 → 해외 공장 → 숨은 부품 → 자긍심\" · 감정선 E07 국제 평가 반전형 · STEP 4 규칙\n- 표기: 일반 문장 = 내레이션(N) · `▶` = 외국인 원음(C) · `🎬` = 화면 메모(낭독 안 함) · `[검증 필요]` = 수치·출처 원문 미대조\n- 원음 원본: BV1qqk5BkEar(중국어 해설) · BILI-124(중국어 가전 해설, 댓글 낭독 구간) — 원어 대조·권리 미검증 🟡\n- ⚠️ 로봇 산업 직접 원음은 GitHub SRT에서 **발견 못 함** → `▶[미확보]` 자리는 자료 수집 후 교체(지어내지 않음)\n\n---\n\n## S1 🟥 훅 (0:00~0:30)\n\n▶ [중국어 해설 · BV1qqk5BkEar · 01:41.240–01:46.240] \"일본의 1인당 경제, 더 이상 한국만큼 좋지 않아요.\"\n▶ [중국어 가전 해설 · BILI-124 · 08:30.200–08:33.598] \"그런데 일본도 이제 상표만 바꿔서 판다.\"\n\n공장 자동화는 이제 한국이 더 앞서잖아.\n일본이 로봇 강국이라는 말도, 다 옛날 얘기 아니야?\n실제로 노동자 수에 비해 로봇을 가장 많이 쓰는 나라는 일본이 아니라 한국입니다. [검증 필요: IFR 로봇 밀도 — 한국 1위]\n그런데 독일에 본부를 둔 국제로봇연맹은, 2023년 세계에서 만들어진 산업용 로봇의 38%가 일본산이었다고 발표했습니다. [검증 필요: IFR World Robotics 원문]\n로봇을 가장 많이 쓰는 나라와, 그 로봇을 만들어 세계에 파는 나라는 달랐던 겁니다.\n이게 진짜일까요?\n세계의 공장들은 왜 아직도 일본 로봇을 들여놓는 걸까요?\n\n🎬 원음 2컷 → 헤드라인 \"로봇 강국 = 옛말?\" → 그래프 카드 [ 로봇 밀도 1위 한국 ] vs [ 로봇 생산 38% 일본 ] → 질문 자막(노랑 q)\n\n## S2 🟨 비교의 기준 — 쓰는 나라, 만드는 나라 (0:30~2:00)\n\n먼저 숫자 두 개를 나란히 놓아 보겠습니다.\n첫 번째는 로봇 밀도입니다.\n공장 노동자 만 명당 로봇이 몇 대나 일하고 있는지 세는 숫자죠.\n이 숫자에서 한국은 오랫동안 세계 1위를 지켜 왔습니다.\n노동자 만 명당 천 대가 넘는다는 집계도 있습니다. [검증 필요: 2023년 1,012대]\n열 명 중 한 명꼴로 로봇 동료가 옆에 서 있는 셈이에요.\n자동차와 반도체, 배터리 공장이 몰려 있는 한국다운 숫자입니다.\n두 번째 숫자는 로봇 생산입니다.\n세계에서 만들어진 로봇이 어느 나라 공장에서 나왔는지 세는 숫자죠.\n여기서는 순위가 완전히 뒤집힙니다.\n일본이 압도적인 1위입니다.\n쓰는 쪽의 1등과, 만드는 쪽의 1등.\n둘은 같은 이야기처럼 들리지만, 사실은 전혀 다른 실력입니다.\n축구로 치면, 경기를 가장 많이 뛰는 선수와 축구공을 만드는 회사가 다른 것과 비슷하죠.\n그렇다면 일본은 어떻게 '로봇을 만드는 나라'가 됐을까요?\n\n이 두 실력의 차이는 돈의 흐름을 보면 더 분명해집니다.\n로봇을 쓰는 나라는 로봇을 사는 데 돈을 씁니다.\n로봇을 만드는 나라는 그 돈을 받습니다.\n공장이 늘어날수록, 자동화가 퍼질수록, 결국 그 주문서는 만드는 나라의 책상 위에 쌓이게 되죠.\n그래서 로봇 밀도 1위라는 숫자만으로는, 로봇 산업 전체의 그림을 다 보기 어렵습니다.\n\n🎬 비교 카드 A/B: [쓰는 나라 · 로봇 밀도] / [만드는 나라 · 생산 점유율] · 형광 파랑 e\n\n## S3 🟥 일본 로봇의 시작과 영광 (2:00~4:30)\n\n일본 산업용 로봇의 역사는 1960년대 말로 거슬러 올라갑니다.\n1968년, 가와사키중공업은 미국 회사 유니메이션과 기술 제휴를 맺었습니다. [검증 필요: 제휴 연도]\n그리고 이듬해 일본 최초의 국산 산업용 로봇을 내놓았죠. [검증 필요: 1969년 가와사키 유니메이트]\n처음에는 미국 기술을 빌려 온 출발이었습니다.\n그런데 일본에는 미국에 없던 조건이 하나 있었습니다.\n일손이 모자랐던 거예요.\n고도 성장기 일본 공장들은 사람을 구하기 어려웠고, 로봇은 그 빈자리를 채워 줄 해답이었습니다.\n1980년은 일본에서 '로봇 보급 원년'이라고 불립니다. [검증 필요: 로봇 보급 원년 표현 출처]\n자동차 공장의 용접 라인에, 전자 공장의 조립 라인에, 로봇 팔이 줄지어 들어섰죠.\n그 시기 세계에서 가동되는 산업용 로봇의 상당수가 일본에 있었다는 집계도 있습니다. [검증 필요: 1980년대 일본 로봇 가동 대수 비중]\n사람만 한 로봇을 처음 만든 것도 일본이었습니다.\n1973년, 와세다대학교는 두 발로 걷는 인간형 로봇 와봇 원을 공개했습니다.\n2000년에는 혼다가 아시모를 내놓아 세계를 놀라게 했죠.\n계단을 오르고, 손을 흔들던 그 로봇은 일본 기술의 얼굴이 됐습니다.\n로봇이라고 하면 누구나 일본을 떠올리던 시대였습니다.\n\n일본 로봇이 가장 먼저 꽃핀 곳은 자동차 공장이었습니다.\n도요타, 닛산, 혼다 같은 회사들은 로봇과 함께 생산 방식을 다듬었습니다.\n적은 사람으로, 적은 불량으로, 더 많은 차를 만드는 방법이었죠.\n세계가 일본 자동차의 품질에 놀랐을 때, 그 뒤에는 이미 수많은 일본 로봇이 서 있었습니다.\n미국과 유럽의 자동차 회사들이 일본 공장을 견학하러 줄을 섰던 시절이었습니다. [검증 필요: 1980년대 해외 견학 사례]\n그들이 돌아가서 가장 먼저 한 일 중 하나가, 일본 로봇을 주문하는 것이었다는 이야기도 전해집니다. [검증 필요]\n\n🎬 연표 카드 1968 → 1969 → 1973 와봇-1 → 1980 → 2000 아시모(자료화면 권리 확인) · 형광 초록 g \"로봇 = 일본\"\n\n## S4 🟥 몰락의 신호 — 중국과 한국의 추격 (4:30~6:30)\n\n그런데 2010년대 들어 분위기가 달라졌습니다.\n세계 로봇 시장의 주인공이 중국으로 바뀌기 시작한 거죠.\n중국은 이제 해마다 세계 산업용 로봇 설치 대수의 절반 이상을 가져가는 나라가 됐습니다. [검증 필요: 2023년 약 27.6만 대·51%]\n중국 안에서 로봇을 만드는 회사들도 빠르게 늘었습니다.\n값싸고 빠른 중국산 로봇이, 자국 시장에서 외국 브랜드의 몫을 조금씩 빼앗기 시작했습니다. [검증 필요: 중국 국산 로봇 점유율 추이]\n한국 역시 로봇 밀도 세계 1위라는 기록을 내세우며, 로봇 산업을 미래 먹거리로 키우고 있습니다.\n그 사이 일본에서는 걱정스러운 이야기가 들려왔습니다.\n아시모는 2018년 개발이 멈췄다는 보도가 나왔고, 결국 2022년 마지막 공연을 끝으로 무대에서 내려왔습니다. [검증 필요: 개발 중단 보도 시점]\n인간형 로봇의 주도권은 미국과 중국 기업으로 넘어가는 것처럼 보였죠.\n걷고 뛰고 공중제비를 도는 로봇 영상이 나올 때마다, 그 회사 이름은 일본이 아니었습니다.\n일본 로봇도 끝난 걸까요?\n화려한 영상이 사라진 자리에서, 일본 로봇은 무엇을 하고 있었을까요?\n\n한국의 추격도 만만치 않습니다.\n한국 현대자동차그룹은 2021년, 걷고 뛰는 로봇으로 유명한 미국 회사 보스턴 다이내믹스를 인수했습니다.\n한국의 협동 로봇 회사들도 해외 시장으로 빠르게 나가고 있죠.\n여기에 중국은 정부가 나서서 로봇 산업을 국가 전략으로 밀고 있습니다.\n양쪽에서 거센 바람이 불어오는 상황이었습니다.\n일본 언론에서도 '로봇 대국의 지위가 흔들린다'는 걱정 섞인 기사가 나오기 시작했습니다. [검증 필요: 일본 언론 보도 원문]\n\n▶[미확보] 해외 시청자가 \"일본 로봇은 이제 끝났다/중국 로봇이 더 낫다\"고 말하는 원음 — 자료 수집 후 교체, 없으면 이 줄 삭제\n\n🎬 중국 공장 로봇 설치 그래프 · 아시모 은퇴 헤드라인(보도 원문 확인 후) · 형광 빨강 c\n\n## S5 🟩 첫 번째 반전 — 세계 공장의 노란 팔 (6:30~9:00)\n\n세계 어느 자동차 공장에 가도 자주 보이는 색이 있습니다.\n샛노란 로봇 팔이죠.\n이 노란색은 일본 회사 화낙의 상징입니다.\n화낙은 후지산 기슭에 본사와 공장을 두고 있습니다.\n그리고 그 공장에는 유명한 이야기가 하나 있습니다.\n로봇이 로봇을 만드는 공장이라는 거예요.\n불을 끈 채 사람 없이 며칠씩 돌아가는 생산 라인이 있다는 보도로 해외에 널리 알려졌죠. [검증 필요: 무인 연속 가동 기간 보도 원문]\n화낙이 지금까지 만든 산업용 로봇은 백만 대를 넘었습니다. [검증 필요: 누적 생산 100만 대 달성 시점]\n화낙만이 아닙니다.\n야스카와전기, 가와사키중공업, 나치후지코시, 덴소웨이브.\n산업용 로봇 시장의 세계 상위권 명단을 보면, 일본 이름이 몇 개씩 들어가 있습니다. [검증 필요: 세계 상위 로봇 제조사 순위]\n중국이 세계 최대의 로봇 시장이 됐다고 했죠.\n그런데 그 중국 공장에 들어가는 로봇의 상당수가, 바로 이 일본 회사들의 제품입니다. [검증 필요: 중국 시장 내 일본 브랜드 점유율]\n한국의 로봇 밀도 1위도 마찬가지입니다.\n한국 공장에서 일하는 로봇 중에도 일본산이 적지 않거든요. [검증 필요: 한국 로봇 수입국 비중]\n세계가 로봇을 많이 쓸수록, 일본은 더 많이 팔게 되는 구조인 겁니다.\n\n야스카와전기의 이야기도 흥미롭습니다.\n1915년 규슈에서 모터를 만드는 회사로 출발했습니다. [검증 필요: 창업 연도]\n그리고 1977년, 모든 관절을 전기 모터로 움직이는 산업용 로봇을 내놓았죠. [검증 필요: 모토맨 출시 연도·'일본 최초 전기식' 표현]\n그 로봇 이름이 모토맨입니다.\n백 년 넘게 모터 하나를 파고든 회사가, 그 모터로 세계 공장의 팔을 만든 겁니다.\n야스카와 역시 누적 생산 대수가 수십만 대를 넘는 것으로 알려져 있습니다. [검증 필요: 누적 대수]\n일본 로봇 회사들의 공통점이 여기 있습니다.\n로봇을 만들기 전부터, 모터나 공작기계, 중공업처럼 정밀한 기계를 오래 만들어 온 회사들이라는 점이죠.\n\n🎬 노란 로봇 팔 B-roll(권리 확인) · 후지산 지도 카드 · 그래프 [ 세계 로봇 생산 · 일본 38% ] · 형광 초록 g \"쓸수록 일본이 판다\"\n\n## S5-2 🟦 해외 공장 — 중국 한가운데의 일본 로봇 (8:30~9:00 확장 구간)\n\n일본 로봇 회사들은 이미 오래전에 해외로 나갔습니다.\n가장 큰 시장인 중국 안에 직접 공장을 세운 거죠.\n야스카와는 중국 창저우에, 화낙은 상하이의 합작 회사를 통해 로봇을 만들고 있습니다. [검증 필요: 해외 생산 거점 원문]\n중국에서 팔리는 로봇이 중국 땅에서 만들어지더라도, 설계와 핵심 부품과 품질 기준은 일본에서 오는 구조입니다.\n그래서 중국 로봇 시장이 커질수록, 일본 로봇 회사들도 함께 커졌습니다.\n한국에도, 미국에도, 유럽에도, 일본 로봇 회사들의 서비스 센터와 교육 시설이 촘촘하게 깔려 있습니다.\n로봇은 한 번 들여놓으면, 그 회사의 기술자와 오랫동안 함께 일해야 하는 물건이니까요.\n공장 엔지니어가 처음 배운 로봇이 일본산이면, 다음 로봇도 일본산을 고르는 경우가 많다고 하죠. [검증 필요]\n\n🎬 세계 지도 카드: 일본 로봇 회사 해외 생산·서비스 거점 표시\n\n## S6 🟨 아직 풀리지 않은 의문 (9:00~10:30)\n\n그런데 여기서 이런 반론이 나올 수 있습니다.\n중국산 로봇이 이렇게 싸고 빨리 나오는데, 언젠가는 일본산을 밀어내지 않을까요?\n실제로 중국 회사들은 해마다 기술을 끌어올리고 있습니다.\n완성된 로봇만 놓고 보면, 겉모습의 차이는 점점 줄어들고 있죠.\n그렇다면 일본이 지키고 있는 진짜 무기는, 완성된 로봇 그 자체가 아닐지도 모릅니다.\n로봇을 뜯어 보면, 그 답이 보입니다.\n\n중국 정부는 로봇 핵심 부품의 국산화를 중요한 목표로 내걸었습니다. [검증 필요: 중국 로봇 산업 계획 원문]\n한국도 부품 자립을 위한 연구 지원을 늘리고 있죠.\n두 나라가 공통으로 노리는 곳이 어디인지 보면, 일본이 쥐고 있는 자리가 보입니다.\n남들이 가장 갖고 싶어 하는 자리, 그게 바로 진짜 강자의 자리니까요.\n그렇다면 그 자리는 정확히 어디일까요?\n\n🎬 로봇 팔 분해 애니메이션(자체 그래픽) · 질문 자막 \"진짜 무기는 어디에?\"\n\n## S7 🟦🟩 두 번째 반전 — 로봇의 관절 (10:30~13:30)\n\n로봇 팔이 사람처럼 정확하게 움직이려면, 관절이 필요합니다.\n모터의 빠른 회전을 느리고 강한 힘으로 바꿔 주는 부품이죠.\n이 부품을 감속기라고 부릅니다.\n로봇 원가에서 꽤 큰 비중을 차지하는 핵심 부품입니다. [검증 필요: 감속기 원가 비중]\n그런데 이 감속기 시장에서도, 일본 회사 두 곳의 이름이 계속 나옵니다.\n하나는 나브테스코입니다.\n로봇 팔의 어깨와 허리처럼 무거운 힘을 받는 관절에 쓰이는 감속기를 만드는데요.\n세계 산업용 로봇의 이 관절 부품 시장에서, 절반이 넘는 몫을 가진 것으로 알려져 있습니다. [검증 필요: RV 감속기 점유율 약 60%]\n다른 하나는 하모닉드라이브시스템즈입니다.\n손목처럼 작고 정밀한 관절에 쓰이는 특수한 감속기로 유명하죠.\n이 부품은 우주 탐사선과 인공위성의 관절에도 쓰였습니다. [검증 필요: 탐사선 적용 사례 원문]\n여기에 정밀 모터, 제어 장치, 센서까지 더하면 이야기가 커집니다.\n중국 회사가 완성 로봇을 만들어도, 그 관절 안에는 일본 부품이 들어가는 경우가 적지 않다는 분석이 나옵니다. [검증 필요: 중국 로봇 핵심부품 수입 의존도]\n겉으로는 중국 로봇, 안을 열면 일본 관절.\n반도체에서 봤던 장면이, 로봇에서도 그대로 반복되는 거죠.\n게다가 금속을 정밀하게 깎는 공작기계에도 두뇌가 필요합니다.\n수치 제어 장치라고 부르는 이 두뇌에서도, 일본 기업이 세계 선두권입니다. [검증 필요: CNC 제어장치 화낙 점유율]\n로봇의 몸과 관절과 두뇌, 그리고 그 로봇을 만드는 기계까지.\n일본은 자동화라는 거대한 건물의 기초 공사를 맡고 있었던 겁니다.\n\n하모닉드라이브라는 기술 자체는 1950년대 미국에서 처음 발명됐습니다. [검증 필요: 발명자·연도]\n하지만 그 기술을 들여와 대량 생산이 가능한 정밀 부품으로 완성한 곳은 일본이었습니다. [검증 필요: 1970년 하모닉드라이브시스템즈 설립 경위]\n반도체 때와 똑같은 패턴이죠.\n남이 시작한 기술을 받아들여, 누구도 따라오기 힘든 수준까지 갈고닦는 겁니다.\n이 부품들이 어려운 이유는 아주 작은 오차 때문입니다.\n머리카락 굵기의 몇십 분의 일만 어긋나도, 로봇 팔 끝에서는 그 오차가 몇 배로 커집니다.\n그래서 이 부품은 설계도만 있다고 만들 수 있는 게 아닙니다.\n금속을 깎고, 열처리하고, 맞물리게 하는 과정마다 오랜 경험이 필요하죠.\n중국과 한국에서도 이 부품을 직접 만들려는 노력이 계속되고 있습니다.\n하지만 가장 무거운 짐을 오래 버텨야 하는 고급 로봇일수록, 여전히 일본 부품을 찾는다는 평가가 많습니다. [검증 필요]\n\n▶[미확보] 해외 엔지니어·리뷰어가 일본 감속기·부품 품질을 평가하는 원음 — 자료 수집 후 교체\n\n🎬 관절 확대 그래픽: 어깨·허리(나브테스코) / 손목(하모닉드라이브) 표시 · 그래프 [ 정밀 감속기 점유율 ] 큰 숫자 + 출처 · 형광 초록 g \"겉은 중국, 관절은 일본\"\n\n## S8 🟩 숫자 뒤의 사람들 — 고장 나지 않는 로봇 (13:30~15:30)\n\n공장 주인들이 일본 로봇을 고르는 이유를 물으면, 비슷한 답이 돌아옵니다.\n잘 안 멈춘다는 거예요.\n자동차 공장 하나가 한 시간 멈추면, 수십억 원이 날아갈 수 있습니다. [검증 필요: 라인 정지 손실 추정치]\n그래서 공장은 조금 비싸더라도, 고장 나지 않는 로봇을 원하죠.\n로봇 한 대를 수십 년씩 쓰는 공장도 적지 않습니다.\n일본 로봇 회사들은 오래된 로봇의 부품을 계속 공급하는 것으로도 유명합니다. [검증 필요: 장기 부품 공급 정책]\n팔고 끝나는 게 아니라, 그 로봇이 은퇴할 때까지 책임진다는 거죠.\n이런 신뢰는 광고로 만들어지지 않습니다.\n수십 년 동안 공장 바닥에서, 한 대 한 대 고장 없이 돌아간 기록이 쌓여야 생기는 것이니까요.\n일본 사람들은 이런 태도를 모노즈쿠리라고 부릅니다.\n물건을 만드는 일에 혼을 담는다는 뜻이죠.\n빨리 만드는 나라는 많습니다.\n하지만 오래 믿을 수 있게 만드는 나라는 많지 않습니다.\n\n일본 로봇은 이제 수술실에도 들어가 있습니다.\n가와사키중공업과 의료기기 회사가 함께 만든 일본산 수술 로봇이 2020년 승인을 받았습니다. [검증 필요: 힌토리 승인 연도·개발사]\n미국산이 거의 독차지하던 분야에, 일본이 처음으로 자기 이름을 올린 겁니다.\n공장에서 쌓은 정밀함이, 사람의 생명을 다루는 곳까지 이어진 셈이죠.\n\n일본 로봇 회사들의 공장 안에서는, 지금도 사람이 직접 하는 일이 남아 있습니다.\n가장 정밀한 부품을 마지막으로 맞추고, 소리를 듣고, 손끝으로 진동을 느끼는 일이죠. [검증 필요: 현장 취재 원문]\n로봇을 만드는 공장의 가장 중요한 공정을, 결국 사람의 감각이 지키고 있는 겁니다.\n기계에 혼을 넣는다는 말이, 그냥 비유가 아니었던 거죠.\n\n🎬 공장 라인 B-roll(권리 확인) · 헤드라인 \"멈추지 않는 로봇\" · 음악 낮춤\n\n## S8-2 🟥 공정하게 — 일본 로봇의 약점 (15:00~15:30 확장 구간)\n\n물론 일본 로봇에 약점이 없는 건 아닙니다.\n먼저 가격입니다.\n같은 일을 하는 로봇이라도, 중국산이 훨씬 싸게 나오는 경우가 많습니다.\n작은 공장들은 이 차이를 무시하기 어렵죠.\n두 번째는 소프트웨어입니다.\n요즘 로봇의 경쟁은 몸보다 두뇌, 그러니까 인공지능으로 옮겨 가고 있습니다.\n이 분야에서는 미국과 중국 기업들이 더 빠르게 움직인다는 평가가 많습니다. [검증 필요]\n일본 안에서도 이 점을 걱정하는 목소리가 큽니다.\n하지만 거꾸로 생각해 볼 수도 있습니다.\n인공지능 두뇌가 아무리 똑똑해져도, 그 명령을 정확하게 수행할 몸과 관절이 없으면 아무 소용이 없습니다.\n두뇌를 만드는 회사들이 결국 찾아가야 하는 곳이, 몸과 관절을 가장 잘 만드는 나라라는 거죠.\n실제로 세계 인간형 로봇 개발사들 가운데 일본산 정밀 부품을 쓰는 곳이 적지 않다는 분석도 나옵니다. [검증 필요: 휴머노이드 부품 공급 관련 보도]\n\n🎬 비교 카드 [가격 · 중국] [소프트웨어 · 미국·중국] [몸·관절 · 일본] · 형광 빨강 c → 초록 g\n\n## S9 🟩 다시 앞으로 — 사람 곁으로 가는 일본 로봇 (15:30~16:30)\n\n그리고 지금, 일본 로봇은 새로운 무대로 향하고 있습니다.\n일본은 세계에서 고령화가 가장 빠른 나라 가운데 하나입니다.\n일할 사람이 줄어드는 문제를, 일본은 누구보다 먼저 겪고 있죠.\n그래서 일본의 로봇은 공장 밖으로 나오고 있습니다.\n간병 현장에서 사람을 들어 올리는 로봇, 물류 창고에서 짐을 나르는 로봇, 식당에서 음식을 나르는 로봇까지요. [검증 필요: 일본 서비스 로봇 보급 사례 출처]\n오십 년 전 일손 부족을 공장 로봇으로 풀었던 나라가, 이번에는 고령 사회의 해답을 로봇에서 찾고 있는 겁니다.\n다른 나라들이 앞으로 겪게 될 문제를, 일본은 지금 먼저 풀고 있습니다.\n\n일본은 2050년까지, 사람이 하던 일을 스스로 배우고 판단하는 로봇을 만들겠다는 국가 연구 목표도 내걸었습니다. [검증 필요: 문샷 연구개발 목표 원문]\n쉽지 않은 목표입니다.\n하지만 일본에는 이미 오십 년 넘게 쌓아 온 로봇의 몸과 관절이 있습니다.\n그 위에 새로운 두뇌만 얹으면 되는, 세계에서 몇 안 되는 나라인 거죠.\n\n일본의 편의점과 물류 회사들은 이미 무인 창고와 자동 배송 실험을 늘리고 있습니다. [검증 필요: 사례·기업명]\n요양 시설에서는 사람을 침대에서 휠체어로 옮겨 주는 로봇이 간병인의 허리를 지켜 주고 있죠. [검증 필요]\n이런 로봇들은 공장 로봇보다 훨씬 까다롭습니다.\n사람 바로 옆에서 일하니까, 힘 조절 하나만 잘못돼도 다칠 수 있거든요.\n그래서 더더욱 정밀한 관절과 센서가 필요합니다.\n일본이 오십 년 동안 갈고닦은 바로 그 기술이, 이번에는 사람을 지키는 데 쓰이는 겁니다.\n고령화라는 위기가, 일본 로봇에게는 오히려 다음 시대를 여는 열쇠가 되고 있습니다.\n\n🎬 간병·물류 로봇 B-roll(권리 확인) · 헤드라인 \"다음 무대는 사람 곁\"\n\n## S9-2 🟦 세계 최초의 로봇 협회 — 일본이 먼저 깔아 둔 길 (16:00~16:30 확장 구간)\n\n일본 로봇의 힘은 회사 몇 곳의 실력만으로 설명되지 않습니다.\n1971년, 일본에서는 산업용 로봇 회사들이 모인 모임이 처음 만들어졌습니다.\n지금의 일본로봇공업회입니다.\n국제로봇연맹은 이 단체를 세계 최초의 국가 로봇 협회로 소개하고 있죠. [검증 필요: IFR robot-history 페이지 표현 대조]\n로봇이라는 말 자체가 아직 공장에서 낯설던 시절이었습니다.\n그런데 일본 회사들은 그때부터 함께 표준을 맞추고, 통계를 모으고, 기술자를 길러 냈거든요.\n경쟁자끼리 한 테이블에 앉아 산업 전체의 길을 먼저 닦은 겁니다.\n도쿄에서는 지금도 국제로봇전이라는 대형 박람회가 정기적으로 열립니다. [검증 필요: iREX 개최 주기·첫 개최 연도]\n세계의 공장 관계자들이 다음 로봇을 고르러 일본으로 모이는 자리죠.\n노란 로봇 팔의 뿌리도 생각보다 깊습니다.\n화낙은 1956년, 일본 민간 최초의 수치 제어 장치를 개발한 것을 자기 역사의 출발점으로 꼽습니다. [검증 필요: 화낙 공식 연혁 — 당시 후지쓰 소속 조직]\n기계를 숫자로 움직이는 두뇌가, 로봇 팔보다 먼저 있었던 거예요.\n그 두뇌 위에 팔을 얹은 것이 지금 세계 공장에 서 있는 노란 로봇입니다.\n일본 안의 숫자도 여전히 큽니다.\n국제로봇연맹 집계로, 2023년 일본 공장에서 일하던 산업용 로봇은 약 43만 5천 대였습니다.\n같은 해 새로 설치된 로봇은 4만 6천여 대로, 중국에 이어 세계 2위 시장이었죠.\n로봇 밀도 순위에서는 한국에 밀렸지만, 일본은 여전히 로봇을 두 번째로 많이 들여놓는 나라입니다.\n그리고 그 로봇의 대부분을 자기 손으로 만들어 쓰는 나라이기도 합니다. [검증 필요: 일본 국내 설치분 중 자국산 비중]\n남이 만든 로봇을 사서 쓰는 나라와, 자기 로봇으로 자기 공장을 채우는 나라.\n공급망이 흔들리는 날, 어느 쪽이 더 오래 버틸까요?\n\n🎬 연표 카드 1956 NC → 1971 일본로봇공업회(전신) → 1972 화낙 독립 · 그래프 카드 [ 2023 일본 가동 로봇 435,299대 · 신규 설치 46,106대 · 세계 2위 ] 출처 IFR World Robotics 2024 보도자료 · 형광 파랑 e\n\n## S10 🟩🟩 결말 — Triple Ending (16:30~17:35)\n\n처음 질문으로 돌아가 보겠습니다.\n세계의 공장들은 왜 아직도 일본 로봇을 들여놓을까요?\n답은 화려함이 아니라 믿음이었습니다.\n일본은 로봇을 가장 많이 쓰는 나라는 아닐지도 모릅니다.\n하지만 세계가 로봇을 쓰면 쓸수록, 그 로봇의 몸과 관절 어딘가에는 일본의 기술이 들어가 있습니다.\n로봇 강국이라는 말의 뜻이, 사실은 처음부터 달랐던 거죠.\n\n한때 세계는 일본 로봇이 끝났다고 말했습니다.\n화려한 영상 속 주인공이 다른 나라 로봇으로 바뀌었으니까요.\n그런데 그 화려한 무대가 서 있는 바닥을 들여다보면, 그곳을 받치고 있는 건 여전히 일본의 기술이었습니다.\n\n▶ [중국어 가전 해설 · BILI-124 · 08:30.200–08:33.598] \"그런데 일본도 이제 상표만 바꿔서 판다.\"\n\n상표는 바뀔 수 있습니다.\n하지만 세계 공장 바닥에서 오늘도 쉬지 않고 돌아가는 노란 팔과, 그 안의 작은 관절은 쉽게 바뀌지 않습니다.\n그렇다면 사람 곁으로 걸어 나온 일본 로봇은, 다음 오십 년 동안 세계를 어떻게 바꿔 놓을까요?\n\n🎬 첫 원음 재생 → 헤드라인 \"상표는 바뀌어도, 관절은 일본\" → 세계 지도에 로봇 아이콘이 켜지는 그래픽 → 마지막 질문 자막\n\n---\n\n## READ 표\n| 표기 | 읽기 |\n|---|---|\n| 38% | 삼십팔 퍼센트 |\n| 1,012대 | 천십이 대 |\n| 1968년 | 천구백육십팔 년 |\n| 1973년 | 천구백칠십삼 년 |\n| 2000년 | 이천 년 |\n| 2022년 | 이천이십이 년 미대조\n- 원음 원본: BV1qqk5BkEar(중국어 해설) · BILI-124(중국어 가전 해설, 댓글 낭독 구간) — 원어 대조·권리 미검증 🟡\n- ⚠️ 로봇 산업 직접 원음은 GitHub SRT에서 **발견 못 함** → `▶[미확보]` 자리는 자료 수집 후 교체(지어내지 않음)\n\n---\n\n## S1 🟥 훅 (0:00~0:30)\n\n▶ [중국어 해설 · BV1qqk5BkEar · 01:41.240–01:46.240] \"일본의 1인당 경제, 더 이상 한국만큼 좋지 않아요.\"\n▶ [중국어 가전 해설 · BILI-124 · 08:30.200–08:33.598] \"그런데 일본도 이제 상표만 바꿔서 판다.\"\n\n공장 자동화는 이제 한국이 더 앞서잖아.\n일본이 로봇 강국이라는 말도, 다 옛날 얘기 아니야?\n실제로 노동자 수에 비해 로봇을 가장 많이 쓰는 나라는 일본이 아니라 한국입니다. [검증 필요: IFR 로봇 밀도 — 한국 1위]\n그런데 독일에 본부를 둔 국제로봇연맹은, 2023년 세계에서 만들어진 산업용 로봇의 38%가 일본산이었다고 발표했습니다. [검증 필요: IFR World Robotics 원문]\n로봇을 가장 많이 쓰는 나라와, 그 로봇을 만들어 세계에 파는 나라는 달랐던 겁니다.\n이게 진짜일까요?\n세계의 공장들은 왜 아직도 일본 로봇을 들여놓는 걸까요?\n\n🎬 원음 2컷 → 헤드라인 \"로봇 강국 = 옛말?\" → 그래프 카드 [ 로봇 밀도 1위 한국 ] vs [ 로봇 생산 38% 일본 ] → 질문 자막(노랑 q)\n\n## S2 🟨 비교의 기준 — 쓰는 나라, 만드는 나라 (0:30~2:00)\n\n먼저 숫자 두 개를 나란히 놓아 보겠습니다.\n첫 번째는 로봇 밀도입니다.\n공장 노동자 만 명당 로봇이 몇 대나 일하고 있는지 세는 숫자죠.\n이 숫자에서 한국은 오랫동안 세계 1위를 지켜 왔습니다.\n노동자 만 명당 천 대가 넘는다는 집계도 있습니다. [검증 필요: 2023년 1,012대]\n열 명 중 한 명꼴로 로봇 동료가 옆에 서 있는 셈이에요.\n자동차와 반도체, 배터리 공장이 몰려 있는 한국다운 숫자입니다.\n두 번째 숫자는 로봇 생산입니다.\n세계에서 만들어진 로봇이 어느 나라 공장에서 나왔는지 세는 숫자죠.\n여기서는 순위가 완전히 뒤집힙니다.\n일본이 압도적인 1위입니다.\n쓰는 쪽의 1등과, 만드는 쪽의 1등.\n둘은 같은 이야기처럼 들리지만, 사실은 전혀 다른 실력입니다.\n축구로 치면, 경기를 가장 많이 뛰는 선수와 축구공을 만드는 회사가 다른 것과 비슷하죠.\n그렇다면 일본은 어떻게 '로봇을 만드는 나라'가 됐을까요?\n\n이 두 실력의 차이는 돈의 흐름을 보면 더 분명해집니다.\n로봇을 쓰는 나라는 로봇을 사는 데 돈을 씁니다.\n로봇을 만드는 나라는 그 돈을 받습니다.\n공장이 늘어날수록, 자동화가 퍼질수록, 결국 그 주문서는 만드는 나라의 책상 위에 쌓이게 되죠.\n그래서 로봇 밀도 1위라는 숫자만으로는, 로봇 산업 전체의 그림을 다 보기 어렵습니다.\n\n🎬 비교 카드 A/B: [쓰는 나라 · 로봇 밀도] / [만드는 나라 · 생산 점유율] · 형광 파랑 e\n\n## S3 🟥 일본 로봇의 시작과 영광 (2:00~4:30)\n\n일본 산업용 로봇의 역사는 1960년대 말로 거슬러 올라갑니다.\n1968년, 가와사키중공업은 미국 회사 유니메이션과 기술 제휴를 맺었습니다. [검증 필요: 제휴 연도]\n그리고 이듬해 일본 최초의 국산 산업용 로봇을 내놓았죠. [검증 필요: 1969년 가와사키 유니메이트]\n처음에는 미국 기술을 빌려 온 출발이었습니다.\n그런데 일본에는 미국에 없던 조건이 하나 있었습니다.\n일손이 모자랐던 거예요.\n고도 성장기 일본 공장들은 사람을 구하기 어려웠고, 로봇은 그 빈자리를 채워 줄 해답이었습니다.\n1980년은 일본에서 '로봇 보급 원년'이라고 불립니다. [검증 필요: 로봇 보급 원년 표현 출처]\n자동차 공장의 용접 라인에, 전자 공장의 조립 라인에, 로봇 팔이 줄지어 들어섰죠.\n그 시기 세계에서 가동되는 산업용 로봇의 상당수가 일본에 있었다는 집계도 있습니다. [검증 필요: 1980년대 일본 로봇 가동 대수 비중]\n사람만 한 로봇을 처음 만든 것도 일본이었습니다.\n1973년, 와세다대학교는 두 발로 걷는 인간형 로봇 와봇 원을 공개했습니다.\n2000년에는 혼다가 아시모를 내놓아 세계를 놀라게 했죠.\n계단을 오르고, 손을 흔들던 그 로봇은 일본 기술의 얼굴이 됐습니다.\n로봇이라고 하면 누구나 일본을 떠올리던 시대였습니다.\n\n일본 로봇이 가장 먼저 꽃핀 곳은 자동차 공장이었습니다.\n도요타, 닛산, 혼다 같은 회사들은 로봇과 함께 생산 방식을 다듬었습니다.\n적은 사람으로, 적은 불량으로, 더 많은 차를 만드는 방법이었죠.\n세계가 일본 자동차의 품질에 놀랐을 때, 그 뒤에는 이미 수많은 일본 로봇이 서 있었습니다.\n미국과 유럽의 자동차 회사들이 일본 공장을 견학하러 줄을 섰던 시절이었습니다. [검증 필요: 1980년대 해외 견학 사례]\n그들이 돌아가서 가장 먼저 한 일 중 하나가, 일본 로봇을 주문하는 것이었다는 이야기도 전해집니다. [검증 필요]\n\n🎬 연표 카드 1968 → 1969 → 1973 와봇-1 → 1980 → 2000 아시모(자료화면 권리 확인) · 형광 초록 g \"로봇 = 일본\"\n\n## S4 🟥 몰락의 신호 — 중국과 한국의 추격 (4:30~6:30)\n\n그런데 2010년대 들어 분위기가 달라졌습니다.\n세계 로봇 시장의 주인공이 중국으로 바뀌기 시작한 거죠.\n중국은 이제 해마다 세계 산업용 로봇 설치 대수의 절반 이상을 가져가는 나라가 됐습니다. [검증 필요: 2023년 약 27.6만 대·51%]\n중국 안에서 로봇을 만드는 회사들도 빠르게 늘었습니다.\n값싸고 빠른 중국산 로봇이, 자국 시장에서 외국 브랜드의 몫을 조금씩 빼앗기 시작했습니다. [검증 필요: 중국 국산 로봇 점유율 추이]\n한국 역시 로봇 밀도 세계 1위라는 기록을 내세우며, 로봇 산업을 미래 먹거리로 키우고 있습니다.\n그 사이 일본에서는 걱정스러운 이야기가 들려왔습니다.\n아시모는 2018년 개발이 멈췄다는 보도가 나왔고, 결국 2022년 마지막 공연을 끝으로 무대에서 내려왔습니다. [검증 필요: 개발 중단 보도 시점]\n인간형 로봇의 주도권은 미국과 중국 기업으로 넘어가는 것처럼 보였죠.\n걷고 뛰고 공중제비를 도는 로봇 영상이 나올 때마다, 그 회사 이름은 일본이 아니었습니다.\n일본 로봇도 끝난 걸까요?\n화려한 영상이 사라진 자리에서, 일본 로봇은 무엇을 하고 있었을까요?\n\n한국의 추격도 만만치 않습니다.\n한국 현대자동차그룹은 2021년, 걷고 뛰는 로봇으로 유명한 미국 회사 보스턴 다이내믹스를 인수했습니다.\n한국의 협동 로봇 회사들도 해외 시장으로 빠르게 나가고 있죠.\n여기에 중국은 정부가 나서서 로봇 산업을 국가 전략으로 밀고 있습니다.\n양쪽에서 거센 바람이 불어오는 상황이었습니다.\n일본 언론에서도 '로봇 대국의 지위가 흔들린다'는 걱정 섞인 기사가 나오기 시작했습니다. [검증 필요: 일본 언론 보도 원문]\n\n▶[미확보] 해외 시청자가 \"일본 로봇은 이제 끝났다/중국 로봇이 더 낫다\"고 말하는 원음 — 자료 수집 후 교체, 없으면 이 줄 삭제\n\n🎬 중국 공장 로봇 설치 그래프 · 아시모 은퇴 헤드라인(보도 원문 확인 후) · 형광 빨강 c\n\n## S5 🟩 첫 번째 반전 — 세계 공장의 노란 팔 (6:30~9:00)\n\n세계 어느 자동차 공장에 가도 자주 보이는 색이 있습니다.\n샛노란 로봇 팔이죠.\n이 노란색은 일본 회사 화낙의 상징입니다.\n화낙은 후지산 기슭에 본사와 공장을 두고 있습니다.\n그리고 그 공장에는 유명한 이야기가 하나 있습니다.\n로봇이 로봇을 만드는 공장이라는 거예요.\n불을 끈 채 사람 없이 며칠씩 돌아가는 생산 라인이 있다는 보도로 해외에 널리 알려졌죠. [검증 필요: 무인 연속 가동 기간 보도 원문]\n화낙이 지금까지 만든 산업용 로봇은 백만 대를 넘었습니다. [검증 필요: 누적 생산 100만 대 달성 시점]\n화낙만이 아닙니다.\n야스카와전기, 가와사키중공업, 나치후지코시, 덴소웨이브.\n산업용 로봇 시장의 세계 상위권 명단을 보면, 일본 이름이 몇 개씩 들어가 있습니다. [검증 필요: 세계 상위 로봇 제조사 순위]\n중국이 세계 최대의 로봇 시장이 됐다고 했죠.\n그런데 그 중국 공장에 들어가는 로봇의 상당수가, 바로 이 일본 회사들의 제품입니다. [검증 필요: 중국 시장 내 일본 브랜드 점유율]\n한국의 로봇 밀도 1위도 마찬가지입니다.\n한국 공장에서 일하는 로봇 중에도 일본산이 적지 않거든요. [검증 필요: 한국 로봇 수입국 비중]\n세계가 로봇을 많이 쓸수록, 일본은 더 많이 팔게 되는 구조인 겁니다.\n\n야스카와전기의 이야기도 흥미롭습니다.\n1915년 규슈에서 모터를 만드는 회사로 출발했습니다. [검증 필요: 창업 연도]\n그리고 1977년, 모든 관절을 전기 모터로 움직이는 산업용 로봇을 내놓았죠. [검증 필요: 모토맨 출시 연도·'일본 최초 전기식' 표현]\n그 로봇 이름이 모토맨입니다.\n백 년 넘게 모터 하나를 파고든 회사가, 그 모터로 세계 공장의 팔을 만든 겁니다.\n야스카와 역시 누적 생산 대수가 수십만 대를 넘는 것으로 알려져 있습니다. [검증 필요: 누적 대수]\n일본 로봇 회사들의 공통점이 여기 있습니다.\n로봇을 만들기 전부터, 모터나 공작기계, 중공업처럼 정밀한 기계를 오래 만들어 온 회사들이라는 점이죠.\n\n🎬 노란 로봇 팔 B-roll(권리 확인) · 후지산 지도 카드 · 그래프 [ 세계 로봇 생산 · 일본 38% ] · 형광 초록 g \"쓸수록 일본이 판다\"\n\n## S5-2 🟦 해외 공장 — 중국 한가운데의 일본 로봇 (8:30~9:00 확장 구간)\n\n일본 로봇 회사들은 이미 오래전에 해외로 나갔습니다.\n가장 큰 시장인 중국 안에 직접 공장을 세운 거죠.\n야스카와는 중국 창저우에, 화낙은 상하이의 합작 회사를 통해 로봇을 만들고 있습니다. [검증 필요: 해외 생산 거점 원문]\n중국에서 팔리는 로봇이 중국 땅에서 만들어지더라도, 설계와 핵심 부품과 품질 기준은 일본에서 오는 구조입니다.\n그래서 중국 로봇 시장이 커질수록, 일본 로봇 회사들도 함께 커졌습니다.\n한국에도, 미국에도, 유럽에도, 일본 로봇 회사들의 서비스 센터와 교육 시설이 촘촘하게 깔려 있습니다.\n로봇은 한 번 들여놓으면, 그 회사의 기술자와 오랫동안 함께 일해야 하는 물건이니까요.\n공장 엔지니어가 처음 배운 로봇이 일본산이면, 다음 로봇도 일본산을 고르는 경우가 많다고 하죠. [검증 필요]\n\n🎬 세계 지도 카드: 일본 로봇 회사 해외 생산·서비스 거점 표시\n\n## S6 🟨 아직 풀리지 않은 의문 (9:00~10:30)\n\n그런데 여기서 이런 반론이 나올 수 있습니다.\n중국산 로봇이 이렇게 싸고 빨리 나오는데, 언젠가는 일본산을 밀어내지 않을까요?\n실제로 중국 회사들은 해마다 기술을 끌어올리고 있습니다.\n완성된 로봇만 놓고 보면, 겉모습의 차이는 점점 줄어들고 있죠.\n그렇다면 일본이 지키고 있는 진짜 무기는, 완성된 로봇 그 자체가 아닐지도 모릅니다.\n로봇을 뜯어 보면, 그 답이 보입니다.\n\n중국 정부는 로봇 핵심 부품의 국산화를 중요한 목표로 내걸었습니다. [검증 필요: 중국 로봇 산업 계획 원문]\n한국도 부품 자립을 위한 연구 지원을 늘리고 있죠.\n두 나라가 공통으로 노리는 곳이 어디인지 보면, 일본이 쥐고 있는 자리가 보입니다.\n남들이 가장 갖고 싶어 하는 자리, 그게 바로 진짜 강자의 자리니까요.\n그렇다면 그 자리는 정확히 어디일까요?\n\n🎬 로봇 팔 분해 애니메이션(자체 그래픽) · 질문 자막 \"진짜 무기는 어디에?\"\n\n## S7 🟦🟩 두 번째 반전 — 로봇의 관절 (10:30~13:30)\n\n로봇 팔이 사람처럼 정확하게 움직이려면, 관절이 필요합니다.\n모터의 빠른 회전을 느리고 강한 힘으로 바꿔 주는 부품이죠.\n이 부품을 감속기라고 부릅니다.\n로봇 원가에서 꽤 큰 비중을 차지하는 핵심 부품입니다. [검증 필요: 감속기 원가 비중]\n그런데 이 감속기 시장에서도, 일본 회사 두 곳의 이름이 계속 나옵니다.\n하나는 나브테스코입니다.\n로봇 팔의 어깨와 허리처럼 무거운 힘을 받는 관절에 쓰이는 감속기를 만드는데요.\n세계 산업용 로봇의 이 관절 부품 시장에서, 절반이 넘는 몫을 가진 것으로 알려져 있습니다. [검증 필요: RV 감속기 점유율 약 60%]\n다른 하나는 하모닉드라이브시스템즈입니다.\n손목처럼 작고 정밀한 관절에 쓰이는 특수한 감속기로 유명하죠.\n이 부품은 우주 탐사선과 인공위성의 관절에도 쓰였습니다. [검증 필요: 탐사선 적용 사례 원문]\n여기에 정밀 모터, 제어 장치, 센서까지 더하면 이야기가 커집니다.\n중국 회사가 완성 로봇을 만들어도, 그 관절 안에는 일본 부품이 들어가는 경우가 적지 않다는 분석이 나옵니다. [검증 필요: 중국 로봇 핵심부품 수입 의존도]\n겉으로는 중국 로봇, 안을 열면 일본 관절.\n반도체에서 봤던 장면이, 로봇에서도 그대로 반복되는 거죠.\n게다가 금속을 정밀하게 깎는 공작기계에도 두뇌가 필요합니다.\n수치 제어 장치라고 부르는 이 두뇌에서도, 일본 기업이 세계 선두권입니다. [검증 필요: CNC 제어장치 화낙 점유율]\n로봇의 몸과 관절과 두뇌, 그리고 그 로봇을 만드는 기계까지.\n일본은 자동화라는 거대한 건물의 기초 공사를 맡고 있었던 겁니다.\n\n하모닉드라이브라는 기술 자체는 1950년대 미국에서 처음 발명됐습니다. [검증 필요: 발명자·연도]\n하지만 그 기술을 들여와 대량 생산이 가능한 정밀 부품으로 완성한 곳은 일본이었습니다. [검증 필요: 1970년 하모닉드라이브시스템즈 설립 경위]\n반도체 때와 똑같은 패턴이죠.\n남이 시작한 기술을 받아들여, 누구도 따라오기 힘든 수준까지 갈고닦는 겁니다.\n이 부품들이 어려운 이유는 아주 작은 오차 때문입니다.\n머리카락 굵기의 몇십 분의 일만 어긋나도, 로봇 팔 끝에서는 그 오차가 몇 배로 커집니다.\n그래서 이 부품은 설계도만 있다고 만들 수 있는 게 아닙니다.\n금속을 깎고, 열처리하고, 맞물리게 하는 과정마다 오랜 경험이 필요하죠.\n중국과 한국에서도 이 부품을 직접 만들려는 노력이 계속되고 있습니다.\n하지만 가장 무거운 짐을 오래 버텨야 하는 고급 로봇일수록, 여전히 일본 부품을 찾는다는 평가가 많습니다. [검증 필요]\n\n▶[미확보] 해외 엔지니어·리뷰어가 일본 감속기·부품 품질을 평가하는 원음 — 자료 수집 후 교체\n\n🎬 관절 확대 그래픽: 어깨·허리(나브테스코) / 손목(하모닉드라이브) 표시 · 그래프 [ 정밀 감속기 점유율 ] 큰 숫자 + 출처 · 형광 초록 g \"겉은 중국, 관절은 일본\"\n\n## S8 🟩 숫자 뒤의 사람들 — 고장 나지 않는 로봇 (13:30~15:30)\n\n공장 주인들이 일본 로봇을 고르는 이유를 물으면, 비슷한 답이 돌아옵니다.\n잘 안 멈춘다는 거예요.\n자동차 공장 하나가 한 시간 멈추면, 수십억 원이 날아갈 수 있습니다. [검증 필요: 라인 정지 손실 추정치]\n그래서 공장은 조금 비싸더라도, 고장 나지 않는 로봇을 원하죠.\n로봇 한 대를 수십 년씩 쓰는 공장도 적지 않습니다.\n일본 로봇 회사들은 오래된 로봇의 부품을 계속 공급하는 것으로도 유명합니다. [검증 필요: 장기 부품 공급 정책]\n팔고 끝나는 게 아니라, 그 로봇이 은퇴할 때까지 책임진다는 거죠.\n이런 신뢰는 광고로 만들어지지 않습니다.\n수십 년 동안 공장 바닥에서, 한 대 한 대 고장 없이 돌아간 기록이 쌓여야 생기는 것이니까요.\n일본 사람들은 이런 태도를 모노즈쿠리라고 부릅니다.\n물건을 만드는 일에 혼을 담는다는 뜻이죠.\n빨리 만드는 나라는 많습니다.\n하지만 오래 믿을 수 있게 만드는 나라는 많지 않습니다.\n\n일본 로봇은 이제 수술실에도 들어가 있습니다.\n가와사키중공업과 의료기기 회사가 함께 만든 일본산 수술 로봇이 2020년 승인을 받았습니다. [검증 필요: 힌토리 승인 연도·개발사]\n미국산이 거의 독차지하던 분야에, 일본이 처음으로 자기 이름을 올린 겁니다.\n공장에서 쌓은 정밀함이, 사람의 생명을 다루는 곳까지 이어진 셈이죠.\n\n일본 로봇 회사들의 공장 안에서는, 지금도 사람이 직접 하는 일이 남아 있습니다.\n가장 정밀한 부품을 마지막으로 맞추고, 소리를 듣고, 손끝으로 진동을 느끼는 일이죠. [검증 필요: 현장 취재 원문]\n로봇을 만드는 공장의 가장 중요한 공정을, 결국 사람의 감각이 지키고 있는 겁니다.\n기계에 혼을 넣는다는 말이, 그냥 비유가 아니었던 거죠.\n\n🎬 공장 라인 B-roll(권리 확인) · 헤드라인 \"멈추지 않는 로봇\" · 음악 낮춤\n\n## S8-2 🟥 공정하게 — 일본 로봇의 약점 (15:00~15:30 확장 구간)\n\n물론 일본 로봇에 약점이 없는 건 아닙니다.\n먼저 가격입니다.\n같은 일을 하는 로봇이라도, 중국산이 훨씬 싸게 나오는 경우가 많습니다.\n작은 공장들은 이 차이를 무시하기 어렵죠.\n두 번째는 소프트웨어입니다.\n요즘 로봇의 경쟁은 몸보다 두뇌, 그러니까 인공지능으로 옮겨 가고 있습니다.\n이 분야에서는 미국과 중국 기업들이 더 빠르게 움직인다는 평가가 많습니다. [검증 필요]\n일본 안에서도 이 점을 걱정하는 목소리가 큽니다.\n하지만 거꾸로 생각해 볼 수도 있습니다.\n인공지능 두뇌가 아무리 똑똑해져도, 그 명령을 정확하게 수행할 몸과 관절이 없으면 아무 소용이 없습니다.\n두뇌를 만드는 회사들이 결국 찾아가야 하는 곳이, 몸과 관절을 가장 잘 만드는 나라라는 거죠.\n실제로 세계 인간형 로봇 개발사들 가운데 일본산 정밀 부품을 쓰는 곳이 적지 않다는 분석도 나옵니다. [검증 필요: 휴머노이드 부품 공급 관련 보도]\n\n🎬 비교 카드 [가격 · 중국] [소프트웨어 · 미국·중국] [몸·관절 · 일본] · 형광 빨강 c → 초록 g\n\n## S9 🟩 다시 앞으로 — 사람 곁으로 가는 일본 로봇 (15:30~16:30)\n\n그리고 지금, 일본 로봇은 새로운 무대로 향하고 있습니다.\n일본은 세계에서 고령화가 가장 빠른 나라 가운데 하나입니다.\n일할 사람이 줄어드는 문제를, 일본은 누구보다 먼저 겪고 있죠.\n그래서 일본의 로봇은 공장 밖으로 나오고 있습니다.\n간병 현장에서 사람을 들어 올리는 로봇, 물류 창고에서 짐을 나르는 로봇, 식당에서 음식을 나르는 로봇까지요. [검증 필요: 일본 서비스 로봇 보급 사례 출처]\n오십 년 전 일손 부족을 공장 로봇으로 풀었던 나라가, 이번에는 고령 사회의 해답을 로봇에서 찾고 있는 겁니다.\n다른 나라들이 앞으로 겪게 될 문제를, 일본은 지금 먼저 풀고 있습니다.\n\n일본은 2050년까지, 사람이 하던 일을 스스로 배우고 판단하는 로봇을 만들겠다는 국가 연구 목표도 내걸었습니다. [검증 필요: 문샷 연구개발 목표 원문]\n쉽지 않은 목표입니다.\n하지만 일본에는 이미 오십 년 넘게 쌓아 온 로봇의 몸과 관절이 있습니다.\n그 위에 새로운 두뇌만 얹으면 되는, 세계에서 몇 안 되는 나라인 거죠.\n\n일본의 편의점과 물류 회사들은 이미 무인 창고와 자동 배송 실험을 늘리고 있습니다. [검증 필요: 사례·기업명]\n요양 시설에서는 사람을 침대에서 휠체어로 옮겨 주는 로봇이 간병인의 허리를 지켜 주고 있죠. [검증 필요]\n이런 로봇들은 공장 로봇보다 훨씬 까다롭습니다.\n사람 바로 옆에서 일하니까, 힘 조절 하나만 잘못돼도 다칠 수 있거든요.\n그래서 더더욱 정밀한 관절과 센서가 필요합니다.\n일본이 오십 년 동안 갈고닦은 바로 그 기술이, 이번에는 사람을 지키는 데 쓰이는 겁니다.\n고령화라는 위기가, 일본 로봇에게는 오히려 다음 시대를 여는 열쇠가 되고 있습니다.\n\n🎬 간병·물류 로봇 B-roll(권리 확인) · 헤드라인 \"다음 무대는 사람 곁\"\n\n## S9-2 🟦 세계 최초의 로봇 협회 — 일본이 먼저 깔아 둔 길 (16:00~16:30 확장 구간)\n\n일본 로봇의 힘은 회사 몇 곳의 실력만으로 설명되지 않습니다.\n1971년, 일본에서는 산업용 로봇 회사들이 모인 모임이 처음 만들어졌습니다.\n지금의 일본로봇공업회입니다.\n국제로봇연맹은 이 단체를 세계 최초의 국가 로봇 협회로 소개하고 있죠. [검증 필요: IFR robot-history 페이지 표현 대조]\n로봇이라는 말 자체가 아직 공장에서 낯설던 시절이었습니다.\n그런데 일본 회사들은 그때부터 함께 표준을 맞추고, 통계를 모으고, 기술자를 길러 냈거든요.\n경쟁자끼리 한 테이블에 앉아 산업 전체의 길을 먼저 닦은 겁니다.\n도쿄에서는 지금도 국제로봇전이라는 대형 박람회가 정기적으로 열립니다. [검증 필요: iREX 개최 주기·첫 개최 연도]\n세계의 공장 관계자들이 다음 로봇을 고르러 일본으로 모이는 자리죠.\n노란 로봇 팔의 뿌리도 생각보다 깊습니다.\n화낙은 1956년, 일본 민간 최초의 수치 제어 장치를 개발한 것을 자기 역사의 출발점으로 꼽습니다. [검증 필요: 화낙 공식 연혁 — 당시 후지쓰 소속 조직]\n기계를 숫자로 움직이는 두뇌가, 로봇 팔보다 먼저 있었던 거예요.\n그 두뇌 위에 팔을 얹은 것이 지금 세계 공장에 서 있는 노란 로봇입니다.\n일본 안의 숫자도 여전히 큽니다.\n국제로봇연맹 집계로, 2023년 일본 공장에서 일하던 산업용 로봇은 약 43만 5천 대였습니다.\n같은 해 새로 설치된 로봇은 4만 6천여 대로, 중국에 이어 세계 2위 시장이었죠.\n로봇 밀도 순위에서는 한국에 밀렸지만, 일본은 여전히 로봇을 두 번째로 많이 들여놓는 나라입니다.\n그리고 그 로봇의 대부분을 자기 손으로 만들어 쓰는 나라이기도 합니다. [검증 필요: 일본 국내 설치분 중 자국산 비중]\n남이 만든 로봇을 사서 쓰는 나라와, 자기 로봇으로 자기 공장을 채우는 나라.\n공급망이 흔들리는 날, 어느 쪽이 더 오래 버틸까요?\n\n🎬 연표 카드 1956 NC → 1971 일본로봇공업회(전신) → 1972 화낙 독립 · 그래프 카드 [ 2023 일본 가동 로봇 435,299대 · 신규 설치 46,106대 · 세계 2위 ] 출처 IFR World Robotics 2024 보도자료 · 형광 파랑 e\n\n## S10 🟩🟩 결말 — Triple Ending (16:30~17:35)\n\n처음 질문으로 돌아가 보겠습니다.\n세계의 공장들은 왜 아직도 일본 로봇을 들여놓을까요?\n답은 화려함이 아니라 믿음이었습니다.\n일본은 로봇을 가장 많이 쓰는 나라는 아닐지도 모릅니다.\n하지만 세계가 로봇을 쓰면 쓸수록, 그 로봇의 몸과 관절 어딘가에는 일본의 기술이 들어가 있습니다.\n로봇 강국이라는 말의 뜻이, 사실은 처음부터 달랐던 거죠.\n\n한때 세계는 일본 로봇이 끝났다고 말했습니다.\n화려한 영상 속 주인공이 다른 나라 로봇으로 바뀌었으니까요.\n그런데 그 화려한 무대가 서 있는 바닥을 들여다보면, 그곳을 받치고 있는 건 여전히 일본의 기술이었습니다.\n\n▶ [중국어 가전 해설 · BILI-124 · 08:30.200–08:33.598] \"그런데 일본도 이제 상표만 바꿔서 판다.\"\n\n상표는 바뀔 수 있습니다.\n하지만 세계 공장 바닥에서 오늘도 쉬지 않고 돌아가는 노란 팔과, 그 안의 작은 관절은 쉽게 바뀌지 않습니다.\n그렇다면 사람 곁으로 걸어 나온 일본 로봇은, 다음 오십 년 동안 세계를 어떻게 바꿔 놓을까요?\n\n🎬 첫 원음 재생 → 헤드라인 \"상표는 바뀌어도, 관절은 일본\" → 세계 지도에 로봇 아이콘이 켜지는 그래픽 → 마지막 질문 자막\n\n---\n\n## READ 표\n| 표기 | 읽기 |\n|---|---|\n| 38% | 삼십팔 퍼센트 |\n| 1,012대 | 천십이 대 |\n| 1968년 | 천구백육십팔 년 |\n| 1973년 | 천구백칠십삼 년 |\n| 2000년 | 이천 년 |\n| 2022년 | 이천이십이 년 |\n| 2023년 | 이천이십삼 년 |\n| 백만 대 | 백만 대 |\n\n## 원음 목록 (C)\n| # | 소스 | IN | OUT | 길이 | 상태 |\n|---|---|---|---|---|---|\n| 1 | BV1qqk5BkEar | 01:41.240 | 01:46.240 | 5.0s | 🟡 원어 대조 |\n| 2 | BILI-124 | 08:30.200 | 08:33.598 | 3.4s | 🟡 댓글 낭독 구간인지 확인(낭 히려 더 많이 골랐습니다.", "⑤❓ 일본이 수십 년 붙들고 있던 이 기술엔 어떤 계산이 숨어 있었을까요?"], "orig": [{"src": "붙여넣기①(13:53) 50편 V2 훅 강화본", "title": "낡은 기술이라고 불렸던 하이브리드의 역습", "text": "지금이 어느 시대인데 아직도 하이브리드야? 일본은 미래 자동차를 포기한 거 아니야?\n그런데 로이터에 따르면 2025년 도요타·렉서스 판매량에서 하이브리드 비중은 42%였습니다. 미래를 향해 달리던 자동차 시장에서 소비자들은 예상과 다른 선택도 하고 있었는데요. 일본이 수십 년 동안 붙들고 있었던 기술에는 어떤 계산이 숨어 있었을까요?"}, {"src": "붙여넣기③(13:55) 50편 실제 기획안", "title": "시대에 뒤처졌다는 하이브리드의 반전", "text": "자동차의 미래는 전기차라고 했습니다. 하이브리드는 과도기의 기술로 여겨지기도 했죠. 그런데 2024년 도요타·렉서스 판매에서 하이브리드 비중은 40%를 넘었습니다. 소비자들은 왜 이 기술을 선택했을까요? 미래를 바라보는 두 가지 전략을 비교해 보겠습니다."}, {"src": "붙여넣기④(13:56) 50편 V2 해외 평가 반전형", "title": "하이브리드", "text": "미국과 유럽 언론은 전기차 대신 하이브리드를 선택하는 소비자들이 있다고 보도했습니다. 도요타도 그 수요의 수혜를 입었습니다. 2024년 도요타·렉서스 판매의 40.8%가 하이브리드였습니다. 시대에 뒤처진 선택처럼 보였던 기술이 왜 다시 주목받았을까요? 두 기술의 경쟁을 결정하는 숨은 변수를 찾아봅니다."}], "outline": "전기차 기대 → 하이브리드 비판 → 소비자 수요 → 비용·인프라 → 판매 반전 → 기술 축적 → 미래 경쟁 → 판단 회수. D02+D04", "question": "⑤❓ 일본이 수십 년 붙들고 있던 이 기술엔 어떤 계산이 숨어 있었을까요?", "answer": ["하이브리드가 다시 팔린 이유는 소비자가 '미래'보다 '지금 내 생활'을 기준으로 골랐기 때문입니다.", "전기차는 충전소, 배터리 가격, 겨울철 주행거리 같은 숙제가 남아 있습니다. 하이브리드는 충전 걱정 없이 연비를 크게 줄여 주죠.", "그래서 도요타·렉서스 판매에서 하이브리드 비중이 40%를 넘었다는 보도가 나왔습니다. [검증 필요: 2024년 40.8% / 2025년 42% — 연도별 원문 확인]", "수십 년 전 '과도기 기술'이라 불리던 그 차가, 전기차 시대의 빈틈을 메우고 있었던 겁니다. 일본은 그 빈틈을 미리 내다본 걸까요?"]}, {"n": 5, "title": "혁신 순위 — \"한국 4위, 일본 12위\"", "v3": ["①🟢 \"한국이 일본보다 훨씬 낫네요.\" (BV1qqk5BkEar 02:25.720~02:28.760)", "②🟧 \"혁신 순위도 한국한테 밀리는데, 일본 기술력은 무슨.\"", "③📰 실제로 세계지식재산기구(WIPO) 혁신지수에서 일본은 12위였습니다. 그런데 같은 성적표를 한 장 넘기면, 생산·수출의 복잡성 항목 세계 1위가 일본입니다.", "④ 종합 12위인 나라가, 가장 만들기 어려운 분야에선 세계 1위라는 겁니다.", "⑤❓ 이게 무슨 일일까요? 순위표가 보여주지 못한 일본의 진짜 실력은 뭘까요?"], "orig": [{"src": "붙여넣기①(13:53) 50편 V2 훅 강화본", "title": "일본 혁신 순위 12위, 그런데 세계 1위라고?", "text": "한국보다 혁신 순위도 낮잖아. 일본 기술력이라는 것도 이제 옛날 얘기 아냐?\n그런데 세계지식재산기구의 2026년 혁신 성적표에는 뜻밖의 항목이 있었습니다. 일본이 생산과 수출의 복잡성에서 세계 1위를 기록한 겁니다. 종합 순위만 봐서는 발견할 수 없었던 일본의 경쟁력은 무엇이었을까요?"}, {"src": "붙여넣기③(13:55) 50편 실제 기획안", "title": "혁신 순위 12위 일본에 숨어 있는 세계 1위", "text": "세계혁신지수에서 한국은 2025년 4위였습니다. 일본은 12위였죠. 그런데 그 성적표를 한 장 더 넘겨 보면 뜻밖의 결과가 등장합니다. 생산과 수출의 복잡성에서는 일본이 1위였습니다. 종합 순위가 보여주지 못한 것은 무엇일까요?"}, {"src": "붙여넣기④(13:56) 50편 V2 해외 평가 반전형", "title": "혁신 순위", "text": "세계지식재산기구는 2025년 한국을 혁신 경쟁력 4위, 일본을 12위로 평가했습니다. 일본이 뒤처졌다고 생각하기 쉬운 성적표입니다. 그런데 바로 그 보고서에서 일본은 생산·수출 복잡성 1위였습니다. 같은 성적표에서 왜 이렇게 다른 결과가 나온 걸까요? 종합 순위 뒤에 가려진 일본의 기술력을 살펴봅니다."}], "outline": "한국 성과 인정 → 종합 순위 → 세부 항목 → 일본 1위 → 산업 사례 → 복잡한 공급망 → 기술의 깊이 → 자긍심. D06+D08", "question": "⑤❓ 이게 무슨 일일까요? 순위표가 보여주지 못한 일본의 진짜 실력은 뭘까요?", "answer": null, "script": "# EP05 · 혁신 순위 12위 일본에 숨어 있는 세계 1위 — 본편 대본 v1\n\n- 기반: 훅 V3(EP05) · 붙여넣기③ 전개 \"한국 성과 인정 → 종합 순위 → 세부 항목 → 일본 1위 → 산업 사례 → 복잡한 공급망 → 기술의 깊이 → 자긍심 (D06+D08)\" · 붙여넣기④ \"순위 충격 → 억울함 → 세부 지표 → 세계 1위 → 기술의 깊이\" · 감정선 E07 국제 평가 반전형 · STEP 4 규칙\n- 표기: 일반 문장 = 내레이션(N) · `▶` = 외국인 원음(C, 저장소 SRT 실재 타임코드) · `🎬` = 화면 메모(낭독 안 함) · `[검증 필요]` = 수치·출처 원문 미대조\n- 원음 원본: BV1qqk5BkEar(중국어 경제 해설 \"1인당 GDP 일본 추월, 삼성이 소니를 넘었다\") · BV17F41197Cp(중국어 경제 강의 \"중국은 일본식 대차대조표 불황에 빠질까\") — 원어 대조·권리 미검증 🟡\n- 출처(이번 세션 검색 결과로 문구 확인): WIPO GII 2025 결과(한국 4위·일본 12위·\"Japan leads in Production and export complexity\"·특허 패밀리 2위·기업 R&D 3위) · WIPO GII 2026 결과(일본 12위·생산·수출 복잡성 1위·특허 패밀리 3위·기업 R&D 3위·도쿄–요코하마 클러스터 2위) · WIPO 한국 2025 프로필(생산·수출 복잡성 2위)\n- 목표 길이: 1.2배속 후 17:20~17:50 → 검사기 결과는 맨 아래\n\n---\n\n## S1 🟥 훅 (0:00~0:30)\n\n▶ [중국어 경제 해설 · BV1qqk5BkEar · 02:24.480–02:28.760] \"조선 산업… 한국이 일본보다 훨씬 낫네요.\"\n\n혁신 순위도 한국한테 밀리는데, 일본 기술력은 무슨.\n요즘 바다 건너에서 자주 들리는 말입니다.\n실제로 세계지식재산기구가 발표한 세계혁신지수에서, 한국은 4위, 일본은 12위였습니다.\n그런데 같은 성적표를 한 장 넘기면, 전혀 다른 숫자가 나옵니다.\n생산과 수출의 복잡성이라는 항목에서, 세계 1위가 바로 일본이었던 겁니다.\n종합 12위인 나라가, 가장 만들기 어려운 분야에선 세계 1위라는 거죠.\n이게 무슨 일일까요?\n순위표가 보여주지 못한 일본의 진짜 실력은 뭘까요?\n\n🎬 0~4초 원음 → 헤드라인 \"한국 4위 · 일본 12위\" (빨강 c) → 회색 그래프 카드 [ 세계혁신지수 2025 ] 한국 4 / 일본 12 → 카드 뒤집기 효과 [ 생산·수출 복잡성 ] 일본 1위 → 질문 자막(노랑 q)\n\n## S2 🟨 성적표의 정체 — 세계혁신지수란 무엇인가 (0:30~2:00)\n\n먼저 이 성적표가 어떤 시험인지부터 짚어 보겠습니다.\n세계혁신지수는 유엔 산하 기구인 세계지식재산기구가 해마다 내는 보고서입니다.\n2025년판은 139개 나라를 약 80개 지표로 채점했습니다.\n연구개발에 얼마나 쓰는지, 대학은 어떤지, 창업은 잘 되는지까지 모두 들어가죠.\n한마디로 한 나라의 혁신 체력을 종합 건강검진처럼 재는 시험인데요.\n이 시험에서 한국은 2025년 4위에 올랐습니다.\n역대 최고 순위였습니다.\n스위스, 스웨덴, 미국 바로 다음이었죠.\n아시아에서는 당당히 1등이었습니다.\n이건 한국이 정말 잘한 부분입니다.\n기업들이 연구개발에 쏟는 돈과 사람에서, 한국은 세계 최상위권이거든요.\n2026년판에서도 한국은 기업 연구개발과 기업 연구원 수에서 세계 1위를 지켰습니다.\n그렇다면 일본은 어땠을까요?\n같은 해 일본의 종합 순위는 12위였습니다.\n중국은 10위로 처음 상위 10개국 안에 들어왔고요.\n숫자만 놓고 보면, 한국과 중국이 모두 일본을 앞지른 셈입니다.\n2026년 순위가 나오자, 한국의 한 경제지는 이런 제목을 달았습니다.\n'일본, 한국과 중국에 밀려 12위'라고요. [검증 필요: 서울경제 영문판 2026.10.07 제목 원문 대조]\n\n그런데 보고서 본문에는, 제목에 잘 나오지 않는 문장이 하나 있습니다.\n일본의 12위는 2011년 이후 가장 높은 순위라는 겁니다.\n2020년 16위였던 일본은 13위를 거쳐, 조금씩 올라오고 있었습니다.\n떨어지는 중인 나라가 아니라, 오히려 올라오는 중인 나라였던 거죠.\n순위표의 숫자 하나가, 이야기의 절반만 들려주고 있었던 겁니다.\n\n🎬 WIPO 보고서 표지 이미지(권리 확인) · 연표 카드 2020 16위 → 2021~2024 13위 → 2025·2026 12위 · 형광 파랑 e \"2011년 이후 최고\"\n\n## S3 🟥 억울함 — '혁신을 멈춘 나라'라는 꼬리표 (2:00~4:30)\n\n▶ [중국어 경제 해설 · BV1qqk5BkEar · 03:02.000–03:06.360] \"국제 시장에서, 한국 제품이 일본 제품을 대체했습니다.\"\n\n중국의 한 경제 해설자는 이렇게 정리했습니다.\n한국 제품이 세계 시장에서 일본 제품의 자리를 차지했다는 거죠.\n이 말에 고개를 끄덕이는 사람도 많습니다.\n스마트폰 매장에 가 보면, 일본 브랜드는 거의 보이지 않으니까요.\n텔레비전 매장도 마찬가지입니다.\n한때 거실을 지배했던 일본 이름들은, 이제 한국과 중국 브랜드에 자리를 내줬습니다.\n그래서 일본에는 '갈라파고스'라는 별명이 붙었습니다.\n세상과 떨어진 섬에서 혼자만의 방식으로 진화했다는 뜻이죠.\n디지털 전환이 늦다는 비판도 끊이지 않았습니다.\n코로나 시기에는 팩스와 도장 문화가 해외 언론의 놀림감이 되기도 했습니다. [검증 필요: 2020년 해외 보도 사례]\n세계혁신지수도 일본의 약점을 숨기지 않습니다.\n고등교육, 창업 환경, 지식집약형 일자리 같은 항목에서는 점수가 낮았습니다. [검증 필요: 2026 일본 프로필 개별 순위]\n젊은 인재가 줄어들면 혁신의 바탕 자체가 약해질 수 있다는 경고도 나왔죠.\n일본 입장에서는 억울하면서도, 반박하기 어려운 지적들입니다.\n\n하지만 여기서 한 가지 이상한 점이 있습니다.\n정말 혁신을 멈춘 나라라면, 왜 세계의 공장들은 여전히 일본 기업에 주문서를 보낼까요?\n왜 첨단 산업의 공급망 지도를 그리면, 일본 이름이 그렇게 자주 나올까요?\n이 질문의 답은 종합 순위가 아니라, 그 아래 숨어 있는 세부 항목에 있습니다.\n세계혁신지수의 종합 점수는 수십 개 지표를 평균 낸 값이거든요.\n평균은 강한 과목과 약한 과목을 한데 섞어 버립니다.\n수학은 만점인데 체육이 낙제라면, 평균은 그저 그런 학생처럼 보이겠죠.\n그렇다면 일본의 만점 과목은 무엇이었을까요?\n\n🎬 스마트폰·TV 매장 B-roll(권리 확인) · 헤드라인 \"갈라파고스 일본?\" (빨강 c) · 평균 함정 그래픽: 막대 7개 → 평균선 하나로 뭉개지는 애니메이션\n\n## S4 🟩 첫 번째 반전 — 생산·수출 복잡성 세계 1위 (4:30~6:30)\n\n2025년 보고서의 동아시아 부분에는 이런 문장이 있습니다.\n'일본은 생산과 수출의 복잡성에서 선두를 달린다.'\n2026년 보고서도 같은 이야기를 반복했습니다.\n일본은 생산·수출 복잡성 세계 1위라고요.\n이 항목은 이름이 어려워서 흔히 그냥 지나치는데요.\n사실은 한 나라의 산업이 얼마나 깊은지를 재는 지표입니다.\n쉽게 비유해 보겠습니다.\n바나나는 햇볕과 땅만 있으면 많은 나라가 수출할 수 있습니다.\n하지만 반도체 장비나 정밀 화학 소재는 다릅니다.\n세계에서 몇 나라만 만들 수 있고, 그 몇 나라 안에서도 소수 기업만 해낼 수 있죠.\n복잡성 지표는 바로 이런 물건을 얼마나 다양하게 수출하는지를 봅니다.\n남들이 쉽게 못 만드는 물건을, 많은 종류로 만들어 내는 나라일수록 점수가 높아지는 겁니다.\n이 개념은 미국 하버드대 연구진이 발전시킨 경제 복잡성 지수에서 나왔습니다. [검증 필요: GII 지표 6.3.2의 원자료 출처 대조]\n그리고 그 하버드 순위에서도, 일본은 이십 년 넘게 맨 위를 지켜 왔습니다. [검증 필요: 하버드 성장연구소 경제 복잡성 순위 연도별 1위]\n흥미로운 건 2위였습니다.\n2025년 한국의 국가별 성적표를 보면, 이 항목에서 한국이 2위였거든요.\n세계에서 가장 복잡한 물건을 만드는 1등과 2등이, 바로 바다 하나를 사이에 둔 이웃이었던 겁니다.\n종합 순위에선 한국이 앞섰지만, 이 과목에서만큼은 일본이 아직 한 칸 위에 있었던 거죠.\n\n🎬 그래프 카드 [ 생산·수출 복잡성 2025 ] 1 일본 · 2 한국 (초록 g) · 바나나 vs 반도체 장비 아이콘 비교 그래픽 · WIPO 원문 문장 타이핑 효과 \"Japan leads in Production and export complexity\"\n\n## S5 🟨 아직 풀리지 않은 의문 — 복잡한 게 뭐가 대단하죠? (6:30~8:30)\n\n그런데 이런 의문이 드실 수 있습니다.\n복잡한 물건을 만든다는 게, 정말 그렇게 대단한 일일까요?\n결국 많이 팔고, 이름이 알려지는 쪽이 이기는 것 아닌가요?\n실제로 완성품 시장에서는 브랜드가 곧 힘입니다.\n하지만 산업의 세계는 완성품만으로 돌아가지 않습니다.\n스마트폰 한 대에는 천 개가 넘는 부품이 들어갑니다. [검증 필요: 스마트폰 부품 수]\n그 부품 하나하나를 만드는 기계와 재료가 또 따로 있죠.\n완성품 회사는 소비자 앞에 서 있지만, 그 뒤에는 보이지 않는 수천 개 회사의 사슬이 있습니다.\n복잡성이 높다는 건, 이 사슬의 가장 깊은 곳을 쥐고 있다는 뜻입니다.\n깊은 곳을 쥔 나라는 쉽게 대체되지 않습니다.\n누군가 그 나라 기업을 빼려면, 같은 물건을 처음부터 다시 만들어야 하니까요.\n\n▶ [중국어 경제 강의 · BV17F41197Cp · 03:45.757–03:51.263] \"게다가 일본은 아시아에서 처음으로 중진국 함정을 벗어나, 선진국 반열에 오른 나라예요.\"\n\n중국의 한 경제학 강사는 일본을 이렇게 소개했습니다.\n아시아에서 가장 먼저 선진국 문턱을 넘은 나라라고요.\n일본이 처음 그 문턱을 넘을 때 쓴 무기가 바로 제조업의 깊이였습니다.\n라디오와 카메라로 시작해, 자동차와 공작기계, 반도체 소재로 점점 더 깊은 곳까지 내려갔죠.\n그리고 그 깊이는, 완성품 브랜드가 밀려난 뒤에도 그대로 남았습니다.\n그렇다면 종합 순위는 왜 그 깊이를 다 보여주지 못한 걸까요?\n\n생산·수출 복잡성은 약 80개 지표 가운데 하나일 뿐입니다.\n나머지 지표에는 창업 투자, 유니콘 기업 가치, 온라인 서비스, 대학 순위 같은 것들이 들어가죠.\n이건 새 회사를 빠르게 세우고 키우는 능력을 재는 항목들입니다.\n반대로 일본이 강한 건, 한 회사가 한 가지 기술을 수십 년 동안 다듬는 능력이었습니다.\n빠른 혁신과 깊은 혁신.\n지금의 순위표는 앞의 것에 조금 더 점수를 주는 시험이었던 셈입니다.\n\n🎬 스마트폰 분해도 그래픽 → 부품 → 장비·소재 계층도 · 형광 노랑 q \"복잡한 게 왜 대단하죠?\" · 원음 앞뒤 무음 B-roll(공장 라인)\n\n## S6 🟥 공정하게 — 일본이 진짜로 약한 곳 (8:30~10:00)\n\n여기서 공정하게 짚고 넘어가야 할 부분이 있습니다.\n일본의 약점은 꾸며낸 이야기가 아닙니다.\n세계혁신지수 2025년판 일본 성적표에서, 젊은 인구 비율은 최하위권이었습니다. [검증 필요: 2025 일본 프로필 '137위' 원문]\n해외 직접투자 유입도 백 위권 밖이었고요. [검증 필요]\n교육 지출, 노동생산성 증가율, 이공계 졸업생 비율에서도 순위가 낮았습니다. [검증 필요: 2025 프로필 개별 순위]\n창업 문화와 벤처 투자 역시 한국과 미국에 비해 약했죠.\n일본 정부도 이 문제를 알고 있습니다.\n2022년 일본은 '스타트업 육성 5개년 계획'을 내놓고, 창업 투자를 크게 늘리겠다고 발표했습니다. [검증 필요: 계획 명칭·목표치]\n한국이 4위에 오른 이유도 분명합니다.\n한국 기업들은 매출의 상당 부분을 연구개발에 다시 쏟아붓습니다.\n2026년 보고서는 한국을 국내총생산 대비 연구개발 지출 5.1퍼센트의 나라로 소개했습니다.\n일본은 3.6퍼센트였죠.\n이건 일본이 반드시 배워야 할 숫자입니다.\n그런데 같은 보고서를 끝까지 읽으면, 일본이 쉽게 무너지지 않는 이유도 함께 보입니다.\n일본은 약점이 있는 나라지만, 동시에 쉽게 따라잡히지 않는 강점을 가진 나라였거든요.\n\n🎬 회색 카드 [ 일본의 약점 ] 젊은 인구·FDI·창업 (연분홍 주의 박스 #FCF1ED) → [ 연구개발 지출 GDP 대비 ] 한국 5.1% · 일본 3.6% · 형광 빨강 c \"배워야 할 숫자\"\n\n## S7 🟦🟩 두 번째 반전 — 특허와 기업 연구, 그리고 도쿄 (10:00~13:30)\n\n다시 성적표의 다른 쪽을 넘겨 보겠습니다.\n2025년 일본은 특허 패밀리 항목에서 세계 2위였습니다.\n2026년에도 3위를 지켰죠.\n특허 패밀리란, 같은 발명을 여러 나라에 동시에 출원한 묶음을 말합니다.\n한 나라에만 내는 특허보다 돈도 시간도 훨씬 많이 듭니다.\n그래서 이 숫자는 '세계 시장에서 지킬 가치가 있는 발명'이 얼마나 많은지를 보여주죠.\n기업이 직접 수행하는 연구개발도 2025년과 2026년 모두 세계 3위였습니다.\n비즈니스 정교화라는 분야에서는 2025년 6위에 올랐고요.\n보고서는 이것을 두고, 일본 산업 혁신 역량의 깊이를 보여준다고 썼습니다.\n2026년판에는 더 분명한 문장이 있습니다.\n일본의 12위는, 세계에서 가장 강한 수준의 산업·기업 혁신을 반영한다고요.\n\n그리고 지도 위에서 보면 더 놀랍습니다.\n세계혁신지수는 나라뿐 아니라 도시권별 혁신 클러스터 순위도 매기는데요.\n2026년 도쿄–요코하마 지역은 세계 2위 혁신 클러스터였습니다.\n보고서는 그 이유를 일본의 특허와 연구, 벤처 투자 활동이 가진 세계적 무게라고 설명했죠.\n도쿄–요코하마는 이 순위가 생긴 뒤 오랫동안 세계 1위를 지켜 온 곳이기도 합니다. [검증 필요: 2017~2024 클러스터 1위 연도]\n2025년, 중국 선전–홍콩–광저우 지역에 처음 1위를 내줬을 뿐이죠.\n\n▶ [중국어 경제 강의 · BV17F41197Cp · 03:59.048–04:02.276] \"일본은 여러 면에서 우리가 참고할 만하다고 정말 느꼈어요.\"\n\n일본을 세 번 다녀왔다는 중국의 한 강사는, 일본을 배울 만한 나라라고 말했습니다.\n경쟁국의 학자가 먼저 꺼낸 평가라 더 무게가 있습니다.\n그가 본 건 아마 화려한 신제품이 아니었을 겁니다.\n도시 곳곳에서 조용히 돌아가는 공장과 연구소, 그리고 그 안의 사람들이었겠죠.\n\n이 깊이는 어디서 왔을까요?\n일본 특허청 자료를 보면, 일본 기업의 특허 출원은 해외 비중이 꾸준히 늘어 왔습니다. [검증 필요: 일본 특허청 연차보고서 해외 출원 비율]\n국내 시장이 줄어드는 동안, 일본 기업들은 세계 시장을 겨냥한 기술을 쌓았던 겁니다.\n지식재산 사용료로 해외에서 벌어들이는 돈도 많습니다.\n2025년 일본 성적표에서 지식재산 수입 항목은 세계 2위권이었다는 분석이 있습니다. [검증 필요: 2025 일본 프로필 6.3.1 원문]\n다른 나라 공장이 일본의 기술을 빌려 쓰고, 그 대가를 일본에 보내고 있다는 뜻이죠.\n매장에서는 일본 이름이 줄었는데, 기술 사용료 통장은 오히려 두꺼워진 겁니다.\n\n🎬 그래프 카드 [ 특허 패밀리 ] 2025 2위 · 2026 3위 / [ 기업 수행 R&D ] 3위 · 세계 지도 클러스터 핀: 1 선전–홍콩–광저우 · 2 도쿄–요코하마 (초록 g) · 형광 초록 g \"매장 대신 기술 사용료\"\n\n## S7-2 🟦 숫자로 본 깊이 — 일본 산업의 '바닥층' (12:30~13:30 확장 구간)\n\n복잡성 1위가 실제로 어떤 모습인지 몇 장면만 보겠습니다.\n반도체를 만드는 웨이퍼의 절반 이상은 일본 두 회사에서 나옵니다. [검증 필요: 신에쓰화학·섬코 합산 점유율]\n스마트폰 속 작은 축전기, 적층세라믹콘덴서는 일본 기업들이 세계 시장의 절반 안팎을 쥐고 있죠. [검증 필요: 무라타 등 일본 기업 MLCC 점유율]\n카메라 속 이미지 센서는 일본의 한 회사가 세계 매출의 절반 가까이를 차지합니다. [검증 필요: 소니 이미지센서 매출 점유율]\n산업용 로봇의 핵심 관절 부품, 정밀 감속기도 일본 기업의 몫이 큽니다. [검증 필요]\n탄소섬유는 비행기 날개와 자동차 차체에 들어가는데, 이 분야 세계 1위도 일본 기업입니다. [검증 필요: 도레이 점유율]\n이 회사들의 공통점은 하나입니다.\n소비자는 이름을 잘 모르지만, 세계의 공장은 이 회사들 없이 돌아가기 어렵다는 거죠.\n생산·수출 복잡성 1위라는 숫자는, 바로 이런 회사 수백 곳이 모여서 만든 결과였습니다.\n\n🎬 아이콘 5개 순차 등장(웨이퍼·MLCC·이미지센서·감속기·탄소섬유) + 각 점유율 큰 숫자 카드 · 효과음 책장 넘김\n\n## S8 🟩 숫자 뒤의 사람들 — 한 우물을 판 시간 (13:30~15:30)\n\n숫자 뒤에는 늘 사람이 있습니다.\n도쿄 남쪽 오타구에는 작은 공장들이 골목마다 붙어 있습니다.\n'마치코바', 동네 공장이라고 부르는 곳들이죠.\n직원이 열 명도 안 되는 공장이, 세계에서 몇 군데만 할 수 있는 가공을 맡기도 합니다.\n어떤 공장은 금속을 머리카락보다 얇게 깎고, 어떤 공장은 오차가 거의 없는 나사를 만듭니다.\n일본의 소행성 탐사선 하야부사의 부품 일부도, 이런 동네 공장의 손을 거쳤다고 알려져 있습니다. [검증 필요: 오타구 마치코바 참여 사례]\n이 공장들은 대개 아버지에서 아들로, 스승에서 제자로 기술이 넘어갑니다.\n기계가 아무리 좋아져도, 마지막 미세한 차이는 손끝의 감각이 잡아내거든요.\n일본에는 창업한 지 백 년이 넘은 기업이 4만 곳이 넘습니다. [검증 필요: 데이코쿠데이터뱅크 2025 조사 46,708곳]\n세계에서 가장 많은 숫자입니다. [검증 필요]\n이 기업들은 유행을 따라 업종을 자주 바꾸지 않았습니다.\n대신 원래 하던 일을 조금씩, 그러나 멈추지 않고 더 정밀하게 다듬었죠.\n빠른 혁신은 화려합니다.\n하지만 깊은 혁신은 조용합니다.\n그리고 조용한 혁신은, 순위표의 평균값 속에 쉽게 묻힙니다.\n일본 사람들은 이런 태도를 '잇쇼켄메이', 한곳에 목숨을 건다는 말로 부르기도 합니다.\n한 가지 일에 평생을 거는 사람들이 모인 나라.\n생산·수출 복잡성 1위는, 그 사람들이 받은 성적표였습니다.\n\n🎬 오타구 동네 공장 B-roll(권리 확인) · 손끝 가공 클로즈업 정지 컷 · 음악 낮춤 · 헤드라인 \"빠른 혁신 vs 깊은 혁신\" (초록 g)\n\n## S8-2 🟨 다시 묻기 — 일본은 정말 따라잡힌 걸까 (15:30~16:20 확장 구간)\n\n그렇다면 일본은 이대로 괜찮은 걸까요?\n꼭 그렇지만은 않습니다.\n깊은 기술을 가진 장인들은 나이가 들어가고 있습니다.\n젊은 인구 비율이 세계 최하위권이라는 건, 이 기술을 이어받을 사람이 줄고 있다는 뜻이죠.\n그래서 일본은 지금 두 번째 시험을 치르고 있습니다.\n쌓아 온 깊이를 지키면서, 새로운 속도까지 갖출 수 있느냐는 시험입니다.\n반가운 신호도 있습니다.\n2026년 보고서는 일본의 과학기술 기반 스타트업 중 특허를 가진 비율이 세계 최상위권이라고 짚었습니다. [검증 필요: '66%·한국·핀란드 다음' 원문 대조]\n깊은 기술 위에서 새 회사가 태어나기 시작했다는 뜻입니다.\n깊이에 속도가 더해진다면, 순위표의 숫자도 다시 움직일지 모릅니다.\n\n🎬 연표 카드: 2022 스타트업 5개년 계획 → 2026 딥사이언스 스타트업 특허 보유율 · 형광 노랑 q \"깊이 + 속도?\"\n\n## S9~S11 🟩🟩 결말 — Triple Ending (16:20~17:40)\n\n처음 질문으로 돌아가 보겠습니다.\n혁신 순위 12위인 일본은, 정말 기술력이 없는 나라일까요?\n종합 점수만 보면, 한국과 중국이 일본을 앞섰습니다.\n그건 사실이고, 한국은 그 성과를 자랑할 자격이 있습니다.\n하지만 같은 성적표 안에서, 일본은 가장 만들기 어려운 물건을 가장 다양하게 만드는 나라였습니다.\n특허 패밀리와 기업 연구에서 세계 3위 안에 들었고, 도쿄는 세계 2위 혁신 도시권이었죠.\n혁신이란 무엇일까요?\n새로운 이름을 빨리 내놓는 것일까요, 아니면 아무도 대신할 수 없는 기술을 끝까지 지키는 것일까요?\n\n잃어버린 삼십 년이라는 말이 일본을 따라다녔습니다.\n그 사이 일본은 순위표에서 여러 번 밀려났습니다.\n그런데 그 삼십 년 동안에도, 누군가는 공장의 불을 끄지 않았습니다.\n작은 부품의 오차를 하나 더 줄이고, 소재의 순도를 한 자리 더 올렸죠.\n아무도 박수 치지 않던 그 시간이, 세계 1위라는 숫자로 돌아왔습니다.\n\n▶ [중국어 경제 해설 · BV1qqk5BkEar · 02:24.480–02:28.760] \"조선 산업… 한국이 일본보다 훨씬 낫네요.\"\n\n다시 들어도 틀린 말은 아닙니다.\n어떤 과목에선 한국이 분명히 앞서 있으니까요.\n다만 세계에서 가장 복잡한 물건을 만드는 과목에서는, 일본이 아직 맨 앞줄에 앉아 있습니다.\n그렇다면 일본이 깊이에 속도까지 더하는 날, 세계의 성적표는 어떻게 달라질까요?\n\n🎬 첫 원음 재생 → 헤드라인 재정의 \"종합 12위 · 복잡성 1위\" → 성적표 카드가 뒤집히며 일본 1위 칸이 초록으로 켜짐 → 마지막 질문 자막(노랑 q)\n\n---\n\n## READ 표 (숫자 한글 읽기)\n| 표기 | 읽기 |\n|---|---|\n| 139개 나라 | 백삼십구 개 나라 |\n| 4위 / 12위 | 사 위 / 십이 위 |\n| 2011년 | 이천십일 년 |\n| 2025년 / 2026년 | 이천이십오 년 / 이천이십육 년 |\n| 5.1퍼센트 / 3.6퍼센트 | 오 점 일 퍼센트 / 삼 점 육 퍼센트 |\n| 16위 → 13위 | 십육 위 → 십삼 위 |\n| 2022년 | 이천이십이 년 |\n| 4만 곳 | 사만 곳 |\n\n## 원음·클립 계획 (C)\n| # | 배치 구간 | 소스ID | 원본 URL | SRT 경로(저장소 기준 상대) | IN | OUT | 길이 | 한국어 자막 | 용도(비하/칭찬/반전/회수/한국비교) | 상태 |\n|---|---|---|---|---|---|---|---|---|---|---|\n| 1 | S1 훅 첫 컷 | BV1qqk5BkEar | https://www.bilibili.com/video/BV1qqk5BkEar | reactions-downloads/audit-20261120/subtitles/BV1qqk5BkEar/BV1qqk5BkEar.translated.ko.srt | 00:02:24.480 | 00:02:28.760 | 4.3s | 조선 산업 / 한국이 일본보다 훨씬 낫네요 | 비하·한국비교 | 🟡 원어 대조·권리 미검증 (자막 2컷 연결) |\n| 2 | S3 억울 | BV1qqk5BkEar | https://www.bilibili.com/video/BV1qqk5BkEar | reactions-downloads/audit-20261120/subtitles/BV1qqk5BkEar/BV1qqk5BkEar.translated.ko.srt | 00:03:02.000 | 00:03:06.360 | 4.4s | 국제 시장에서 / 한국 제품이 일본 제품을 대체했습니다 | 비하·한국비교 | 🟡 |\n| 3 | S5 의문→근거 | BV17F41197Cp | https://www.bilibili.com/video/BV17F41197Cp | 국뽕
