com/world/2026/10/07/japan-slips-to-12th-in-global-innovation-index-behind-korea)\n- 추가 수집 후보: 중국어권 \"日本创新指数 排名 下滑\" / \"日本 隐形冠军\" 해설 영상, 영어권 \"Japan economic complexity number one\" 해설(CNBC·Bloomberg·NHK World), WIPO 발표 기자회견 영상(공식 채널), 한국 매체 \"혁신지수 한국 4위\" 보도 영상(한국비교용).\n\n## 4. 대본 검사기 결과(추정)\n```\nFAIL scripts/EP05_혁신순위_본편대본_v1.md\n  내레이션 6751자 · 원음 5컷 22초 · 1.0배속 17.67분 · 1.2배속 14:43 (기준 17:10)\n  부족: 내레이션 약 1143자 더 필요\n```\n\n## 5. 본편 대본 전문\n# EP05 · 혁신 순위 12위 일본에 숨어 있는 세계 1위 — 본편 대본 v1\n\n- 기반: 훅 V3(EP05) · 붙여넣기③ 전개 \"한국 성과 인정 → 종합 순위 → 세부 항목 → 일본 1위 → 산업 사례 → 복잡한 공급망 → 기술의 깊이 → 자긍심 (D06+D08)\" · 붙여넣기④ \"순위 충격 → 억울함 → 세부 지표 → 세계 1위 → 기술의 깊이\" · 감정선 E07 국제 평가 반전형 · STEP 4 규칙\n- 표기: 일반 문장 = 내레이션(N) · `▶` = 외국인 원음(C, 저장소 SRT 실재 타임코드) · `🎬` = 화면 메모(낭독 안 함) · `[검증 필요]` = 수치·출처 원문 미대조\n- 원음 원본: BV1qqk5BkEar(중국어 경제 해설 \"1인당 GDP 일본 추월, 삼성이 소니를 넘었다\") · BV17F41197Cp(중국어 경제 강의 \"중국은 일본식 대차대조표 불황에 빠질까\") — 원어 대조·권리 미검증 🟡\n- 출처(이번 세션 검색 결과로 문구 확인): WIPO GII 2025 결과(한국 4위·일본 12위·\"Japan leads in Production and export complexity\"·특허 패밀리 2위·기업 R&D 3위) · WIPO GII 2026 결과(일본 12위·생산·수출 복잡성 1위·특허 패밀리 3위·기업 R&D 3위·도쿄–요코하마 클러스터 2위) · WIPO 한국 2025 프로필(생산·수출 복잡성 2위)\n- 목표 길이: 1.2배속 후 17:20~17:50 → 검사기 결과는 맨 아래\n\n---\n\n## S1 🟥 훅 (0:00~0:30)\n\n▶ [중국어 경제 해설 · BV1qqk5BkEar · 02:24.480–02:28.760] \"조선 산업… 한국이 일본보다 훨씬 낫네요.\"\n\n혁신 순위도 한국한테 밀리는데, 일본 기술력은 무슨.\n요즘 바다 건너에서 자주 들리는 말입니다.\n실제로 세계지식재산기구가 발표한 세계혁신지수에서, 한국은 4위, 일본은 12위였습니다.\n그런데 같은 성적표를 한 장 넘기면, 전혀 다른 숫자가 나옵니다.\n생산과 수출의 복잡성이라는 항목에서, 세계 1위가 바로 일본이었던 겁니다.\n종합 12위인 나라가, 가장 만들기 어려운 분야에선 세계 1위라는 거죠.\n이게 무슨 일일까요?\n순위표가 보여주지 못한 일본의 진짜 실력은 뭘까요?\n\n🎬 0~4초 원음 → 헤드라인 \"한국 4위 · 일본 12위\" (빨강 c) → 회색 그래프 카드 [ 세계혁신지수 2025 ] 한국 4 / 일본 12 → 카드 뒤집기 효과 [ 생산·수출 복잡성 ] 일본 1위 → 질문 자막(노랑 q)\n\n## S2 🟨 성적표의 정체 — 세계혁신지수란 무엇인가 (0:30~2:00)\n\n먼저 이 성적표가 어떤 시험인지부터 짚어 보겠습니다.\n세계혁신지수는 유엔 산하 기구인 세계지식재산기구가 해마다 내는 보고서입니다.\n2025년판은 139개 나라를 약 80개 지표로 채점했습니다.\n연구개발에 얼마나 쓰는지, 대학은 어떤지, 창업은 잘 되는지까지 모두 들어가죠.\n한마디로 한 나라의 혁신 체력을 종합 건강검진처럼 재는 시험인데요.\n이 시험에서 한국은 2025년 4위에 올랐습니다.\n역대 최고 순위였습니다.\n스위스, 스웨덴, 미국 바로 다음이었죠.\n아시아에서는 당당히 1등이었습니다.\n이건 한국이 정말 잘한 부분입니다.\n기업들이 연구개발에 쏟는 돈과 사람에서, 한국은 세계 최상위권이거든요.\n2026년판에서도 한국은 기업 연구개발과 기업 연구원 수에서 세계 1위를 지켰습니다.\n그렇다면 일본은 어땠을까요?\n같은 해 일본의 종합 순위는 12위였습니다.\n중국은 10위로 처음 상위 10개국 안에 들어왔고요.\n숫자만 놓고 보면, 한국과 중국이 모두 일본을 앞지른 셈입니다.\n2026년 순위가 나오자, 한국의 한 경제지는 이런 제목을 달았습니다.\n'일본, 한국과 중국에 밀려 12위'라고요. [검증 필요: 서울경제 영문판 2026.10.07 제목 원문 대조]\n\n그런데 보고서 본문에는, 제목에 잘 나오지 않는 문장이 하나 있습니다.\n일본의 12위는 2011년 이후 가장 높은 순위라는 겁니다.\n2020년 16위였던 일본은 13위를 거쳐, 조금씩 올라오고 있었습니다.\n떨어지는 중인 나라가 아니라, 오히려 올라오는 중인 나라였던 거죠.\n순위표의 숫자 하나가, 이야기의 절반만 들려주고 있었던 겁니다.\n\n🎬 WIPO 보고서 표지 이미지(권리 확인) · 연표 카드 2020 16위 → 2021~2024 13위 → 2025·2026 12위 · 형광 파랑 e \"2011년 이후 최고\"\n\n## S3 🟥 억울함 — '혁신을 멈춘 나라'라는 꼬리표 (2:00~4:30)\n\n▶ [중국어 경제 해설 · BV1qqk5BkEar · 03:02.000–03:06.360] \"국제 시장에서, 한국 제품이 일본 제품을 대체했습니다.\"\n\n중국의 한 경제 해설자는 이렇게 정리했습니다.\n한국 제품이 세계 시장에서 일본 제품의 자리를 차지했다는 거죠.\n이 말에 고개를 끄덕이는 사람도 많습니다.\n스마트폰 매장에 가 보면, 일본 브랜드는 거의 보이지 않으니까요.\n텔레비전 매장도 마찬가지입니다.\n한때 거실을 지배했던 일본 이름들은, 이제 한국과 중국 브랜드에 자리를 내줬습니다.\n그래서 일본에는 '갈라파고스'라는 별명이 붙었습니다.\n세상과 떨어진 섬에서 혼자만의 방식으로 진화했다는 뜻이죠.\n디지털 전환이 늦다는 비판도 끊이지 않았습니다.\n코로나 시기에는 팩스와 도장 문화가 해외 언론의 놀림감이 되기도 했습니다. [검증 필요: 2020년 해외 보도 사례]\n세계혁신지수도 일본의 약점을 숨기지 않습니다.\n고등교육, 창업 환경, 지식집약형 일자리 같은 항목에서는 점수가 낮았습니다. [검증 필요: 2026 일본 프로필 개별 순위]\n젊은 인재가 줄어들면 혁신의 바탕 자체가 약해질 수 있다는 경고도 나왔죠.\n일본 입장에서는 억울하면서도, 반박하기 어려운 지적들입니다.\n\n하지만 여기서 한 가지 이상한 점이 있습니다.\n정말 혁신을 멈춘 나라라면, 왜 세계의 공장들은 여전히 일본 기업에 주문서를 보낼까요?\n왜 첨단 산업의 공급망 지도를 그리면, 일본 이름이 그렇게 자주 나올까요?\n이 질문의 답은 종합 순위가 아니라, 그 아래 숨어 있는 세부 항목에 있습니다.\n세계혁신지수의 종합 점수는 수십 개 지표를 평균 낸 값이거든요.\n평균은 강한 과목과 약한 과목을 한데 섞어 버립니다.\n수학은 만점인데 체육이 낙제라면, 평균은 그저 그런 학생처럼 보이겠죠.\n그렇다면 일본의 만점 과목은 무엇이었을까요?\n\n🎬 스마트폰·TV 매장 B-roll(권리 확인) · 헤드라인 \"갈라파고스 일본?\" (빨강 c) · 평균 함정 그래픽: 막대 7개 → 평균선 하나로 뭉개지는 애니메이션\n\n## S4 🟩 첫 번째 반전 — 생산·수출 복잡성 세계 1위 (4:30~6:30)\n\n2025년 보고서의 동아시아 부분에는 이런 문장이 있습니다.\n'일본은 생산과 수출의 복잡성에서 선두를 달린다.'\n2026년 보고서도 같은 이야기를 반복했습니다.\n일본은 생산·수출 복잡성 세계 1위라고요.\n이 항목은 이름이 어려워서 흔히 그냥 지나치는데요.\n사실은 한 나라의 산업이 얼마나 깊은지를 재는 지표입니다.\n쉽게 비유해 보겠습니다.\n바나나는 햇볕과 땅만 있으면 많은 나라가 수출할 수 있습니다.\n하지만 반도체 장비나 정밀 화학 소재는 다릅니다.\n세계에서 몇 나라만 만들 수 있고, 그 몇 나라 안에서도 소수 기업만 해낼 수 있죠.\n복잡성 지표는 바로 이런 물건을 얼마나 다양하게 수출하는지를 봅니다.\n남들이 쉽게 못 만드는 물건을, 많은 종류로 만들어 내는 나라일수록 점수가 높아지는 겁니다.\n이 개념은 미국 하버드대 연구진이 발전시킨 경제 복잡성 지수에서 나왔습니다. [검증 필요: GII 지표 6.3.2의 원자료 출처 대조]\n그리고 그 하버드 순위에서도, 일본은 이십 년 넘게 맨 위를 지켜 왔습니다. [검증 필요: 하버드 성장연구소 경제 복잡성 순위 연도별 1위]\n흥미로운 건 2위였습니다.\n2025년 한국의 국가별 성적표를 보면, 이 항목에서 한국이 2위였거든요.\n세계에서 가장 복잡한 물건을 만드는 1등과 2등이, 바로 바다 하나를 사이에 둔 이웃이었던 겁니다.\n종합 순위에선 한국이 앞섰지만, 이 과목에서만큼은 일본이 아직 한 칸 위에 있었던 거죠.\n\n🎬 그래프 카드 [ 생산·수출 복잡성 2025 ] 1 일본 · 2 한국 (초록 g) · 바나나 vs 반도체 장비 아이콘 비교 그래픽 · WIPO 원문 문장 타이핑 효과 \"Japan leads in Production and export complexity\"\n\n## S5 🟨 아직 풀리지 않은 의문 — 복잡한 게 뭐가 대단하죠? (6:30~8:30)\n\n그런데 이런 의문이 드실 수 있습니다.\n복잡한 물건을 만든다는 게, 정말 그렇게 대단한 일일까요?\n결국 많이 팔고, 이름이 알려지는 쪽이 이기는 것 아닌가요?\n실제로 완성품 시장에서는 브랜드가 곧 힘입니다.\n하지만 산업의 세계는 완성품만으로 돌아가지 않습니다.\n스마트폰 한 대에는 천 개가 넘는 부품이 들어갑니다. [검증 필요: 스마트폰 부품 수]\n그 부품 하나하나를 만드는 기계와 재료가 또 따로 있죠.\n완성품 회사는 소비자 앞에 서 있지만, 그 뒤에는 보이지 않는 수천 개 회사의 사슬이 있습니다.\n복잡성이 높다는 건, 이 사슬의 가장 깊은 곳을 쥐고 있다는 뜻입니다.\n깊은 곳을 쥔 나라는 쉽게 대체되지 않습니다.\n누군가 그 나라 기업을 빼려면, 같은 물건을 처음부터 다시 만들어야 하니까요.\n\n▶ [중국어 경제 강의 · BV17F41197Cp · 03:45.757–03:51.263] \"게다가 일본은 아시아에서 처음으로 중진국 함정을 벗어나, 선진국 반열에 오른 나라예요.\"\n\n중국의 한 경제학 강사는 일본을 이렇게 소개했습니다.\n아시아에서 가장 먼저 선진국 문턱을 넘은 나라라고요.\n일본이 처음 그 문턱을 넘을 때 쓴 무기가 바로 제조업의 깊이였습니다.\n라디오와 카메라로 시작해, 자동차와 공작기계, 반도체 소재로 점점 더 깊은 곳까지 내려갔죠.\n그리고 그 깊이는, 완성품 브랜드가 밀려난 뒤에도 그대로 남았습니다.\n그렇다면 종합 순위는 왜 그 깊이를 다 보여주지 못한 걸까요?\n\n생산·수출 복잡성은 약 80개 지표 가운데 하나일 뿐입니다.\n나머지 지표에는 창업 투자, 유니콘 기업 가치, 온라인 서비스, 대학 순위 같은 것들이 들어가죠.\n이건 새 회사를 빠르게 세우고 키우는 능력을 재는 항목들입니다.\n반대로 일본이 강한 건, 한 회사가 한 가지 기술을 수십 년 동안 다듬는 능력이었습니다.\n빠른 혁신과 깊은 혁신.\n지금의 순위표는 앞의 것에 조금 더 점수를 주는 시험이었던 셈입니다.\n\n🎬 스마트폰 분해도 그래픽 → 부품 → 장비·소재 계층도 · 형광 노랑 q \"복잡한 게 왜 대단하죠?\" · 원음 앞뒤 무음 B-roll(공장 라인)\n\n## S6 🟥 공정하게 — 일본이 진짜로 약한 곳 (8:30~10:00)\n\n여기서 공정하게 짚고 넘어가야 할 부분이 있습니다.\n일본의 약점은 꾸며낸 이야기가 아닙니다.\n세계혁신지수 2025년판 일본 성적표에서, 젊은 인구 비율은 최하위권이었습니다. [검증 필요: 2025 일본 프로필 '137위' 원문]\n해외 직접투자 유입도 백 위권 밖이었고요. [검증 필요]\n교육 지출, 노동생산성 증가율, 이공계 졸업생 비율에서도 순위가 낮았습니다. [검증 필요: 2025 프로필 개별 순위]\n창업 문화와 벤처 투자 역시 한국과 미국에 비해 약했죠.\n일본 정부도 이 문제를 알고 있습니다.\n2022년 일본은 '스타트업 육성 5개년 계획'을 내놓고, 창업 투자를 크게 늘리겠다고 발표했습니다. [검증 필요: 계획 명칭·목표치]\n한국이 4위에 오른 이유도 분명합니다.\n한국 기업들은 매출의 상당 부분을 연구개발에 다시 쏟아붓습니다.\n2026년 보고서는 한국을 국내총생산 대비 연구개발 지출 5.1퍼센트의 나라로 소개했습니다.\n일본은 3.6퍼센트였죠.\n이건 일본이 반드시 배워야 할 숫자입니다.\n그런데 같은 보고서를 끝까지 읽으면, 일본이 쉽게 무너지지 않는 이유도 함께 보입니다.\n일본은 약점이 있는 나라지만, 동시에 쉽게 따라잡히지 않는 강점을 가진 나라였거든요.\n\n🎬 회색 카드 [ 일본의 약점 ] 젊은 인구·FDI·창업 (연분홍 주의 박스 #FCF1ED) → [ 연구개발 지출 GDP 대비 ] 한국 5.1% · 일본 3.6% · 형광 빨강 c \"배워야 할 숫자\"\n\n## S7 🟦🟩 두 번째 반전 — 특허와 기업 연구, 그리고 도쿄 (10:00~13:30)\n\n다시 성적표의 다른 쪽을 넘겨 보겠습니다.\n2025년 일본은 특허 패밀리 항목에서 세계 2위였습니다.\n2026년에도 3위를 지켰죠.\n특허 패밀리란, 같은 발명을 여러 나라에 동시에 출원한 묶음을 말합니다.\n한 나라에만 내는 특허보다 돈도 시간도 훨씬 많이 듭니다.\n그래서 이 숫자는 '세계 시장에서 지킬 가치가 있는 발명'이 얼마나 많은지를 보여주죠.\n기업이 직접 수행하는 연구개발도 2025년과 2026년 모두 세계 3위였습니다.\n비즈니스 정교화라는 분야에서는 2025년 6위에 올랐고요.\n보고서는 이것을 두고, 일본 산업 혁신 역량의 깊이를 보여준다고 썼습니다.\n2026년판에는 더 분명한 문장이 있습니다.\n일본의 12위는, 세계에서 가장 강한 수준의 산업·기업 혁신을 반영한다고요.\n\n그리고 지도 위에서 보면 더 놀랍습니다.\n세계혁신지수는 나라뿐 아니라 도시권별 혁신 클러스터 순위도 매기는데요.\n2026년 도쿄–요코하마 지역은 세계 2위 혁신 클러스터였습니다.\n보고서는 그 이유를 일본의 특허와 연구, 벤처 투자 활동이 가진 세계적 무게라고 설명했죠.\n도쿄–요코하마는 이 순위가 생긴 뒤 오랫동안 세계 1위를 지켜 온 곳이기도 합니다. [검증 필요: 2017~2024 클러스터 1위 연도]\n2025년, 중국 선전–홍콩–광저우 지역에 처음 1위를 내줬을 뿐이죠.\n\n▶ [중국어 경제 강의 · BV17F41197Cp · 03:59.048–04:02.276] \"일본은 여러 면에서 우리가 참고할 만하다고 정말 느꼈어요.\"\n\n일본을 세 번 다녀왔다는 중국의 한 강사는, 일본을 배울 만한 나라라고 말했습니다.\n경쟁국의 학자가 먼저 꺼낸 평가라 더 무게가 있습니다.\n그가 본 건 아마 화려한 신제품이 아니었을 겁니다.\n도시 곳곳에서 조용히 돌아가는 공장과 연구소, 그리고 그 안의 사람들이었겠죠.\n\n이 깊이는 어디서 왔을까요?\n일본 특허청 자료를 보면, 일본 기업의 특허 출원은 해외 비중이 꾸준히 늘어 왔습니다. [검증 필요: 일본 특허청 연차보고서 해외 출원 비율]\n국내 시장이 줄어드는 동안, 일본 기업들은 세계 시장을 겨냥한 기술을 쌓았던 겁니다.\n지식재산 사용료로 해외에서 벌어들이는 돈도 많습니다.\n2025년 일본 성적표에서 지식재산 수입 항목은 세계 2위권이었다는 분석이 있습니다. [검증 필요: 2025 일본 프로필 6.3.1 원문]\n다른 나라 공장이 일본의 기술을 빌려 쓰고, 그 대가를 일본에 보내고 있다는 뜻이죠.\n매장에서는 일본 이름이 줄었는데, 기술 사용료 통장은 오히려 두꺼워진 겁니다.\n\n🎬 그래프 카드 [ 특허 패밀리 ] 2025 2위 · 2026 3위 / [ 기업 수행 R&D ] 3위 · 세계 지도 클러스터 핀: 1 선전–홍콩–광저우 · 2 도쿄–요코하마 (초록 g) · 형광 초록 g \"매장 대신 기술 사용료\"\n\n## S7-2 🟦 숫자로 본 깊이 — 일본 산업의 '바닥층' (12:30~13:30 확장 구간)\n\n복잡성 1위가 실제로 어떤 모습인지 몇 장면만 보겠습니다.\n반도체를 만드는 웨이퍼의 절반 이상은 일본 두 회사에서 나옵니다. [검증 필요: 신에쓰화학·섬코 합산 점유율]\n스마트폰 속 작은 축전기, 적층세라믹콘덴서는 일본 기업들이 세계 시장의 절반 안팎을 쥐고 있죠. [검증 필요: 무라타 등 일본 기업 MLCC 점유율]\n카메라 속 이미지 센서는 일본의 한 회사가 세계 매출의 절반 가까이를 차지합니다. [검증 필요: 소니 이미지센서 매출 점유율]\n산업용 로봇의 핵심 관절 부품, 정밀 감속기도 일본 기업의 몫이 큽니다. [검증 필요]\n탄소섬유는 비행기 날개와 자동차 차체에 들어가는데, 이 분야 세계 1위도 일본 기업입니다. [검증 필요: 도레이 점유율]\n이 회사들의 공통점은 하나입니다.\n소비자는 이름을 잘 모르지만, 세계의 공장은 이 회사들 없이 돌아가기 어렵다는 거죠.\n생산·수출 복잡성 1위라는 숫자는, 바로 이런 회사 수백 곳이 모여서 만든 결과였습니다.\n\n🎬 아이콘 5개 순차 등장(웨이퍼·MLCC·이미지센서·감속기·탄소섬유) + 각 점유율 큰 숫자 카드 · 효과음 책장 넘김\n\n## S8 🟩 숫자 뒤의 사람들 — 한 우물을 판 시간 (13:30~15:30)\n\n숫자 뒤에는 늘 사람이 있습니다.\n도쿄 남쪽 오타구에는 작은 공장들이 골목마다 붙어 있습니다.\n'마치코바', 동네 공장이라고 부르는 곳들이죠.\n직원이 열 명도 안 되는 공장이, 세계에서 몇 군데만 할 수 있는 가공을 맡기도 합니다.\n어떤 공장은 금속을 머리카락보다 얇게 깎고, 어떤 공장은 오차가 거의 없는 나사를 만듭니다.\n일본의 소행성 탐사선 하야부사의 부품 일부도, 이런 동네 공장의 손을 거쳤다고 알려져 있습니다. [검증 필요: 오타구 마치코바 참여 사례]\n이 공장들은 대개 아버지에서 아들로, 스승에서 제자로 기술이 넘어갑니다.\n기계가 아무리 좋아져도, 마지막 미세한 차이는 손끝의 감각이 잡아내거든요.\n일본에는 창업한 지 백 년이 넘은 기업이 4만 곳이 넘습니다. [검증 필요: 데이코쿠데이터뱅크 2025 조사 46,708곳]\n세계에서 가장 많은 숫자입니다. [검증 필요]\n이 기업들은 유행을 따라 업종을 자주 바꾸지 않았습니다.\n대신 원래 하던 일을 조금씩, 그러나 멈추지 않고 더 정밀하게 다듬었죠.\n빠른 혁신은 화려합니다.\n하지만 깊은 혁신은 조용합니다.\n그리고 조용한 혁신은, 순위표의 평균값 속에 쉽게 묻힙니다.\n일본 사람들은 이런 태도를 '잇쇼켄메이', 한곳에 목숨을 건다는 말로 부르기도 합니다.\n한 가지 일에 평생을 거는 사람들이 모인 나라.\n생산·수출 복잡성 1위는, 그 사람들이 받은 성적표였습니다.\n\n🎬 오타구 동네 공장 B-roll(권리 확인) · 손끝 가공 클로즈업 정지 컷 · 음악 낮춤 · 헤드라인 \"빠른 혁신 vs 깊은 혁신\" (초록 g)\n\n## S8-2 🟨 다시 묻기 — 일본은 정말 따라잡힌 걸까 (15:30~16:20 확장 구간)\n\n그렇다면 일본은 이대로 괜찮은 걸까요?\n꼭 그렇지만은 않습니다.\n깊은 기술을 가진 장인들은 나이가 들어가고 있습니다.\n젊은 인구 비율이 세계 최하위권이라는 건, 이 기술을 이어받을 사람이 줄고 있다는 뜻이죠.\n그래서 일본은 지금 두 번째 시험을 치르고 있습니다.\n쌓아 온 깊이를 지키면서, 새로운 속도까지 갖출 수 있느냐는 시험입니다.\n반가운 신호도 있습니다.\n2026년 보고서는 일본의 과학기술 기반 스타트업 중 특허를 가진 비율이 세계 최상위권이라고 짚었습니다. [검증 필요: '66%·한국·핀란드 다음' 원문 대조]\n깊은 기술 위에서 새 회사가 태어나기 시작했다는 뜻입니다.\n깊이에 속도가 더해진다면, 순위표의 숫자도 다시 움직일지 모릅니다.\n\n🎬 연표 카드: 2022 스타트업 5개년 계획 → 2026 딥사이언스 스타트업 특허 보유율 · 형광 노랑 q \"깊이 + 속도?\"\n\n## S9~S11 🟩🟩 결말 — Triple Ending (16:20~17:40)\n\n처음 질문으로 돌아가 보겠습니다.\n혁신 순위 12위인 일본은, 정말 기술력이 없는 나라일까요?\n종합 점수만 보면, 한국과 중국이 일본을 앞섰습니다.\n그건 사실이고, 한국은 그 성과를 자랑할 자격이 있습니다.\n하지만 같은 성적표 안에서, 일본은 가장 만들기 어려운 물건을 가장 다양하게 만드는 나라였습니다.\n특허 패밀리와 기업 연구에서 세계 3위 안에 들었고, 도쿄는 세계 2위 혁신 도시권이었죠.\n혁신이란 무엇일까요?\n새로운 이름을 빨리 내놓는 것일까요, 아니면 아무도 대신할 수 없는 기술을 끝까지 지키는 것일까요?\n\n잃어버린 삼십 년이라는 말이 일본을 따라다녔습니다.\n그 사이 일본은 순위표에서 여러 번 밀려났습니다.\n그런데 그 삼십 년 동안에도, 누군가는 공장의 불을 끄지 않았습니다.\n작은 부품의 오차를 하나 더 줄이고, 소재의 순도를 한 자리 더 올렸죠.\n아무도 박수 치지 않던 그 시간이, 세계 1위라는 숫자로 돌아왔습니다.\n\n▶ [중국어 경제 해설 · BV1qqk5BkEar · 02:24.480–02:28.760] \"조선 산업… 한국이 일본보다 훨씬 낫네요.\"\n\n다시 들어도 틀린 말은 아닙니다.\n어떤 과목에선 한국이 분명히 앞서 있으니까요.\n다만 세계에서 가장 복잡한 물건을 만드는 과목에서는, 일본이 아직 맨 앞줄에 앉아 있습니다.\n그렇다면 일본이 깊이에 속도까지 더하는 날, 세계의 성적표는 어떻게 달라질까요?\n\n🎬 첫 원음 재생 → 헤드라인 재정의 \"종합 12위 · 복잡성 1위\" → 성적표 카드가 뒤집히며 일본 1위 칸이 초록으로 켜짐 → 마지막 질문 자막(노랑 q)\n\n---\n\n## READ 표 (숫자 한글 읽기)\n| 표기 | 읽기 |\n|---|---|\n| 139개 나라 | 백삼십구 개 나라 |\n| 4위 / 12위 | 사 위 / 십이 위 |\n| 2011년 | 이천십일 년 |\n| 2025년 / 2026년 | 이천이십오 년 / 이천이십육 년 |\n| 5.1퍼센트 / 3.6퍼센트 | 오 점 일 퍼센트 / 삼 점 육 퍼센트 |\n| 16위 → 13위 | 십육 위 → 십삼 위 |\n| 2022년 | 이천이십이 년 |\n| 4만 곳 | 사만 곳 |\n\n## 원음·클립 계획 (C)\n| # | 배치 구간 | 소스ID | 원본 URL | SRT 경로(저장소 기준 상대) | IN | OUT | 길이 | 한국어 자막 | 용도(비하/칭찬/반전/회수/한국비교) | 상태 |\n|---|---|---|---|---|---|---|---|---|---|---|\n| 1 | S1 훅 첫 컷 | BV1qqk5BkEar | https://www.bilibili.com/video/BV1qqk5BkEar | reactions-downloads/audit-20261120/subtitles/BV1qqk5BkEar/BV1qqk5BkEar.translated.ko.srt | 00:02:24.480 | 00:02:28.760 | 4.3s | 조선 산업 / 한국이 일본보다 훨씬 낫네요 | 비하·한국비교 | 🟡 원어 대조·권리 미검증 (자막 2컷 연결) |\n| 2 | S3 억울 | BV1qqk5BkEar | https://www.bilibili.com/video/BV1qqk5BkEar | reactions-downloads/audit-20261120/subtitles/BV1qqk5BkEar/BV1qqk5BkEar.translated.ko.srt | 00:03:02.000 | 00:03:06.360 | 4.4s | 국제 시장에서 / 한국 제품이 일본 제품을 대체했습니다 | 비하·한국비교 | 🟡 |\n| 3 | S5 의문→근거 | BV17F41197Cp | https://www.bilibili.com/video/BV17F41197Cp | 국뽕해외반응-중국SNS-20261103/script/data/BV17F41197Cp.ko.srt | 00:03:45 용하는 제품에는 어떤 일본 기술이 숨어 있을까요?"}, {"src": "붙여넣기③(13:55) 50편 실제 기획안", "title": "일본의 특허가 세계 산업에서 살아남는 이유", "text": "새로운 제품은 매일 등장합니다. 하지만 제품을 만드는 기술은 하루아침에 생기지 않습니다. 2026년 세계혁신지수의 일본 특허 관련 지표에는 세계 1위 항목도 있습니다. 그 숫자는 무엇을 의미할까요? 제품 뒤에 숨은 기술의 역사를 따라가 봅니다."}, {"src": "붙여넣기④(13:56) 50편 V2 해외 평가 반전형", "title": "특허", "text": "세계지식재산기구는 2026년에도 일본의 기업 연구개발과 특허 역량을 높게 평가했습니다. 특허 패밀리 지표는 세계 3위였습니다. 그런데 특허는 단순히 발명품을 많이 만들었다는 뜻만은 아닙니다. 세계 기업들이 사용하는 기술에는 어떤 역사가 담겨 있을까요? 완성품보다 오래 살아남는 지식의 힘을 파고듭니다."}], "outline": "기술 경쟁 → 특허의 역할 → 국제지표 → 실제 기술 → 연구 과정 → 해외 기업 활용 → 산업 가치 → 회수. D03+D02", "question": "⑤❓ 우리가 매일 쓰는 그 제품 속에는 어떤 일본 기술이 숨어 있을까요?", "answer": null}, {"n": 7, "title": "GDP — \"일본은 가난해졌다\"", "v3": ["①🟢 \"일본의 총GDP는 이미 인도보다 낮습니다.\" (BV1qqk5BkEar 03:26.320~03:29.720)", "②🟢 \"하지만 중국에서는 일본 같은 급락이 나올 수 없어요.\" (BV17F41197Cp 14:04.436~14:07.620)", "③📰 그런데 로이터는 2024년 말 일본의 순대외자산이 사상 최고인 533조 엔을 넘었다고 보도했습니다.", "④ 세계 1위 채권국 자리는 독일에 내줬는데, 자산은 오히려 사상 최대라는 겁니다.", "⑤❓ 이게 진짜일까요? 일본은 지난 30년 동안 국경 밖에서 무엇을 쌓아온 걸까요?", "🎬 반전용 2차 원음(칭찬형): BV1EV4y1J7Dz 01:41.686 \"사실 일본 재벌은 한국 삼성보다 더 대단하다.\""], "orig": [{"src": "붙여넣기①(13:53) 50편 V2 훅 강화본", "title": "일본은 가난해졌다? GDP 뒤에 숨겨진 돈", "text": "일본은 이제 부자 나라라는 말도 못 하지 않아? 1인당 GDP만 봐도 예전 같지 않잖아.\n그런데 IMF가 일본의 해외 자산을 조사하자 전혀 다른 경제의 모습이 나타났습니다. 2024년 말 일본의 순대외자산은 국내총생산의 약 90%에 해당했습니다. 일본 경제는 지난 수십 년 동안 국경 밖에서 무엇을 쌓아온 걸까요?"}, {"src": "붙여넣기③(13:55) 50편 실제 기획안", "title": "1인당 GDP만으로 보이지 않는 일본의 자산", "text": "한국이 일본의 1인당 GDP를 넘어선 시기가 있었습니다. 일본 경제에는 분명 해결할 문제가 있습니다. 그런데 2024년 말 일본의 순대외자산은 당시 발표 기준 533조 엔을 넘었습니다. 일본 기업은 국경 밖에서 무엇을 쌓아왔을까요? 경제를 바라보는 또 하나의 숫자가 있습니다."}, {"src": "붙여넣기④(13:56) 50편 V2 해외 평가 반전형", "title": "해외자산", "text": "로이터는 일본이 34년 만에 세계 최대 순채권국 자리를 독일에 내줬다고 보도했습니다. 그런데 2024년 말 일본의 순대외자산 자체는 사상 최고인 533조 엔을 넘었습니다. 순위는 떨어졌는데 자산은 늘어났습니다. 이 모순처럼 보이는 숫자는 무엇을 의미할까요? 일본 경제를 국내 GDP만으로 판단할 수 없는 이유를 찾아봅니다."}], "outline": "GDP 비교 → 일본의 침체 → 순대외자산 → 해외 투자 → 소득 발생 → 환율 영향 → 경제 구조 변화 → 재발견. D06+D08", "question": "⑤❓ 이게 진짜일까요? 일본은 지난 30년 동안 국경 밖에서 무엇을 쌓아온 걸까요?", "answer": null}, {"n": 8, "title": "전자제품 — \"소니·파나소닉은 끝\"", "v3": ["①🟢 \"그리고 일본에서는 팔 물건이 없어요.\" (BV1qqk5BkEar 03:14.520~03:17.600 · ⚠️앞뒤 맥락 확인 필수)", "②🟧 \"예전엔 일본 TV가 최고였지. 지금 누가 일본 가전 사?\"", "③📰 그런데 OECD 경제 분석은 이름 없는 일본 전문 제조기업들, 미국 CSIS는 일본 소재·장비 기업의 높은 비중에 주목했습니다.", "④ 매장에서 사라진 일본 브랜드가, 공장 안에선 사라지지 않았던 거죠.", "⑤❓ 일본은 경쟁에서 진 걸까요, 아니면 싸우는 자리를 바꾼 걸까요?"], "orig": [{"src": "붙여넣기①(13:53) 50편 V2 훅 강화본", "title": "일본 전자제품이 사라진 자리에 남은 기술", "text": "예전엔 일본 TV와 가전이 최고였지. 그런데 요즘 누가 일본 전자산업 얘기를 해?\n그런데 완성품이 만들어지는 공장 안으로 들어가면 다른 이름들이 등장합니다. 미국 CSIS의 공급망 연구도 일본 소재·장비 기업들의 높은 비중에 주목했는데요. 일본 기업들은 경쟁에서 사라진 것일까요, 아니면 경쟁하는 자리를 바꾼 것일까요?"}, {"src": "붙여넣기③(13:55) 50편 실제 기획안", "title": "제품보다 오래 살아남는 일본의 제조 기술", "text": "휴대전화와 가전 시장의 주인공은 바뀌었습니다. 일본의 소비자 전자제품도 예전만큼 눈에 띄지 않죠. 그런데 산업의 경쟁력은 매장에서 보이는 완성품만으로 결정되지 않습니다. 공장 안으로 들어가면 다른 이야기가 시작됩니다. 일본 기업은 어디에 집중해 왔을까요?"}, {"src": "붙여넣기④(13:56) 50편 V2 해외 평가 반전형", "title": "숨은 제조기업", "text": "OECD의 경제 분석은 일본의 잘 알려지지 않은 전문 제조기업들에 주목했습니다. 소비자 시장의 유명 브랜드만으로 일본 산업을 판단하기는 어렵다는 이야기입니다. 세계적인 제품의 내부에는 수많은 전문 부품이 들어갑니다. 완성품의 이름이 사라져도 기술은 살아남을 수 있을까요? 공장 안에서 일본 기업의 진짜 모습을 찾아봅니다."}], "outline": "완성품 경쟁 → 일본의 변화 → 부품·소재 → 정밀 가공 → 해외 생산라인 → 전문기업 → 기술 생태계 → 저력. D03+D05", "question": "⑤❓ 일본은 경쟁에서 진 걸까요, 아니면 싸우는 자리를 바꾼 걸까요?", "answer": null}, {"n": 9, "title": "달 착륙 — \"실패한 착륙\"", "v3": ["①🟧 \"달에 내려가서 전기도 못 만들었다고? 그거 실패 아니야?\"", "②🟧 \"착륙하자마자 뒤집혔다며? 망신이지.\"", "③📰 그런데 과학잡지 네이처는 일본의 SLIM을 당시 가장 정밀한 달 착륙으로 평가했습니다. 목표 지점에서 약 55미터.", "④ 뒤집힌 채 내려앉은 그 착륙선이, 사실은 세계 기록을 쓰고 있었던 겁니다.", "⑤❓ 예상 못 한 사고 속에서 일본이 증명한 건 무엇이었을까요?"], "orig": [{"src": "붙여넣기①(13:53) 50편 V2 훅 강화본", "title": "실패처럼 보였던 일본 달 착륙의 반전", "text": "달에 내려놓고도 태양광 발전을 못 한다고? 일본 달 착륙, 이거 실패한 거 아니야?\n그런데 독일 항공우주센터가 소개한 일본의 착륙 결과에는 또 하나의 숫자가 있었습니다. 목표 지점에서 약 55m 떨어진 곳에 도달했다는 겁니다. 예상하지 못한 사고 속에서도 일본이 증명해 낸 기술은 무엇이었을까요?"}, {"src": "붙여넣기③(13:55) 50편 실제 기획안", "title": "달에 도착하는 것과 원하는 곳에 내리는 것", "text": "달에 우주선을 보내는 것부터 어려운 일입니다. 그런데 착륙 위치를 정밀하게 맞추는 것은 또 다른 도전이죠. 일본의 달 착륙선 SLIM은 바로 그 문제에 도전했습니다. 모든 과정이 계획대로 흘러간 것은 아니었습니다. 그럼에도 이 임무가 남긴  경기를 일본 선수들은 어떻게 뒤집었을까요?"}, {"src": "붙여넣기③(13:55) 50편 실제 기획안", "title": "18점 차를 뒤집은 일본 농구", "text": "2023년 농구월드컵에서 일본은 핀란드에 크게 뒤지고 있었습니다. 점수 차는 한때 18점까지 벌어졌습니다. 그런데 마지막 점수는 98대 88이었습니다. 일본이 승리했습니다. 대체 3쿼터 이후 무슨 일이 있었던 걸까요?"}, {"src": "붙여넣기④(13:56) 50편 V2 해외 평가 반전형", "title": "농구", "text": "국제농구연맹은 일본이 핀란드를 상대로 만들어낸 극적인 역전을 집중 조명했습니다. 한때 일본은 18점이나 뒤지고 있었습니다. 그런데 마지막 쿼터에서 일본은 35점을 몰아넣었습니다. 패배가 가까워 보이던 경기에서 어떻게 이런 일이 가능했을까요? 포기하지 않았던 선수들의 마지막 시간을 따라갑니다."}], "outline": "상대 전력 → 18점 차 → 관중 → 추격 → 전술 변화 → 역전 → 승리 → 팀의 저력. D08+D10", "question": "⑤❓ 포기 직전의 경기를, 일본 선수들은 어떻게 뒤집었을까요?", "answer": null, "script": "# EP45 · 18점 차를 뒤집은 일본 농구, 채널을 돌린 사람들만 못 본 기적 — 본편 대본 v1\n\n- 기반: 훅 V3(EP45) · 붙여넣기③ 전개 \"상대 전력 → 18점 차 → 관중 → 추격 → 전술 변화 → 역전 → 승리 → 팀의 저력 (D08+D10)\" · 붙여넣기④ 전개 \"절망 → 추격 → 희망 → 역전 → 감동\" · 붙여넣기② 감정선 \"절망 → 추격 → 관중의 함성 → 대역전 → 눈물과 자긍심\" · 감정선 E04 불가능 극복형 · STEP 4 규칙\n- 표기: 일반 문장 = 내레이션(N) · `▶` = 외국인 원음(C) · `▶[미확보]` = 필요한 원음 자리(지어내지 않음) · `🎬` = 화면 메모(낭독 안 함) · `[검증 필요]` = 수치·출처 원문 미대조\n- 원음 원본: ⚠️ 자막 저장소(`*.ko.srt` 약 730개)에서 2023 농구월드컵 일본-핀란드전 관련 외국인 발언 SRT **발견 못 함** → 훅 ①②는 🟧 창작 구어체(내레이션 전용), 원음 자리는 전부 `▶[미확보]`\n- 확인한 해외 출처(검색 결과 요약문 대조): CNN 2023-08-27 \"18점 차 역전, 유럽 팀 상대 월드컵 첫 승\" · 요미우리 재팬뉴스 2023-08-28 \"4쿼터 시작 73-63 핀란드 리드, 호킨슨 28점 19리바운드\" · Olympics.com \"2006년 이후 월드컵 첫 승\" · BasketNews 사수 살린 인터뷰 \"We played stupid\"\n- 목표 길이: 1.2배속 후 17:20~17:50 → 검사기 결과는 맨 아래 보고\n\n---\n\n## S1 🟥 훅 (0:00~0:30)\n\n18점 차? 일본 끝났네. 채널 돌려.\n아시아 농구가 유럽을 이긴다고? 꿈 깨.\n그런데 2023년 여름 오키나와, 최종 점수판에는 98대 88이 찍혀 있었습니다.\n미국 CNN은 일본이 18점 차를 뒤집고, 월드컵 역사상 처음으로 유럽 팀을 꺾었다고 전했죠.\n국제농구연맹도 일본이 마지막 쿼터에만 35점을 몰아넣은 대역전을 집중 조명했습니다. [검증 필요: FIBA 경기 보고서 원문 문구]\n채널을 돌린 사람들만, 그날의 기적을 못 봤던 겁니다.\n이게 진짜일까요?\n포기 직전의 경기를, 일본 선수들은 도대체 어떻게 뒤집었을까요?\n\n▶[미확보] 핀란드전 4쿼터 역전 순간 해외 중계진의 외침(영어, FIBA 공식 하이라이트 8Y2kCBtgeOc 자막 추출 후 3~5초)\n🎬 0~3초 검은 화면 위 흰 굵은 헤드라인 \"18점 차 = 끝?\"(빨강 c) → 점수판 그래픽 46:64 → 98:88 숫자 롤링 → 질문 자막(노랑 q)\n\n## S2 🟥 아시아 농구의 벽 — 키가 모든 걸 정한다는 말 (0:30~2:00)\n\n농구는 키의 스포츠라는 말이 있습니다.\n공을 높은 곳의 링에 넣는 경기니까요.\n그래서 오랫동안 세계 농구에서 아시아는 들러리 취급을 받았습니다.\n일본 남자 농구도 예외가 아니었죠.\n일본이 자력으로 올림픽 본선에 나간 건, 1976년 몬트리올이 마지막이었습니다. [검증 필요: 2020 도쿄는 개최국 자동 출전]\n그 뒤로 거의 반세기 동안, 일본 남자 농구는 세계 무대 밖에 있었던 겁니다.\n월드컵에 나가도 결과는 비슷했습니다.\n유럽 팀을 만나면 큰 점수 차로 지는 게 당연한 일처럼 여겨졌거든요.\n일본은 월드컵 무대에서 유럽 팀을 한 번도 이겨 본 적이 없었습니다.\n2019년 중국 대회에서는 다섯 경기를 모두 지고 돌아왔죠. [검증 필요: 2019 월드컵 일본 0승 5패]\n해외 농구 팬들 사이에서 일본은 이른바 '쉬어 가는 경기' 상대였습니다.\n\n일본 안에서도 농구는 오랫동안 2등 스포츠였습니다.\n야구와 축구에 밀려, 프로 리그조차 둘로 쪼개져 있었으니까요.\n국제농구연맹은 2014년, 리그 분열을 이유로 일본에 국제 대회 출전 정지 처분까지 내렸습니다. [검증 필요: FIBA 일본협회 자격정지 2014년 11월]\n나라 대표팀이 국제 대회에 나가지 못하는 상황까지 간 거죠.\n그 위기가 오히려 출발점이 됐습니다.\n2016년, 두 리그가 하나로 합쳐져 비리그가 출범합니다. [검증 필요: B.LEAGUE 2016년 9월 개막]\n그리고 일본은 2023년 월드컵을 필리핀, 인도네시아와 함께 공동 개최하게 됐습니다.\n안방에서 열리는 월드컵이었지만, 기대는 크지 않았습니다.\n목표는 아시아 1위로 파리 올림픽 티켓을 따는 것이었는데요.\n그러려면 조별리그에서 적어도 한 번은 이겨야 했습니다.\n\n🎬 연표 카드 1976 몬트리올 → 2014 FIBA 자격정지 → 2016 B리그 출범 → 2023 공동 개최 · 헤드라인 \"아시아 = 들러리?\"(빨강 c)\n\n## S3 🟥🟨 첫 경기의 충격, 그리고 핀란드 (2:00~4:00)\n\n2023년 8월 25일, 오키나와 아레나.\n일본의 첫 상대는 독일이었습니다.\n결과는 63대 81, 18점 차 완패였죠. [검증 필요: 독일전 최종 점수]\n독일은 그 대회에서 결국 우승까지 차지하는 팀이었습니다.\n그래도 안방 팬들 앞에서 맥없이 무너진 건 뼈아팠습니다.\n다음 상대는 핀란드였습니다.\n핀란드에는 미국 프로농구에서 올스타로 뽑힌 라우리 마르카넨이 있었거든요. [검증 필요: 마르카넨 2023 NBA 올스타]\n키가 2미터 13센티미터에 가까운 선수인데, 외곽 슛까지 던집니다. [검증 필요: 마르카넨 신장]\n일본에는 그만한 스타가 없었습니다.\n미국 무대에서 뛰던 하치무라 루이는 이 대회에 나오지 않았죠. [검증 필요: 하치무라 2023 월드컵 불참]\n바깥에서 보기에 이 경기는 결과가 정해진 경기처럼 보였습니다.\n\n만약 핀란드에도 진다면, 일본의 1라운드 탈락이 사실상 확정될 상황이었습니다.\n안방 월드컵에서, 또 한 번 승리 없이 끝날 수도 있었던 거죠.\n선수들도 그 무게를 알고 있었습니다.\n대표팀 주축이던 와타나베 유타는 대회 전, 올림픽에 못 가면 대표팀을 그만두겠다는 각오까지 밝혔습니다. [검증 필요: 와타나베 유타 발언 원문·시점]\n그만큼 절박했던 대회였습니다.\n\n경기는 예상대로 흘러갔습니다.\n핀란드는 높이에서 앞섰고, 리바운드를 계속 따냈습니다.\n전반이 끝났을 때 일본은 이미 뒤지고 있었죠. [검증 필요: 전반 점수]\n그리고 3쿼터, 점수 차는 18점까지 벌어집니다.\n경기장의 일만 명 가까운 관중이 조용해졌습니다. [검증 필요: 오키나와 아레나 관중 수]\n중계를 보던 사람들 상당수가, 아마 이 순간에 채널을 돌렸을 겁니다.\n\n▶[미확보] 3쿼터 18점 차 순간, 해외 해설진의 \"사실상 끝났다\"류 발언(영어 중계 자막 추출 후 3~5초 · 실제 발언만)\n🎬 점수 그래프 카드(회색) 1쿼터~3쿼터 점수 차 곡선이 −18까지 떨어지는 애니메이션 · 관중석 B-roll(권리 확인) · 형광 빨강 c \"−18\"\n\n## S4 🟨 남은 10분, 아무도 믿지 않았던 시간 (4:00~5:30)\n\n3쿼터가 끝났을 때 점수는 73대 63, 핀란드가 10점 앞서 있었습니다.\n요미우리신문 영자판은 이 순간을, 일본이 두 경기 연속 패배까지 10분 남은 상황이라고 적었습니다.\n10점 차가 크지 않아 보일 수도 있는데요.\n상대는 유럽 팀이었고, 일본은 그런 팀을 한 번도 이겨 본 적이 없었습니다.\n게다가 바로 몇 분 전까지 18점을 뒤지던 흐름이었죠.\n그런데 3쿼터 막판, 경기장에서 작은 변화가 일어나고 있었습니다.\n일본이 조금씩 따라붙기 시작한 겁니다.\n그리고 관중이 다시 일어서기 시작했습니다.\n\n오키나와는 일본에서도 농구 열기가 유난히 뜨거운 곳입니다.\n미군 기지 영향으로 일찍부터 농구 코트가 동네 곳곳에 있었다는 이야기가 전해지거든요. [검증 필요: 오키나와 농구 문화 배경]\n그 관중들이 일본 선수 한 명 한 명의 이름을 부르기 시작했습니다.\n점수 차가 줄어들 때마다, 경기장 소리가 한 단계씩 커졌죠.\n선수들은 나중에, 그 함성이 다리를 움직이게 했다고 돌아봤습니다. [검증 필요: 선수 인터뷰 원문]\n그렇다면 남은 10분 동안, 코트 위에서는 정확히 무슨 일이 있었던 걸까요?\n\n🎬 경기장 함성 효과음 서서히 키움 · 헤드라인 \"남은 10분 · 73:63\"(파랑 e) · 관중 응원 B-roll(권리 확인)\n\n## S5 🟩 첫 번째 반전 — 마지막 쿼터 35점 (5:30~7:30)\n\n4쿼터, 일본은 35점을 넣었습니다.\n같은 10분 동안 핀란드는 15점에 그쳤죠.\n10점 뒤지던 경기가, 10점 차 승리로 끝난 겁니다.\n최종 점수는 98대 88이었습니다.\n이 쿼터를 이끈 건, 키가 170센티미터 남짓한 가드 가와무라 유키였습니다. [검증 필요: 가와무라 유키 공식 신장 172cm]\n농구 선수로는 믿기 어려울 만큼 작은 키인데요.\n그는 2미터가 넘는 선수들 사이를 빠르게 파고들었고, 수비에서는 공을 계속 가로챘습니다.\n그리고 외곽에서 3점 슛을 연달아 꽂아 넣었죠.\n가와무라는 이날 24점을 기록했습니다. [검증 필요: 가와무라 득점·어시스트 기록]\n골밑에는 귀화 선수 조쉬 호킨슨이 버티고 있었습니다.\n호킨슨은 28점, 리바운드 19개로 양 팀 최다 기록을 세웠습니다.\n작은 선수는 바깥을 흔들고, 큰 선수는 안쪽을 지켰던 거죠.\n\n▶[미확보] 가와무라 유키 3점 슛 직후 해외 중계진 감탄(3~5초) — FIBA 하이라이트 또는 해외 반응 영상 자막 추출 후\n▶[미확보] 경기 종료 버저 직후 해외 해설 \"역사적 승리\"류 발언(3~5초)\n\n경기가 끝나자 일본 선수들은 코트에 주저앉았습니다.\n울고 있는 선수가 여럿이었죠.\n관중석에서도 눈물을 닦는 사람들이 보였습니다.\n미국 CNN은 기사 첫 줄에, 일본 선수들과 팬들이 눈물을 흘렸다고 썼습니다.\n이 승리는 일본 남자 농구가 월드컵 무대에서 유럽 팀을 꺾은 첫 승리였습니다.\n국제올림픽위원회 공식 사이트는, 일본이 월드컵에서 17년 만에 거둔 승리라고 소개했죠.\n요미우리는 2006년 이후 세계 대회 첫 승이라고 적었습니다.\n오랜 시간 따라붙던 '들러리'라는 꼬리표가, 이 10분 만에 흔들린 겁니다.\n\n🎬 4쿼터 득점 카드(회색 그래프) 일본 35 · 핀란드 15 큰 숫자 · 선수 기록 카드 [ 가와무라 24점 ] [ 호킨슨 28점 19리바운드 ] · 형광 초록 g \"4쿼터 35점\"\n\n## S6 🟥 의심 — 운이 좋았던 것 아닐까 (7:30~9:00)\n\n하지만 여기서 의심하는 사람들도 있었습니다.\n핀란드가 방심했던 것 아니냐는 거죠.\n실제로 핀란드 쪽의 반응도 그랬습니다.\n핀란드 대표팀 가드 사수 살린은 경기 뒤, 리투아니아 농구 매체에 \"우리가 어리석게 경기했다\"고 말했습니다.\n결정적인 순간에 침착함을 잃었다는 고백이었죠.\n그렇다면 일본의 승리는 상대의 실수 덕분이었을까요?\n숫자를 다시 보면 이야기가 달라집니다.\n상대가 무너진 경기는 보통 실책 몇 개로 갈립니다.\n그런데 이날 일본은 한 쿼터에 35점을 넣었습니다.\n상대가 실수했다고 해서, 저절로 생기는 점수가 아니죠.\n그 점수는 일본이 직접 슛을 던지고, 직접 넣어서 만든 숫자였습니다.\n\n그리고 더 중요한 질문이 남아 있었습니다.\n이 승리가 한 번의 기적으로 끝날 것인가, 아니면 시작이 될 것인가.\n일본은 다음 경기에서 호주에 졌습니다. [검증 필요: 호주전 점수]\n다시 한 번, '역시 한 번뿐이었다'는 말이 나올 수 있는 상황이었죠.\n남은 순위 결정전에서 아시아 1위를 차지해야, 파리 올림픽으로 가는 문이 열렸습니다.\n일본 선수들에게는 아직 끝나지 않은 싸움이 남아 있었던 겁니다.\n\n▶[미확보] 핀란드 선수·감독 경기 후 인터뷰 육성(사수 살린 \"We played stupid\" 영상 확보 시 3~5초, 실제 발언만)\n🎬 해외 매체 헤드라인 타이핑 효과(BasketNews 원문 확인 후) \"We played stupid\" · 헤드라인 \"운? 실력?\"(노랑 q)\n\n## S7 🟦🟩 두 번째 반전 — 또 한 번의 역전, 그리고 파리 (9:00~11:30)\n\n순위 결정전 첫 상대는 남미의 베네수엘라였습니다.\n이 경기에서도 일본은 끌려갔습니다.\n후반 한때 15점 가까이 뒤졌다는 보도가 나왔죠. [검증 필요: 베네수엘라전 최대 점수 차]\n그리고 또다시, 일본은 경기를 뒤집었습니다.\n최종 점수는 86대 77이었습니다. [검증 필요: 베네수엘라전 최종 점수]\n핀란드전이 우연이 아니었다는 걸, 바로 다음 승리로 증명한 거죠.\n마지막 상대는 아프리카의 카보베르데였습니다.\n일본은 80대 71로 이기고, 대회 3승을 채웠습니다. [검증 필요: 카보베르데전 점수]\n월드컵 한 대회에서 세 번을 이긴 건 일본 남자 농구 역사상 처음이었습니다. [검증 필요: 월드컵 최다승 기록]\n그 결과 일본은 아시아 팀 가운데 가장 높은 순위에 올랐습니다.\n파리 올림픽 본선 직행 티켓을 손에 넣은 겁니다.\n자력으로 올림픽에 간 건 1976년 이후 48년 만이었습니다. [검증 필요: '자력 진출' 표현 기준]\n\n이 결과를 두고 해외 농구 매체들은 일본을 다르게 부르기 시작했습니다.\n쉬어 가는 상대가 아니라, 경기를 끝까지 알 수 없게 만드는 팀으로요. [검증 필요: 해외 매체 평가 원문 링크]\n핀란드전 하이라이트는 국제농구연맹 공식 채널에서 '일본의 역사적 역전'이라는 제목으로 소개됐습니다. [검증 필요: 8Y2kCBtgeOc 영상 제목·게시 주체]\n그 영상 하나의 조회수가 수백만 회를 넘었다는 집계도 있습니다. [검증 필요: 조회수 약 590만 회]\n월드컵 본선 중 일부 경기의 일본 시청률이 크게 치솟았다는 보도도 이어졌죠. [검증 필요: 일본 TV 시청률 보도]\n야구와 축구에 밀리던 농구가, 일본 전체를 붙잡아 둔 겁니다.\n\n▶[미확보] 해외 농구 팬·해설가의 \"일본은 이제 무시할 수 없는 팀\"류 반응(영어권 반응 영상 자막 추출 후 3~5초)\n▶[미확보] 파리 올림픽 진출 확정 순간 해외 중계 멘트(3~5초)\n\n🎬 대회 전적 카드 독일 패 → 핀란드 승 → 호주 패 → 베네수엘라 승 → 카보베르데 승 · 지도 카드 오키나와 → 파리 · 형광 초록 g \"48년 만의 자력 진출\"\n\n## S7-2 🟩 코트 위의 사람들 (11:30~14:00)\n\n이 팀을 만든 사람 가운데에는 미국인 감독이 있었습니다.\n톰 호바스 감독입니다.\n그는 일본 여자 대표팀을 이끌고, 도쿄 올림픽 은메달을 따낸 사람이었죠. [검증 필요: 2020 도쿄 여자농구 은메달]\n호바스 감독이 일본 남자 대표팀에 맡긴 건 단순한 전술이었습니다.\n키로 이길 수 없다면, 더 빨리 뛰고 더 많이 던지자는 겁니다.\n3점 슛을 두려워하지 말고, 수비에서는 끝까지 상대를 따라붙자는 거죠.\n말은 쉽지만, 이걸 40분 내내 해내려면 체력이 남달라야 합니다.\n일본 선수들은 대회를 앞두고 그 체력을 만들기 위해, 혹독한 훈련을 견뎠다고 알려졌습니다. [검증 필요: 대표팀 합숙 훈련 보도]\n핀란드전 4쿼터에 일본 선수들의 발이 오히려 더 빨라 보였던 이유입니다.\n\n가와무라 유키의 이야기는 더 극적입니다.\n그는 어릴 때부터 늘 키가 작다는 말을 들으며 자랐습니다.\n농구를 계속하기엔 너무 작다는 말이었죠. [검증 필요: 성장기 인터뷰]\n그런데 그 작은 선수가 월드컵 무대에서 유럽의 거인들을 흔들어 놓았습니다.\n그리고 이듬해, 그는 미국 프로농구 멤피스 그리즐리스와 계약하며 꿈의 무대까지 밟았습니다. [검증 필요: 2024년 계약 형태·데뷔 시점]\n키가 모든 걸 정한다는 말에, 몸으로 답한 셈입니다.\n\n주장 도가시 유키도 키가 167센티미터 정도인 가드입니다. [검증 필요: 도가시 유키 신장]\n그는 대표팀에서 오래 뛰며, 큰 점수 차로 지는 경기를 누구보다 많이 겪었습니다.\n그래서 이 승리의 의미를 누구보다 잘 알았을 겁니다.\n귀화 선수 호킨슨도 빼놓을 수 없습니다.\n미국에서 태어난 그는 일본 리그에서 오래 뛰다, 일본 국적을 얻어 대표팀에 합류했습니다. [검증 필요: 귀화 시점]\n골밑에서 몸을 던지는 그의 모습에, 일본 팬들은 누구보다 큰 박수를 보냈습니다.\n태어난 곳은 달라도, 같은 유니폼을 입고 같은 함성을 들었던 거죠.\n\n와타나베 유타는 경기 뒤 인터뷰에서 눈물을 참지 못했습니다. [검증 필요: 인터뷰 장면·발언]\n대표팀을 그만두겠다는 각오까지 했던 선수였기에, 그 눈물은 더 무거웠습니다.\n일본 농구의 승리는 한 명의 스타가 만든 게 아니었습니다.\n작은 선수, 귀화 선수, 그리고 은퇴까지 걸었던 선수가 함께 만든 승리였습니다.\n\n▶[미확보] 해외 기자·해설가의 가와무라 유키 평가 \"작은 거인\"류 발언(3~5초, 실제 발언만)\n🎬 선수 카드 3장(가와무라 · 호킨슨 · 와타나베) 신장 숫자 크게 · 호바스 감독 카드 \"더 빨리, 더 많이\" · 음악 낮춤\n\n## S8 🟦 역사의 뿌리 — 만화가 키운 나라 (14:00~16:00)\n\n일본 농구를 이야기할 때 빠질 수 없는 이름이 있습니다.\n만화 '슬램덩크'입니다.\n1990년부터 연재된 이 만화는 일본에 농구 붐을 일으켰습니다. [검증 필요: 연재 시작 연도 1990]\n지금 대표팀 선수들 가운데에도 이 만화를 보고 농구를 시작했다는 선수가 적지 않습니다. [검증 필요: 선수 인터뷰]\n그런데 만화 속 주인공 팀은 늘 키 큰 강팀을 상대로 싸웁니다.\n이기기 어려운 상대에게, 끝까지 따라붙는 이야기죠.\n2023년 오키나와에서 벌어진 일은, 그 만화의 한 장면과 많이 닮아 있었습니다.\n\n이 만화는 일본에서만 사랑받은 게 아닙니다.\n2022년 개봉한 극장판은 한국과 중국에서도 큰 흥행을 기록했습니다. [검증 필요: '더 퍼스트 슬램덩크' 한국 관객 수]\n한국과 중국의 많은 팬들이, 일본 만화를 통해 농구를 처음 좋아하게 됐다고 말하기도 하죠.\n일본이 코트 위에서 세계를 이기기 전에, 이미 이야기로 세계의 마음을 움직이고 있었던 겁니다.\n\n리그를 하나로 합친 지 7년 만에 거둔 성과라는 점도 의미가 큽니다.\n비리그 출범 뒤 관중 수는 꾸준히 늘었고, 해외 선수들도 일본 리그로 모여들었습니다. [검증 필요: B리그 관중 수 추이]\n어린 선수들이 미국 대학과 프로 무대에 도전하는 길도 넓어졌죠.\n2014년 국제 대회 출전 정지라는 바닥에서, 일본 농구는 십 년도 안 돼 올림픽 무대로 올라왔습니다.\n위기를 겪은 조직이 이렇게 빨리 바뀐 사례는 흔치 않습니다.\n일본 사회가 자주 듣는 비판이 하나 있는데요.\n변화가 느리다는 말입니다.\n그런데 일본 농구는, 한 번 바꾸기로 하자 누구보다 빠르게 바뀌었습니다.\n\n물론 과제도 남아 있습니다.\n2024년 파리 올림픽에서 일본은 조별리그를 넘지 못했습니다. [검증 필요: 파리 올림픽 일본 남자농구 성적]\n세계 정상과의 거리는 여전히 멀다는 평가도 있죠.\n하지만 그 대회에서도 일본은 강팀을 상대로 끝까지 접전을 펼쳤습니다. [검증 필요: 프랑스전 연장 접전 보도]\n이제 세계는 일본을 쉬어 가는 상대로 보지 않습니다.\n\n🎬 연표 카드 1990 만화 연재 → 2016 B리그 → 2023 월드컵 3승 → 2024 파리 · 헤드라인 \"만화가 현실이 된 밤\"(초록 g) · 만화 이미지는 권리 확인 전 사용 금지(BLOCKED_FOR_RIGHTS_CHECK)\n\n## S8-2 🟨 아시아의 경쟁자들은 어땠을까 (확장 구간)\n\n같은 대회에 나선 아시아의 다른 나라들과 비교해 보면, 이 결과의 무게가 더 분명해집니다.\n2023년 월드컵에는 일본 말고도 여러 아시아 팀이 나왔습니다.\n중국, 필리핀, 요르단, 레바논, 이란 같은 나라들이었죠. [검증 필요: 2023 월드컵 아시아 참가국 명단]\n이 가운데 중국은 오랫동안 아시아 농구의 맹주로 불린 나라입니다.\n미국 프로농구에서 뛴 야오밍 같은 스타를 배출했고, 키 큰 선수도 많았거든요.\n그런데 그 대회에서 아시아 최고 순위를 차지한 건 중국이 아니라 일본이었습니다. [검증 필요: 아시아 팀 최종 순위]\n이 결과를 두고 중국 안에서도 자국 농구를 돌아보는 목소리가 나왔다는 보도가 있었습니다. [검증 필요: 중국 매체 반응 원문]\n한때 일본을 크게 이기던 나라들이, 이제는 일본을 연구하기 시작한 겁니다.\n한국 남자 농구는 이 대회 본선에 오르지 못했습니다. [검증 필요: 한국 2023 월드컵 예선 탈락]\n물론 아시아 안의 경쟁은 해마다 바뀝니다.\n다른 대회에서는 한국이 일본을 꺾고 웃은 적도 있었죠.\n그래도 2023년 여름만큼은, 아시아에서 세계와 가장 대등하게 싸운 팀이 일본이었습니다.\n키가 가장 큰 팀이 아니라, 끝까지 가장 많이 뛴 팀이었다는 점이 중요합니다.\n\n▶[미확보] 중국어권 해설 \"왜 아시아 1위는 중국이 아니라 일본인가\"류 발언(중국어 SRT 확보 시 3~5초, 한국비교·중국비교 자극용)\n🎬 아시아 참가국 순위 카드(회색) 일본 1위 하이라이트 · 헤드라인 \"아시아 1위 = 일본\"(초록 g)\n\n## S8-3 🟦 4쿼터 10분, 숫자로 다시 돌려 보면 (확장 구간)\n\n그날의 4쿼터를 조금 더 천천히 돌려 보겠습니다.\n3쿼터 막판 일본은 18점 차를 10점까지 줄여 놓았습니다.\n4쿼터 초반, 일본의 3점 슛이 연달아 림을 통과했습니다. [검증 필요: 4쿼터 3점 성공 개수]\n점수 차가 한 자리로 줄어들자, 핀란드 벤치가 작전 시간을 불렀습니다.\n보통 이 순간이 분수령입니다.\n작전 시간 뒤 강팀이 흐름을 되찾는 경우가 많거든요.\n그런데 이날은 달랐습니다.\n일본 수비가 핀란드의 패스 길목을 끈질기게 막아섰고, 공을 빼앗아 곧바로 달려 나갔죠.\n결국 경기 종료 몇 분 전, 일본은 처음으로 리드를 잡습니다. [검증 필요: 역전 시점]\n경기장은 그 순간 거의 폭발하듯 함성이 터졌습니다.\n한번 앞서기 시작하자, 점수 차는 오히려 더 벌어졌습니다.\n마지막 몇 분 동안 핀란드는 서두르다 슛을 놓쳤고, 일본은 차분하게 자유투를 넣었습니다.\n핀란드 선수가 말한 '어리석은 경기'는, 사실 일본이 그렇게 만든 경기였던 셈입니다.\n상대가 서두르게 만든 것도, 결국 실력이니까요.\n작은 팀이 큰 팀을 이기는 방법은 하나입니다.\n상대가 편하게 숨 쉴 틈을 주지 않는 거죠.\n일본은 그 10분 동안, 핀란드에 단 한 번도 숨 돌릴 틈을 주지 않았습니다.\n\n🎬 4쿼터 점수 흐름 타임라인 그래프(1분 단위) · 역전 순간 형광 초록 g \"첫 리드\" · 효과음 함성 피크\n\n## S9~S11 🟩🟩 결말 — Triple Ending (16:00~17:35)\n\n처음 질문으로 돌아가 보겠습니다.\n포기 직전의 경기를, 일본 선수들은 어떻게 뒤집었을까요?\n답은 하나가 아니었습니다.\n작은 키를 빠른 발로 바꾼 전술이 있었습니다.\n마지막 10분까지 지치지 않게 만든 훈련이 있었죠.\n그리고 선수들의 이름을 끝까지 불러 준 관중이 있었습니다.\n무엇보다, 18점을 뒤진 순간에도 아무도 고개를 숙이지 않았습니다.\n\n일본 남자 농구는 거의 반세기 동안 세계 무대에서 이기지 못했습니다.\n출전 정지를 당했고, 늘 큰 점수 차로 지는 팀이었죠.\n그 긴 시간 동안에도 누군가는 체육관에 남아 슛을 던졌습니다.\n아무도 기대하지 않던 시간이 쌓여, 오키나와의 그 10분이 만들어진 겁니다.\n\n18점 차, 일본 끝났네.\n그날 이렇게 말하며 채널을 돌린 사람들이 분명히 있었을 겁니다.\n그 말은 틀리지 않았습니다.\n점수판만 보면, 그 순간 일본은 끝난 팀이었으니까요.\n다만 일본 선수들은 점수판이 아니라, 남은 시간을 보고 있었습니다.\n끝났다는 말과 끝까지 했다는 말은, 단 10분 차이였습니다.\n다음에 일본이 또 크게 뒤지고 있다면, 여러분은 채널을 돌리시겠습니까?\n\n▶[미확보] 첫 장면 회수용 — 경기 종료 직후 해외 중계 멘트(S5에서 확보한 것 재사용 가능)\n🎬 처음 헤드라인 \"18점 차 = 끝?\" 다시 띄움 → 빨간 줄 긋고 \"98:88\" 초록 g로 교체 → 선수들 포옹 정지 컷(권리 확인) → 마지막 질문 자막(노랑 q)\n\n---\n\n## READ 표 (숫자 한글 읽기)\n| 표기 | 읽기 |\n|---|---|\n| 18점 | 십팔 점 |\n| 98대 88 | 구십팔 대 팔십팔 |\n| 73대 63 | 칠십삼 대 육십삼 |\n| 35점 | 삼십오 점 |\n| 63대 81 | 육십삼 대 팔십일 |\n| 86대 77 | 팔십육 대 칠십칠 |\n| 80대 71 | 팔십 대 칠십일 |\n| 1976년 | 천구백칠십육 년 |\n| 2006년 | 이천육 년 |\n| 2023년 | 이천이십삼 년 |\n| 170센티미터 | 백칠십 센티미터 |\n| 2미터 13센티미터 | 이 미터 십삼 센티미터 |\n| 48년 | 사십팔 년 |\n| 17년 | 십칠 년 |\n\n## 원음·클립 계획 (C)\n| # | 배치 구간 | 소스ID | 원본 URL | SRT 경로(저장소 기준 상대) | IN | OUT | 길이 | 한국어 자막 | 용도(비하/칭찬/반전/회수/한국비교) | 상태 |\n|---|---|---|---|---|---|---|---|---|---|---|\n| 1 | S1 훅 | 미확보(후보 8Y2kCBtgeOc) | https://www.youtube.com/watch?v=8Y2kCBtgeOc | 없음 | — | — | 3~5s | (역전 순간 해외 중계 외침) | 반전 | 🔴 수집 필요 |\n| 2 | S3 | 미확보 | — | 없음 | — | — | 3~5s | (18점 차 순간 해외 해설) | 비하 | 🔴 수집 필요 |\n| 3 | S5 | 미확보(후보 8Y2kCBtgeOc) | https://www.youtube.com/watch?v=8Y2kCBtgeOc | 없음 | — | — | 3~5s | (가와무라 3점 슛 직후 감탄) | 칭찬 | 🔴 수집 필요 |\n| 4 | S5 | 미확보 | — | 없음 | — | — | 3~5s | (종료 버저 \"역사적 승리\") | 칭찬 | 🔴 수집 필요 |\n| 5 | S6 | 미확보(BasketNews 사수 살린) | https://m.basketnews.com/news-193804-we-played-stupid-sasu-salin-reacts-to-sensational-loss-vs-japan.html | 없음 | — | — | 3~5s | \"우리가 어리석게 경기했다\" | 반전 | 🔴 영상 여부 확인 필요(기사만이면 헤드라인 카드로) |\n| 6 | S7 | 미확보 | — | 없음 | — | — | 3~5s | (해외 팬 \"일본 무시 못 해\") | 칭찬 | 🔴 수집 필요 |\n| 7 | S7 | 미확보(후보 0I172p7Erc8) | https://www.youtube.com/watch?v=0I172p7Erc8 | 없음 | — | — | 3~5s | (파리 진출 확정 멘트) | 칭찬 | 🔴 수집 필요 |\n| 8 | S7-2 | 미확보 | — | 없음 | — | — | 3~5s | (가와무라 \"작은 거인\" 평가) | 칭찬 | 🔴 수집 필요 |\n| 9 | S9 회수 | 미확보(#4 재사용) | — | 없음 | — | — | 3~5s | (종료 직후 중계) | 회수 | 🔴 |\n\n- 원음 합계 **0초(확보분 없음)** → 목표(원음 약 35%) 대비 **전량 부족**. 현재 길이는 내레이션만으로 충족하도록 작성.\n- : CNN 2023-08-27 \"18점 차 역전, 유럽 팀 상대 월드컵 첫 승\" · 요미우리 재팬뉴스 2023-08-28 \"4쿼터 시작 73-63 핀란드 리드, 호킨슨 28점 19리바운드\" · Olympics.com \"2006년 이후 월드컵 첫 승\" · BasketNews 사수 살린 인터뷰 \"We played stupid\"\n- 목표 길이: 1.2배속 후 17:20~17:50 → 검사기 결과는 맨 아래 보고\n\n---\n\n## S1 🟥 훅 (0:00~0:30)\n\n18점 차? 일본 끝났네. 채널 돌려.\n아시아 농구가 유럽을 이긴다고? 꿈 깨.\n그런데 2023년 여름 오키나와, 최종 점수판에는 98대 88이 찍혀 있었습니다.\n미국 CNN은 일본이 18점 차를 뒤집고, 월드컵 역사상 처음으로 유럽 팀을 꺾었다고 전했죠.\n국제농구연맹도 일본이 마지막 쿼터에만 35점을 몰아넣은 대역전을 집중 조명했습니다. [검증 필요: FIBA 경기 보고서 원문 문구]\n채널을 돌린 사람들만, 그날의 기적을 못 봤던 겁니다.\n이게 진짜일까요?\n포기 직전의 경기를, 일본 선수들은 도대체 어떻게 뒤집었을까요?\n\n▶[미확보] 핀란드전 4쿼터 역전 순간 해외 중계진의 외침(영어, FIBA 공식 하이라이트 8Y2kCBtgeOc 자막 추출 후 3~5초)\n🎬 0~3초 검은 화면 위 흰 굵은 헤드라인 \"18점 차 = 끝?\"(빨강 c) → 점수판 그래픽 46:64 → 98:88 숫자 롤링 → 질문 자막(노랑 q)\n\n## S2 🟥 아시아 농구의 벽 — 키가 모든 걸 정한다는 말 (0:30~2:00)\n\n농구는 키의 스포츠라는 말이 있습니다.\n공을 높은 곳의 링에 넣는 경기니까요.\n그래서 오랫동안 세계 농구에서 아시아는 들러리 취급을 받았습니다.\n일본 남자 농구도 예외가 아니었죠.\n일본이 자력으로 올림픽 본선에 나간 건, 1976년 몬트리올이 마지막이었습니다. [검증 필요: 2020 도쿄는 개최국 자동 출전]\n그 뒤로 거의 반세기 동안, 일본 남자 농구는 세계 무대 밖에 있었던 겁니다.\n월드컵에 나가도 결과는 비슷했습니다.\n유럽 팀을 만나면 큰 점수 차로 지는 게 당연한 일처럼 여겨졌거든요.\n일본은 월드컵 무대에서 유럽 팀을 한 번도 이겨 본 적이 없었습니다.\n2019년 중국 대회에서는 다섯 경기를 모두 지고 돌아왔죠. [검증 필요: 2019 월드컵 일본 0승 5패]\n해외 농구 팬들 사이에서 일본은 이른바 '쉬어 가는 경기' 상대였습니다.\n\n일본 안에서도 농구는 오랫동안 2등 스포츠였습니다.\n야구와 축구에 밀려, 프로 리그조차 둘로 쪼개져 있었으니까요.\n국제농구연맹은 2014년, 리그 분열을 이유로 일본에 국제 대회 출전 정지 처분까지 내렸습니다. [검증 필요: FIBA 일본협회 자격정지 2014년 11월]\n나라 대표팀이 국제 대회에 나가지 못하는 상황까지 간 거죠.\n그 위기가 오히려 출발점이 됐습니다.\n2016년, 두 리그가 하나로 합쳐져 비리그가 출범합니다. [검증 필요: B.LEAGUE 2016년 9월 개막]\n그리고 일본은 2023년 월드컵을 필리핀, 인도네시아와 함께 공동 개최하게 됐습니다.\n안방에서 열리는 월드컵이었지만, 기대는 크지 않았습니다.\n목표는 아시아 1위로 파리 올림픽 티켓을 따는 것이었는데요.\n그러려면 조별리그에서 적어도 한 번은 이겨야 했습니다.\n\n🎬 연표 카드 1976 몬트리올 → 2014 FIBA 자격정지 → 2016 B리그 출범 → 2023 공동 개최 · 헤드라인 \"아시아 = 들러리?\"(빨강 c)\n\n## S3 🟥🟨 첫 경기의 충격, 그리고 핀란드 (2:00~4:00)\n\n2023년 8월 25일, 오키나와 아레나.\n일본의 첫 상대는 독일이었습니다.\n결과는 63대 81, 18점 차 완패였죠. [검증 필요: 독일전 최종 점수]\n독일은 그 대회에서 결국 우승까지 차지하는 팀이었습니다.\n그래도 안방 팬들 앞에서 맥없이 무너진 건 뼈아팠습니다.\n다음 상대는 핀란드였습니다.\n핀란드에는 미국 프로농구에서 올스타로 뽑힌 라우리 마르카넨이 있었거든요. [검증 필요: 마르카넨 2023 NBA 올스타]\n키가 2미터 13센티미터에 가까운 선수인데, 외곽 슛까지 던집니다. [검증 필요: 마르카넨 신장]\n일본에는 그만한 스타가 없었습니다.\n미국 무대에서 뛰던 하치무라 루이는 이 대회에 나오지 않았죠. [검증 필요: 하치무라 2023 월드컵 불참]\n바깥에서 보기에 이 경기는 결과가 정해진 경기처럼 보였습니다.\n\n만약 핀란드에도 진다면, 일본의 1라운드 탈락이 사실상 확정될 상황이었습니다.\n안방 월드컵에서, 또 한 번 승리 없이 끝날 수도 있었던 거죠.\n선수들도 그 무게를 알고 있었습니다.\n대표팀 주축이던 와타나베 유타는 대회 전, 올림픽에 못 가면 대표팀을 그만두겠다는 각오까지 밝혔습니다. [검증 필요: 와타나베 유타 발언 원문·시점]\n그만큼 절박했던 대회였습니다.\n\n경기는 예상대로 흘러갔습니다.\n핀란드는 높이에서 앞섰고, 리바운드를 계속 따냈습니다.\n전반이 끝났을 때 일본은 이미 뒤지고 있었죠. [검증 필요: 전반 점수]\n그리고 3쿼터, 점수 차는 18점까지 벌어집니다.\n경기장의 일만 명 가까운 관중이 조용해졌습니다. [검증 필요: 오키나와 아레나 관중 수]\n중계를 보던 사람들 상당수가, 아마 이 순간에 채널을 돌렸을 겁니다.\n\n▶[미확보] 3쿼터 18점 차 순간, 해외 해설진의 \"사실상 끝났다\"류 발언(영어 중계 자막 추출 후 3~5초 · 실제 발언만)\n🎬 점수 그래프 카드(회색) 1쿼터~3쿼터 점수 차 곡선이 −18까지 떨어지는 애니메이션 · 관중석 B-roll(권리 확인) · 형광 빨강 c \"−18\"\n\n## S4 🟨 남은 10분, 아무도 믿지 않았던 시간 (4:00~5:30)\n\n3쿼터가 끝났을 때 점수는 73대 63, 핀란드가 10점 앞서 있었습니다.\n요미우리신문 영자판은 이 순간을, 일본이 두 경기 연속 패배까지 10분 남은 상황이라고 적었습니다.\n10점 차가 크지 않아 보일 수도 있는데요.\n상대는 유럽 팀이었고, 일본은 그런 팀을 한 번도 이겨 본 적이 없었습니다.\n게다가 바로 몇 분 전까지 18점을 뒤지던 흐름이었죠.\n그런데 3쿼터 막판, 경기장에서 작은 변화가 일어나고 있었습니다.\n일본이 조금씩 따라붙기 시작한 겁니다.\n그리고 관중이 다시 일어서기 시작했습니다.\n\n오키나와는 일본에서도 농구 열기가 유난히 뜨거운 곳입니다.\n미군 기지 영향으로 일찍부터 농구 코트가 동네 곳곳에 있었다는 이야기가 전해지거든요. [검증 필요: 오키나와 농구 문화 배경]\n그 관중들이 일본 선수 한 명 한 명의 이름을 부르기 시작했습니다.\n점수 차가 줄어들 때마다, 경기장 소리가 한 단계씩 커졌죠.\n선수들은 나중에, 그 함성이 다리를 움직이게 했다고 돌아봤습니다. [검증 필요: 선수 인터뷰 원문]\n그렇다면 남은 10분 동안, 코트 위에서는 정확히 무슨 일이 있었던 걸까요?\n\n🎬 경기장 함성 효과음 서서히 키움 · 헤드라인 \"남은 10분 · 73:63\"(파랑 e) · 관중 응원 B-roll(권리 확인)\n\n## S5 🟩 첫 번째 반전 — 마지막 쿼터 35점 (5:30~7:30)\n\n4쿼터, 일본은 35점을 넣었습니다.\n같은 10분 동안 핀란드는 15점에 그쳤죠.\n10점 뒤지던 경기가, 10점 차 승리로 끝난 겁니다.\n최종 점수는 98대 88이었습니다.\n이 쿼터를 이끈 건, 키가 170센티미터 남짓한 가드 가와무라 유키였습니다. [검증 필요: 가와무라 유키 공식 신장 172cm]\n농구 선수로는 믿기 어려울 만큼 작은 키인데요.\n그는 2미터가 넘는 선수들 사이를 빠르게 파고들었고, 수비에서는 공을 계속 가로챘습니다.\n그리고 외곽에서 3점 슛을 연달아 꽂아 넣었죠.\n가와무라는 이날 24점을 기록했습니다. [검증 필요: 가와무라 득점·어시스트 기록]\n골밑에는 귀화 선수 조쉬 호킨슨이 버티고 있었습니다.\n호킨슨은 28점, 리바운드 19개로 양 팀 최다 기록을 세웠습니다.\n작은 선수는 바깥을 흔들고, 큰 선수는 안쪽을 지켰던 거죠.\n\n▶[미확보] 가와무라 유키 3점 슛 직후 해외 geOc 영상 제목·게시 주체]\n그 영상 하나의 조회수가 수백만 회를 넘었다는 집계도 있습니다. [검증 필요: 조회수 약 590만 회]\n월드컵 본선 중 일부 경기의 일본 시청률이 크게 치솟았다는 보도도 이어졌죠. [검증 필요: 일본 TV 시청률 보도]\n야구와 축구에 밀리던 농구가, 일본 전체를 붙잡아 둔 겁니다.\n\n▶[미확보] 해외 농구 팬·해설가의 \"일본은 이제 무시할 수 없는 팀\"류 반응(영어권 반응 영상 자막 추출 후 3~5초)\n▶[미확보] 파리 올림픽 진출 확정 순간 해외 중계 멘트(3~5초)\n\n🎬 대회 전적 카드 독일 패 → 핀란드 승 → 호주 패 → 베네수엘라 승 → 카보베르데 승 · 지도 카드 오키나와 → 파리 · 형광 초록 g \"48년 만의 자력 진출\"\n\n## S7-2 🟩 코트 위의 사람들 (11:30~14:00)\n\n이 팀을 만든 사람 가운데에는 미국인 감독이 있었습니다.\n톰 호바스 감독입니다.\n그는 일본 여자 대표팀을 이끌고, 도쿄 올림픽 은메달을 따낸 사람이었죠. [검증 필요: 2020 도쿄 여자농구 은메달]\n호바스 감독이 일본 남자 대표팀에 맡긴 건 단순한 전술이었습니다.\n키로 이길 수 없다면, 더 빨리 뛰고 더 많이 던지자는 겁니다.\n3점 슛을 두려워하지 말고, 수비에서는 끝까지 상대를 따라붙자는 거죠.\n말은 쉽지만, 이걸 40분 내내 해내려면 체력이 남달라야 합니다.\n일본 선수들은 대회를 앞두고 그 체력을 만들기 위해, 혹독한 훈련을 견뎠다고 알려졌습니다. [검증 필요: 대표팀 합숙 훈련 보도]\n핀란드전 4쿼터에 일본 선수들의 발이 오히려 더 빨라 보였던 이유입니다.\n\n가와무라 유키의 이야기는 더 극적입니다.\n그는 어릴 때부터 늘 키가 작다는 말을 들으며 자랐습니다.\n농구를 계속하기엔 너무 작다는 말이었죠. [검증 필요: 성장기 인터뷰]\n그런데 그 작은 선수가 월드컵 무대에서 유럽의 거인들을 흔들어 놓았습니다.\n그리고 이듬해, 그는 미국 프로농구 멤피스 그리즐리스와 계약하며 꿈의 무대까지 밟았습니다. [검증 필요: 2024년 계약 형태·데뷔 시점]\n키가 모든 걸 정한다는 말에, 몸으로 답한 셈입니다.\n\n주장 도가시 유키도 키가 167센티미터 정도인 가드입니다. [검증 필요: 도가시 유키 신장]\n그는 대표팀에서 오래 뛰며, 큰 점수 차로 지는 경기를 누구보다 많이 겪었습니다.\n그래서 이 승리의 의미를 누구보다 잘 알았을 겁니다.\n귀화 선수 호킨슨도 빼놓을 수 없습니다.\n미국에서 태어난 그는 일본 리그에서 오래 뛰다, 일본 국적을 얻어 대표팀에 합류했습니다. [검증 필요: 귀화 시점]\n골밑에서 몸을 던지는 그의 모습에, 일본 팬들은 누구보다 큰 박수를 보냈습니다.\n태어난 곳은 달라도, 같은 유니폼을 입고 같은 함성을 들었던 거죠.\n\n와타나베 유타는 경기 뒤 인터뷰에서 눈물을 참지 못했습니다. [검증 필요: 인터뷰 장면·발언]\n대표팀을 그만두겠다는 각오까지 했던 선수였기에, 그 눈물은 더 무거웠습니다.\n일본 농구의 승리는 한 명의 스타가 만든 게 아니었습니다.\n작은 선수, 귀화 선수, 그리고 은퇴까지 걸었던 선수가 함께 만든 승리였습니다.\n\n▶[미확보] 해외 기자·해설가의 가와무라 유키 평가 \"작은 거인\"류 발언(3~5초, 실제 발언만)\n🎬 선수 카드 3장(가와무라 · 호킨슨 · 와타나베) 신장 숫자 크게 · 호바스 감독 카드 \"더 빨리, 더 많이\" · 음악 낮춤\n\n## S8 🟦 역사의 뿌리 — 만화가 키운 나라 (14:00~16:00)\n\n일본 농구를 이야기할 때 빠질 수 없는 이름이 있습니다.\n만화 '슬램덩크'입니다.\n1990년부터 연재된 이 만화는 일본에 농구 붐을 일으켰습니다. [검증 필요: 연재 시작 연도 1990]\n지금 대표팀 선수들 가운데에도 이 만화를 보고 농구를 시작했다는 선수가 적지 않습니다. [검증 필요: 선수 인터뷰]\n그런데 만화 속 주인공 팀은 늘 키 큰 강팀을 상대로 싸웁니다.\n이기기 어려운 상대에게, 끝까지 따라붙는 이야기죠.\n2023년 오키나와에서 벌어진 일은, 그 만화의 한 장면과 많이 닮아 있었습니다.\n\n이 만화는 일본에서만 사랑받은 게 아닙니다.\n2022년 개봉한 극장판은 한국과 중국에서도 큰 흥행을 기록했습니다. [검증 필요: '더 퍼스트 슬램덩크' 한국 관객 수]\n한국과 중국의 많은 팬들이, 일본 만화를 통해 농구를 처음 좋아하게 됐다고 말하기도 하죠.\n일본이 코트 위에서 세계를 이기기 전에, 이미 이야기로 세계의 마음을 움직이고 있었던 겁니다.\n\n리그를 하나로 합친 지 7년 만에 거둔 성과라는 점도 의미가 큽니다.\n비리그 출범 뒤 관중 수는 꾸준히 늘었고, 해외 선수들도 일본 리그로 모여들었습니다. [검증 필요: B리그 관중 수 추이]\n어린 선수들이 미국 대학과 프로 무대에 도전하는 길도 넓어졌죠.\n2014년 국제 대회 출전 정지라는 바닥에서, 일본 농구는 십 년도 안 돼 올림픽 무대로 올라왔습니다.\n위기를 겪은 조직이 이렇게 빨리 바뀐 사례는 흔치 않습니다.\n일본 사회가 자주 듣는 비판이 하나 있는데요.\n변화가 느리다는 말입니다.\n그런데 일본 농구는, 한 번 바꾸기로 하자 누구보다 빠르게 바뀌었습니다.\n\n물론 과제도 남아 있습니다.\n2024년 파리 올림픽에서 일본은 조별리그를 넘지 못했습니다. [검증 필요: 파리 올림픽 일본 남자농구 성적]\n세계 정상과의 거리는 여전히 멀다는 평가도 있죠.\n하지만 그 대회에서도 일본은 강팀을 상대로 끝까지 접전을 펼쳤습니다. [검증 필요: 프랑스전 연장 접전 보도]\n이제 세계는 일본을 쉬어 가는 상대로 보지 않습니다.\n\n🎬 연표 카드 1990 만화 연재 → 2016 B리그 → 2023 월드컵 3승 → 2024 파리 · 헤드라인 \"만화가 현실이 된 밤\"(초록 g) · 만화 이미지는 권리 확인 전 사용 금지(BLOCKED_FOR_RIGHTS_CHECK)\n\n## S8-2 🟨 아시아의 경쟁자들은 어땠을까 (확장 구간)\n\n같은 대회에 나선 아시아의 다른 나라들과 비교해 보면, 이 결과의 무게가 더 분명해집니다.\n2023년 월드컵에는 일본 말고도 여러 아시아 팀이 나왔습니다.\n중국, 필리핀, 요르단, 레바논, 이란 같은 나라들이었죠. [검증 필요: 2023 월드컵 아시아 참가국 명단]\n이 가운데 중국은 오랫동안 아시아 농구의 맹주로 불린 나라입니다.\n미국 프로농구에서 뛴 야오밍 같은 스타를 배출했고, 키 큰 선수도 많았거든요.\n그런데 그 대회에서 아시아 최고 순위를 차지한 건 중국이 아니라 일본이었습니다. [검증 필요: 아시아 팀 최종 순위]\n이 결과를 두고 중국 안에서도 자국 농구를 돌아보는 목소리가 나왔다는 보도가 있었습니다. [검증 필요: 중국 매체 반응 원문]\n한때 일본을 크게 이기던 나라들이, 이제는 일본을 연구하기 시작한 겁니다.\n한국 남자 농구는 이 대회 본선에 오르지 못했습니다. [검증 필요: 한국 2023 월드컵 예선 탈락]\n물론 아시아 안의 경쟁은 해마다 바뀝니다.\n다른 대회에서는 한국이 일본을 꺾고 웃은 적도 있었죠.\n그래도 2023년 여름만큼은, 아시아에서 세계와 가장 대등하게 싸운 팀이 일본이었습니다.\n키가 가장 큰 팀이 아니라, 끝까지 가장 많이 뛴 팀이었다는 점이 중요합니다.\n\n▶[미확보] 중국어권 해설 \"왜 아시아 1위는 중국이 아니라 일본인가\"류 발언(중국어 SRT 확보 시 3~5초, 한국비교·중국비교 자극용)\n🎬 아시아 참가국 순위 카드(회색) 일본 1위 하이라이트 · 헤드라인 \"아시아 1위 = 일본\"(초록 g)\n\n## S8-3 🟦 4쿼터 10분, 숫자로 다시 돌려 보면 (확장 구간)\n\n그날의 4쿼터를 조금 더 천천히 돌려 보겠습니다.\n3쿼터 막판 일본은 18점 차를 10점까지 줄여 놓았습니다.\n4쿼터 초반, 일본의 3점 슛이 연달아 림을 통과했습니다. [검증 필요: 4쿼터 3점 성공 개수]\n점수 차가 한 자리로 줄어들자, 핀란드 벤치가 작전 시간을 불렀습니다.\n보통 이 순간이 분수령입니다.\n작전 시간 뒤 강팀이 흐름을 되찾는 경우가 많거든요.\n그런데 이날은 달랐습니다.\n일본 수비가 핀란드의 패스 길목을 끈질기게 막아섰고, 공을 빼앗아 곧바로 달려 나갔죠.\n결국 경기 종료 몇 분 전, 일본은 처음으로 리드를 잡습니다. [검증 필요: 역전 시점]\n경기장은 그 순간 거의 폭발하듯 함성이 터졌습니다.\n한번 앞서기 시작하자, 점수 차는 오히려 더 벌어졌습니다.\n마지막 몇 분 동안 핀란드는 서두르다 슛을 놓쳤고, 일본은 차분하게 자유투를 넣었습니다.\n핀란드 선수가 말한 '어리석은 경기'는, 사실 일본이 그렇게 만든 경기였던 셈입니다.\n상대가 서두르게 만든 것도, 결국 실력이니까요.\n작은 팀이 큰 팀을 이기는 방법은 하나입니다.\n상대가 편하게 숨 쉴 틈을 주지 않는 거죠.\n일본은 그 10분 동안, 핀란드에 단 한 번도 숨 돌릴 틈을 주지 않았습니다.\n\n🎬 4쿼터 점수 흐름 타임라인 그래프(1분 단위) · 역전 순간 형광 초록 g \"첫 리드\" · 효과음 함성 피크\n\n## S9~S11 🟩🟩 결말 — Triple Ending (16:00~17:35)\n\n처음 질문으로 돌아가 보겠습니다.\n포기 직전의 경기를, 일본 선수들은 어떻게 뒤집었을까요?\n답은 하나가 아니었습니다.\n작은 키를 빠른 발로 바꾼 전술이 있었습니다.\n마지막 10분까지 지치지 않게 만든 훈련이 있었죠.\n그리고 선수들의 이름을 끝까지 불러 준 관중이 있었습니다.\n무엇보다, 18점을 뒤진 순간에도 아무도 고개를 숙이지 않았습니다.\n\n일본 남자 농구는 거의 반세기 동안 세계 무대에서 이기지 못했습니다.\n출전 정지를 당했고, 늘 큰 점수 차로 지는 팀이었죠.\n그 긴 시간 동안에도 누군가는 체육관에 남아 슛을 던졌습니다.\n아무도 기대하지 않던 시간이 쌓여, 오키나와의 그 10분이 만들어진 겁니다.\n\n18점 차, 일본 끝났네.\n그날 이렇게 말하며 채널을 돌린 사람들이 분명히 있었을 겁니다.\n그 말은 틀리지 않았습니다.\n점수판만 보면, 그 순간 일본은 끝난 팀이었으니까요.\n다만 일본 선수들은 점수판이 아니라, 남은 시간을 보고 있었습니다.\n끝났다는 말과 끝까지 했다는 말은, 단 10분 차이였습니다.\n다음에 일본이 또 크게 뒤지고 있다면, 여러분은 채널을 돌리시겠습니까?\n\n▶[미확보] 첫 장면 회수용 — 경기 종료 직후 해외 중계 멘트(S5에서 확보한 것 재사용 가능)\n🎬 처음 헤드라인 \"18점 차 = 끝?\" 다시 띄움 → 빨간 줄 긋고 \"98:88\" 초록 g로 교체 → 선수들 포옹 정지 컷(권리 확인) → 마지막 질문 자막(노랑 q)\n\n---\n\n## READ 표 (숫자 한글 읽기)\n| 표기 | 읽기 |\n|---|---|\n| 18점 | 십팔 점 |\n| 98대 88 | 구십팔 대 팔십팔 |\n| 73대 63 | 칠십삼 대 육십삼 |\n| 35점 | 삼십오 점 |\n| 63대 81 | 육십삼 대 팔십일 |\n| 86대 77 | 팔십육 대 칠십칠 |\n| 80대 71 | 팔십 대 칠십일 |\n| 1976년 | 천구백칠십육 년 |\n| 2006년 | 이천육 년 |\n| 2023년 | 이천이십삼 년 |\n| 170센티미터 | 백칠십 센티미터 |\n| 2미터 13센티미터 | 이 미터 십삼 센티미터 |\n| 48년 | 사십팔 년 |\n| 17년 | 십칠 년 |\n\n## 원음·클립 계획 (C)\n| # | 배치 구간 | 소스ID | 원본 URL | SRT 경로(저장소 기준 상대) | IN | OUT | 길이 | 한국어 자막 | 용도(비하/칭찬/반전/회수/한국비교) | 상태 |\n|---|---|---|---|---|---|---|---|---|---|---|\n| 1 | S1 훅 | 미확보(후보 8Y2kCBtgeOc) | https://www.youtube.com/watch?v=8Y2kCBtgeOc | 없음 | — | — | 3~5s | (역전 순간 해외 중계 외침) | 반전 | 🔴 수집 필요 |\n| 2 | S3 | 미확보 | — | 없음 | — | — | 3~5s | (18점 차 순간 해외 해설) | 비하 | 🔴 수집 필요 |\n| 3 | S5 | 미확보(후보 8Y2kCBtgeOc) | https:/
