<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>외국인이 본 일본 · SNS 원장</title><style>
*{box-sizing:border-box}body{margin:0;background:#131918;color:#eef5eb;font:13px/1.45 'Malgun Gothic',sans-serif}h1{margin:0;background:#bcff34;color:#172300;font-size:18px;padding:7px 10px}main{padding:6px 8px}p{margin:4px 0}a{color:#c5ff67}button,select,input{color:inherit;background:#202c24;border:1px solid #627660;border-radius:3px;padding:5px 6px;font:inherit}label{display:inline-flex;align-items:center;gap:4px}.controls{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0}.layout{display:flex;min-width:0}.topics{width:164px;flex:0 0 auto;overflow:auto;max-height:75vh}.topics button{display:block;width:100%;text-align:left;border-radius:0;padding:3px 5px}.topics button[aria-pressed=true]{background:#bcff34;color:#172300}.panel{flex:1;min-width:0;overflow:auto}.handle{flex:0 0 8px;background:#657958;cursor:col-resize;touch-action:none}.handle:focus-visible{outline:2px solid #bcff34}table{width:100%;min-width:490px;border-collapse:collapse}th,td{padding:4px 6px;text-align:left;vertical-align:top;border-bottom:1px solid #3d4c3d}th{background:#2c3d28}tr:nth-child(even){background:#1a241e}td:first-child{white-space:nowrap}.muted{color:#bac9b8}details{margin:5px 0}summary{cursor:pointer}@media(max-width:540px){.layout{display:block}.topics,.handle{display:none}}
</style></head><body><h1>외국인이 본 일본 · SNS 30개 분야</h1><main><p id="totals" role="status">자료 확인 중…</p><details><summary>출처 확인 방식 · 플랫폼 접근 상태</summary><div id="evidence"></div><p>긍정·비판·혼합·해설은 공개 설명 기준 분류입니다. 게시물의 실제 발언·게시자 국적·재생 여부는 확인하지 않았습니다. 다른 세션의 비공개 작업과 완전 중복 대조한 것은 아닙니다.</p></details><div class="controls"><label>분야 <select id="category"></select></label><label>기간 <select id="period"></select></label><label>검색 <input id="query" type="search" placeholder="제목·ID·반응"></label><a href="sources.tsv">원장 TSV</a></div><div class="layout"><nav class="topics" id="tabs" aria-label="분야 탭"></nav><div class="handle" id="handle" role="separator" aria-label="분야 탭 폭 조정" aria-orientation="vertical" aria-valuemin="104" aria-valuemax="320" aria-valuenow="164" tabindex="0"></div><div class="panel"><p id="count" role="status"></p><table><thead><tr><th>게시일</th><th>분야</th><th>내용 / 원본</th><th>반응</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>
const $=id=>document.getElementById(id),el=(t,v)=>{const e=document.createElement(t);if(v!==undefined)e.textContent=v;return e};
fetch('sources.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{
 const cat=$('category'),period=$('period'),nav=$('tabs');const chosen=(new URLSearchParams(location.search)).get('category');
 const n=d.rows.length;$('totals').textContent=`${d.asof} 기준 · 초기 ${n}건 / 목표 ${d.categories.length*100}건 · 원장 ${d.checked_files}개 파일 ID 대조 · 분야별 목표 100건`;
 Object.entries(d.status).forEach(([k,v])=>$('evidence').append(el('p',`${k}: ${v}`)));
 for(const [i,day] of d.windows.entries()){const o=el('option',`${i+1}개월 · ${day}부터`);o.value=day;period.append(o)}period.selectedIndex=11;
 for(const c of ['전체',...d.categories]){let o=el('option',c);o.value=c;cat.append(o);const num=d.rows.filter(r=>c==='전체'||r.category===c).length;const b=el('button',`${c} · ${num}${c==='전체'?'':'/100'}`);b.dataset.category=c;b.onclick=()=>{cat.value=c;render()};nav.append(b)}
 if(d.categories.includes(chosen))cat.value=chosen;
 function render(){const q=$('query').value.toLowerCase();let rows=d.rows.filter(r=>(cat.value==='전체'||r.category===cat.value)&&r.date>=period.value&&r.date<=d.asof&&(!q||`${r.title} ${r.id} ${r.tone}`.toLowerCase().includes(q)));rows.sort((a,b)=>b.date.localeCompare(a.date));$('count').textContent=`${rows.length}건 표시 · 0건인 분야는 미수집`;for(const b of nav.children)b.setAttribute('aria-pressed',String(b.dataset.category===cat.value));$('rows').replaceChildren(...rows.map(r=>{const tr=el('tr'),td=el('td',r.title+' '),a=el('a',r.platform+' 원본');a.href=r.url;a.target='_blank';a.rel='noopener';td.append(a);if(r.existing.length)td.append(el('small',' · 기존 원장 ID 발견'));tr.append(el('td',r.date),el('td',r.category),td,el('td',r.tone));return tr}));}
 cat.onchange=period.onchange=$('query').oninput=render;render();window.japanSocialReady=true;
 const handle=$('handle');const resize=x=>{const w=Math.max(104,Math.min(320,Math.round(x)));nav.style.width=w+'px';handle.setAttribute('aria-valuenow',w);localStorage.setItem('japanSocialWidth',w)};
 resize(Number(localStorage.getItem('japanSocialWidth'))||164);handle.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();resize(nav.offsetWidth+(e.key==='ArrowLeft'?-12:12))}};handle.onpointerdown=e=>handle.setPointerCapture(e.pointerId);handle.onpointermove=e=>{if(handle.hasPointerCapture(e.pointerId))resize(e.clientX-nav.getBoundingClientRect().left)};
}).catch(e=>{$('totals').textContent='원장을 불러오지 못했습니다: '+e.message});
</script></body></html>
