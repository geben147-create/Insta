function card(v){const u='https://www.youtube.com/watch?v='+v.id;return '<div class="card'+(isYT(v)?' yt':'')+'"><h3>TOP '+v.rank+' · '+E(v.t)+'</h3><small>한국어 제목: 번역 미실행 · 분야: '+E(v.f)+'</small><small>플랫폼: YouTube · 제작자: '+E(v.ch)+' · <span class="tag">'+E(v.orig)+'</span></small><small>원본 영상: <a class="lk" href="'+u+'" target="_blank" rel="noopener">'+u+'</a> · 재게시 주소: 미확인</small><small>조회수 '+E(v.views)+' · 게시 '+E(v.date)+' · 길이 '+E(v.len)+' (YouTube 검색 2026-11-27 확인)</small><small>다운로드: 미실행 · 원어 자막: 미확보 · 한국어 자막: 미확보 · 저장 경로: 없음 · 사용 권리: 미확인(재배포 금지 가정)</small></div>'}
function show(k){[...nav.children].forEach(a=>a.className=a.dataset.k===k?'on':'');let h='';
 const by=(a,b)=>D.V.filter(v=>v.rank>=a&&v.rank<=b);
 if(k==='t1')h='<p>TOP 1~10 · 신규 후보 '+by(1,10).length+'건 (YouTube 검색 기반, 분야당 최대 10개)</p>'+by(1,10).map(card).join('');
 else if(k==='t2'||k==='t3')h='<p>수집 0건. 아직 검색하지 않았습니다(미수집).</p>';
 else if(k==='yt')h='<p>공식 채널명으로 원작자 추정된 영상은 흰색, 나머지는 원작자 확인 필요입니다.</p>'+D.V.filter(isYT).map(card).join('')+'<h4>원작자 확인 필요('+D.V.filter(v=>!isYT(v)).length+'건)는 TOP 메뉴에서 확인</h4>';
 else if(k==='oldsub')h='<p>기존 japan-social 원장 중 자막 미확보 또는 상태 없음 '+D.OLD.length+'건 (자막 추출 대기)</p>'+D.OLD.map(r=>'<div class="card"><h3>'+E(r.t)+'</h3><small>'+E(r.p)+' · '+E(r.c)+' · <a class="lk" href="'+E(r.u)+'" target="_blank" rel="noopener">'+E(r.u)+'</a> · ID '+E(r.id)+' · 기존 자료</small></div>').join('');
 else if(k==='newsub')h='<p>신규 영상 '+D.V.length+'건 전부 자막 미추출(PENDING)</p>'+D.V.map(card).join('');
 else if(k==='rate')h='<table><tr><th>플랫폼</th><th>신규 발견</th><th>다운로드</th><th>원어 자막</th><th>한국어</th></tr><tr><td>YouTube</td><td>'+D.V.length+'</td><td>0 (0%)</td><td>0 (0%)</td><td>0 (0%)</td></tr><tr><td>빌리빌리</td><td>0</td><td colspan=3>미수집</td></tr><tr><td>도우인</td><td>0</td><td colspan=3>미수집</td></tr><tr><td>틱톡</td><td>0</td><td colspan=3>미수집</td></tr><tr><td>샤오홍슈</td><td>0</td><td colspan=3>미수집</td></tr></table>';
 else h='<p>이 플랫폼은 아직 수집하지 않았습니다(0건). 로그인·접근 제한으로 미확인.</p>';
 m.innerHTML=h;location.hash=k}
M.forEach(([k,n])=>{const a=document.createElement('a');a.href='#'+k;a.dataset.k=k;a.textContent=n;a.onclick=e=>{e.preventDefault();show(k)};nav.append(a)});
show(M.some(x=>x[0]===location.hash.slice(1))?location.hash.slice(1):'t1');window.v4Ready=true;
</script></body></html>
