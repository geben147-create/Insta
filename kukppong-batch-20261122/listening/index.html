<script>
'use strict';
const $=id=>document.getElementById(id);
const tracks=JSON.parse($('tracks').textContent), player=$('player'), status=$('status'), state=$('state'), seek=$('queue-time');
const fmt=(s)=>{const t=Math.floor(Math.max(0,s));const p=n=>String(n).padStart(2,'0');return t>=3600?`${Math.floor(t/3600)}:${p(Math.floor(t/60)%60)}:${p(t%60)}`:`${p(Math.floor(t/60))}:${p(t%60)}`;};
const groups=[tracks.filter(t=>t.id>=21),tracks.filter(t=>t.id<21)], options=new URLSearchParams(location.search);
for(const group of groups){let at=0;for(const t of group){t.start=at;at+=t.duration;} group.total=at;}
let selected=null,queue=groups[0],ticket=0,pending=null;
function node(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e;}
function showTime(t=player.currentTime){if(!selected)return;const time=Math.max(0,Math.min(selected.duration,t||0)), total=selected.start+time;
 if(document.activeElement!==seek||!seek.matches(':active'))seek.value=total;
 $('queue-clock').textContent=`${fmt(total)} / ${fmt(queue.total)}`;seek.setAttribute('aria-valuetext',`${selected.id}번 ${fmt(time)} · 전체 ${fmt(total)}`);
 if(!selected.seek.matches(':active'))selected.seek.value=time;selected.clock.textContent=`${fmt(time)} / ${fmt(selected.duration)}`;
}
function requestPlay(token){player.play().catch(()=>{if(token===ticket&&!player.error)state.textContent='브라우저가 자동 재생을 막았습니다. 위의 ▶ 또는 편별 재생 버튼을 눌러 주세요.';});}
function useTrack(t,offset=0,autoplay=true){
 const token=++ticket, point=Math.min(Math.max(offset,0),Math.max(0,t.duration-.06));
 const same=selected===t;
 if(!same){if(selected){selected.row.classList.remove('active');selected.row.removeAttribute('aria-current');selected.clock.textContent=fmt(selected.duration);selected.seek.value=0;}
  selected=t;queue=groups[t.id>=21?0:1];t.row.classList.add('active');t.row.setAttribute('aria-current','true');
  status.textContent=`${t.id}번 · ${t.title}`;status.dataset.episode=t.id;
  $('queue-label').textContent=(t.id>=21?'21~40번':'기존 대본 10편')+' 전체 타임라인';seek.max=queue.total;seek.disabled=false;
  $('prev').disabled=queue.indexOf(t)===0;$('forward').disabled=queue.indexOf(t)===queue.length-1;
  $('chapters').replaceChildren(...(t.chapters||[]).map(c=>{const b=node('button',`${fmt(c.at)} · ${c.label}`); b.type='button';b.onclick=()=>useTrack(t,c.at);return b;}));
  state.textContent=`${t.kind} · 전체 ${fmt(t.duration)} · 2배속`;player.src=t.url;player.defaultPlaybackRate=1;player.playbackRate=1;
 }
 if(player.readyState>=1){player.currentTime=point;pending=null;}
 else pending=point;
 showTime(point);
 if(autoplay)requestPlay(token);
}
function move(step){const t=queue[queue.indexOf(selected)+step];if(t)useTrack(t);}
for(const t of tracks){
 const li=node('li');li.dataset.episode=t.id;li.value=t.id;t.row=li;
 const row=node('div',null,'row'), b=node('button',`${t.id}번 재생하기`), name=node('div',t.title,'name'), time=node('div',null,'time');b.type='button';b.onclick=()=>useTrack(t);
 const mode=node('small',`${t.kind}${t.id>=21?' · 연속 재생 '+fmt(t.start)+' 시작':''}`);name.append(mode);
 t.clock=node('span',fmt(t.duration));t.clock.dataset.duration=t.duration;
 const a=node('a','MP3 저장'), download=node('small');a.href=t.url;a.download='';download.append(a);time.append(t.clock,download);
 const range=node('input');range.type='range';range.min=0;range.max=t.duration;range.step='.1';range.value=0;range.setAttribute('aria-label',`${t.id}번 타임라인`);range.onchange=()=>useTrack(t,Number(range.value));t.seek=range;
 const line=node('div',null,'row-seek timeline');line.append(range);row.append(b,name,time,line);li.append(row);$(t.id>=21?'new':'old').append(li);
}
player.addEventListener('loadedmetadata',()=>{if(pending!==null){player.currentTime=Math.min(pending,player.duration);pending=null;}showTime();});
player.addEventListener('timeupdate',()=>showTime());
player.addEventListener('playing',()=>{if(selected)state.textContent=`${selected.kind} · 2배속 재생 중`;});
player.addEventListener('error',()=>{if(selected)state.textContent=`${selected.id}번 음성을 불러오지 못했습니다. 해당 편의 재생하기를 다시 눌러 주세요.`;});
player.addEventListener('ended',()=>{
 if(!selected)return;
 const target=queue[queue.indexOf(selected)+1];
 if($('next').checked&&target)useTrack(target);
 else state.textContent=target?`${selected.id}번 재생을 마쳤습니다.`:'이 목록의 재생을 마쳤습니다.';
});
seek.addEventListener('input',()=>{$('queue-clock').textContent=`${fmt(Number(seek.value))} / ${fmt(queue.total)}`;});
seek.addEventListener('change',()=>{const at=Number(seek.value), t=queue.findLast(x=>x.start<=at)||queue[0];useTrack(t,at-t.start);});
$('all').onclick=()=>{$('next').checked=true;useTrack(groups[0][0]);};$('prev').onclick=()=>move(-1);$('forward').onclick=()=>move(1);
useTrack(tracks.find(t=>String(t.id)===options.get('ep'))||groups[0][0],0,false);
</script></body></html>
