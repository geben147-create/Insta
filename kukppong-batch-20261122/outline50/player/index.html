<script>
const ST={"51": {"no": 51, "title": "\"일본 PC방은 게임하는 곳이 아니다\" 100위안 들고 한중일 돈 중국인이 서울에서 놀란 이유", "outline": true, "newch": true, "script": true, "audio": true, "mins": 22.1, "version": "5c325c0820d3"}, "52": {"no": 52, "title": "\"LPL이 꿈에 그리던 트로피\" 한국 T1 사옥 앞에 줄 선 중국인들, 일본과 68배 벌어진 이유", "outline": true, "newch": false, "script": true, "audio": true, "mins": 20.8, "version": "ec27b1273415"}, "53": {"no": 53, "title": "‘늙은 아저씨 숫자’라던 310만, 일본 예비군의 55배… 외국인들이 한국 병역에 놀란 이유", "outline": true, "newch": false, "script": true, "audio": true, "mins": 22.8, "version": "a9d5dd8163bd"}, "54": {"no": 54, "title": "“온천은 두 시간, 한국은 하룻밤” 日 온천 다녀온 외국인들이 찜질방에 놀란 이유", "outline": true, "newch": true, "script": true, "audio": true, "mins": 22.6, "version": "d2a51116bab9"}, "55": {"no": 55, "title": "“한국이 싸고 효과도 좋다” 日 클리닉 조사에 드러난 진실… 주말 비행기로 한국 피부과 가는 외국인들", "outline": true, "newch": false, "script": true, "audio": true, "mins": 23.7, "version": "bdb8b0f0fdcd"}, "56": {"no": 56, "title": "일본인도 ‘일본보다 섬세하다’던 한국 미용실·메이크업샵·사진관, 한나절 변신에 놀란 외국인들", "outline": true, "newch": false, "script": true, "audio": true, "mins": 22.8, "version": "11bc8853cb17"}, "57": {"no": 57, "title": "일본은 ‘10년 안 바뀌는 병’, 한국은 ‘세계의 기본’… 한국식 세안·스킨케어 습관에 놀란 외국인들", "outline": true, "newch": true, "script": true, "audio": true, "mins": 21.0, "version": "b1688149b4dd"}, "58": {"no": 58, "title": "일본 10대도 ‘IVE 얼굴이 되고 싶다’… 화장·말투·표정까지 한국을 따라 하는 외국인들", "outline": true, "newch": false, "script": true, "audio": true, "mins": 22.6, "version": "cbd8be8b6c14"}, "59": {"no": 59, "title": "“K팝이 프로야구면 AKB는 고교야구” 일본도 인정한 이수만의 아이돌 학교에 놀란 외국인들", "outline": true, "newch": false, "script": true, "audio": true, "mins": 22.8, "version": "4f50dd05bcf1"}, "60": {"no": 60, "title": "조용한 일본 공연장과 정반대, 막차부터 첫차까지 떼창하는 한국에 놀란 외국인들", "outline": true, "newch": true, "script": true, "audio": true, "mins": 22.9, "version": "1a30f85f4eb7"}, "61": {"no": 61, "title": "일본은 5초 악수에 CD 열 장, 한국은 백화점에서 배우와 마주친다? 길에서 스타 만난 외국인들", "outline": true, "newch": false, "script": true, "audio": true, "mins": 23.3, "version": "dba6aa4a1e38"}, "62": {"no": 62, "title": "8개국 대결 일본 3위, 판을 짠 한국은 1위… ‘공포영화 같다’던 한국 예능에 외국인들이 빠진 이유", "outline": true, "newch": false, "script": true, "audio": true, "mins": 21.8, "version": "0e67604ccb7a"}, "63": {"no": 63, "title": "‘일본판만 못하다’던 중국 댓글창, 한국 드라마 원작 앞에서 뒤집힌 이유", "outline": true, "newch": true, "script": true, "audio": true, "mins": 23.0, "version": "7610f25cef32"}, "64": {"no": 64, "title": "“한국 영화계에 완전히 추월당했다” 일본 감독들이 부러워한 건 스크린 속 장면이 아니었다", "outline": true, "newch": false, "script": true, "audio": true, "mins": 21.6, "version": "ef6bb65e1e2f"}, "65": {"no": 65, "title": "“찍으면 완전 한국 느낌” 일본 블로거가 ‘결점’이라던 갤럭시 사진의 색, 소니를 넘어선 이유", "outline": true, "newch": false, "script": true, "audio": true, "mins": 22.7, "version": "330a081dae4f"}, "66": {"no": 66, "title": "\"내 밥솥이 문제였네요\" 일본 솥 사 오던 중국인들이 한국 가전에 놀란 이유", "outline": true, "newch": true, "script": true, "audio": true, "mins": 22.1, "version": "caac6087d3a3"}, "67": {"no": 67, "title": "“일본 집은 악명 높게 춥다” 100년 전 미국 공사의 기록, 지금 일본인들도 한국 집 문 열자마자 놀란 이유", "outline": true, "newch": false, "script": true, "audio": true, "mins": 23.0, "version": "356ca76f36ab"}, "68": {"no": 68, "title": "“일본인 동료 누구도 기모노를 못 입혀 줬다” 같은 전통 의상인데 외국인들이 한복을 입고 궁을 더 오래 걷는 이유", "outline": true, "newch": false, "script": true, "audio": true, "mins": 22.8, "version": "133fd5a7388b"}, "69": {"no": 69, "title": "“한국 왕궁, 이 정도밖에 못 지었다”던 서울에 650만… 도쿄국립박물관의 두 배 반", "outline": true, "newch": true, "script": true, "audio": true, "mins": 23.1, "version": "256c7e579fa8"}, "70": {"no": 70, "title": "“누가 한국에 유학 가요” 비웃던 중국인들, 도쿄 제친 서울 캠퍼스에 놀란 이유", "outline": true, "newch": false, "script": true, "audio": true, "mins": 22.2, "version": "5927954d31a8"}, "71": {"no": 71, "title": "일본어 줄 때 한국어만 38% 늘었다… 새벽 3시 어학당에서 울던 외국인들의 결말", "outline": true, "newch": false, "script": true, "audio": true, "mins": 22.6, "version": "9ac9451a82d2"}, "72": {"no": 72, "title": "\"한국 쪽은 시급 1,700엔\" 일본 조선소 대신 한국을 고른 외국인 노동자들, 한
