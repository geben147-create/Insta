"00:45–02:30","text":"NACS 슈퍼차저 호환 배경","question":"현대차가 테슬라 충전소에 간 이유는?"},{"t":"02:30–04:30","text":"400/800V 이해하기","question":"전압과 충전 규격은 왜 중요한가?"},{"t":"04:30–06:30","text":"최대출력 vs 충전 곡선","question":"최대 출력 숫자만으로 판단할 수 있을까?"},{"t":"06:30–09:00","text":"1차 반전 · 실측 결과","question":"1차 반전: 같은 차도 충전소·조건에 따라 충전 시간이 바뀐다."},{"t":"09:00–11:30","text":"기상·SOC 조건의 함정","question":"InsideEVs 시승·시험의 구체적 조건은?"},{"t":"11:30–14:30","text":"2차 반전 · 접근성과 속도 분리","question":"2차 반전: 이용 가능 충전망 확대와 최고속도는 별개다."},{"t":"14:30–17:00","text":"기자의 최종 평가 회수","question":"해외 기자의 장단점 평가와 전기차 경쟁력을 회수한다."}],"hooks":["미국 기자가 아이오닉을 충전하는 실제 테스트 영상의 호평 부분만 쓴다.","현대차가 테슬라 충전소에 간 이유는?","전압과 충전 규격은 왜 중요한가?","최대 출력 숫자만으로 판단할 수 있을까?","1차 반전: 같은 차도 충전소·조건에 따라 충전 시간이 바뀐다.","InsideEVs 시승·시험의 구체적 조건은?","2차 반전: 이용 가능 충전망 확대와 최고속도는 별개다.","해외 기자의 장단점 평가와 전기차 경쟁력을 회수한다."],"source_links":[["미국 Car and Driver","2025-04-11","2025 아이오닉5 10%→90%: 테슬라 슈퍼차저 40분, 800V급 다른 충전기 30분","https://www.caranddriver.com/news/a64410159/2025-hyundai-ioniq-5-nacs-port-charging-test/","해외실측"],["미국 InsideEVs","2025","아이오닉5의 800V급 구조와 V3 슈퍼차저 전압 차이 분석","https://insideevs.com/news/751308/hyundai-charging-tesla-v3-interview/","해외기술평가"]],"correction":"실측 40/30분은 해당 차량 연식·조건의 테스트 값. 다른 모델 일반화 금지.","parts":["테슬라 충전소에 한국 아이오닉 파이브가 섰습니다. 미국 기자들은 실제 충전 시간을 재봤습니다. 그런데 충전기가 많아져도 속도는 달랐습니다. 같은 차에 왜 열 분 차이가 날까요. 이 시험의 주인공은 숫자보다 충전 조건입니다.","전기차 운전자의 가장 큰 걱정 중 하나는 멀리 나갔다가 충전할 곳을 찾지 못하는 상황입니다. 가솔린 자동차가 주유소 표지만 찾으면 어느 정도 안심할 수 있는 것과 다릅니다. 플러그 규격이 다르면 충전기 앞에 서 있어도 꽂지 못할 수 있고, 연결하더라도 출력이 달라집니다. 미국의 충전 시장에서는 테슬라의 슈퍼차저망이 큰 영향력을 가지고 있습니다. 현대차가 북미 시장용 아이오닉 파이브에 NACS 충전 규격을 적용한 이유는 이용할 수 있는 충전소의 범위를 넓히는 데 있습니다. 이것만으로도 소비자에게는 중요한 변화입니다. 그런데 연결만 되면 모든 문제가 해결될까요. 실제 속도를 확인하려면 충전기의 전압과 자동차 배터리 구조까지 살펴봐야 합니다.\n\n장거리 운전자에게 중요한 것은 경로의 충전소가 실제로 열려 있고 사용할 수 있느냐입니다. 충전 가능한 장소가 늘어나면 이동 계획의 자유도 함께 커집니다.\n\n운전자가 충전소에 들어서는 마음을 생각해 보십시오. 전기차를 처음 산 사람에게는 충전기 화면의 작은 글씨도 낯섭니다. 어디에 주차해야 하는지, 충전 단자가 맞는지, 결제는 어떻게 하는지 알아야 합니다. 충전이 시작된 뒤에는 몇 분이 걸릴지도 신경 쓰입니다. 자동차 회사가 규격을 바꾼다는 뉴스는 겉으로는 기술 이야기지만, 결국 이런 운전자의 걱정을 덜기 위한 일이기도 합니다. 같은 나라 안에서도 사용하는 충전기 규격이 달라 불편함이 생길 수 있습니다. 그러니 테슬라 충전망에 현대차가 접근할 수 있게 된 일은 브랜드 경쟁을 넘어 실제 운전자에게 중요한 변화입니다.","전압을 이해하기 어렵다면 물이 흐르는 배관을 떠올려 봐도 좋습니다. 물을 밀어내는 압력과 흐르는 양이 다르면 전달되는 에너지도 달라지듯, 전기차 충전에서도 전압과 전류가 함께 작용합니다. 아이오닉 파이브에는 높은 전압을 활용하는 설계가 적용됐습니다. 반면 많은 테슬라 V3 슈퍼차저의 작동 조건은 그 설계와 다릅니다. 그래서 차량이 높은 출력에 대응할 수 있다고 해도 특정 충전기에서 늘 최고 수치를 끌어낼 수 있는 것은 아닙니다. 성능표의 최대 숫자와 실제로 전력이 들어가는 과정은 다릅니다. 충전 경험을 평가할 때는 운전자에게 필요한 시간이 얼마나 걸렸는지가 더 중요할 수 있습니다.\n\n고전압 배터리와 낮은 전압 충전기가 만날 때의 출력 제한은 고장이라기보다 설계 조건의 차이일 수 있습니다. 어떤 조건에서 느렸는지 먼저 확인해야 합니다.\n\n전압을 물의 압력에 비유하는 설명은 이해를 돕지만 모든 것을 설명하지는 못합니다. 실제 충전에서는 자동차 내부의 회로와 배터리 상태를 관리하는 시스템도 함께 움직입니다. 어떤 충전기는 같은 차에 연결해도 최대 출력이 다른 충전기보다 낮을 수 있습니다. 이것이 자동차의 설계가 나쁘다는 뜻도, 충전기가 고장났다는 뜻도 아닙니다. 서로 다른 전압 범위에서 작동하도록 만들어진 기술이 만나면 어떤 제한이 발생하는지 이해해야 합니다. 서로 다른 기기의 협력이 필요한 시대에는 이런 호환성의 문제가 예상보다 중요합니다. 차량을 잘 만드는 것만큼 남이 만든 시설과 잘 연결하는 능력이 경쟁력이 됩니다.","여기서 한 가지 더 눈여겨볼 것이 있습니다. 충전은 처음부터 끝까지 같은 속도로 진행되지 않습니다. 배터리의 남은 용량과 온도, 차량이 배터리를 보호하는 방식에 따라 속도가 계속 달라집니다. 그래서 누군가 충전 화면에서 순간적으로 높은 숫자를 봤다고 해서 전체 충전이 빨랐다고 단정하기 어렵습니다. 비슷한 차종이라도 겨울의 차가운 배터리와 충분히 예열된 배터리는 결과가 달라질 수 있습니다. 미국의 기자들이 충전 조건을 구체적으로 설명하는 이유도 여기에 있습니다. 몇 킬로와트를 찍었느냐보다 시작과 끝의 충전 비율, 걸린 시간을 함께 비교해야 공정한 평가가 됩니다. 결국 충전 규격은 편의의 문제이고 출력은 물리적 조건의 문제입니다.\n\n최대 출력만 표시한 광고 화면과 전체 충전 시간은 분리해서 다뤄야 합니다. 배터리 잔량 구간마다 전력이 달라지므로 단일 수치로 경험 전체를 요약할 수 없습니다.\n\n배터리 충전율을 퍼센트로 보여 주는 화면을 떠올려 봅니다. 처음에는 숫자가 빠르게 오르다가 어느 구간부터 느려질 수 있습니다. 이 변화에는 배터리 온도와 안전을 관리하는 절차가 포함됩니다. 자동차 기자들이 십 퍼센트에서 구십 퍼센트까지 같은 구간을 비교하는 이유는 시작과 끝을 명확히 하기 위해서입니다. 다른 회사가 오 퍼센트에서 팔십 퍼센트까지 걸린 시간을 제시했다면 똑같은 시험이라고 보기 어렵습니다. 충전 그래프에서 최고로 높았던 한 점이 전부는 아닙니다. 운전자가 실제로 기다린 전체 시간이 그 경험을 더 잘 설명할 수 있습니다. 그래서 기술 시험에서는 작은 조건 하나까지 중요합니다.","첫 번째 반전은 실제 시험 수치에서 나옵니다. 미국 카앤드라이버는 2025년형 아이오닉 파이브를 충전율 십 퍼센트에서 구십 퍼센트까지 시험했습니다. 테슬라의 사백 볼트급 슈퍼차저에서는 약 사십 분, 팔백 볼트급 다른 급속 충전기에서는 약 삼십 분이 걸렸습니다. 이 결과는 테슬라 충전망을 쓸 수 있게 된 편리함과 모든 충전소에서 같은 속도를 내는 것이 별개라는 사실을 보여 줍니다. 한국 차가 테슬라 충전소에 갔으니 언제나 더 빨라야 한다는 주장은 성립하지 않습니다. 동시에 사십 분이 나왔다고 해서 기술이 쓸모없다는 평가도 맞지 않습니다. 어느 조건에서 무엇을 얻고 잃었는지 봐야 하기 때문입니다.\n\n미국 카앤드라이버의 40분과 30분은 같은 차량의 특정 충전 조건을 비교한 결과입니다. 국가와 연식, 충전기 버전이 달라지면 시간도 달라질 수 있습니다.\n\n미국 카앤드라이버의 결과를 들으면 누구나 먼저 열 분의 차이에 눈길이 갈 수 있습니다. 하지만 서로 다른 충전기의 전압 조건을 확인하는 순간 의미가 달라집니다. 한국 차가 테슬라 충전소에서 충전됐다는 사실 자체는 중요한 변화입니다. 같은 차가 다른 시설에서는 더 빨리 충전된다는 결과도 중요합니다. 어느 한쪽을 버리고 기사 제목을 자극적으로 만들면 운전자가 알아야 할 정보가 사라집니다. 같은 차량을 놓고 한쪽은 사십 분, 다른 쪽은 삼십 분이 걸렸다는 사실이 더 또렷해집니다. 물론 두 숫자에는 각각 다른 충전 조건이 따라붙습니다. 이 차이는 승리와 패배보다 충전 환경을 이해하는 문제에 가깝습니다.","미국 전기차 전문매체 인사이드이브이스도 같은 문제를 짚었습니다. 자동차가 높은 전압을 사용하도록 설계돼도 충전 설비의 실제 전압 때문에 속도 차이가 생길 수 있다는 것입니다. 이 문제를 알면 충전소를 고르는 방식도 달라집니다. 장거리 운전에서는 충전기를 꼭 최고 출력 제품만 찾을 필요가 없을 수 있습니다. 쉬는 시간 동안 충분히 충전할 수 있는 곳이 운전자에게 더 좋은 선택일 때도 있습니다. 다른 날씨, 다른 시작 충전량, 다른 충전기 버전에서 얻은 기록을 하나의 순위표로 만들면 오류가 생깁니다. 해외 전문가의 시험이 가치 있는 것은 한국 차를 칭찬했기 때문만이 아니라 정확한 조건을 보여 주었기 때문입니다.\n\n기자가 불리한 결과를 공개했다고 한국 차를 비난하는 것은 아닙니다. 제품의 장점과 제약을 같이 설명할 때 독자는 스스로 판단할 수 있습니다.\n\n한 기자가 제품의 단점까지 설명한다는 것은 독자를 위해 그만큼 구체적인 상황을 기록했다는 의미입니다. 충전기가 고장 났는지, 차량 내부 설계의 전압 조건 때문인지, 외부 기온 때문인지 구분해 봐야 소비자에게 도움이 됩니다. 이런 시험은 한국 브랜드에 대한 호불호를 넘어 기술의 실제 모습을 보여 줍니다. 흥미로운 점은 자동차 산업이 점점 혼자 잘하는 기술보다 함께 잘 작동하는 기술을 요구한다는 사실입니다. 충전소 운영사와 자동차 회사, 결제 서비스가 서로 맞지 않으면 운전자는 불편을 겪습니다. 좋은 차를 만드는 일과 이용하기 쉬운 환경을 만드는 일이 하나의 경쟁이 되고 있습니다.","두 번째 반전은 충전 속도와 충전망 접근성이 서로 다른 경쟁력이라는 점입니다. 차량 회사가 충전 규격을 바꾸면 기존보다 많은 장소에서 충전할 가능성이 열립니다. 반면 자동차의 배터리 설계와 충전기의 기술적 조건까지 한꺼번에 바뀌는 것은 아닙니다. 두 가지를 함께 보아야 진짜 편리함을 판단할 수 있습니다. 자동차 기술은 종종 최고 속도 한 번으로 승패가 갈리는 것처럼 보입니다. 하지만 매일 출퇴근하는 사람에게는 고장 없이 쓸 수 있는 충전기와 안내 화면, 결제 방식, 기다리는 시간이 더 중요할 수도 있습니다. 좋은 기술은 멋진 숫자가 아니라 생활 속에서 반복해서 믿을 수 있는 경험으로 남습니다.\n\n하루에 필요한 주행거리가 짧은 운전자에게는 한 번의 최고 속도보다 동네 충전소의 접근성이 더 중요할 수 있습니다. 기술 경쟁의 질문을 소비자 생활로 옮겨야 합니다.\n\n자동차 경쟁을 나라 대 나라의 자존심 싸움으로만 만들면 놓치는 부분이 있습니다. 미국 소비자가 어느 충전소를 골라야 하는지, 장거리 여행을 어떻게 계획하는지라는 현실적인 고민입니다. 예컨대 빠른 충전기가 멀리 있고 조금 느린 충전기가 바로 옆에 있다면 어느 쪽이 더 편리할까요. 답은 이동 경로와 남은 배터리에 따라 달라집니다. 전기차 기술의 실제 가치는 실험실의 숫자만으로 완성되지 않습니다. 많은 운전자가 다양한 환경에서 반복해서 사용할 때 모습을 드러냅니다. 한국 제품이 세계 시장에서 선택받으려면 이런 일상의 질문에도 좋은 답을 내놓아야 합니다.","한국 자동차 산업은 한때 남의 기술을 배우고 따라가는 처지였습니다. 이제 미국의 전문 매체가 한국 전기차를 실제로 시험하며 충전망과 전압 구조의 차이를 분석합니다. 모든 시험 결과가 한국에 유리한 것은 아닙니다. 오히려 솔직한 장단점이 드러날수록 소비자는 어떤 차가 자신에게 맞는지 알 수 있습니다. 처음의 장면으로 돌아갑니다. 현대차가 테슬라 충전소에 들어간 이유는 단순히 상대 회사의 장비 앞에서 승리를 선언하려는 것이 아니었습니다. 더 많은 길 위에서 운전자의 선택지를 넓히려는 변화였습니다. 한국의 기술이 해외의 시험을 받는 시대, 그 시험에서 배울 것을 배우는 태도까지 경쟁력입니다.\n\n한국이 기술을 만드는 나라가 됐다는 의미는 검증받을 용기를 갖게 됐다는 뜻이기도 합니다. 실측값으로 부족함을 알 때 다음 설계도 개선됩니다.\n\n한국 자동차를 낮게 보던 시절을 기억하는 사람들이 있습니다. 한국 차가 해외의 전문 테스트에서 주요 비교 대상이 된 지금의 모습은 분명 변화입니다. 하지만 위상을 인정받기 위해 모든 시험에서 일 등을 해야 하는 것은 아닙니다. 장단점을 솔직하게 보여 주고 불편함을 하나씩 개선하는 기술이 오래 살아남습니다. 해외 기자의 실측이 우리에게 반갑게 느껴지는 이유도 여기 있습니다. 외국에서 한국 차를 직접 운전하고 충전하고 자신의 돈과 시간을 기준으로 평가하는 시대가 됐습니다. 한 번의 충전 기록에 승패를 모두 걸지 않아도, 그 변화 자체가 오래 쌓아 온 산업의 시간을 보여 줍니다."],"duration_target_sec":1020,"duration_measured_sec":null,"narration_chars":5415,"source_audio_confirmed":false,"source_in_out_confirmed":false,"rights_confirmed":false,"narration_synthesized":false,"provisional_srt":true,"emotion_curve":[3,3,2,3,4,3,5,5],"reference_group":"기술","foreign_opening_status":"2~4개 외국인 실음성 클립 미확보. 첫 12초 0:00-0:12 임시 배치 불가.","planned_srt":"1\n00:00:00,000 --> 00:00:10,041\n테슬라 충전소에 한국 아이오닉 파이브가 섰습니다.\n\n2\n00:00:10,041 --> 00:00:18,967\n미국 기자들은 실제 충전 시간을 재봤습니다.\n\n3\n00:00:18,967 --> 00:00:35,702\n그런데 충전기가 많아져도 속도는 달랐습니다. 같은 차에 왜 열 분 차이가 날까요.\n\n4\n00:00:35,702 --> 00:00:45,000\n이 시험의 주인공은 숫자보다 충전 조건입니다.\n\n5\n00:00:45,000 --> 00:00:52,169\n전기차 운전자의 가장 큰 걱정 중 하나는 멀리 나갔다가 충전할 곳을 찾지 못하는 상황입니다.\n\n6\n00:00:52,169 --> 00:00:58,353\n가솔린 자동차가 주유소 표지만 찾으면 어느 정도 안심할 수 있는 것과 다릅니다.\n\n7\n00:00:58,353 --> 00:01:05,944\n플러그 규격이 다르면 충전기 앞에 서 있어도 꽂지 못할 수 있고, 연결하더라도 출력이 달라집니다.\n\n8\n00:01:05,944 --> 00:01:11,707\n미국의 충전 시장에서는 테슬라의 슈퍼차저망이 큰 영향력을 가지고 있습니다.\n\n9\n00:01:11,707 --> 00:01:21,687\n현대차가 북미 시장용 아이오닉 파이브에 NACS 충전 규격을 적용한 이유는 이용할 수 있는 충전소의 범위를 넓히는 데 있습니다.\n\n10\n00:01:21,687 --> 00:01:25,060\n이것만으로도 소비자에게는 중요한 변화입니다.\n\n11\n00:01:25,060 --> 00:01:28,434\n그런데 연결만 되면 모든 문제가 해결될까요.\n\n12\n00:01:28,434 --> 00:01:34,618\n실제 속도를 확인하려면 충전기의 전압과 자동차 배터리 구조까지 살펴봐야 합니다.\n\n13\n00:01:34,618 --> 00:01:41,506\n장거리 운전자에게 중요한 것은 경로의 충전소가 실제로 열려 있고 사용할 수 있느냐입니다.\n\n14\n00:01:41,506 --> 00:01:46,426\n충전 가능한 장소가 늘어나면 이동 계획의 자유도 함께 커집니다.\n\n15\n00:01:46,426 --> 00:01:50,361\n운전자가 충전소에 들어서는 마음을 생각해 보십시오.\n\n16\n00:01:50,361 --> 00:01:55,422\n전기차를 처음 산 사람에게는 충전기 화면의 작은 글씨도 낯섭니다.\n\n17\n00:01:55,422 --> 00:02:01,888\n어디에 주차해야 하는지, 충전 단자가 맞는지, 결제는 어떻게 하는지 알아야 합니다.\n\n18\n00:02:01,888 --> 00:02:06,104\n충전이 시작된 뒤에는 몇 분이 걸릴지도 신경 쓰입니다.\n\n19\n00:02:06,104 --> 00:02:15,382\n자동차 회사가 규격을 바꾼다는 뉴스는 겉으로는 기술 이야기지만, 결국 이런 운전자의 걱정을 덜기 위한 일이기도 합니다.\n\n20\n00:02:15,382 --> 00:02:21,285\n같은 나라 안에서도 사용하는 충전기 규격이 달라 불편함이 생길 수 있습니다.\n\n21\n00:02:21,285 --> 00:02:30,000\n그러니 테슬라 충전망에 현대차가 접근할 수 있게 된 일은 브랜드 경쟁을 넘어 실제 운전자에게 중요한 변화입니다.\n\n22\n00:02:30,000 --> 00:02:36,082\n전압을 이해하기 어렵다면 물이 흐르는 배관을 떠올려 봐도 좋습니다.\n\n23\n00:02:36,082 --> 00:02:46,932\n물을 밀어내는 압력과 흐르는 양이 다르면 전달되는 에너지도 달라지듯, 전기차 충전에서도 전압과 전류가 함께 작용합니다.\n\n24\n00:02:46,932 --> 00:02:52,521\n아이오닉 파이브에는 높은 전압을 활용하는 설계가 적용됐습니다.\n\n25\n00:02:52,521 --> 00:02:58,603\n반면 많은 테슬라 V3 슈퍼차저의 작동 조건은 그 설계와 다릅니다.\n\n26\n00:02:58,603 --> 00:03:08,959\n그래서 차량이 높은 출력에 대응할 수 있다고 해도 특정 충전기에서 늘 최고 수치를 끌어낼 수 있는 것은 아닙니다.\n\n27\n00:03:08,959 --> 00:03:14,548\n성능표의 최대 숫자와 실제로 전력이 들어가는 과정은 다릅니다.\n\n28\n00:03:14,548 --> 00:03:22,932\n충전 경험을 평가할 때는 운전자에게 필요한 시간이 얼마나 걸렸는지가 더 중요할 수 있습니다.\n\n29\n00:03:22,932 --> 00:03:32,630\n고전압 배터리와 낮은 전압 충전기가 만날 때의 출력 제한은 고장이라기보다 설계 조건의 차이일 수 있습니다.\n\n30\n00:03:32,630 --> 00:03:36,740\n어떤 조건에서 느렸는지 먼저 확인해야 합니다.\n\n31\n00:03:36,740 --> 00:03:44,137\n전압을 물의 압력에 비유하는 설명은 이해를 돕지만 모든 것을 설명하지는 못합니다.\n\n32\n00:03:44,137 --> 00:03:52,027\n실제 충전에서는 자동차 내부의 회로와 배터리 상태를 관리하는 시스템도 함께 움직입니다.\n\n33\n00:03:52,027 --> 00:03:59,425\n어떤 충전기는 같은 차에 연결해도 최대 출력이 다른 충전기보다 낮을 수 있습니다.\n\n34\n00:03:59,425 --> 00:04:06,164\n이것이 자동차의 설계가 나쁘다는 뜻도, 충전기가 고장났다는 뜻도 아닙니다.\n\n35\n00:04:06,164 --> 00:04:15,205\n서로 다른 전압 범위에서 작동하도록 만들어진 기술이 만나면 어떤 제한이 발생하는지 이해해야 합니다.\n\n36\n00:04:15,205 --> 00:04:22,767\n서로 다른 기기의 협력이 필요한 시대에는 이런 호환성의 문제가 예상보다 중요합니다.\n\n37\n00:04:22,767 --> 00:04:30,000\n차량을 잘 만드는 것만큼 남이 만든 시설과 잘 연결하는 능력이 경쟁력이 됩니다.\n\n38\n00:04:30,000 --> 00:04:33,794\n여기서 한 가지 더 눈여겨볼 것이 있습니다.\n\n39\n00:04:33,794 --> 00:04:38,538\n충전은 처음부터 끝까지 같은 속도로 진행되지 않습니다.\n\n40\n00:04:38,538 --> 00:04:46,443\n배터리의 남은 용량과 온도, 차량이 배터리를 보호하는 방식에 따라 속도가 계속 달라집니다.\n\n41\n00:04:46,443 --> 00:04:55,771\n그래서 누군가 충전 화면에서 순간적으로 높은 숫자를 봤다고 해서 전체 충전이 빨랐다고 단정하기 어렵습니다.\n\n42\n00:04:55,771 --> 00:05:03,834\n비슷한 차종이라도 겨울의 차가운 배터리와 충분히 예열된 배터리는 결과가 달라질 수 있습니다.\n\n43\n00:05:03,834 --> 00:05:10,158\n미국의 기자들이 충전 조건을 구체적으로 설명하는 이유도 여기에 있습니다.\n\n44\n00:05:10,158 --> 00:05:19,012\n몇 킬로와트를 찍었느냐보다 시작과 끝의 충전 비율, 걸린 시간을 함께 비교해야 공정한 평가가 됩니다.\n\n45\n00:05:19,012 --> 00:05:24,862\n결국 충전 규격은 편의의 문제이고 출력은 물리적 조건의 문제입니다.\n\n46\n00:05:24,862 --> 00:05:31,344\n최대 출력만 표시한 광고 화면과 전체 충전 시간은 분리해서 다뤄야 합니다.\n\n47\n00:05:31,344 --> 00:05:38,775\n배터리 잔량 구간마다 전력이 달라지므로 단일 수치로 경험 전체를 요약할 수 없습니다.\n\n48\n00:05:38,775 --> 00:05:43,834\n배터리 충전율을 퍼센트로 보여 주는 화면을 떠올려 봅니다.\n\n49\n00:05:43,834 --> 00:05:49,684\n처음에는 숫자가 빠르게 오르다가 어느 구간부터 느려질 수 있습니다.\n\n50\n00:05:49,684 --> 00:05:55,059\n이 변화에는 배터리 온도와 안전을 관리하는 절차가 포함됩니다.\n\n51\n00:05:55,059 --> 00:06:05,020\n자동차 기자들이 십 퍼센트에서 구십 퍼센트까지 같은 구간을 비교하는 이유는 시작과 끝을 명확히 하기 위해서입니다.\n\n52\n00:06:05,020 --> 00:06:13,874\n다른 회사가 오 퍼센트에서 팔십 퍼센트까지 걸린 시간을 제시했다면 똑같은 시험이라고 보기 어렵습니다.\n\n53\n00:06:13,874 --> 00:06:18,775\n충전 그래프에서 최고로 높았던 한 점이 전부는 아닙니다.\n\n54\n00:06:18,775 --> 00:06:25,257\n운전자가 실제로 기다린 전체 시간이 그 경험을 더 잘 설명할 수 있습니다.\n\n55\n00:06:25,257 --> 00:06:30,000\n그래서 기술 시험에서는 작은 조건 하나까지 중요합니다.\n\n56\n00:06:30,000 --> 00:06:35,054\n첫 번째 반전은 실제 시험 수치에서 나옵니다.\n\n57\n00:06:35,054 --> 00:06:46,375\n미국 카앤드라이버는 2025년형 아이오닉 파이브를 충전율 십 퍼센트에서 구십 퍼센트까지 시험했습니다.\n\n58\n00:06:46,375 --> 00:06:58,908\n테슬라의 사백 볼트급 슈퍼차저에서는 약 사십 분, 팔백 볼트급 다른 급속 충전기에서는 약 삼십 분이 걸렸습니다.\n\n59\n00:06:58,908 --> 00:07:12,453\n이 결과는 테슬라 충전망을 쓸 수 있게 된 편리함과 모든 충전소에서 같은 속도를 내는 것이 별개라는 사실을 보여 줍니다.\n\n60\n00:07:12,453 --> 00:07:21,954\n한국 차가 테슬라 충전소에 갔으니 언제나 더 빨라야 한다는 주장은 성립하지 않습니다.\n\n61\n00:07:21,954 --> 00:07:30,040\n동시에 사십 분이 나왔다고 해서 기술이 쓸모없다는 평가도 맞지 않습니다.\n\n62\n00:07:30,040 --> 00:07:36,509\n어느 조건에서 무엇을 얻고 잃었는지 봐야 하기 때문입니다.\n\n63\n00:07:36,509 --> 00:07:46,213\n미국 카앤드라이버의 40분과 30분은 같은 차량의 특정 충전 조건을 비교한 결과입니다.\n\n64\n00:07:46,213 --> 00:07:53,491\n국가와 연식, 충전기 버전이 달라지면 시간도 달라질 수 있습니다.\n\n65\n00:07:53,491 --> 00:08:03,194\n미국 카앤드라이버의 결과를 들으면 누구나 먼저 열 분의 차이에 눈길이 갈 수 있습니다.\n\n66\n00:08:03,194 --> 00:08:11,280\n하지만 서로 다른 충전기의 전압 조건을 확인하는 순간 의미가 달라집니다.\n\n67\n00:08:11,280 --> 00:08:19,164\n한국 차가 테슬라 충전소에서 충전됐다는 사실 자체는 중요한 변화입니다.\n\n68\n00:08:19,164 --> 00:08:26,442\n같은 차가 다른 시설에서는 더 빨리 충전된다는 결과도 중요합니다.\n\n69\n00:08:26,442 --> 00:08:36,348\n어느 한쪽을 버리고 기사 제목을 자극적으로 만들면 운전자가 알아야 할 정보가 사라집니다.\n\n70\n00:08:36,348 --> 00:08:46,456\n같은 차량을 놓고 한쪽은 사십 분, 다른 쪽은 삼십 분이 걸렸다는 사실이 더 또렷해집니다.\n\n71\n00:08:46,456 --> 00:08:52,520\n물론 두 숫자에는 각각 다른 충전 조건이 따라붙습니다.\n\n72\n00:08:52,520 --> 00:09:00,000\n이 차이는 승리와 패배보다 충전 환경을 이해하는 문제에 가깝습니다.\n\n73\n00:09:00,000 --> 00:09:07,143\n미국 전기차 전문매체 인사이드이브이스도 같은 문제를 짚었습니다.\n\n74\n00:09:07,143 --> 00:09:19,592\n자동차가 높은 전압을 사용하도록 설계돼도 충전 설비의 실제 전압 때문에 속도 차이가 생길 수 있다는 것입니다.\n\n75\n00:09:19,592 --> 00:09:25,306\n이 문제를 알면 충전소를 고르는 방식도 달라집니다.\n\n76\n00:09:25,306 --> 00:09:34,286\n장거리 운전에서는 충전기를 꼭 최고 출력 제품만 찾을 필요가 없을 수 있습니다.\n\n77\n00:09:34,286 --> 00:09:44,082\n쉬는 시간 동안 충분히 충전할 수 있는 곳이 운전자에게 더 좋은 선택일 때도 있습니다.\n\n78\n00:09:44,082 --> 00:09:56,122\n다른 날씨, 다른 시작 충전량, 다른 충전기 버전에서 얻은 기록을 하나의 순위표로 만들면 오류가 생깁니다.\n\n79\n00:09:56,122 --> 00:10:08,776\n해외 전문가의 시험이 가치 있는 것은 한국 차를 칭찬했기 때문만이 아니라 정확한 조건을 보여 주었기 때문입니다.\n\n80\n00:10:08,776 --> 00:10:16,327\n기자가 불리한 결과를 공개했다고 한국 차를 비난하는 것은 아닙니다.\n\n81\n00:10:16,327 --> 00:10:24,490\n제품의 장점과 제약을 같이 설명할 때 독자는 스스로 판단할 수 있습니다.\n\n82\n00:10:24,490 --> 00:10:35,918\n한 기자가 제품의 단점까지 설명한다는 것은 독자를 위해 그만큼 구체적인 상황을 기록했다는 의미입니다.\n\n83\n00:10:35,918 --> 00:10:49,592\n충전기가 고장 났는지, 차량 내부 설계의 전압 조건 때문인지, 외부 기온 때문인지 구분해 봐야 소비자에게 도움이 됩니다.\n\n84\n00:10:49,592 --> 00:10:58,571\n이런 시험은 한국 브랜드에 대한 호불호를 넘어 기술의 실제 모습을 보여 줍니다.\n\n85\n00:10:58,571 --> 00:11:10,204\n흥미로운 점은 자동차 산업이 점점 혼자 잘하는 기술보다 함께 잘 작동하는 기술을 요구한다는 사실입니다.\n\n86\n00:11:10,204 --> 00:11:20,204\n충전소 운영사와 자동차 회사, 결제 서비스가 서로 맞지 않으면 운전자는 불편을 겪습니다.\n\n87\n00:11:20,204 --> 00:11:30,000\n좋은 차를 만드는 일과 이용하기 쉬운 환경을 만드는 일이 하나의 경쟁이 되고 있습니다.\n\n88\n00:11:30,000 --> 00:11:40,720\n두 번째 반전은 충전 속도와 충전망 접근성이 서로 다른 경쟁력이라는 점입니다.\n\n89\n00:11:40,720 --> 00:11:51,939\n차량 회사가 충전 규격을 바꾸면 기존보다 많은 장소에서 충전할 가능성이 열립니다.\n\n90\n00:11:51,939 --> 00:12:03,657\n반면 자동차의 배터리 설계와 충전기의 기술적 조건까지 한꺼번에 바뀌는 것은 아닙니다.\n\n91\n00:12:03,657 --> 00:12:11,634\n두 가지를 함께 보아야 진짜 편리함을 판단할 수 있습니다.\n\n92\n00:12:11,634 --> 00:12:21,607\n자동차 기술은 종종 최고 속도 한 번으로 승패가 갈리는 것처럼 보입니다.\n\n93\n00:12:21,607 --> 00:12:40,055\n하지만 매일 출퇴근하는 사람에게는 고장 없이 쓸 수 있는 충전기와 안내 화면, 결제 방식, 기다리는 시간이 더 중요할 수도 있습니다.\n\n94\n00:12:40,055 --> 00:12:52,022\n좋은 기술은 멋진 숫자가 아니라 생활 속에서 반복해서 믿을 수 있는 경험으로 남습니다.\n\n95\n00:12:52,022 --> 00:13:07,729\n하루에 필요한 주행거리가 짧은 운전자에게는 한 번의 최고 속도보다 동네 충전소의 접근성이 더 중요할 수 있습니다.\n\n96\n00:13:07,729 --> 00:13:14,460\n기술 경쟁의 질문을 소비자 생활로 옮겨야 합니다.\n\n97\n00:13:14,460 --> 00:13:25,429\n자동차 경쟁을 나라 대 나라의 자존심 싸움으로만 만들면 놓치는 부분이 있습니다.\n\n98\n00:13:25,429 --> 00:13:39,391\n미국 소비자가 어느 충전소를 골라야 하는지, 장거리 여행을 어떻게 계획하는지라는 현실적인 고민입니다.\n\n99\n00:13:39,391 --> 00:13:52,604\n예컨대 빠른 충전기가 멀리 있고 조금 느린 충전기가 바로 옆에 있다면 어느 쪽이 더 편리할까요.\n\n100\n00:13:52,604 --> 00:13:59,335\n답은 이동 경로와 남은 배터리에 따라 달라집니다.\n\n101\n00:13:59,335 --> 00:14:08,310\n전기차 기술의 실제 가치는 실험실의 숫자만으로 완성되지 않습니다.\n\n102\n00:14:08,310 --> 00:14:17,784\n많은 운전자가 다양한 환경에서 반복해서 사용할 때 모습을 드러냅니다.\n\n103\n00:14:17,784 --> 00:14:30,000\n한국 제품이 세계 시장에서 선택받으려면 이런 일상의 질문에도 좋은 답을 내놓아야 합니다.\n\n104\n00:14:30,000 --> 00:14:37,719\n한국 자동차 산업은 한때 남의 기술을 배우고 따라가는 처지였습니다.\n\n105\n00:14:37,719 --> 00:14:48,776\n이제 미국의 전문 매체가 한국 전기차를 실제로 시험하며 충전망과 전압 구조의 차이를 분석합니다.\n\n106\n00:14:48,776 --> 00:14:54,200\n모든 시험 결과가 한국에 유리한 것은 아닙니다.\n\n107\n00:14:54,200 --> 00:15:04,214\n오히려 솔직한 장단점이 드러날수록 소비자는 어떤 차가 자신에게 맞는지 알 수 있습니다.\n\n108\n00:15:04,214 --> 00:15:07,344\n처음의 장면으로 돌아갑니다.\n\n109\n00:15:07,344 --> 00:15:19,861\n현대차가 테슬라 충전소에 들어간 이유는 단순히 상대 회사의 장비 앞에서 승리를 선언하려는 것이 아니었습니다.\n\n110\n00:15:19,861 --> 00:15:26,745\n더 많은 길 위에서 운전자의 선택지를 넓히려는 변화였습니다.\n\n111\n00:15:26,745 --> 00:15:37,594\n한국의 기술이 해외의 시험을 받는 시대, 그 시험에서 배울 것을 배우는 태도까지 경쟁력입니다.\n\n112\n00:15:37,594 --> 00:15:47,816\n한국이 기술을 만드는 나라가 됐다는 의미는 검증받을 용기를 갖게 됐다는 뜻이기도 합니다.\n\n113\n00:15:47,816 --> 00:15:53,658\n실측값으로 부족함을 알 때 다음 설계도 개선됩니다.\n\n114\n00:15:53,658 --> 00:16:00,542\n한국 자동차를 낮게 보던 시절을 기억하는 사람들이 있습니다.\n\n115\n00:16:00,542 --> 00:16:10,556\n한국 차가 해외의 전문 테스트에서 주요 비교 대상이 된 지금의 모습은 분명 변화입니다.\n\n116\n00:16:10,556 --> 00:16:19,527\n하지만 위상을 인정받기 위해 모든 시험에서 일 등을 해야 하는 것은 아닙니다.\n\n117\n00:16:19,527 --> 00:16:28,707\n장단점을 솔직하게 보여 주고 불편함을 하나씩 개선하는 기술이 오래 살아남습니다.\n\n118\n00:16:28,707 --> 00:16:36,426\n해외 기자의 실측이 우리에게 반갑게 느껴지는 이유도 여기 있습니다.\n\n119\n00:16:36,426 --> 00:16:47,691\n외국에서 한국 차를 직접 운전하고 충전하고 자신의 돈과 시간을 기준으로 평가하는 시대가 됐습니다.\n\n120\n00:16:47,691 --> 00:17:00,000\n한 번의 충전 기록에 승패를 모두 걸지 않아도, 그 변화 자체가 오래 쌓아 온 산업의 시간을 보여 줍니다.\n","cuts":[{"shot":"S01","output_start":"00:00:00","output_end":"00:00:25","beat":"1","narration_prompt":"테슬라 충전소에 한국 아이오닉 파이브가 섰습니다.","visual":"권리 확인된 실제 외국인 호평 클립 1~4초 2~4개가 확보될 때만 배치; 기본 상태는 승인 대기","source_candidates":"https://www.caranddriver.com/news/a64410159/2025-hyundai-ioniq-5-nacs-port-charging-test/; https://insideevs.com/news/751308/hyundai-charging-tesla-v3-interview/","foreign_clip_id":"미확정","source_IN":"","source_OUT":"","source_audio_status":"UNVERIFIED","rights":"NOT_CLEARED","overlay":"외국인 실제 발언 (확인 전 빈칸)","emotion":"3","note":"4초 이하 컷은 목표, 저작권 보장 아님"},{"shot":"S02","output_start":"00:00:25","output_end":"00:00:50","beat":"1","narration_prompt":"그런데 충전기가 많아져도 속도는 달랐습니다.","visual":"권리 확인된 실제 외국인 호평 클립 1~4초 2~4개가 확보될 때만 배치; 기본 상태는 승인 대기","source_candidates":"https://www.caranddriver.com/news/a64410159/2025-hyundai-ioniq-5-nacs-port-charging-test/; https://insideevs.com/news/751308/hyundai-charging-tesla-v3-interview/","foreign_clip_id":" stion":"새 배터리보다 폐배터리가 중요한 이유는?"},{"t":"02:30–04:30","text":"재활용 공정 단계별 추적","question":"버려진 배터리 안에는 무엇이 남는가?"},{"t":"04:30–06:30","text":"금속 회수량과 가격","question":"회수한 금속은 정말 값어치가 있을까?"},{"t":"06:30–09:00","text":"1차 반전 · 배터리 화학 차이","question":"1차 반전: 수익성은 회수율뿐 아니라 배터리 화학에 달린다."},{"t":"09:00–11:30","text":"연구의 경제성·환경 지표","question":"해외 연구가 제기한 비용·환경 쟁점은?"},{"t":"11:30–14:30","text":"2차 반전 · 글로벌 규모 차이","question":"2차 반전: 중국의 재활용 규모와 한국의 전략은 다르다."},{"t":"14:30–17:00","text":"한국의 가능성과 숙제","question":"희망만이 아닌 수치·제약을 담아 미래 산업 기회로 회수한다."}],"hooks":["해외 연구자 인터뷰나 국제기구 평가 원음을 확인해 배치한다.","새 배터리보다 폐배터리가 중요한 이유는?","버려진 배터리 안에는 무엇이 남는가?","회수한 금속은 정말 값어치가 있을까?","1차 반전: 수익성은 회수율뿐 아니라 배터리 화학에 달린다.","해외 연구가 제기한 비용·환경 쟁점은?","2차 반전: 중국의 재활용 규모와 한국의 전략은 다르다.","희망만이 아닌 수치·제약을 담아 미래 산업 기회로 회수한다."],"source_links":[["국제에너지기구 IEA","2026","재활용 원료는 당분간 제조 스크랩 중심, 폐전기차 배터리 주요 공급은 2030년대 중반 이후","https://www.iea.org/reports/global-ev-outlook-2026/electric-vehicle-batteries","국제연구"],["국제에너지기구 IEA","2026","중국의 높은 회수 역량 집중과 중국 밖 한국의 소재 회수 역할","https://www.iea.org/reports/global-critical-minerals-outlook-2026/executive-summary","국제연구"]],"correction":"현재 폐배터리 대량 발생·한국 세계1위 주장 금지. 원료 공급은 2030년대 중반부터 증가 예상.","parts":["전기차 배터리를 버리면 귀한 자원도 끝날까요. 국제에너지기구는 다른 가능성을 제시합니다. 한국도 그 회수 기술 경쟁에 참여하고 있습니다. 그런데 재활용 공장의 주원료는 아직 예상과 다릅니다. 첫 반전은 새 차와 폐차 사이의 시간입니다.","전기차가 거리를 달릴 때 배터리 안의 금속이 눈에 보이지는 않습니다. 하지만 리튬과 니켈, 코발트 같은 원료를 확보하고 정제하는 산업이 뒤에서 돌아갑니다. 배터리는 완성차 공장에서 조립되는 마지막 순간에 갑자기 만들어지지 않습니다. 광산과 제련소, 소재 공장, 셀 제조 공장을 거칩니다. 한국의 배터리 기업들이 세계 시장에서 중요한 역할을 하게 된 것도 이 복잡한 연결망 속에서였습니다. 그런데 원료를 대부분 해외에서 들여와야 하는 현실은 여전히 부담입니다. 그래서 한번 사용한 금속을 다시 얻는 기술은 단순한 환경 캠페인이 아니라 공급망을 지키는 방법으로 논의됩니다. 문제는 이 방법이 언제부터 충분한 양을 제공할 수 있느냐는 것입니다.\n\n전기차 배터리는 광산부터 자동차까지 여러 단계를 거칩니다. 원료를 반복 사용한다면 해외 공급망의 불안을 일부 줄일 수 있을 것입니다.\n\n배터리를 다시 만드는 과정을 생각하면 새로운 자원 산업의 모습이 보입니다. 과거에는 광산에서 금속을 캐고 배에 실어 공장으로 보내는 흐름이 익숙했습니다. 앞으로는 이미 만들어진 제품을 안전하게 모으고 처리해 다시 소재로 만드는 흐름이 더 중요해질 수 있습니다. 하지만 그 과정에서도 물류와 에너지 비용이 들어가고 새로운 폐기물이 생길 수 있습니다. 자원을 다시 쓴다는 문장 하나로 모든 환경 문제가 해결되는 것은 아닙니다. 어떤 방식으로 회수했을 때 실제로 원료와 에너지를 아낄 수 있는지 측정해야 합니다. 자원을 거의 갖지 못한 나라가 자원 산업에 관심을 기울이는 이유는 이런 어려운 계산 속에 있습니다.","사용이 끝난 배터리를 모았다고 모든 금속을 곧바로 얻을 수 있는 것은 아닙니다. 안전하게 방전하고 분해하고, 원료가 섞인 물질을 처리하고, 다시 제품에 쓸 수 있는 순도로 정제해야 합니다. 이 과정에는 설비와 전기, 화학약품, 숙련된 인력이 필요합니다. 금속을 많이 회수하는 기술이 있어도 처리 비용이 너무 크면 사업은 흔들립니다. 배터리 종류에 따라 들어 있는 금속 자체가 다르다는 점도 중요합니다. 니켈과 코발트가 많이 들어간 제품과 리튬인산철 제품은 회수할 때의 경제성이 똑같지 않습니다. 그래서 폐배터리는 막연히 귀금속 덩어리라고 부르기보다 정확히 무엇이 얼마나 들어 있는지 먼저 확인해야 합니다.\n\n배터리의 소재가 다르면 회수할 만한 금속도 달라집니다. 혼합물을 안전하게 다루는 기술은 재료공학뿐 아니라 환경관리와 연결됩니다.\n\n배터리에서 나온 금속이 다시 좋은 배터리의 재료로 돌아오려면 품질을 맞춰야 합니다. 회수율이 높다는 말은 투입한 금속의 몇 퍼센트를 다시 얻었다는 뜻일 수 있지만, 그 금속의 순도가 제품의 품질을 보장하는 것은 아닙니다. 새로운 배터리 공장에서는 작은 불순물도 문제가 될 수 있습니다. 따라서 회수하는 기술과 정제하는 기술, 검사하는 기술이 함께 필요합니다. 한국 산업이 이런 부분에 강점을 만들려면 연구실의 성공을 반복 가능한 공정으로 바꾸어야 합니다. 실험용으로 한 번 성공한 것과 대량 공장에서 경제적으로 운영하는 것은 다른 일입니다. 경쟁은 바로 그 차이에서 갈릴 수 있습니다.","재활용 산업의 경제성을 판단할 때에는 금속의 국제 가격도 중요한 변수입니다. 광물 가격이 오르면 회수하는 금속의 가치가 커질 수 있습니다. 반대로 가격이 내려가면 같은 공정을 돌려도 이익이 줄어듭니다. 배터리를 모아오는 비용과 위험물 운송 규정도 무시하기 어렵습니다. 새 배터리를 만드는 공장의 불량품과 자투리는 상대적으로 성분과 이력이 잘 알려져 있습니다. 반면 여러 해 동안 사용한 배터리는 남은 상태가 제각각입니다. 이것이 현재 재활용 산업에 생산 공정에서 나온 스크랩이 중요한 이유입니다. 한때 쓸모없어 보였던 자투리가 기술과 품질 관리의 시험장이 된 것입니다.\n\n금속 가격과 회수비용은 같은 방향으로 움직이지 않습니다. 원료값이 내려가면 좋은 기술을 가진 공장도 수익을 내기 어려울 수 있습니다.\n\n배터리의 종류가 바뀌는 현상도 산업의 시간을 바꿉니다. 어떤 제품은 코발트가 많이 필요하지만 어떤 제품은 코발트 사용을 줄입니다. 재활용 업체가 투자한 설비가 미래의 소재 구성과 잘 맞지 않으면 수익성이 달라질 수 있습니다. 따라서 오늘 가장 비싼 금속을 회수하는 데만 초점을 맞추는 것은 위험합니다. 앞으로 어떤 배터리가 많이 만들어지고 얼마나 오래 사용될지 살펴봐야 합니다. 시장의 변화가 빠를수록 기술은 한 종류의 소재만 처리하는 방식에서 유연함을 요구받을 수 있습니다. 이런 문제를 잘 다루는 업체가 세계 시장에서 살아남을 가능성이 커집니다. 자원 순환은 화학의 문제이면서 장기 전망의 문제이기도 합니다.","첫 번째 반전은 시간표에서 드러납니다. IEA의 2026년 보고서는 사용이 끝난 전기차 배터리가 재활용 원료의 중심이 되는 시점을 대체로 2030년대 중반 이후로 봅니다. 많은 전기차가 아직 도로 위를 달리고 있기 때문입니다. 새로 팔린 전기차가 많다는 뉴스와 올해 폐배터리가 넘쳐난다는 주장은 동시에 성립하지 않을 수 있습니다. 몇 년 동안 살아서 일하는 배터리를 이미 폐기물로 계산하면 시장 규모가 부풀려집니다. 이 시간 차이는 미래 수요를 기다리는 기업에게 위험이자 기회입니다. 물량이 많아질 때를 준비하되 그 전에 공장이 멈추지 않도록 운영해야 합니다.\n\nIEA의 핵심 메시지는 오늘 팔린 배터리와 오늘 버려지는 배터리가 같지 않다는 것입니다. 산업의 시간표는 판매량 그래프와 별도로 그려야 합니다.\n\n새로 팔리는 전기차 수를 보고 십 년 뒤 폐배터리 물량을 그대로 계산하고 싶은 유혹이 있습니다. 하지만 실제 자동차는 구매자가 바뀌고 나라를 넘어 중고로 팔리며 배터리도 예상보다 오래 쓰일 수 있습니다. 일부 배터리는 안전성 검사를 거쳐 다른 용도로 재사용될 가능성도 있습니다. 반면 사고나 고장으로 일찍 처리되는 배터리도 있습니다. 이런 다양한 경로를 무시하고 판매량에서 일정 비율을 곧바로 폐기량으로 계산하면 재활용 공장의 공급 전망이 잘못됩니다. IEA가 생산 스크랩과 사용 후 배터리를 분리해서 설명하는 이유도 여기에 있습니다. 산업의 미래를 정확히 보려면 기술보다 먼저 시간과 물량의 현실을 보아야 합니다.","세계 재활용 산업은 중국의 비중이 매우 큽니다. IEA는 중국에 전 세계 배터리 재활용 처리 역량의 상당 부분이 집중돼 있다고 분석합니다. 2026년 국제 핵심광물 전망은 중국 밖에서 한국이 물질 회수 분야의 주요 사업자라고 설명합니다. 하지만 한국이 중국 전체를 이미 추월했다는 뜻은 아닙니다. 오히려 중국의 압도적인 규모 사이에서 한국이 어떤 기술과 공급망을 확보해야 하는지 보여 주는 자료입니다. 재활용은 금속을 다시 꺼내는 데서 끝나지 않습니다. 회수된 원료가 다시 배터리 제조에 쓸 수 있을 정도의 안정된 품질을 갖춰야 합니다. 공정을 반복해도 품질 편차가 작아야 세계 고객이 믿고 주문할 수 있습니다.\n\n중국의 압도적 규모는 인정해야 합니다. 한국의 역할은 중국 밖 회수 기술과 공급망을 확대할 가능성에서 찾을 수 있습니다.\n\n한국이 세계에서 중요한 배터리 제조국 가운데 하나라는 사실과 재활용 분야에서 세계 일 위라는 주장은 다릅니다. IEA의 2026년 자료는 중국에 재활용 처리 능력이 크게 집중돼 있다고 분명히 설명합니다. 중국이 가진 압도적인 규모를 무시할 수 없습니다. 그러나 규모가 전부라면 다른 나라의 기회는 아예 없을 것입니다. 실제로 국제기구는 한국과 일본 등의 기술과 소재 공급망이 다변화에 도움이 될 수 있다고 분석합니다. 한국의 기회는 다른 나라를 과장해서 깎아내리는 데 있지 않습니다. 신뢰할 수 있는 회수 품질과 안정적인 공급망을 구축하는 일에서 찾을 수 있습니다. 그런 전망은 크고 화려한 말보다 구체적인 공정과 수치로 설명해야 합니다.","두 번째 반전은 회수할 배터리가 예상보다 늦게 나온다는 점입니다. 사용한 전기차가 다른 나라로 중고차로 수출되거나, 배터리를 교체하지 않고 수리해 더 오래 쓰는 경우가 있습니다. 에너지저장장치로 재사용할 수도 있지만 안전과 보증, 비용 문제가 따라옵니다. 이 경우 배터리가 처음 판매된 나라의 재활용 공장으로 돌아오지 않을 수도 있습니다. 따라서 국가별 폐배터리 물량은 전기차 판매량에 비례해 자동으로 쌓이지 않습니다. 기업은 원료 확보 계약, 운송망, 추적 시스템을 갖춰야 합니다. 여기서 승부를 가르는 것은 화려한 회수율 한 줄이 아니라 공급망 전체를 관리하는 능력입니다.\n\n중고차가 다른 나라로 이동하면 배터리도 함께 이동합니다. 처음에 판매된 국가의 자원 회수량을 그대로 미래 자원으로 계산할 수 없습니다.\n\n재활용 공장을 만드는 데만 집중하면 배터리가 어디서 들어올지 놓칠 수 있습니다. 기업이 아무리 좋은 시설을 갖추어도 처리할 물량이 부족하면 가동률이 낮아집니다. 반대로 예상보다 많은 폐배터리가 한꺼번에 들어오면 안전한 보관과 처리가 어려울 수 있습니다. 배터리는 일반 종이 상자처럼 아무 창고에 쌓아 두는 제품이 아닙니다. 운송과 보관의 안전을 확인해야 합니다. 그래서 원료를 수거하는 회사와 자동차 제조사, 배터리 제조사, 재활용 시설 사이의 장기 계약이 중요해집니다. 이 연결망은 눈에 보이지 않지만 산업의 성패를 가르는 기반입니다. 자원 재활용은 사용이 끝난 물건에 새로운 순서를 부여하는 일이기도 합니다.","우리 부모 세대는 자원이 부족한 나라에서 공업을 키웠습니다. 필요한 것을 해외에서 들여오고 아껴 쓰며 새로운 기술을 배워야 했습니다. 지금도 자원의 문제는 끝나지 않았습니다. 달라진 것은 우리가 버려지는 금속을 다시 쓰기 위한 공정과 기술을 만드는 위치에 서 있다는 점입니다. 한국의 기회가 크다고 해서 모든 공장이 성공한다는 뜻은 아닙니다. 실패 위험을 인정하고 원료의 흐름과 기술을 검증하는 기업이 남을 것입니다. 처음의 질문으로 돌아갑니다. 낡은 배터리는 쓰레기일까요. 정답은 아직 한 단어로 정해져 있지 않습니다. 어떤 기술과 제도로 다루느냐에 따라 다음 산업의 자원이 될 수도 있습니다.\n\n자원이 부족한 나라가 다시 쓰는 기술에 투자하는 일은 단순한 절약을 넘어 산업의 선택지를 넓히는 일입니다.\n\n몇십 년 전 우리 부모 세대는 자원이 없는 나라에서 공장을 짓는 일이 쉽지 않다는 사실을 누구보다 잘 알았습니다. 값비싼 원료를 해외에서 들여와 제품을 만들어 수출해야 했습니다. 지금 한국이 다시 쓰는 기술에 투자하는 모습은 그 역사와 묘하게 이어집니다. 과거에는 부족한 것을 어떻게 구할지 고민했다면 앞으로는 이미 사용한 것에서 무엇을 다시 얻을지 고민합니다. 물론 회수 기술이 광산의 필요를 하루아침에 없애 주지는 않을 것입니다. 하지만 기술과 제도를 쌓으면 새로운 선택지가 생깁니다. 처음 버려진 배터리를 보며 던졌던 질문은 이제 조금 달라집니다. 우리에게 부족했던 자원을 다시 쓰게 하는 능력, 그 능력은 다음 세대를 위한 새로운 산업의 기초가 될 수 있습니다."],"duration_target_sec":1020,"duration_measured_sec":null,"narration_chars":5421,"source_audio_confirmed":false,"source_in_out_confirmed":false,"rights_confirmed":false,"narration_synthesized":false,"provisional_srt":true,"emotion_curve":[3,3,2,3,4,3,5,5],"reference_group":"기술","foreign_opening_status":"2~4개 외국인 실음성 클립 미확보. 첫 12초 0:00-0:12 임시 배치 불가.","planned_srt":"1\n00:00:00,000 --> 00:00:08,858\n전기차 배터리를 버리면 귀한 자원도 끝날까요.\n\n2\n00:00:08,858 --> 00:00:17,008\n국제에너지기구는 다른 가능성을 제시합니다.\n\n3\n00:00:17,008 --> 00:00:26,220\n한국도 그 회수 기술 경쟁에 참여하고 있습니다.\n\n4\n00:00:26,220 --> 00:00:36,496\n그런데 재활용 공장의 주원료는 아직 예상과 다릅니다.\n\n5\n00:00:36,496 --> 00:00:45,000\n첫 반전은 새 차와 폐차 사이의 시간입니다.\n\n6\n00:00:45,000 --> 00:00:50,278\n전기차가 거리를 달릴 때 배터리 안의 금속이 눈에 보이지는 않습니다.\n\n7\n00:00:50,278 --> 00:00:56,806\n하지만 리튬과 니켈, 코발트 같은 원료를 확보하고 정제하는 산업이 뒤에서 돌아갑니다.\n\n8\n00:00:56,806 --> 00:01:02,639\n배터리는 완성차 공장에서 조립되는 마지막 순간에 갑자기 만들어지지 않습니다.\n\n9\n00:01:02,639 --> 00:01:06,806\n광산과 제련소, 소재 공장, 셀 제조 공장을 거칩니다.\n\n10\n00:01:06,806 --> 00:01:14,444\n한국의 배터리 기업들이 세계 시장에서 중요한 역할을 하게 된 것도 이 복잡한 연결망 속에서였습니다.\n\n11\n00:01:14,444 --> 00:01:19,861\n그런데 원료를 대부분 해외에서 들여와야 하는 현실은 여전히 부담입니다.\n\n12\n00:01:19,861 --> 00:01:28,333\n그래서 한번 사용한 금속을 다시 얻는 기술은 단순한 환경 캠페인이 아니라 공급망을 지키는 방법으로 논의됩니다.\n\n13\n00:01:28,333 --> 00:01:33,611\n문제는 이 방법이 언제부터 충분한 양을 제공할 수 있느냐는 것입니다.\n\n14\n00:01:33,611 --> 00:01:38,056\n전기차 배터리는 광산부터 자동차까지 여러 단계를 거칩니다.\n\n15\n00:01:38,056 --> 00:01:43,750\n원료를 반복 사용한다면 해외 공급망의 불안을 일부 줄일 수 있을 것입니다.\n\n16\n00:01:43,750 --> 00:01:49,444\n배터리를 다시 만드는 과정을 생각하면 새로운 자원 산업의 모습이 보입니다.\n\n17\n00:01:49,444 --> 00:01:55,417\n과거에는 광산에서 금속을 캐고 배에 실어 공장으로 보내는 흐름이 익숙했습니다.\n\n18\n00:01:55,417 --> 00:02:03,611\n앞으로는 이미 만들어진 제품을 안전하게 모으고 처리해 다시 소재로 만드는 흐름이 더 중요해질 수 있습니다.\n\n19\n00:02:03,611 --> 00:02:10,278\n하지만 그 과정에서도 물류와 에너지 비용이 들어가고 새로운 폐기물이 생길 수 있습니다.\n\n20\n00:02:10,278 --> 00:02:15,972\n자원을 다시 쓴다는 문장 하나로 모든 환경 문제가 해결되는 것은 아닙니다.\n\n21\n00:02:15,972 --> 00:02:22,361\n어떤 방식으로 회수했을 때 실제로 원료와 에너지를 아낄 수 있는지 측정해야 합니다.\n\n22\n00:02:22,361 --> 00:02:30,000\n자원을 거의 갖지 못한 나라가 자원 산업에 관심을 기울이는 이유는 이런 어려운 계산 속에 있습니다.\n\n23\n00:02:30,000 --> 00:02:37,303\n사용이 끝난 배터리를 모았다고 모든 금속을 곧바로 얻을 수 있는 것은 아닙니다.\n\n24\n00:02:37,303 --> 00:02:47,261\n안전하게 방전하고 분해하고, 원료가 섞인 물질을 처리하고, 다시 제품에 쓸 수 있는 순도로 정제해야 합니다.\n\n25\n00:02:47,261 --> 00:02:53,071\n이 과정에는 설비와 전기, 화학약품, 숙련된 인력이 필요합니다.\n\n26\n00:02:53,071 --> 00:03:00,207\n금속을 많이 회수하는 기술이 있어도 처리 비용이 너무 크면 사업은 흔들립니다.\n\n27\n00:03:00,207 --> 00:03:06,515\n배터리 종류에 따라 들어 있는 금속 자체가 다르다는 점도 중요합니다.\n\n28\n00:03:06,515 --> 00:03:14,979\n니켈과 코발트가 많이 들어간 제품과 리튬인산철 제품은 회수할 때의 경제성이 똑같지 않습니다.\n\n29\n00:03:14,979 --> 00:03:25,104\n그래서 폐배터리는 막연히 귀금속 덩어리라고 부르기보다 정확히 무엇이 얼마나 들어 있는지 먼저 확인해야 합니다.\n\n30\n00:03:25,104 --> 00:03:30,083\n배터리의 소재가 다르면 회수할 만한 금속도 달라집니다.\n\n31\n00:03:30,083 --> 00:03:36,722\n혼합물을 안전하게 다루는 기술은 재료공학뿐 아니라 환경관리와 연결됩니다.\n\n32\n00:03:36,722 --> 00:03:44,357\n배터리에서 나온 금속이 다시 좋은 배터리의 재료로 돌아오려면 품질을 맞춰야 합니다.\n\n33\n00:03:44,357 --> 00:03:56,971\n회수율이 높다는 말은 투입한 금속의 몇 퍼센트를 다시 얻었다는 뜻일 수 있지만, 그 금속의 순도가 제품의 품질을 보장하는 것은 아닙니다.\n\n34\n00:03:56,971 --> 00:04:02,780\n새로운 배터리 공장에서는 작은 불순물도 문제가 될 수 있습니다.\n\n35\n00:04:02,780 --> 00:04:09,419\n따라서 회수하는 기술과 정제하는 기술, 검사하는 기술이 함께 필요합니다.\n\n36\n00:04:09,419 --> 00:04:18,216\n한국 산업이 이런 부분에 강점을 만들려면 연구실의 성공을 반복 가능한 공정으로 바꾸어야 합니다.\n\n37\n00:04:18,216 --> 00:04:26,017\n실험용으로 한 번 성공한 것과 대량 공장에서 경제적으로 운영하는 것은 다른 일입니다.\n\n38\n00:04:26,017 --> 00:04:30,000\n경쟁은 바로 그 차이에서 갈릴 수 있습니다.\n\n39\n00:04:30,000 --> 00:04:37,010\n재활용 산업의 경제성을 판단할 때에는 금속의 국제 가격도 중요한 변수입니다.\n\n40\n00:04:37,010 --> 00:04:42,684\n광물 가격이 오르면 회수하는 금속의 가치가 커질 수 있습니다.\n\n41\n00:04:42,684 --> 00:04:48,359\n반대로 가격이 내려가면 같은 공정을 돌려도 이익이 줄어듭니다.\n\n42\n00:04:48,359 --> 00:04:54,367\n배터리를 모아오는 비용과 위험물 운송 규정도 무시하기 어렵습니다.\n\n43\n00:04:54,367 --> 00:05:02,712\n새 배터리를 만드는 공장의 불량품과 자투리는 상대적으로 성분과 이력이 잘 알려져 있습니다.\n\n44\n00:05:02,712 --> 00:05:08,387\n반면 여러 해 동안 사용한 배터리는 남은 상태가 제각각입니다.\n\n45\n00:05:08,387 --> 00:05:15,229\n이것이 현재 재활용 산업에 생산 공정에서 나온 스크랩이 중요한 이유입니다.\n\n46\n00:05:15,229 --> 00:05:21,905\n한때 쓸모없어 보였던 자투리가 기술과 품질 관리의 시험장이 된 것입니다.\n\n47\n00:05:21,905 --> 00:05:27,079\n금속 가격과 회수비용은 같은 방향으로 움직이지 않습니다.\n\n48\n00:05:27,079 --> 00:05:34,089\n원료값이 내려가면 좋은 기술을 가진 공장도 수익을 내기 어려울 수 있습니다.\n\n49\n00:05:34,089 --> 00:05:39,096\n배터리의 종류가 바뀌는 현상도 산업의 시간을 바꿉니다.\n\n50\n00:05:39,096 --> 00:05:45,939\n어떤 제품은 코발트가 많이 필요하지만 어떤 제품은 코발트 사용을 줄입니다.\n\n51\n00:05:45,939 --> 00:05:54,618\n재활용 업체가 투자한 설비가 미래의 소재 구성과 잘 맞지 않으면 수익성이 달라질 수 있습니다.\n\n52\n00:05:54,618 --> 00:06:01,627\n따라서 오늘 가장 비싼 금속을 회수하는 데만 초점을 맞추는 것은 위험합니다.\n\n53\n00:06:01,627 --> 00:06:08,637\n앞으로 어떤 배터리가 많이 만들어지고 얼마나 오래 사용될지 살펴봐야 합니다.\n\n54\n00:06:08,637 --> 00:06:17,650\n시장의 변화가 빠를수록 기술은 한 종류의 소재만 처리하는 방식에서 유연함을 요구받을 수 있습니다.\n\n55\n00:06:17,650 --> 00:06:24,325\n이런 문제를 잘 다루는 업체가 세계 시장에서 살아남을 가능성이 커집니다.\n\n56\n00:06:24,325 --> 00:06:30,000\n자원 순환은 화학의 문제이면서 장기 전망의 문제이기도 합니다.\n\n57\n00:06:30,000 --> 00:06:34,351\n첫 번째 반전은 시간표에서 드러납니다.\n\n58\n00:06:34,351 --> 00:06:49,475\nIEA의 2026년 보고서는 사용이 끝난 전기차 배터리가 재활용 원료의 중심이 되는 시점을 대체로 2030년대 중반 이후로 봅니다.\n\n59\n00:06:49,475 --> 00:06:55,691\n많은 전기차가 아직 도로 위를 달리고 있기 때문입니다.\n\n60\n00:06:55,691 --> 00:07:07,500\n새로 팔린 전기차가 많다는 뉴스와 올해 폐배터리가 넘쳐난다는 주장은 동시에 성립하지 않을 수 있습니다.\n\n61\n00:07:07,500 --> 00:07:17,238\n몇 년 동안 살아서 일하는 배터리를 이미 폐기물로 계산하면 시장 규모가 부풀려집니다.\n\n62\n00:07:17,238 --> 00:07:24,903\n이 시간 차이는 미래 수요를 기다리는 기업에게 위험이자 기회입니다.\n\n63\n00:07:24,903 --> 00:07:33,605\n물량이 많아질 때를 준비하되 그 전에 공장이 멈추지 않도록 운영해야 합니다.\n\n64\n00:07:33,605 --> 00:07:43,757\nIEA의 핵심 메시지는 오늘 팔린 배터리와 오늘 버려지는 배터리가 같지 않다는 것입니다.\n\n65\n00:07:43,757 --> 00:07:49,972\n산업의 시간표는 판매량 그래프와 별도로 그려야 합니다.\n\n66\n00:07:49,972 --> 00:08:00,953\n새로 팔리는 전기차 수를 보고 십 년 뒤 폐배터리 물량을 그대로 계산하고 싶은 유혹이 있습니다.\n\n67\n00:08:00,953 --> 00:08:13,177\n하지만 실제 자동차는 구매자가 바뀌고 나라를 넘어 중고로 팔리며 배터리도 예상보다 오래 쓰일 수 있습니다.\n\n68\n00:08:13,177 --> 00:08:21,671\n일부 배터리는 안전성 검사를 거쳐 다른 용도로 재사용될 가능성도 있습니다.\n\n69\n00:08:21,671 --> 00:08:27,887\n반면 사고나 고장으로 일찍 처리되는 배터리도 있습니다.\n\n70\n00:08:27,887 --> 00:08:41,354\n이런 다양한 경로를 무시하고 판매량에서 일정 비율을 곧바로 폐기량으로 계산하면 재활용 공장의 공급 전망이 잘못됩니다.\n\n71\n00:08:41,354 --> 00:08:50,884\nIEA가 생산 스크랩과 사용 후 배터리를 분리해서 설명하는 이유도 여기에 있습니다.\n\n72\n00:08:50,884 --> 00:09:00,000\n산업의 미래를 정확히 보려면 기술보다 먼저 시간과 물량의 현실을 보아야 합니다.\n\n73\n00:09:00,000 --> 00:09:05,193\n세계 재활용 산업은 중국의 비중이 매우 큽니다.\n\n74\n00:09:05,193 --> 00:09:15,180\nIEA는 중국에 전 세계 배터리 재활용 처리 역량의 상당 부분이 집중돼 있다고 분석합니다.\n\n75\n00:09:15,180 --> 00:09:25,965\n2026년 국제 핵심광물 전망은 중국 밖에서 한국이 물질 회수 분야의 주요 사업자라고 설명합니다.\n\n76\n00:09:25,965 --> 00:09:32,357\n하지만 한국이 중국 전체를 이미 추월했다는 뜻은 아닙니다.\n\n77\n00:09:32,357 --> 00:09:43,941\n오히려 중국의 압도적인 규모 사이에서 한국이 어떤 기술과 공급망을 확보해야 하는지 보여 주는 자료입니다.\n\n78\n00:09:43,941 --> 00:09:49,534\n재활용은 금속을 다시 꺼내는 데서 끝나지 않습니다.\n\n79\n00:09:49,534 --> 00:09:58,722\n회수된 원료가 다시 배터리 제조에 쓸 수 있을 정도의 안정된 품질을 갖춰야 합니다.\n\n80\n00:09:58,722 --> 00:10:06,911\n공정을 반복해도 품질 편차가 작아야 세계 고객이 믿고 주문할 수 있습니다.\n\n81\n00:10:06,911 --> 00:10:11,105\n중국의 압도적 규모는 인정해야 합니다.\n\n82\n00:10:11,105 --> 00:10:20,093\n한국의 역할은 중국 밖 회수 기술과 공급망을 확대할 가능성에서 찾을 수 있습니다.\n\n83\n00:10:20,093 --> 00:10:32,277\n한국이 세계에서 중요한 배터리 제조국 가운데 하나라는 사실과 재활용 분야에서 세계 일 위라는 주장은 다릅니다.\n\n84\n00:10:32,277 --> 00:10:42,463\nIEA의 2026년 자료는 중국에 재활용 처리 능력이 크게 집중돼 있다고 분명히 설명합니다.\n\n85\n00:10:42,463 --> 00:10:47,856\n중국이 가진 압도적인 규모를 무시할 수 없습니다.\n\n86\n00:10:47,856 --> 00:10:54,847\n그러나 규모가 전부라면 다른 나라의 기회는 아예 없을 것입니다.\n\n87\n00:10:54,847 --> 00:11:05,832\n실제로 국제기구는 한국과 일본 등의 기술과 소재 공급망이 다변화에 도움이 될 수 있다고 분석합니다.\n\n88\n00:11:05,832 --> 00:11:13,023\n한국의 기회는 다른 나라를 과장해서 깎아내리는 데 있지 않습니다.\n\n89\n00:11:13,023 --> 00:11:22,011\n신뢰할 수 있는 회수 품질과 안정적인 공급망을 구축하는 일에서 찾을 수 있습니다.\n\n90\n00:11:22,011 --> 00:11:30,000\n그런 전망은 크고 화려한 말보다 구체적인 공정과 수치로 설명해야 합니다.\n\n91\n00:11:30,000 --> 00:11:38,938\n두 번째 반전은 회수할 배터리가 예상보다 늦게 나온다는 점입니다.\n\n92\n00:11:38,938 --> 00:11:54,331\n사용한 전기차가 다른 나라로 중고차로 수출되거나, 배터리를 교체하지 않고 수리해 더 오래 쓰는 경우가 있습니다.\n\n93\n00:11:54,331 --> 00:12:04,759\n에너지저장장치로 재사용할 수도 있지만 안전과 보증, 비용 문제가 따라옵니다.\n\n94\n00:12:04,759 --> 00:12:16,179\n이 경우 배터리가 처음 판매된 나라의 재활용 공장으로 돌아오지 않을 수도 있습니다.\n\n95\n00:12:16,179 --> 00:12:27,103\n따라서 국가별 폐배터리 물량은 전기차 판매량에 비례해 자동으로 쌓이지 않습니다.\n\n96\n00:12:27,103 --> 00:12:35,793\n기업은 원료 확보 계약, 운송망, 추적 시스템을 갖춰야 합니다.\n\n97\n00:12:35,793 --> 00:12:48,455\n여기서 승부를 가르는 것은 화려한 회수율 한 줄이 아니라 공급망 전체를 관리하는 능력입니다.\n\n98\n00:12:48,455 --> 00:12:56,152\n중고차가 다른 나라로 이동하면 배터리도 함께 이동합니다.\n\n99\n00:12:56,152 --> 00:13:06,828\n처음에 판매된 국가의 자원 회수량을 그대로 미래 자원으로 계산할 수 없습니다.\n\n100\n00:13:06,828 --> 00:13:17,752\n재활용 공장을 만드는 데만 집중하면 배터리가 어디서 들어올지 놓칠 수 있습니다.\n\n101\n00:13:17,752 --> 00:13:28,676\n기업이 아무리 좋은 시설을 갖추어도 처리할 물량이 부족하면 가동률이 낮아집니다.\n\n102\n00:13:28,676 --> 00:13:41,338\n반대로 예상보다 많은 폐배터리가 한꺼번에 들어오면 안전한 보관과 처리가 어려울 수 있습니다.\n\n103\n00:13:41,338 --> 00:13:50,772\n배터리는 일반 종이 상자처럼 아무 창고에 쌓아 두는 제품이 아닙니다.\n\n104\n00:13:50,772 --> 00:13:55,986\n운송과 보관의 안전을 확인해야 합니다.\n\n105\n00:13:55,986 --> 00:14:10,883\n그래서 원료를 수거하는 회사와 자동차 제조사, 배터리 제조사, 재활용 시설 사이의 장기 계약이 중요해집니다.\n\n106\n00:14:10,883 --> 00:14:19,821\n이 연결망은 눈에 보이지 않지만 산업의 성패를 가르는 기반입니다.\n\n107\n00:14:19,821 --> 00:14:30,000\n자원 재활용은 사용이 끝난 물건에 새로운 순서를 부여하는 일이기도 합니다.\n\n108\n00:14:30,000 --> 00:14:36,591\n우리 부모 세대는 자원이 부족한 나라에서 공업을 키웠습니다.\n\n109\n00:14:36,591 --> 00:14:44,581\n필요한 것을 해외에서 들여오고 아껴 쓰며 새로운 기술을 배워야 했습니다.\n\n110\n00:14:44,581 --> 00:14:48,975\n지금도 자원의 문제는 끝나지 않았습니다.\n\n111\n00:14:48,975 --> 00:15:00,160\n달라진 것은 우리가 버려지는 금속을 다시 쓰기 위한 공정과 기술을 만드는 위치에 서 있다는 점입니다.\n\n112\n00:15:00,160 --> 00:15:07,350\n한국의 기회가 크다고 해서 모든 공장이 성공한다는 뜻은 아닙니다.\n\n113\n00:15:07,350 --> 00:15:15,539\n실패 위험을 인정하고 원료의 흐름과 기술을 검증하는 기업이 남을 것입니다.\n\n114\n00:15:15,539 --> 00:15:21,731\n처음의 질문으로 돌아갑니다. 낡은 배터리는 쓰레기일까요.\n\n115\n00:15:21,731 --> 00:15:26,724\n정답은 아직 한 단어로 정해져 있지 않습니다.\n\n116\n00:15:26,724 --> 00:15:34,913\n어떤 기술과 제도로 다루느냐에 따라 다음 산업의 자원이 될 수도 있습니다.\n\n117\n00:15:34,913 --> 00:15:46,698\n자원이 부족한 나라가 다시 쓰는 기술에 투자하는 일은 단순한 절약을 넘어 산업의 선택지를 넓히는 일입니다.\n\n118\n00:15:46,698 --> 00:15:59,281\n몇십 년 전 우리 부모 세대는 자원이 없는 나라에서 공장을 짓는 일이 쉽지 않다는 사실을 누구보다 잘 알았습니다.\n\n119\n00:15:59,281 --> 00:16:06,272\n값비싼 원료를 해외에서 들여와 제품을 만들어 수출해야 했습니다.\n\n120\n00:16:06,272 --> 00:16:14,660\n지금 한국이 다시 쓰는 기술에 투자하는 모습은 그 역사와 묘하게 이어집니다.\n\n121\n00:16:14,660 --> 00:16:26,445\n과거에는 부족한 것을 어떻게 구할지 고민했다면 앞으로는 이미 사용한 것에서 무엇을 다시 얻을지 고민합니다.\n\n122\n00:16:26,445 --> 00:16:34,234\n물론 회수 기술이 광산의 필요를 하루아침에 없애 주지는 않을 것입니다.\n\n123\n00:16:34,234 --> 00:16:40,226\n하지만 기술과 제도를 쌓으면 새로운 선택지가 생깁니다.\n\n124\n00:16:40,226 --> 00:16:47,217\n처음 버려진 배터리를 보며 던졌던 질문은 이제 조금 달라집니다.\n\n125\n00:16:47,217 --> 00:17:00,000\n우리에게 부족했던 자원을 다시 쓰게 하는 능력, 그 능력은 다음 세대를 위한 새로운 산업의 기초가 될 수 있습니다.\n","cuts":[{"shot":"S01","output_start":"00:00:00","output_end":"00:00:25","beat":"1","narration_prompt":"전기차 배터리를 버리면 귀한 자원도 끝날까요.","visual":"권리 확인된 실제 외국인 호평 클립 1~4초 2~4개가 확보될 때만 배치; 기본 상태는 승인 대기","source_candidates":"https://www.iea.org/reports/global-ev-outlook-2026/electric-vehicle-batteries; https://www.iea.org/reports/global-critical-minerals-outlook-2026/executive-summary","foreign_clip_id":"미확정","source_IN":"","source_OUT":"","source_audio_status":"UNVERIFIED","rights":"NOT_CLEARED","overlay":"외국인 실제 발언 (확인 전 빈칸)","emotion":"3","note":"4초 이하 컷은 목표, 저작권 보장 아님"},{"shot":"S02","output_start":"00:00:25","output_end":"00:00:50","beat":"1","narration_prompt":"한국도 그 회수 기술 경쟁에 참여하고 있습니다.","visual":"권리 확인된 실제 외국인 호평 클립 1~4초 2~4개가 확보될 때만 배치; 기본 상태는 승인 대기","source_candidates":"https://www.iea.org/report line":[{"t":"00:00–00:45","text":"외국 기관의 한국 평가 직접 노출","question":"OECD 해외 평가의 한국 관련 발언이나 기관 공식 영상 실제 원음을 찾아 선공개한다."},{"t":"00:45–02:30","text":"1950년대 국제 원조 배경","question":"전쟁 뒤 원조가 절실했던 한국은 어디로 갔나?"},{"t":"02:30–04:30","text":"경제 발전과 정책 변화","question":"한국은 언제 원조를 받는 나라에서 주는 나라로 바뀌었나?"},{"t":"04:30–06:30","text":"OECD DAC 가입의 의미","question":"2010년 OECD DAC 가입의 의미는?"},{"t":"06:30–09:00","text":"1차 반전 · 공여국의 책임","question":"1차 반전: 성장 숫자보다 제도를 나누는 능력이 평가 대상이다."},{"t":"09:00–11:30","text":"해외 개발협력 현장의 평가","question":"다른 나라와 협력 사업은 어떻게 다른가?"},{"t":"11:30–14:30","text":"2차 반전 · 긍정과 개선 권고","question":"2차 반전: 국제 평가에는 개선 과제도 있다."},{"t":"14:30–17:00","text":"전쟁 세대에서 현재까지 회수","question":"역사 사진과 현재 해외 평가로 자긍심을 회수한다."}],"hooks":["OECD 해외 평가의 한국 관련 발언이나 기관 공식 영상 실제 원음을 찾아 선공개한다.","전쟁 뒤 원조가 절실했던 한국은 어디로 갔나?","한국은 언제 원조를 받는 나라에서 주는 나라로 바뀌었나?","2010년 OECD DAC 가입의 의미는?","1차 반전: 성장 숫자보다 제도를 나누는 능력이 평가 대상이다.","다른 나라와 협력 사업은 어떻게 다른가?","2차 반전: 국제 평가에는 개선 과제도 있다.","역사 사진과 현재 해외 평가로 자긍심을 회수한다."],"source_links":[["OECD","2021","2010년 DAC 가입 배경과 동료평가 절차","https://www.oecd.org/en/publications/korean-focus-areas_f91f3b75-en/from-emerging-donor-to-global-development-partner_66044045-en.html","국제기관"],["OECD","2024-05-21","한국 개발협력 동료 검토, 성과와 개선점 동시 평가","https://www.oecd.org/en/publications/oecd-development-co-operation-peer-reviews-korea-2024_889c6564-en.html","국제평가"]],"correction":"2010년 OECD 가입이 아니라 OECD DAC 가입. 해외 평가와 국내 사실 분리.","parts":["한국은 전쟁 뒤 국제 원조를 받던 나라였습니다. 지금은 OECD가 한국의 개발협력을 평가합니다. 어떻게 이런 변화가 가능했을까요. 그런데 돕는 나라가 됐다고 모든 과제가 끝난 것은 아닙니다. 우리가 오래 기억해야 할 것은 숫자보다 책임입니다.","1950년대 한국에 국제 원조는 매우 현실적인 생존 수단이었습니다. 먹을 것과 입을 것, 의료 지원과 산업을 다시 세울 자원이 필요했습니다. 전쟁의 상처는 지도 위에서 국경선이 그어진 것으로 끝나지 않았습니다. 학교와 병원, 집과 도로를 새로 일으켜야 했습니다. 누군가가 보낸 식량과 의약품, 기술 협력은 사람들의 하루를 이어 가게 했습니다. 그 시절을 지나온 세대에게 원조라는 말은 먼 국제정치의 단어가 아니라 생활 그 자체였을 수 있습니다. 그리고 세월이 흘렀습니다. 한국은 산업을 키우고 수출을 늘리며 나라의 생활 수준을 바꾸었습니다. 그렇다면 받은 도움의 경험은 어디에 남았을까요.\n\n원조 물자에 의존하던 시절을 한 사람의 목소리로 꾸밀 필요는 없습니다. 실제 사진과 당시 기록을 재현으로 구분해 보여 주면 시대의 무게가 충분히 전달됩니다.\n\n한국에서 전쟁의 상처가 남아 있던 시절, 국제 원조는 먼 나라와의 연결을 뜻했습니다. 서로 얼굴을 알지 못하는 사람들이 식량과 의약품, 기술을 보내왔습니다. 그 도움만으로 모든 문제가 해결되지는 않았습니다. 학교를 다시 열고 농사를 짓고 길을 복구하는 일은 한국 사람들이 직접 해야 했습니다. 그러나 도움을 받았다는 경험은 남았습니다. 어느 나라든 어려운 시절에는 외부의 협력과 내부의 노력이 함께 필요할 수 있습니다. 지금 한국이 개발협력의 문제를 논의할 때 이 기억은 단순한 미담보다 중요한 출발점입니다. 과거의 수혜 경험을 알고 있는 나라가 다른 나라의 현실을 이해하려는 태도를 보일 수 있기 때문입니다.","국가가 경제적으로 성장하면 모든 문제가 저절로 해결되는 것은 아닙니다. 산업을 일으키는 과정에는 교육과 인력, 보건과 행정, 수출 통로, 재정의 관리가 함께 작동합니다. 각 나라마다 출발 조건이 다르므로 한국의 방법을 그대로 복사한다고 같은 결과가 나오지도 않습니다. 그러나 어떤 시행착오를 거쳤는지, 공공기관을 어떻게 운영했는지, 의료나 교육의 접근성을 어떻게 넓혔는지 같은 경험은 다른 나라와 나눌 수 있습니다. 한국의 발전 역사는 성공한 사진 한 장보다 그 사진 뒤에 쌓인 수많은 선택의 기록입니다. 국제 개발협력이 주목하는 것도 바로 이런 구체적인 경험입니다.\n\n성장 과정의 시행착오도 다른 나라가 배우는 자료가 될 수 있습니다. 완벽한 성공 신화를 만들면 오히려 쓸모 있는 교훈이 줄어듭니다.\n\n경제 성장의 순간을 한 장의 사진으로 보여 주기는 쉽습니다. 높은 건물과 자동차, 늘어난 수출품이 보입니다. 하지만 그 사진만으로는 사람들이 어떻게 교육받았고 산업을 위해 어떤 제도를 만들었는지 알기 어렵습니다. 경제가 성장하는 동안 실패한 정책과 부작용도 있었습니다. 어려웠던 경험을 감추고 모든 과정을 완벽한 성공담으로 만드는 것은 다른 나라에 별 도움이 되지 않을 수 있습니다. 개발협력에서 중요한 것은 기적 같은 결과를 그대로 복사하라는 주문이 아니라 어떤 조건에서 어떤 방법이 작동했는지 함께 살피는 일입니다. 이 과정에서 한국은 경험을 나누는 나라가 되었습니다.","2010년 한국은 OECD 개발원조위원회, DAC의 회원국이 됐습니다. 이 변화는 한국이 경제협력개발기구에 가입했다는 사실과 구분해야 합니다. DAC는 개발협력의 기준과 실적을 놓고 회원국들이 서로 평가하는 조직입니다. 도움을 받는 위치에서 다른 나라를 지원하는 위치로 이동했다는 상징성은 큽니다. 그러나 가입이 곧 완벽한 원조 국가가 됐다는 인증서는 아닙니다. 회원국은 다른 나라의 평가를 받으며 예산을 얼마나 쓰는지, 어떤 사업이 효과적인지, 현지 사람에게 실제 도움이 되는지 설명해야 합니다. 그 과정에서 과거 경험을 자랑하는 것보다 현재의 책임을 증명하는 일이 더 중요해집니다.\n\nDAC의 동료검토는 상을 주는 절차가 아닙니다. 회원국이 서로 사업 성과와 개선점을 살피는 제도입니다.\n\nDAC 가입의 상징적 의미를 이해하려면 2010년이라는 숫자를 기억할 필요가 있습니다. 한국은 이미 OECD에 가입한 뒤였습니다. 그리고 2010년 개발원조위원회에 참여하면서 개발협력의 성과를 동료 국가와 함께 평가하는 체계로 들어갔습니다. 한국이 원조를 제공하는 위치가 되었다는 변화는 많은 사람에게 자랑스럽게 느껴질 수 있습니다. 그러나 국제사회가 기대하는 기준도 함께 높아졌습니다. 사업의 효율과 투명성, 현지 주민의 참여를 검토받아야 했습니다. 결과적으로 회원 자격은 졸업장이 아니라 계속 시험을 치르는 자리와 비슷합니다. 얼마나 도움을 주었느냐와 어떤 도움이 되었느냐는 다른 질문이기 때문입니다.","첫 번째 반전은 바로 그 평가의 방향에 있습니다. OECD는 한국의 경험을 소개하면서도 개선할 점을 함께 검토합니다. 2024년 동료 검토 보고서는 한국이 원조 규모를 빠르게 확대하는 시점에 더 큰 국제적 책임을 맡고 있다고 설명했습니다. 성장의 성적표를 보여 주는 자리에서 이제는 다른 나라와 어떻게 협력하는지가 시험대에 오른 것입니다. 협력 사업이 발표됐다고 현장 주민에게 즉시 변화가 생기는 것은 아닙니다. 우물과 병원, 학교가 실제로 오랫동안 운영되는지, 지역사회가 스스로 관리할 능력이 생기는지 살펴봐야 합니다. 성과를 내는 방식도 과거보다 더 복잡해진 것입니다.\n\n2024년 OECD 검토는 한국이 원조 규모를 늘리는 동시에 운영 역량을 더욱 강화해야 한다고 봅니다. 이 평가를 칭찬만 남기고 편집해서는 안 됩니다.\n\n2024년 OECD 보고서는 한국의 개발협력 규모가 커지는 시기에 필요한 새로운 과제를 다룹니다. 원조 금액이 증가했다고 곧바로 현장의 삶이 나아졌다고 말할 수는 없습니다. 사업이 장기간 이어지려면 상대국 기관이 스스로 운영할 능력을 갖추어야 합니다. 또한 지원국이 자기 기업만 이익을 얻는 방향으로 사업을 설계하면 본래의 목적이 흐려질 수도 있습니다. 그래서 국제 개발협력에는 성과를 측정하는 기준과 현지의 목소리가 중요합니다. 한국이 이런 기준에 따라 평가받는다는 사실은 오늘날의 국제적 위치가 얼마나 달라졌는지 보여 줍니다. 과거에 도움을 받던 나라가 이제는 도움의 방식 자체를 검증받고 있습니다.","국제 개발협력에는 단순한 현금 지원만 있는 것이 아닙니다. 보건 체계를 강화하고 의료 인력을 교육하는 사업, 행정 시스템을 구축하는 사업, 도로와 물 관리를 돕는 사업도 있습니다. 하지만 모든 사업은 받는 나라의 필요에서 시작해야 합니다. 한국에서 성공한 방법이라도 환경과 정치 제도, 언어와 문화가 다르면 결과가 달라집니다. 사업이 끝난 뒤 현지 사람들이 계속 사용할 수 없으면 화려한 준공식도 오래 남지 못합니다. 외부 전문가가 한국의 경험을 흥미롭게 보는 이유는 이미 완성된 모범답안이 있어서가 아닙니다. 어려운 출발점에서 제도를 만들어 온 과정이 다른 나라에 질문을 던지기 때문입니다.\n\n협력 사업은 학교를 지어 주는 데서 끝나지 않습니다. 현지 교사가 계속 수업을 열고 주민이 시설을 관리할 수 있어야 의미가 있습니다.\n\n어떤 마을에 새로운 시설이 생긴다고 가정해 봅니다. 건물을 짓는 일은 눈에 잘 보이는 성과입니다. 하지만 건물이 오래 쓸 수 있는 시설이 되려면 지역 주민의 필요를 듣고 유지보수 방법을 알려 주어야 합니다. 의사가 있는 병원인지, 깨끗한 물이 나오는 설비인지, 교사가 꾸준히 일하는 학교인지도 중요합니다. 실제 협력 사업마다 조건은 달라질 것입니다. 그래서 다른 나라에서 성공한 방식을 그냥 가져와서 똑같이 적용해서는 안 됩니다. 현지의 언어와 환경, 제도에 맞는 개선이 필요합니다. 한국이 배우고 나누어야 할 것도 바로 이 현실적인 태도입니다. 선의만으로 모든 문제가 해결되지는 않는다는 사실을 아는 것이 책임의 시작입니다.","두 번째 반전은 칭찬 뒤에 따라오는 권고입니다. OECD의 동료 검토는 좋은 사례를 소개하는 동시에 사업의 질과 효율, 지역 주도성에 관한 개선 과제를 제시합니다. 한국이 국제적 지위를 얻었기 때문에 비판에서 자유로워지는 것이 아니라 오히려 더 엄격한 기준을 적용받는 것입니다. 어떤 사업이 누구의 삶을 바꿨는지 기록하고, 예상과 다른 결과가 나오면 바꾸어야 합니다. 원조받던 시절의 기억이 진짜 의미를 가지려면 상대 나라의 어려움을 단순한 수치로 다루지 않는 태도가 필요합니다. 한국이 과거의 아픔을 안다는 사실은 동정의 면허가 아니라 더 깊이 듣고 책임져야 할 이유가 됩니다.\n\n받는 나라가 원하는 것을 먼저 듣는 태도는 도움을 제공하는 나라에도 어려운 과제입니다. 과거의 어려움을 기억하는 것이 시작일 수 있습니다.\n\n외국 전문가의 긍정 평가를 강조하고 싶을수록 비판을 함께 살펴야 합니다. 국제기관은 한국의 발전 경험을 흥미로운 사례로 소개하면서도 더 효율적인 사업 운영과 정책 조정이 필요하다고 지적합니다. 그것을 한국을 무시한 반응이라고 받아들일 필요는 없습니다. 책임이 커졌기 때문에 더 정밀한 검증을 요구받는 것입니다. 어떤 사업은 효과가 크지만 어떤 사업은 예상한 만큼 성과를 내지 못할 수 있습니다. 그때 중요한 것은 실패를 감추지 않고 원인을 찾는 태도입니다. 개발협력의 진짜 가치는 행사를 얼마나 크게 열었느냐보다 현장 사람들의 생활이 실제로 좋아졌느냐에서 나옵니다. 이 기준을 지켜야 과거의 성장 경험도 설득력 있게 전해질 수 있습니다.","한때 한국에 보내진 원조 물자 상자를 기억하는 사람이 있을 것입니다. 그 상자를 받아 든 손이 오늘의 산업과 교육, 국제협력을 만든 모든 원인은 아니었습니다. 그러나 그 도움을 발판으로 다시 일어선 사람들의 노력이 이어졌습니다. 이제 한국은 다른 나라의 어려움 앞에서 무슨 도움을 줄 수 있는지 묻습니다. 이것이 나라가 바뀌었다는 가장 따뜻한 증거일지 모릅니다. 처음 질문으로 돌아갑니다. 원조받던 한국이 세계에 무엇을 보여 주게 됐을까요. 받은 것을 잊지 않고, 가능한 것을 나누며, 부족한 점은 다시 배우는 태도입니다. 그 변화는 숫자만큼이나 조용하고 깊은 자긍심을 남깁니다.\n\n도움의 기억이 세대가 바뀐 뒤에도 이어질 때, 산업 발전의 성공담은 다른 나라와 나누는 책임으로 변합니다.\n\n어려운 시절의 기억을 지나온 사람에게 한국의 변화는 특별하게 다가올 수 있습니다. 원조를 받으며 하루를 이어 가던 나라가 이제는 다른 나라의 교육과 보건을 위해 협력할 수 있는 역량을 갖추었습니다. 그러나 그 역량을 자랑하기 위해 과거의 고통을 지나치게 자극적으로 꾸밀 필요는 없습니다. 폐허가 된 도시의 실제 기록과 이후의 산업, 교육 발전을 차례로 보여 주면 됩니다. 그리고 오늘의 국제협력 현장을 연결하면 시간의 변화가 더욱 또렷해집니다. 우리가 도움을 받았다는 사실을 잊지 않는다면 누군가의 어려움을 함부로 대할 수 없습니다. 성장한 나라의 품격은 큰 숫자를 내세우는 말보다 다른 사람의 필요를 정확히 듣는 모습에서 완성됩니다."],"duration_target_sec":1020,"duration_measured_sec":null,"narration_chars":5357,"source_audio_confirmed":false,"source_in_out_confirmed":false,"rights_confirmed":false,"narration_synthesized":false,"provisional_srt":true,"emotion_curve":[3,3,2,3,4,3,5,5],"reference_group":"이슈","foreign_opening_status":"2~4개 외국인 실음성 클립 미확보. 첫 12초 0:00-0:12 임시 배치 불가.","planned_srt":"1\n00:00:00,000 --> 00:00:08,864\n한국은 전쟁 뒤 국제 원조를 받던 나라였습니다.\n\n2\n00:00:08,864 --> 00:00:24,205\n지금은 OECD가 한국의 개발협력을 평가합니다. 어떻게 이런 변화가 가능했을까요.\n\n3\n00:00:24,205 --> 00:00:35,455\n그런데 돕는 나라가 됐다고 모든 과제가 끝난 것은 아닙니다.\n\n4\n00:00:35,455 --> 00:00:45,000\n우리가 오래 기억해야 할 것은 숫자보다 책임입니다.\n\n5\n00:00:45,000 --> 00:00:50,243\n1950년대 한국에 국제 원조는 매우 현실적인 생존 수단이었습니다.\n\n6\n00:00:50,243 --> 00:00:55,911\n먹을 것과 입을 것, 의료 지원과 산업을 다시 세울 자원이 필요했습니다.\n\n7\n00:00:55,911 --> 00:01:01,296\n전쟁의 상처는 지도 위에서 국경선이 그어진 것으로 끝나지 않았습니다.\n\n8\n00:01:01,296 --> 00:01:05,263\n학교와 병원, 집과 도로를 새로 일으켜야 했습니다.\n\n9\n00:01:05,263 --> 00:01:11,498\n누군가가 보낸 식량과 의약품, 기술 협력은 사람들의 하루를 이어 가게 했습니다.\n\n10\n00:01:11,498 --> 00:01:19,433\n그 시절을 지나온 세대에게 원조라는 말은 먼 국제정치의 단어가 아니라 생활 그 자체였을 수 있습니다.\n\n11\n00:01:19,433 --> 00:01:21,417\n그리고 세월이 흘렀습니다.\n\n12\n00:01:21,417 --> 00:01:26,802\n한국은 산업을 키우고 수출을 늘리며 나라의 생활 수준을 바꾸었습니다.\n\n13\n00:01:26,802 --> 00:01:30,486\n그렇다면 받은 도움의 경험은 어디에 남았을까요.\n\n14\n00:01:30,486 --> 00:01:36,012\n원조 물자에 의존하던 시절을 한 사람의 목소리로 꾸밀 필요는 없습니다.\n\n15\n00:01:36,012 --> 00:01:42,672\n실제 사진과 당시 기록을 재현으로 구분해 보여 주면 시대의 무게가 충분히 전달됩니다.\n\n16\n00:01:42,672 --> 00:01:49,332\n한국에서 전쟁의 상처가 남아 있던 시절, 국제 원조는 먼 나라와의 연결을 뜻했습니다.\n\n17\n00:01:49,332 --> 00:01:54,858\n서로 얼굴을 알지 못하는 사람들이 식량과 의약품, 기술을 보내왔습니다.\n\n18\n00:01:54,858 --> 00:01:58,684\n그 도움만으로 모든 문제가 해결되지는 않았습니다.\n\n19\n00:01:58,684 --> 00:02:05,344\n학교를 다시 열고 농사를 짓고 길을 복구하는 일은 한국 사람들이 직접 해야 했습니다.\n\n20\n00:02:05,344 --> 00:02:08,603\n그러나 도움을 받았다는 경험은 남았습니다.\n\n21\n00:02:08,603 --> 00:02:15,121\n어느 나라든 어려운 시절에는 외부의 협력과 내부의 노력이 함께 필요할 수 있습니다.\n\n22\n00:02:15,121 --> 00:02:22,065\n지금 한국이 개발협력의 문제를 논의할 때 이 기억은 단순한 미담보다 중요한 출발점입니다.\n\n23\n00:02:22,065 --> 00:02:30,000\n과거의 수혜 경험을 알고 있는 나라가 다른 나라의 현실을 이해하려는 태도를 보일 수 있기 때문입니다.\n\n24\n00:02:30,000 --> 00:02:36,705\n국가가 경제적으로 성장하면 모든 문제가 저절로 해결되는 것은 아닙니다.\n\n25\n00:02:36,705 --> 00:02:45,989\n산업을 일으키는 과정에는 교육과 인력, 보건과 행정, 수출 통로, 재정의 관리가 함께 작동합니다.\n\n26\n00:02:45,989 --> 00:02:55,272\n각 나라마다 출발 조건이 다르므로 한국의 방법을 그대로 복사한다고 같은 결과가 나오지도 않습니다.\n\n27\n00:02:55,272 --> 00:03:09,370\n그러나 어떤 시행착오를 거쳤는지, 공공기관을 어떻게 운영했는지, 의료나 교육의 접근성을 어떻게 넓혔는지 같은 경험은 다른 나라와 나눌 수 있습니다.\n\n28\n00:03:09,370 --> 00:03:17,794\n한국의 발전 역사는 성공한 사진 한 장보다 그 사진 뒤에 쌓인 수많은 선택의 기록입니다.\n\n29\n00:03:17,794 --> 00:03:23,639\n국제 개발협력이 주목하는 것도 바로 이런 구체적인 경험입니다.\n\n30\n00:03:23,639 --> 00:03:30,000\n성장 과정의 시행착오도 다른 나라가 배우는 자료가 될 수 있습니다.\n\n31\n00:03:30,000 --> 00:03:36,017\n완벽한 성공 신화를 만들면 오히려 쓸모 있는 교훈이 줄어듭니다.\n\n32\n00:03:36,017 --> 00:03:41,691\n경제 성장의 순간을 한 장의 사진으로 보여 주기는 쉽습니다.\n\n33\n00:03:41,691 --> 00:03:46,160\n높은 건물과 자동차, 늘어난 수출품이 보입니다.\n\n34\n00:03:46,160 --> 00:03:55,960\n하지만 그 사진만으로는 사람들이 어떻게 교육받았고 산업을 위해 어떤 제도를 만들었는지 알기 어렵습니다.\n\n35\n00:03:55,960 --> 00:04:01,289\n경제가 성장하는 동안 실패한 정책과 부작용도 있었습니다.\n\n36\n00:04:01,289 --> 00:04:12,120\n어려웠던 경험을 감추고 모든 과정을 완벽한 성공담으로 만드는 것은 다른 나라에 별 도움이 되지 않을 수 있습니다.\n\n37\n00:04:12,120 --> 00:04:25,014\n개발협력에서 중요한 것은 기적 같은 결과를 그대로 복사하라는 주문이 아니라 어떤 조건에서 어떤 방법이 작동했는지 함께 살피는 일입니다.\n\n38\n00:04:25,014 --> 00:04:30,000\n이 과정에서 한국은 경험을 나누는 나라가 되었습니다.\n\n39\n00:04:30,000 --> 00:04:36,610\n2010년 한국은 OECD 개발원조위원회, DAC의 회원국이 됐습니다.\n\n40\n00:04:36,610 --> 00:04:43,220\n이 변화는 한국이 경제협력개발기구에 가입했다는 사실과 구분해야 합니다.\n\n41\n00:04:43,220 --> 00:04:50,339\nDAC는 개발협력의 기준과 실적을 놓고 회원국들이 서로 평가하는 조직입니다.\n\n42\n00:04:50,339 --> 00:04:57,627\n도움을 받는 위치에서 다른 나라를 지원하는 위치로 이동했다는 상징성은 큽니다.\n\n43\n00:04:57,627 --> 00:05:03,559\n그러나 가입이 곧 완벽한 원조 국가가 됐다는 인증서는 아닙니다.\n\n44\n00:05:03,559 --> 00:05:16,271\n회원국은 다른 나라의 평가를 받으며 예산을 얼마나 쓰는지, 어떤 사업이 효과적인지, 현지 사람에게 실제 도움이 되는지 설명해야 합니다.\n\n45\n00:05:16,271 --> 00:05:24,407\n그 과정에서 과거 경험을 자랑하는 것보다 현재의 책임을 증명하는 일이 더 중요해집니다.\n\n46\n00:05:24,407 --> 00:05:28,814\nDAC의 동료검토는 상을 주는 절차가 아닙니다.\n\n47\n00:05:28,814 --> 00:05:33,898\n회원국이 서로 사업 성과와 개선점을 살피는 제도입니다.\n\n48\n00:05:33,898 --> 00:05:42,034\nDAC 가입의 상징적 의미를 이해하려면 2010년이라는 숫자를 기억할 필요가 있습니다.\n\n49\n00:05:42,034 --> 00:05:45,932\n한국은 이미 OECD에 가입한 뒤였습니다.\n\n50\n00:05:45,932 --> 00:05:56,271\n그리고 2010년 개발원조위원회에 참여하면서 개발협력의 성과를 동료 국가와 함께 평가하는 체계로 들어갔습니다.\n\n51\n00:05:56,271 --> 00:06:04,915\n한국이 원조를 제공하는 위치가 되었다는 변화는 많은 사람에게 자랑스럽게 느껴질 수 있습니다.\n\n52\n00:06:04,915 --> 00:06:09,831\n그러나 국제사회가 기대하는 기준도 함께 높아졌습니다.\n\n53\n00:06:09,831 --> 00:06:15,763\n사업의 효율과 투명성, 현지 주민의 참여를 검토받아야 했습니다.\n\n54\n00:06:15,763 --> 00:06:23,051\n결과적으로 회원 자격은 졸업장이 아니라 계속 시험을 치르는 자리와 비슷합니다.\n\n55\n00:06:23,051 --> 00:06:30,000\n얼마나 도움을 주었느냐와 어떤 도움이 되었느냐는 다른 질문이기 때문입니다.\n\n56\n00:06:30,000 --> 00:06:35,563\n첫 번째 반전은 바로 그 평가의 방향에 있습니다.\n\n57\n00:06:35,563 --> 00:06:43,187\nOECD는 한국의 경험을 소개하면서도 개선할 점을 함께 검토합니다.\n\n58\n00:06:43,187 --> 00:06:56,992\n2024년 동료 검토 보고서는 한국이 원조 규모를 빠르게 확대하는 시점에 더 큰 국제적 책임을 맡고 있다고 설명했습니다.\n\n59\n00:06:56,992 --> 00:07:08,324\n성장의 성적표를 보여 주는 자리에서 이제는 다른 나라와 어떻게 협력하는지가 시험대에 오른 것입니다.\n\n60\n00:07:08,324 --> 00:07:16,566\n협력 사업이 발표됐다고 현장 주민에게 즉시 변화가 생기는 것은 아닙니다.\n\n61\n00:07:16,566 --> 00:07:28,929\n우물과 병원, 학교가 실제로 오랫동안 운영되는지, 지역사회가 스스로 관리할 능력이 생기는지 살펴봐야 합니다.\n\n62\n00:07:28,929 --> 00:07:34,698\n성과를 내는 방식도 과거보다 더 복잡해진 것입니다.\n\n63\n00:07:34,698 --> 00:07:46,442\n2024년 OECD 검토는 한국이 원조 규모를 늘리는 동시에 운영 역량을 더욱 강화해야 한다고 봅니다.\n\n64\n00:07:46,442 --> 00:07:51,799\n이 평가를 칭찬만 남기고 편집해서는 안 됩니다.\n\n65\n00:07:51,799 --> 00:08:02,926\n2024년 OECD 보고서는 한국의 개발협력 규모가 커지는 시기에 필요한 새로운 과제를 다룹니다.\n\n66\n00:08:02,926 --> 00:08:11,374\n원조 금액이 증가했다고 곧바로 현장의 삶이 나아졌다고 말할 수는 없습니다.\n\n67\n00:08:11,374 --> 00:08:20,234\n사업이 장기간 이어지려면 상대국 기관이 스스로 운영할 능력을 갖추어야 합니다.\n\n68\n00:08:20,234 --> 00:08:31,772\n또한 지원국이 자기 기업만 이익을 얻는 방향으로 사업을 설계하면 본래의 목적이 흐려질 수도 있습니다.\n\n69\n00:08:31,772 --> 00:08:40,426\n그래서 국제 개발협력에는 성과를 측정하는 기준과 현지의 목소리가 중요합니다.\n\n70\n00:08:40,426 --> 00:08:51,758\n한국이 이런 기준에 따라 평가받는다는 사실은 오늘날의 국제적 위치가 얼마나 달라졌는지 보여 줍니다.\n\n71\n00:08:51,758 --> 00:09:00,000\n과거에 도움을 받던 나라가 이제는 도움의 방식 자체를 검증받고 있습니다.\n\n72\n00:09:00,000 --> 00:09:06,486\n국제 개발협력에는 단순한 현금 지원만 있는 것이 아닙니다.\n\n73\n00:09:06,486 --> 00:09:20,068\n보건 체계를 강화하고 의료 인력을 교육하는 사업, 행정 시스템을 구축하는 사업, 도로와 물 관리를 돕는 사업도 있습니다.\n\n74\n00:09:20,068 --> 00:09:26,554\n하지만 모든 사업은 받는 나라의 필요에서 시작해야 합니다.\n\n75\n00:09:26,554 --> 00:09:36,284\n한국에서 성공한 방법이라도 환경과 정치 제도, 언어와 문화가 다르면 결과가 달라집니다.\n\n76\n00:09:36,284 --> 00:09:46,419\n사업이 끝난 뒤 현지 사람들이 계속 사용할 수 없으면 화려한 준공식도 오래 남지 못합니다.\n\n77\n00:09:46,419 --> 00:09:56,757\n외부 전문가가 한국의 경험을 흥미롭게 보는 이유는 이미 완성된 모범답안이 있어서가 아닙니다.\n\n78\n00:09:56,757 --> 00:10:05,878\n어려운 출발점에서 제도를 만들어 온 과정이 다른 나라에 질문을 던지기 때문입니다.\n\n79\n00:10:05,878 --> 00:10:11,757\n협력 사업은 학교를 지어 주는 데서 끝나지 않습니다.\n\n80\n00:10:11,757 --> 00:10:20,676\n현지 교사가 계속 수업을 열고 주민이 시설을 관리할 수 있어야 의미가 있습니다.\n\n81\n00:10:20,676 --> 00:10:26,351\n어떤 마을에 새로운 시설이 생긴다고 가정해 봅니다.\n\n82\n00:10:26,351 --> 00:10:31,419\n건물을 짓는 일은 눈에 잘 보이는 성과입니다.\n\n83\n00:10:31,419 --> 00:10:43,581\n하지만 건물이 오래 쓸 수 있는 시설이 되려면 지역 주민의 필요를 듣고 유지보수 방법을 알려 주어야 합니다.\n\n84\n00:10:43,581 --> 00:10:54,527\n의사가 있는 병원인지, 깨끗한 물이 나오는 설비인지, 교사가 꾸준히 일하는 학교인지도 중요합니다.\n\n85\n00:10:54,527 --> 00:10:59,392\n실제 협력 사업마다 조건은 달라질 것입니다.\n\n86\n00:10:59,392 --> 00:11:08,311\n그래서 다른 나라에서 성공한 방식을 그냥 가져와서 똑같이 적용해서는 안 됩니다.\n\n87\n00:11:08,311 --> 00:11:14,189\n현지의 언어와 환경, 제도에 맞는 개선이 필요합니다.\n\n88\n00:11:14,189 --> 00:11:21,081\n한국이 배우고 나누어야 할 것도 바로 이 현실적인 태도입니다.\n\n89\n00:11:21,081 --> 00:11:30,000\n선의만으로 모든 문제가 해결되지는 않는다는 사실을 아는 것이 책임의 시작입니다.\n\n90\n00:11:30,000 --> 00:11:36,290\n두 번째 반전은 칭찬 뒤에 따라오는 권고입니다.\n\n91\n00:11:36,290 --> 00:11:51,774\nOECD의 동료 검토는 좋은 사례를 소개하는 동시에 사업의 질과 효율, 지역 주도성에 관한 개선 과제를 제시합니다.\n\n92\n00:11:51,774 --> 00:12:07,016\n한국이 국제적 지위를 얻었기 때문에 비판에서 자유로워지는 것이 아니라 오히려 더 엄격한 기준을 적용받는 것입니다.\n\n93\n00:12:07,016 --> 00:12:18,871\n어떤 사업이 누구의 삶을 바꿨는지 기록하고, 예상과 다른 결과가 나오면 바꾸어야 합니다.\n\n94\n00:12:18,871 --> 00:12:33,871\n원조받던 시절의 기억이 진짜 의미를 가지려면 상대 나라의 어려움을 단순한 수치로 다루지 않는 태도가 필요합니다.\n\n95\n00:12:33,871 --> 00:12:47,177\n한국이 과거의 아픔을 안다는 사실은 동정의 면허가 아니라 더 깊이 듣고 책임져야 할 이유가 됩니다.\n\n96\n00:12:47,177 --> 00:12:58,790\n받는 나라가 원하는 것을 먼저 듣는 태도는 도움을 제공하는 나라에도 어려운 과제입니다.\n\n97\n00:12:58,790 --> 00:13:05,565\n과거의 어려움을 기억하는 것이 시작일 수 있습니다.\n\n98\n00:13:05,565 --> 00:13:15,242\n외국 전문가의 긍정 평가를 강조하고 싶을수록 비판을 함께 살펴야 합니다.\n\n99\n00:13:15,242 --> 00:13:31,210\n국제기관은 한국의 발전 경험을 흥미로운 사례로 소개하면서도 더 효율적인 사업 운영과 정책 조정이 필요하다고 지적합니다.\n\n100\n00:13:31,210 --> 00:13:38,952\n그것을 한국을 무시한 반응이라고 받아들일 필요는 없습니다.\n\n101\n00:13:38,952 --> 00:13:46,694\n책임이 커졌기 때문에 더 정밀한 검증을 요구받는 것입니다.\n\n102\n00:13:46,694 --> 00:13:57,823\n어떤 사업은 효과가 크지만 어떤 사업은 예상한 만큼 성과를 내지 못할 수 있습니다.\n\n103\n00:13:57,823 --> 00:14:06,048\n그때 중요한 것은 실패를 감추지 않고 원인을 찾는 태도입니다.\n\n104\n00:14:06,048 --> 00:14:20,565\n개발협력의 진짜 가치는 행사를 얼마나 크게 열었느냐보다 현장 사람들의 생활이 실제로 좋아졌느냐에서 나옵니다.\n\n105\n00:14:20,565 --> 00:14:30,000\n이 기준을 지켜야 과거의 성장 경험도 설득력 있게 전해질 수 있습니다.\n\n106\n00:14:30,000 --> 00:14:37,862\n한때 한국에 보내진 원조 물자 상자를 기억하는 사람이 있을 것입니다.\n\n107\n00:14:37,862 --> 00:14:48,000\n그 상자를 받아 든 손이 오늘의 산업과 교육, 국제협력을 만든 모든 원인은 아니었습니다.\n\n108\n00:14:48,000 --> 00:14:55,862\n그러나 그 도움을 발판으로 다시 일어선 사람들의 노력이 이어졌습니다.\n\n109\n00:14:55,862 --> 00:15:04,552\n이제 한국은 다른 나라의 어려움 앞에서 무슨 도움을 줄 수 있는지 묻습니다.\n\n110\n00:15:04,552 --> 00:15:14,069\n이것이 나라가 바뀌었다는 가장 따뜻한 증거일지 모릅니다. 처음 질문으로 돌아갑니다.\n\n111\n00:15:14,069 --> 00:15:19,862\n원조받던 한국이 세계에 무엇을 보여 주게 됐을까요.\n\n112\n00:15:19,862 --> 00:15:29,172\n받은 것을 잊지 않고, 가능한 것을 나누며, 부족한 점은 다시 배우는 태도입니다.\n\n113\n00:15:29,172 --> 00:15:35,586\n그 변화는 숫자만큼이나 조용하고 깊은 자긍심을 남깁니다.\n\n114\n00:15:35,586 --> 00:15:47,793\n도움의 기억이 세대가 바뀐 뒤에도 이어질 때, 산업 발전의 성공담은 다른 나라와 나누는 책임으로 변합니다.\n\n115\n00:15:47,793 --> 00:15:57,103\n어려운 시절의 기억을 지나온 사람에게 한국의 변화는 특별하게 다가올 수 있습니다.\n\n116\n00:15:57,103 --> 00:16:10,345\n원조를 받으며 하루를 이어 가던 나라가 이제는 다른 나라의 교육과 보건을 위해 협력할 수 있는 역량을 갖추었습니다.\n\n117\n00:16:10,345 --> 00:16:20,483\n그러나 그 역량을 자랑하기 위해 과거의 고통을 지나치게 자극적으로 꾸밀 필요는 없습니다.\n\n118\n00:16:20,483 --> 00:16:30,000\n폐허가 된 도시의 실제 기록과 이후의 산업, 교육 발전을 차례로 보여 주면 됩니다.\n\n119\n00:16:30,000 --> 00:16:38,276\n그리고 오늘의 국제협력 현장을 연결하면 시간의 변화가 더욱 또렷해집니다.\n\n120\n00:16:38,276 --> 00:16:48,414\n우리가 도움을 받았다는 사실을 잊지 않는다면 누군가의 어려움을 함부로 대할 수 없습니다.\n\n121\n00:16:48,414 --> 00:17:00,000\n성장한 나라의 품격은 큰 숫자를 내세우는 말보다 다른 사람의 필요를 정확히 듣는 모습에서 완성됩니다.\n","cuts":[{"shot":"S01","output_start":"00:00:00","output_end":"00:00:25","beat":"1","narration_prompt":"한국은 전쟁 뒤 국제 원조를 받던 나라였습니다.","visual":"권리 확인된 실제 외국인 호평 클립 1~4초 2~4개가 확보될 때만 배치; 기본 상태는 승인 대기","source_candidates":"https://www.oecd.org/en/publications/korean-focus-areas_f91f3b75-en/from-emerging-donor-to-global-development-partner_66044045-en.html; https://www.oecd.org/en/publications/oecd-development-co-operation-peer-reviews-korea-2024_889c6564-en.html","foreign_clip_id":"미확정","source_IN":"","source_OUT":"","source_audio_status":"UNVERIFIED","rights":"NOT_CLEARED","overlay":"외국인 실제 발언 (확인 전 빈칸)","emotion":"3","note":"4초 이하 컷은 목표, 저작권 보장 아님"},{"shot":"S02","output_start":"00:00:25","output_end":"00:00:50","beat":"1","narration_prompt":"어떻게 이런 변화가 가능했을까요.","visual":"권리 확인된 실제 외국인 호평 클립 1~4초 2~4개가 확보될 때만 배치; 기본 상태는 승인 대기","source_candidates": ibili 외국인 관중의 실제 한국 야구 응원 호평부터 시작, 원음 확인 전 대사 생성 금지.","중국인은 왜 부산 야구장 티켓을 샀을까?","한국 관중의 응원은 다른 나라와 어떻게 다른가?","경기가 시작되기 전부터 즐거운 이유는?","1차 반전: 경기 결과 외에 관람 경험 자체가 목적이 된다.","응원도구·노래·현장 음향은 무엇을 보여주나?","2차 반전: 해외 관중의 반응도 하나로 같지 않다.","당사자의 마지막 소감으로 회수한다."],"source_links":[["Bilibili 게시자 기본祐利_","2025-08-26","부산 야구장 소개 영상; 업로더 스스로 한국인 유학생이라 소개, 중국인 관중 원음으로 사용 금지","https://www.bilibili.com/list/3546592124602439?bvid=BV1wvvNztErz&oid=115094805614509","원영상 소개 / 권리불명"],["미국 ESPN 인터뷰","2024","자비에 스크럭스: 한국 야구 관중의 응원·노래·열기 경험","https://espnpressroom.com/feature/xavier-scruggs-qa/","외국인 인터뷰"],["한국 영자 매체의 외국인 인터뷰","2026-04-06","외국 관중들이 한국 응원문화에 끌린 사례, 국내 매체 취재와 외국인 발언 구분","https://www.chosun.com/english/national-en/2026/04/06/OI46KMICQBA7VOBXTXPSGJCLLE/","외국인 발언 / 국내 취재"]],"correction":"Bilibili 원영상 게시자는 한국인이라고 소개함. 제목을 중국 관중 직접 칭찬으로 쓰지 않음. 차별화 보강 필요.","parts":["부산 야구장에서는 경기 전부터 노래가 시작됩니다. 중국어 영상 플랫폼에도 그 열기가 소개됐습니다. 해외 야구 팬이 놀라는 이유는 무엇일까요. 점수판 밖에 또 하나의 경기가 열리고 있었습니다. 그 주인공은 선수만이 아니라 관중이었습니다.","한국 프로야구는 도시마다 서로 다른 응원 문화를 키워 왔습니다. 같은 규칙으로 경기를 해도 관중석의 분위기는 팀에 따라 달라집니다. 부산의 롯데 자이언츠를 응원하는 사람들에게 야구장은 경기 결과만 확인하는 장소가 아닙니다. 응원가와 함께 동작을 맞추고 처음 보는 사람들과 소리를 모으는 장소입니다. 빌리빌리의 해당 영상도 부산의 야구 응원이 얼마나 활기찬지 보여 주려는 소개를 담고 있습니다. 중국어로 작성된 제목이 있다는 이유만으로 영상 속 모든 인물을 중국인이라고 단정해서는 안 됩니다. 대신 한국인 제작자가 왜 중국어 플랫폼 시청자에게 이 풍경을 소개했는지 생각해 볼 수 있습니다. 누군가에게 너무 익숙한 일상이 다른 누군가에겐 처음 보는 문화가 되기도 합니다.\n\n야구장이 있는 도시마다 응원가와 좌석의 분위기가 달라질 수 있습니다. 팀에 대한 기억과 지역의 기억이 서로 이어집니다.\n\n한 도시의 야구팀을 좋아하는 마음은 종종 가족의 기억과 연결됩니다. 부모가 응원하던 팀을 아이가 함께 응원하고, 친구와 같은 유니폼을 입으며 해마다 구장을 찾습니다. 스포츠가 한 도시의 문화가 되는 과정은 숫자와 승패만으로 다 설명되지 않습니다. 부산의 응원석은 이런 지역적 정체성이 강하게 느껴지는 장소 중 하나입니다. 그 풍경이 해외 플랫폼에 올라오는 것은 한국인에게 익숙한 일상이 다른 언어권의 시청자에게도 소개된다는 뜻입니다. 하지만 누가 영상에 나왔는지, 실제로 누가 감탄했는지는 따로 확인해야 합니다. 한국인이 중국어로 만든 영상을 중국인의 체험담으로 바꾸면 그 영상의 진짜 매력도 왜곡됩니다.","야구에서는 긴 경기 시간 동안 타석과 수비가 번갈아 진행됩니다. 점수가 매 순간 바뀌는 종목이 아니므로 경기 흐름을 잘 모르는 사람은 처음에 지루하다고 느낄 수도 있습니다. 그런데 한국 야구장에는 응원단과 치어리더, 팀마다 다른 응원가가 있습니다. 관중이 가사를 완벽히 몰라도 박자를 함께 맞추며 참여할 수 있습니다. 외국인에게는 경기 규칙을 모두 이해하기 전부터 현장에 속해 있다는 느낌이 생길 수 있습니다. 그 경험이 얼마나 특별한지는 실제로 방문한 외국인의 말에서 확인해야 합니다. 단지 화면 속 관중이 크게 소리 지른다는 이유만으로 해외에서 열광했다고 쓰는 것은 다른 이야기입니다.\n\n경기를 처음 보는 사람은 파울과 아웃부터 익히기도 바쁩니다. 하지만 박자와 응원가에는 처음부터 참여할 수 있습니다.\n\n경기장에 들어선 처음 몇 분 동안은 낯설 수 있습니다. 선수의 이름이 적힌 응원가가 시작되고 관중이 일어서는 순간, 처음 온 사람은 무엇을 해야 할지 망설일지도 모릅니다. 곧 옆자리의 박자를 따라 하며 몸을 움직일 수 있습니다. 이런 변화는 한국의 야구장에 적응하는 하나의 가능성을 보여 주지만, 특정 외국인이 실제로 그렇게 행동했다고 확인되지 않은 경우 발언으로 꾸미면 안 됩니다. 대신 누구나 볼 수 있는 응원 단체 동작과 실제 관중 인터뷰를 분리해서 소개할 수 있습니다. 친숙해지는 과정을 설명하고 싶다면 여러 방문객의 각기 다른 반응을 나란히 놓는 편이 정확합니다. 그 차이가 오히려 현장의 다양성을 살립니다.","야구장의 매력은 응원만으로 설명되지 않습니다. 친구들과 음식을 나눠 먹고 팀 유니폼을 입으며 경기를 기다리는 시간까지 하나의 체험이 됩니다. 팬들은 경기가 잘 풀리지 않을 때에도 응원가를 멈추지 않습니다. 외국에서 온 관광객에게는 이런 지속적인 관중 참여가 낯설 수 있습니다. 미국의 전 KBO 선수이자 ESPN 해설자였던 자비에 스크럭스는 한국의 팬들이 경기 상황과 관계없이 노래하고 춤추는 열정을 특별하게 기억한다고 인터뷰했습니다. 실제 한국에서 뛰어 본 외국인의 경험이라는 점에서 가치가 있습니다. 하지만 한 사람의 긍정적 경험을 모든 외국인의 생각으로 확대할 필요는 없습니다. 현장의 힘은 실제 목소리 하나로도 충분히 전해지기 때문입니다.\n\n점수를 못 내는 순간에도 관중은 식사하고 노래하며 경기를 기다립니다. 관람이 하나의 축제가 되는 이유입니다.\n\n스포츠에서 모든 시간을 승부의 긴장으로 채울 수는 없습니다. 투수가 준비하고 타자가 들어서며 수비 위치가 바뀌는 동안 경기에는 자연스러운 쉼이 생깁니다. 한국 야구장의 응원 문화는 그런 시간에도 관중이 함께 움직이도록 해 줍니다. 경기 속도가 느리다고 느끼는 사람에게는 이런 참여가 새로운 즐거움이 될 수 있습니다. 어떤 팬은 응원가에 더 빠지고, 어떤 팬은 타격과 수비의 세밀한 기술에 집중합니다. 서로 다른 즐기는 방법이 공존한다는 것이 스포츠의 매력입니다. 외국인이 한국 야구장을 좋아했다고 해도 모든 문화가 완전히 같다고 느끼지는 않을 것입니다. 바로 그 차이를 보여 줄 때 이야기는 더 풍부해집니다.","첫 번째 반전은 경기의 승패가 관중 경험의 전부는 아니라는 점입니다. 야구를 보러 왔다가 응원 문화를 기억하는 방문객이 있습니다. 그들 중에는 선수 이름이나 규칙을 처음엔 잘 모르는 사람도 있습니다. 관중석의 박자를 따라가다 보면 경기 외의 즐거움도 생기기 때문입니다. 한국을 찾는 외국인이 야구장을 관광 일정에 넣는 현상은 이런 참여형 문화와 연결됩니다. 하지만 야구장이 누구에게나 자동으로 즐거운 곳이 되는 것은 아닙니다. 날씨와 긴 대기, 낯선 응원 문화, 표를 구하기 어려운 날도 있습니다. 그래서 더 중요한 것은 실제 체험한 사람의 반응과 상황을 함께 보여 주는 일입니다.\n\n외국인의 실제 반응을 밝힐 때는 누가 말했는지 확인해야 합니다. 미국 선수의 경험과 중국어 플랫폼의 한국인 게시물을 같은 사람의 이야기로 묶지 않습니다.\n\n외국에서 온 팬이 한국 야구장을 찾는 데에는 여러 이유가 있을 수 있습니다. 야구 자체를 좋아할 수도 있고, 한국 여행의 새로운 경험을 찾을 수도 있습니다. 응원가 영상이 소셜미디어에서 퍼지면서 호기심이 생기는 경우도 실제 취재에 등장합니다. 그러나 관중 수가 늘었다는 사실만으로 어느 나라가 한국 야구를 모두 부러워한다고 결론 낼 수는 없습니다. 확인된 외국인 인터뷰 한 건을 소개하고 그 사람이 어떤 이유로 찾았는지 설명하면 충분합니다. 실제로 경기장에 도착한 뒤 무엇을 즐겼는지는 당사자의 말과 표정을 통해 확인해야 합니다. 이야기의 주인공이 외국인이라면 그 사람의 경험을 작가의 상상으로 대체하지 않는 것이 중요합니다.","2026년 국내 영자 매체는 실제 미국 관중과 외국인 방문객들이 한국 야구장의 응원을 즐긴 사례를 취재했습니다. 미국의 한 방문객은 영상으로 본 단체 응원에 호기심이 생겨 경기장을 찾았다고 말합니다. 경기 내내 이어지는 관중의 참여가 인상적이었다는 설명도 나옵니다. 이 자료는 한국 언론이 취재했지만 실제 외국인 당사자의 발언을 담고 있다는 점을 따로 표기해야 합니다. 정부나 한국 전문가가 야구 문화를 칭찬했다고 해서 해외 반응으로 바꾸면 안 됩니다. 당사자의 국적과 말한 내용을 확인한 뒤 화면에 소개해야 합니다. 문장의 힘은 화려한 수식어보다 누가 어떤 장면에서 느꼈느냐에 달려 있습니다.\n\nESPN에 실린 스크럭스의 인터뷰는 실제 외국인 경험입니다. 한국에서 야구를 한 사람의 말이므로 단순한 관광객 평가와도 구분하면 더 입체적입니다.\n\n자비에 스크럭스는 한국에서 프로 선수로 활동했고 이후 ESPN과의 인터뷰에서 응원문화를 떠올렸습니다. 그의 경험은 일반 여행객과 다릅니다. 선수는 경기장 안에서 관중의 소리를 듣고, 점수가 앞서거나 뒤질 때마다 분위기를 느낍니다. 그래서 그의 말에는 응원석의 에너지가 경기의 흐름과 어떻게 연결되는지에 관한 단서가 있습니다. 반면 관광객에게는 팀 유니폼과 먹거리, 처음 배우는 응원가가 더 기억에 남을 수도 있습니다. 이 둘을 합치면 한국 야구장의 매력이 경기를 하는 사람과 보는 사람 모두에게 다르게 다가간다는 사실이 보입니다. 한 종류의 칭찬만 모아 놓는 것보다 훨씬 입체적인 이야기입니다.","두 번째 반전은 모든 외국인의 반응이 똑같지는 않다는 사실입니다. 어떤 사람은 응원단의 열정에 놀라고, 어떤 사람은 경기 자체를 조용히 보고 싶어 할 수 있습니다. 모두가 같은 방식으로 즐겨야 좋은 문화가 되는 것은 아닙니다. 외국인이 한국식 응원을 처음 접했을 때 어색함을 느낄 수도 있고, 두 번째 방문에서 자연스럽게 따라 하게 될 수도 있습니다. 실제 변화가 확인되지 않았다면 한 사람의 극적인 변심을 꾸며 낼 필요는 없습니다. 서로 다른 외국인의 체험을 나란히 놓는 것만으로도 한국 야구가 얼마나 다양한 방식으로 기억되는지 드러납니다. 수많은 사람이 같은 노래를 부르지만 그 노래를 받아들이는 감정은 모두 다릅니다.\n\n시끌벅적한 분위기를 낯설어하는 사람도 있을 것입니다. 그것을 억지로 한국이 최고라며 반박하는 대신 서로 다른 관람 취향을 존중하면 됩니다.\n\n좋은 문화를 소개할 때 아쉬운 부분을 꼭 숨길 필요는 없습니다. 표를 구하기 어려운 날도 있고 구장까지 이동하는 일이 복잡할 수도 있습니다. 응원 소리가 너무 크다고 느끼는 사람도 있을 수 있습니다. 실제 외국인의 그런 불편이 확인됐다면 그대로 다뤄도 좋습니다. 그 다음에 다른 외국인의 긍정 평가를 연결하되 한 사람이 갑자기 마음을 바꾼 것처럼 편집하지 않아야 합니다. 같은 풍경을 서로 다르게 느끼는 것이 문화 체험의 자연스러운 모습이기 때문입니다. 누군가 처음에는 낯설다고 느낀다고 해서 그것을 한국에 대한 모욕으로 받아들일 이유도 없습니다. 서로 다른 관점을 통해 문화의 매력과 한계를 함께 보여 주면 시청자는 더 오래 믿게 됩니다.","부산 야구장의 응원 소리는 화면 밖까지 이어집니다. 이 도시에서 오래 살아온 사람에게는 응원가 한 소절이 젊은 시절의 기억을 불러올지도 모릅니다. 처음 찾은 여행객에게는 새로운 도시의 인사처럼 들릴 수 있습니다. 한국 야구의 진짜 장점은 다른 나라의 야구보다 반드시 우월하다는 선언에 있지 않습니다. 함께 즐길 수 있는 문화를 오랜 시간 다듬어 왔다는 사실에 있습니다. 처음의 질문을 되짚어 봅니다. 외국인은 야구장에서 무엇을 기억할까요. 홈런의 순간일 수도, 낯선 노래를 옆사람과 함께 불렀던 순간일 수도 있습니다. 그 작은 경험이 한 나라의 문화를 다시 찾게 만드는 시작이 될 수 있습니다.\n\n관중석에서 박자를 맞추는 일은 누구나 한번 해 볼 수 있습니다. 낯선 사람을 동료 팬으로 만드는 경험에 이 문화의 매력이 있습니다.\n\n부산 구장에서 오래 울려 퍼진 응원가는 도시의 시간을 함께 기억하는 소리일지도 모릅니다. 승리한 날에는 환호가 있고 패배한 날에는 아쉬움이 있습니다. 그 모든 날에 관중이 다시 모인다는 사실이 팀을 지역의 일부로 만듭니다. 해외에서 온 사람이 그 현장을 경험한다면 그에게는 처음 듣는 한국의 소리일 수 있습니다. 그러나 그 소리가 우리에게는 어릴 적 아버지와 함께 갔던 경기장의 기억을 떠올리게 할 수도 있습니다. 이 마지막 장면을 특정 가족의 실화로 만들어 버릴 필요는 없습니다. 누구나 자신의 시간을 떠올릴 수 있게 남겨 두는 편이 깊은 여운을 줍니다. 문화의 힘은 누군가가 이해하게 되는 순간뿐 아니라 이미 알고 있던 사람의 기억을 새롭게 열어 주는 순간에도 있습니다."],"duration_target_sec":1020,"duration_measured_sec":null,"narration_chars":5519,"source_audio_confirmed":false,"source_in_out_confirmed":false,"rights_confirmed":false,"narration_synthesized":false,"provisional_srt":true,"emotion_curve":[3,3,2,3,4,3,5,5],"reference_group":"스포츠","foreign_opening_status":"2~4개 외국인 실음성 클립 미확보. 첫 12초 0:00-0:12 임시 배치 불가.","planned_srt":"1\n00:00:00,000 --> 00:00:09,567\n부산 야구장에서는 경기 전부터 노래가 시작됩니다.\n\n2\n00:00:09,567 --> 00:00:18,780\n중국어 영상 플랫폼에도 그 열기가 소개됐습니다.\n\n3\n00:00:18,780 --> 00:00:26,929\n해외 야구 팬이 놀라는 이유는 무엇일까요.\n\n4\n00:00:26,929 --> 00:00:36,496\n점수판 밖에 또 하나의 경기가 열리고 있었습니다.\n\n5\n00:00:36,496 --> 00:00:45,000\n그 주인공은 선수만이 아니라 관중이었습니다.\n\n6\n00:00:45,000 --> 00:00:49,817\n한국 프로야구는 도시마다 서로 다른 응원 문화를 키워 왔습니다.\n\n7\n00:00:49,817 --> 00:00:54,908\n같은 규칙으로 경기를 해도 관중석의 분위기는 팀에 따라 달라집니다.\n\n8\n00:00:54,908 --> 00:01:01,789\n부산의 롯데 자이언츠를 응원하는 사람들에게 야구장은 경기 결과만 확인하는 장소가 아닙니다.\n\n9\n00:01:01,789 --> 00:01:07,431\n응원가와 함께 동작을 맞추고 처음 보는 사람들과 소리를 모으는 장소입니다.\n\n10\n00:01:07,431 --> 00:01:14,587\n빌리빌리의 해당 영상도 부산의 야구 응원이 얼마나 활기찬지 보여 주려는 소개를 담고 있습니다.\n\n11\n00:01:14,587 --> 00:01:22,018\n중국어로 작성된 제목이 있다는 이유만으로 영상 속 모든 인물을 중국인이라고 단정해서는 안 됩니다.\n\n12\n00:01:22,018 --> 00:01:29,312\n대신 한국인 제작자가 왜 중국어 플랫폼 시청자에게 이 풍경을 소개했는지 생각해 볼 수 있습니다.\n\n13\n00:01:29,312 --> 00:01:35,367\n누군가에게 너무 익숙한 일상이 다른 누군가에겐 처음 보는 문화가 되기도 합니다.\n\n14\n00:01:35,367 --> 00:01:40,596\n야구장이 있는 도시마다 응원가와 좌석의 분위기가 달라질 수 있습니다.\n\n15\n00:01:40,596 --> 00:01:44,312\n팀에 대한 기억과 지역의 기억이 서로 이어집니다.\n\n16\n00:01:44,312 --> 00:01:49,404\n한 도시의 야구팀을 좋아하는 마음은 종종 가족의 기억과 연결됩니다.\n\n17\n00:01:49,404 --> 00:01:56,835\n부모가 응원하던 팀을 아이가 함께 응원하고, 친구와 같은 유니폼을 입으며 해마다 구장을 찾습니다.\n\n18\n00:01:56,835 --> 00:02:02,890\n스포츠가 한 도시의 문화가 되는 과정은 숫자와 승패만으로 다 설명되지 않습니다.\n\n19\n00:02:02,890 --> 00:02:08,532\n부산의 응원석은 이런 지역적 정체성이 강하게 느껴지는 장소 중 하나입니다.\n\n20\n00:02:08,532 --> 00:02:17,064\n그 풍경이 해외 플랫폼에 올라오는 것은 한국인에게 익숙한 일상이 다른 언어권의 시청자에게도 소개된다는 뜻입니다.\n\n21\n00:02:17,064 --> 00:02:22,982\n하지만 누가 영상에 나왔는지, 실제로 누가 감탄했는지는 따로 확인해야 합니다.\n\n22\n00:02:22,982 --> 00:02:30,000\n한국인이 중국어로 만든 영상을 중국인의 체험담으로 바꾸면 그 영상의 진짜 매력도 왜곡됩니다.\n\n23\n00:02:30,000 --> 00:02:35,793\n야구에서는 긴 경기 시간 동안 타석과 수비가 번갈아 진행됩니다.\n\n24\n00:02:35,793 --> 00:02:45,724\n점수가 매 순간 바뀌는 종목이 아니므로 경기 흐름을 잘 모르는 사람은 처음에 지루하다고 느낄 수도 있습니다.\n\n25\n00:02:45,724 --> 00:02:52,510\n그런데 한국 야구장에는 응원단과 치어리더, 팀마다 다른 응원가가 있습니다.\n\n26\n00:02:52,510 --> 00:02:58,800\n관중이 가사를 완벽히 몰라도 박자를 함께 맞추며 참여할 수 있습니다.\n\n27\n00:02:58,800 --> 00:03:07,241\n외국인에게는 경기 규칙을 모두 이해하기 전부터 현장에 속해 있다는 느낌이 생길 수 있습니다.\n\n28\n00:03:07,241 --> 00:03:14,193\n그 경험이 얼마나 특별한지는 실제로 방문한 외국인의 말에서 확인해야 합니다.\n\n29\n00:03:14,193 --> 00:03:23,462\n단지 화면 속 관중이 크게 소리 지른다는 이유만으로 해외에서 열광했다고 쓰는 것은 다른 이야기입니다.\n\n30\n00:03:23,462 --> 00:03:28,924\n경기를 처음 보는 사람은 파울과 아웃부터 익히기도 바쁩니다.\n\n31\n00:03:28,924 --> 00:03:33,890\n하지만 박자와 응원가에는 처음부터 참여할 수 있습니다.\n\n32\n00:03:33,890 --> 00:03:38,855\n경기장에 들어선 처음 몇 분 동안은 낯설 수 있습니다.\n\n33\n00:03:38,855 --> 00:03:49,448\n선수의 이름이 적힌 응원가가 시작되고 관중이 일어서는 순간, 처음 온 사람은 무엇을 해야 할지 망설일지도 모릅니다.\n\n34\n00:03:49,448 --> 00:03:54,579\n곧 옆자리의 박자를 따라 하며 몸을 움직일 수 있습니다.\n\n35\n00:03:54,579 --> 00:04:08,814\n이런 변화는 한국의 야구장에 적응하는 하나의 가능성을 보여 주지만, 특정 외국인이 실제로 그렇게 행동했다고 확인되지 않은 경우 발언으로 꾸미면 안 됩니다.\n\n36\n00:04:08,814 --> 00:04:17,255\n대신 누구나 볼 수 있는 응원 단체 동작과 실제 관중 인터뷰를 분리해서 소개할 수 있습니다.\n\n37\n00:04:17,255 --> 00:04:26,028\n친숙해지는 과정을 설명하고 싶다면 여러 방문객의 각기 다른 반응을 나란히 놓는 편이 정확합니다.\n\n38\n00:04:26,028 --> 00:04:30,000\n그 차이가 오히려 현장의 다양성을 살립니다.\n\n39\n00:04:30,000 --> 00:04:34,021\n야구장의 매력은 응원만으로 설명되지 않습니다.\n\n40\n00:04:34,021 --> 00:04:42,386\n친구들과 음식을 나눠 먹고 팀 유니폼을 입으며 경기를 기다리는 시간까지 하나의 체험이 됩니다.\n\n41\n00:04:42,386 --> 00:04:48,016\n팬들은 경기가 잘 풀리지 않을 때에도 응원가를 멈추지 않습니다.\n\n42\n00:04:48,016 --> 00:04:54,290\n외국에서 온 관광객에게는 이런 지속적인 관중 참여가 낯설 수 있습니다.\n\n43\n00:04:54,290 --> 00:05:08,445\n미국의 전 KBO 선수이자 ESPN 해설자였던 자비에 스크럭스는 한국의 팬들이 경기 상황과 관계없이 노래하고 춤추는 열정을 특별하게 기억한다고 인터뷰했습니다.\n\n44\n00:05:08,445 --> 00:05:14,397\n실제 한국에서 뛰어 본 외국인의 경험이라는 점에서 가치가 있습니다.\n\n45\n00:05:14,397 --> 00:05:21,475\n하지만 한 사람의 긍정적 경험을 모든 외국인의 생각으로 확대할 필요는 없습니다.\n\n46\n00:05:21,475 --> 00:05:26,944\n현장의 힘은 실제 목소리 하나로도 충분히 전해지기 때문입니다.\n\n47\n00:05:26,944 --> 00:05:33,056\n점수를 못 내는 순간에도 관중은 식사하고 노래하며 경기를 기다립니다.\n\n48\n00:05:33,056 --> 00:05:36,434\n관람이 하나의 축제가 되는 이유입니다.\n\n49\n00:05:36,434 --> 00:05:41,743\n스포츠에서 모든 시간을 승부의 긴장으로 채울 수는 없습니다.\n\n50\n00:05:41,743 --> 00:05:49,946\n투수가 준비하고 타자가 들어서며 수비 위치가 바뀌는 동안 경기에는 자연스러운 쉼이 생깁니다.\n\n51\n00:05:49,946 --> 00:05:56,702\n한국 야구장의 응원 문화는 그런 시간에도 관중이 함께 움직이도록 해 줍니다.\n\n52\n00:05:56,702 --> 00:06:04,263\n경기 속도가 느리다고 느끼는 사람에게는 이런 참여가 새로운 즐거움이 될 수 있습니다.\n\n53\n00:06:04,263 --> 00:06:11,662\n어떤 팬은 응원가에 더 빠지고, 어떤 팬은 타격과 수비의 세밀한 기술에 집중합니다.\n\n54\n00:06:11,662 --> 00:06:17,131\n서로 다른 즐기는 방법이 공존한다는 것이 스포츠의 매력입니다.\n\n55\n00:06:17,131 --> 00:06:25,174\n외국인이 한국 야구장을 좋아했다고 해도 모든 문화가 완전히 같다고 느끼지는 않을 것입니다.\n\n56\n00:06:25,174 --> 00:06:30,000\n바로 그 차이를 보여 줄 때 이야기는 더 풍부해집니다.\n\n57\n00:06:30,000 --> 00:06:37,641\n첫 번째 반전은 경기의 승패가 관중 경험의 전부는 아니라는 점입니다.\n\n58\n00:06:37,641 --> 00:06:44,276\n야구를 보러 왔다가 응원 문화를 기억하는 방문객이 있습니다.\n\n59\n00:06:44,276 --> 00:06:51,917\n그들 중에는 선수 이름이나 규칙을 처음엔 잘 모르는 사람도 있습니다.\n\n60\n00:06:51,917 --> 00:06:59,558\n관중석의 박자를 따라가다 보면 경기 외의 즐거움도 생기기 때문입니다.\n\n61\n00:06:59,558 --> 00:07:09,209\n한국을 찾는 외국인이 야구장을 관광 일정에 넣는 현상은 이런 참여형 문화와 연결됩니다.\n\n62\n00:07:09,209 --> 00:07:16,850\n하지만 야구장이 누구에게나 자동으로 즐거운 곳이 되는 것은 아닙니다.\n\n63\n00:07:16,850 --> 00:07:24,692\n날씨와 긴 대기, 낯선 응원 문화, 표를 구하기 어려운 날도 있습니다.\n\n64\n00:07:24,692 --> 00:07:33,941\n그래서 더 중요한 것은 실제 체험한 사람의 반응과 상황을 함께 보여 주는 일입니다.\n\n65\n00:07:33,941 --> 00:07:40,979\n외국인의 실제 반응을 밝힐 때는 누가 말했는지 확인해야 합니다.\n\n66\n00:07:40,979 --> 00:07:50,831\n미국 선수의 경험과 중국어 플랫폼의 한국인 게시물을 같은 사람의 이야기로 묶지 않습니다.\n\n67\n00:07:50,831 --> 00:07:59,276\n외국에서 온 팬이 한국 야구장을 찾는 데에는 여러 이유가 있을 수 있습니다.\n\n68\n00:07:59,276 --> 00:08:08,123\n야구 자체를 좋아할 수도 있고, 한국 여행의 새로운 경험을 찾을 수도 있습니다.\n\n69\n00:08:08,123 --> 00:08:17,574\n응원가 영상이 소셜미디어에서 퍼지면서 호기심이 생기는 경우도 실제 취재에 등장합니다.\n\n70\n00:08:17,574 --> 00:08:29,236\n그러나 관중 수가 늘었다는 사실만으로 어느 나라가 한국 야구를 모두 부러워한다고 결론 낼 수는 없습니다.\n\n71\n00:08:29,236 --> 00:08:39,491\n확인된 외국인 인터뷰 한 건을 소개하고 그 사람이 어떤 이유로 찾았는지 설명하면 충분합니다.\n\n72\n00:08:39,491 --> 00:08:49,343\n실제로 경기장에 도착한 뒤 무엇을 즐겼는지는 당사자의 말과 표정을 통해 확인해야 합니다.\n\n73\n00:08:49,343 --> 00:09:00,000\n이야기의 주인공이 외국인이라면 그 사람의 경험을 작가의 상상으로 대체하지 않는 것이 중요합니다.\n\n74\n00:09:00,000 --> 00:09:12,705\n2026년 국내 영자 매체는 실제 미국 관중과 외국인 방문객들이 한국 야구장의 응원을 즐긴 사례를 취재했습니다.\n\n75\n00:09:12,705 --> 00:09:22,541\n미국의 한 방문객은 영상으로 본 단체 응원에 호기심이 생겨 경기장을 찾았다고 말합니다.\n\n76\n00:09:22,541 --> 00:09:29,918\n경기 내내 이어지는 관중의 참여가 인상적이었다는 설명도 나옵니다.\n\n77\n00:09:29,918 --> 00:09:41,598\n이 자료는 한국 언론이 취재했지만 실제 외국인 당사자의 발언을 담고 있다는 점을 따로 표기해야 합니다.\n\n78\n00:09:41,598 --> 00:09:51,025\n정부나 한국 전문가가 야구 문화를 칭찬했다고 해서 해외 반응으로 바꾸면 안 됩니다.\n\n79\n00:09:51,025 --> 00:09:58,197\n당사자의 국적과 말한 내용을 확인한 뒤 화면에 소개해야 합니다.\n\n80\n00:09:58,197 --> 00:10:06,803\n문장의 힘은 화려한 수식어보다 누가 어떤 장면에서 느꼈느냐에 달려 있습니다.\n\n81\n00:10:06,803 --> 00:10:13,566\nESPN에 실린 스크럭스의 인터뷰는 실제 외국인 경험입니다.\n\n82\n00:10:13,566 --> 00:10:23,197\n한국에서 야구를 한 사람의 말이므로 단순한 관광객 평가와도 구분하면 더 입체적입니다.\n\n83\n00:10:23,197 --> 00:10:34,672\n자비에 스크럭스는 한국에서 프로 선수로 활동했고 이후 ESPN과의 인터뷰에서 응원문화를 떠올렸습니다.\n\n84\n00:10:34,672 --> 00:10:38,770\n그의 경험은 일반 여행객과 다릅니다.\n\n85\n00:10:38,770 --> 00:10:49,016\n선수는 경기장 안에서 관중의 소리를 듣고, 점수가 앞서거나 뒤질 때마다 분위기를 느낍니다.\n\n86\n00:10:49,016 --> 00:10:59,672\n그래서 그의 말에는 응원석의 에너지가 경기의 흐름과 어떻게 연결되는지에 관한 단서가 있습니다.\n\n87\n00:10:59,672 --> 00:11:10,123\n반면 관광객에게는 팀 유니폼과 먹거리, 처음 배우는 응원가가 더 기억에 남을 수도 있습니다.\n\n88\n00:11:10,123 --> 00:11:22,828\n이 둘을 합치면 한국 야구장의 매력이 경기를 하는 사람과 보는 사람 모두에게 다르게 다가간다는 사실이 보입니다.\n\n89\n00:11:22,828 --> 00:11:30,000\n한 종류의 칭찬만 모아 놓는 것보다 훨씬 입체적인 이야기입니다.\n\n90\n00:11:30,000 --> 00:11:38,427\n두 번째 반전은 모든 외국인의 반응이 똑같지는 않다는 사실입니다.\n\n91\n00:11:38,427 --> 00:11:51,066\n어떤 사람은 응원단의 열정에 놀라고, 어떤 사람은 경기 자체를 조용히 보고 싶어 할 수 있습니다.\n\n92\n00:11:51,066 --> 00:11:59,025\n모두가 같은 방식으로 즐겨야 좋은 문화가 되는 것은 아닙니다.\n\n93\n00:11:59,025 --> 00:12:15,176\n외국인이 한국식 응원을 처음 접했을 때 어색함을 느낄 수도 있고, 두 번째 방문에서 자연스럽게 따라 하게 될 수도 있습니다.\n\n94\n00:12:15,176 --> 00:12:25,709\n실제 변화가 확인되지 않았다면 한 사람의 극적인 변심을 꾸며 낼 필요는 없습니다.\n\n95\n00:12:25,709 --> 00:12:39,753\n서로 다른 외국인의 체험을 나란히 놓는 것만으로도 한국 야구가 얼마나 다양한 방식으로 기억되는지 드러납니다.\n\n96\n00:12:39,753 --> 00:12:50,052\n수많은 사람이 같은 노래를 부르지만 그 노래를 받아들이는 감정은 모두 다릅니다.\n\n97\n00:12:50,052 --> 00:12:56,840\n시끌벅적한 분위기를 낯설어하는 사람도 있을 것입니다.\n\n98\n00:12:56,840 --> 00:13:07,841\n그것을 억지로 한국이 최고라며 반박하는 대신 서로 다른 관람 취향을 존중하면 됩니다.\n\n99\n00:13:07,841 --> 00:13:16,034\n좋은 문화를 소개할 때 아쉬운 부분을 꼭 숨길 필요는 없습니다.\n\n100\n00:13:16,034 --> 00:13:25,865\n표를 구하기 어려운 날도 있고 구장까지 이동하는 일이 복잡할 수도 있습니다.\n\n101\n00:13:25,865 --> 00:13:33,355\n응원 소리가 너무 크다고 느끼는 사람도 있을 수 있습니다.\n\n102\n00:13:33,355 --> 00:13:41,313\n실제 외국인의 그런 불편이 확인됐다면 그대로 다뤄도 좋습니다.\n\n103\n00:13:41,313 --> 00:13:55,358\n그 다음에 다른 외국인의 긍정 평가를 연결하되 한 사람이 갑자기 마음을 바꾼 것처럼 편집하지 않아야 합니다.\n\n104\n00:13:55,358 --> 00:14:05,891\n같은 풍경을 서로 다르게 느끼는 것이 문화 체험의 자연스러운 모습이기 때문입니다.\n\n105\n00:14:05,891 --> 00:14:18,062\n누군가 처음에는 낯설다고 느낀다고 해서 그것을 한국에 대한 모욕으로 받아들일 이유도 없습니다.\n\n106\n00:14:18,062 --> 00:14:30,000\n서로 다른 관점을 통해 문화의 매력과 한계를 함께 보여 주면 시청자는 더 오래 믿게 됩니다.\n\n107\n00:14:30,000 --> 00:14:35,476\n부산 야구장의 응원 소리는 화면 밖까지 이어집니다.\n\n108\n00:14:35,476 --> 00:14:45,645\n이 도시에서 오래 살아온 사람에게는 응원가 한 소절이 젊은 시절의 기억을 불러올지도 모릅니다.\n\n109\n00:14:45,645 --> 00:14:52,686\n처음 찾은 여행객에게는 새로운 도시의 인사처럼 들릴 수 있습니다.\n\n110\n00:14:52,686 --> 00:15:02,073\n한국 야구의 진짜 장점은 다른 나라의 야구보다 반드시 우월하다는 선언에 있지 않습니다.\n\n111\n00:15:02,073 --> 00:15:09,505\n함께 즐길 수 있는 문화를 오랜 시간 다듬어 왔다는 사실에 있습니다.\n\n112\n00:15:09,505 --> 00:15:16,936\n처음의 질문을 되짚어 봅니다. 외국인은 야구장에서 무엇을 기억할까요.\n\n113\n00:15:16,936 --> 00:15:25,346\n홈런의 순간일 수도, 낯선 노래를 옆사람과 함께 불렀던 순간일 수도 있습니다.\n\n114\n00:15:25,346 --> 00:15:33,559\n그 작은 경험이 한 나라의 문화를 다시 찾게 만드는 시작이 될 수 있습니다.\n\n115\n00:15:33,559 --> 00:15:40,404\n관중석에서 박자를 맞추는 일은 누구나 한번 해 볼 수 있습니다.\n\n116\n00:15:40,404 --> 00:15:47,640\n낯선 사람을 동료 팬으로 만드는 경험에 이 문화의 매력이 있습니다.\n\n117\n00:15:47,640 --> 00:15:57,223\n부산 구장에서 오래 울려 퍼진 응원가는 도시의 시간을 함께 기억하는 소리일지도 모릅니다.\n\n118\n00:15:57,223 --> 00:16:03,677\n승리한 날에는 환호가 있고 패배한 날에는 아쉬움이 있습니다.\n\n119\n00:16:03,677 --> 00:16:11,499\n그 모든 날에 관중이 다시 모인다는 사실이 팀을 지역의 일부로 만듭니다.\n\n120\n00:16:11,499 --> 00:16:21,082\n해외에서 온 사람이 그 현장을 경험한다면 그에게는 처음 듣는 한국의 소리일 수 있습니다.\n\n121\n00:16:21,082 --> 00:16:32,034\n그러나 그 소리가 우리에게는 어릴 적 아버지와 함께 갔던 경기장의 기억을 떠올리게 할 수도 있습니다.\n\n122\n00:16:32,034 --> 00:16:39,270\n이 마지막 장면을 특정 가족의 실화로 만들어 버릴 필요는 없습니다.\n\n123\n00:16:39,270 --> 00:16:47,288\n누구나 자신의 시간을 떠올릴 수 있게 남겨 두는 편이 깊은 여운을 줍니다.\n\n124\n00:16:47,288 --> 00:17:00,000\n문화의 힘은 누군가가 이해하게 되는 순간뿐 아니라 이미 알고 있던 사람의 기억을 새롭게 열어 주는 순간에도 있습니다.\n","cuts":[{"shot":"S01","output_start":"00:00:00","output_end":"00:00:25","beat":"1","narration_prompt":"부산 야구장에서는 경기 전부터 노래가 시작됩니다.","visual":"권리 확인된 실제 외국인 호평 클립 1~4초 2~4개가 확보될 때만 배치; 기본 상태는 승인 대기","source_candidates":"https://www.bilibili.com/list/3546592124602439?bvid=BV1wvvNztErz&oid=115094805614509; https://espnpressroom.com/feature/xavier-scruggs-qa/","foreign_clip_id":"BV1wvvNztErz [게시자 한국인]","source_IN":"","source_OUT":"","source_audio_status":"UNVERIFIED","rights":"NOT_CLEARED","overlay":"외국인 실제 발언 (확인 전 빈칸)","emotion":"3","note":"4초 이하 컷은 목표, 저작권 보장 아님"},{"shot":"S02","output_start":"00:00:25","output_end":"00:00:50","beat":"1","narration_prompt":"해외 야구 팬이 놀라는 이유는 무엇일까요.","visual":"권리 확인된 실제 외국인 호평 클립 1~4초 2~4개가 확보될 때만 배치; 기본 상태는 승인 대기","source_candidates":"https://www.bilibili.com/list/3546592124602439?bvid=BV1wvvNztErz&oid=115094805614509; https://espnpressroom.com/feature/xavier-scruggs-qa/","foreign_clip_id":"미확정","source_IN":"","source_OUT":"","source_audio_status"
