kim-blazes-an-icy-trail-for-the-republic-of-korea","국제평가"],["Olympedia","2010","쇼트 78.50, 프리 150.06, 합계 228.56 당시 기록","https://www.olympedia.org/results/924268?id=14295","기록자료"]],"correction":"당시 228.56 세계기록이며 오늘의 세계기록은 아님. 해외 중계 원음·초상권 불명.","parts":["2010년 밴쿠버에서 김연아가 빙판에 섰습니다. 세계는 한국 선수의 연기를 지켜봤습니다. 그런데 금메달보다 더 놀라운 숫자가 기다리고 있었습니다. 두 차례 경기에서 무엇이 달라졌을까요. 그날의 기록은 지금도 한 세대의 기억에 남아 있습니다.","올림픽에 나서는 세계 정상급 선수에게 가장 어려운 것은 때로 기술보다 기대입니다. 경기가 시작되기 전부터 수많은 사람이 결과를 예상하고 모든 움직임을 지켜봅니다. 2010년 김연아는 세계선수권 우승 경험을 가진 유력한 금메달 후보였습니다. 그런데 유력하다는 말은 조금도 쉬워진다는 뜻이 아닙니다. 모두가 잘하리라 기대할수록 작은 실수 한 번이 더 크게 보이기 때문입니다. 열아홉 살의 선수가 감당해야 했던 무게를 생각하면 스케이트 날 아래에 놓인 것은 차가운 얼음만이 아니었을 것입니다. 본인이 실제로 말했다고 확인되지 않은 심정을 마음대로 인용할 수는 없습니다. 하지만 그 시합의 압박과 중요성은 공식 기록만으로도 충분히 느낄 수 있습니다.\n\n경기 전 세계의 높은 기대는 부담을 더합니다. 강력한 우승 후보라는 표현이 어느 선수에게나 편안한 자리는 아닙니다.\n\n세계 최고의 무대에 오르는 선수의 마음을 함부로 단정할 수는 없습니다. 그러나 올림픽이라는 대회가 가진 특별한 무게는 짐작할 수 있습니다. 네 해 동안 준비해 한 번의 경기에서 보여 주어야 합니다. 한 번의 작은 실수는 오랜 훈련의 결과를 바꿀 수도 있습니다. 김연아는 이미 국제무대에서 뛰어난 성적을 냈지만 올림픽은 다른 시험대였습니다. 그 무대를 기다린 한국의 많은 시청자에게도 긴장과 기대가 함께 있었을 것입니다. 그날의 경기 일정과 점수, 선수의 표정에는 말로 설명하기 어려운 긴장이 담겼습니다. 역사적인 스포츠 장면을 만드는 가장 좋은 재료는 기록과 순간의 리듬입니다.","피겨스케이팅에서는 쇼트프로그램과 프리스케이팅 점수를 합산해 순위를 결정합니다. 쇼트는 제한된 시간에 정해진 요소와 표현을 보여 줘야 하는 무대이고, 프리는 더 긴 프로그램 안에서 기술과 예술을 함께 완성하는 무대입니다. 김연아는 밴쿠버에서 쇼트프로그램 78.50점을 받았습니다. 그 점수는 당시 기록을 세운 공연이었습니다. 하지만 쇼트의 성공이 금메달을 확정한 것은 아니었습니다. 더 긴 프리 프로그램이 남아 있었기 때문입니다. 점수를 앞서고 있는 선수가 마지막 연기까지 끝내야 한다는 사실은 어쩌면 추격하는 것보다 더 큰 압박이 됩니다. 이제 남은 것은 첫 번째 숫자를 잊고 다시 자신이 준비한 움직임을 보여 주는 일이었습니다.\n\n쇼트프로그램 기록만으로 금메달이 확정된 것은 아닙니다. 남은 프리 스케이팅을 기다리는 시간이 이야기의 긴장입니다.\n\n쇼트프로그램은 짧다고 해서 쉽지 않습니다. 정해진 요소를 수행하면서 음악과 움직임을 하나의 프로그램으로 만들어야 합니다. 한 번의 점프를 성공한 뒤에도 다음 요소로 자연스럽게 이어져야 합니다. 김연아가 받은 당시 78.50점은 그날의 상황을 바꾸어 놓았습니다. 하지만 점수판에서 앞선다고 프리 프로그램의 실수가 용서되는 것은 아니었습니다. 그다음 경기에서 모든 선수가 다시 자신의 기술을 보여 주어야 했습니다. 스포츠를 보는 사람이 가장 긴장하는 순간은 때로 이미 좋은 결과를 얻은 선수가 또 한 번 완벽에 가까운 수행을 해내야 하는 때입니다. 이 긴장 때문에 시청자는 다음 프로그램을 기다리게 됩니다.","프리스케이팅은 여러 점프와 스핀, 스텝이 하나의 이야기처럼 이어져야 합니다. 기술의 난도만 높다고 감동이 생기지는 않습니다. 음악과 동작이 어우러지면서도 요소마다 정확한 수행이 필요합니다. 김연아가 밴쿠버에서 보여 준 프로그램은 트리플 러츠와 트리플 토루프의 연속 점프 같은 기술을 포함했습니다. 그리고 프리 150.06점을 받았습니다. 이 점수는 쇼트와 합쳐 228.56점이 됐습니다. 당시 채점 체계에서 세계 최고 점수였습니다. '영원히 깨지지 않을 기록'이라고 말하면 틀립니다. 채점 규칙은 시간이 지나 바뀌기도 하고 기록도 새롭게 세워지기 때문입니다. 정확한 표현은 당시의 세계기록입니다. 그 숫자 앞에서 감탄이 나오는 것은 여전합니다.\n\n정확한 점프와 동작을 하나씩 수행하는 동안 관객은 실수 하나에 숨을 죽입니다. 완성된 안무는 그 작은 집중이 이어진 결과입니다.\n\n프리스케이팅에서 한 동작이 끝났다고 긴장을 풀 수는 없습니다. 다음 점프와 스핀, 스텝이 남아 있기 때문입니다. 시청자가 점프 이름을 모두 몰라도 준비 동작과 착지 순간의 긴장을 느낄 수 있습니다. 음악이 계속되는 동안 선수는 숨을 고르고 속도를 조절합니다. 한 프로그램 전체를 완성하는 일은 개별 기술을 잘하는 것과 또 다른 어려움입니다. 김연아가 연기를 마치고 받은 150.06점은 그날의 성적표에 남았습니다. 그리고 쇼트 점수와 합쳐 새로운 기록이 되었습니다. 높은 점수도 중요하지만 그보다 앞서 수행한 기술과 경기장의 반응을 함께 떠올릴 때 기록의 의미가 더 분명해집니다.","첫 번째 반전은 우승보다 기록의 방식에서 나옵니다. 김연아는 올림픽 금메달 하나를 얻은 데 그치지 않고 쇼트와 프리, 합계에서 당시 가장 높은 기록을 세웠습니다. 한 번의 행운만으로 설명하기 어려운 무대였다는 뜻입니다. 경기 직후 사람들은 금메달을 확인했지만 점수표에는 여러 기술 요소와 표현의 세부 평가가 남았습니다. 이 점수표가 중요한 이유는 승리의 크기뿐 아니라 어떤 수행이 높이 평가됐는지를 보여 주기 때문입니다. 국제올림픽위원회는 이 장면을 한국 피겨의 새로운 길을 연 순간으로 소개합니다. 해외의 공식 평가가 있는 사실을 억지 외국인 감탄사보다 앞세우면 이야기는 더 오래갑니다.\n\n228.56이라는 합계는 당시 세계기록입니다. 올림픽과 채점 체계가 바뀐 뒤 현재 기록과 같다고 말하면 오해가 생깁니다.\n\n피겨스케이팅은 예술적인 표현과 기술적 수행을 함께 평가합니다. 그래서 겉으로 아름다워 보이는 동작 뒤에도 복잡한 기준이 존재합니다. 점프를 했다는 사실 하나만이 아니라 얼마나 정확히 수행했는지, 프로그램 전체를 어떻게 구성했는지가 중요합니다. 김연아의 밴쿠버 경기 기록은 그 두 측면이 함께 높은 수준에 도달한 사례였습니다. 하지만 경기 규칙과 채점 체계는 이후 변했습니다. 따라서 당시 세계기록이라는 설명을 반드시 붙여야 합니다. 지금까지 누구도 넘어설 수 없었다는 식의 문구는 실제 역사를 잘못 전달합니다. 오히려 기준이 있었던 시대에 새로운 경지를 보여 주었다는 설명이 더 정확하고 감동적입니다.","당시 김연아의 무대를 기억하는 해외의 여러 방송 영상이 남아 있습니다. 하지만 해설자의 정확한 발언과 방송 권리를 확인하지 않은 상태에서 누군가가 '완벽하다'고 말했다는 식으로 대사를 만들 수는 없습니다. 방송사마다 중계 언어와 해설자가 달랐기 때문입니다. 영상 편집에서 좋은 방법은 공식 기록 화면과 실제로 확인한 원음을 짧게 연결하는 것입니다. 해설이 감탄한 직후 내레이션이 똑같은 칭찬을 반복할 이유는 없습니다. 그보다 경기 전의 압박, 점수의 의미, 당시 한국 피겨의 위치를 새롭게 알려 주면 됩니다. 서로 다른 정보가 이어져야 그 장면을 처음 보는 사람도 끝까지 관심을 놓지 않습니다.\n\nIOC가 경기의 가치를 높이 평가했다는 자료는 확인됩니다. 그러나 특정 중계진의 와우 원음은 방송을 직접 확인하고 허락을 받은 뒤에만 넣어야 합니다.\n\n세계 여러 나라의 방송사가 피겨스케이팅을 중계했습니다. 해설자마다 자신의 언어로 기술과 표정을 설명했습니다. 그런데 영상 제작자가 다른 중계 영상의 감탄사를 한데 섞어 한 사람이 연속해서 말했다고 소개한다면 문제가 됩니다. 실제 발언은 말한 사람과 원문 맥락이 중요하기 때문입니다. 각 방송의 평가를 구별할 때 그 시대의 분위기도 더 정확하게 이해할 수 있습니다. IOC가 남긴 기록은 지금도 그날의 가치를 설명하는 중요한 출발점입니다. 그날의 짧은 환호가 오래 남는 이유는 경기의 과정이 이미 큰 이야기를 만들었기 때문입니다. 외국인의 평가를 신뢰하게 만드는 것은 목소리의 크기가 아니라 검증입니다.","두 번째 반전은 개인의 기록이 남긴 길입니다. 김연아가 금메달을 딴 뒤 한국에는 피겨스케이팅을 새롭게 바라보는 시선이 생겼습니다. 이는 후배 선수들의 모든 성과가 한 사람 덕분이라는 뜻은 아닙니다. 각자의 훈련과 지원, 재능, 노력도 존재합니다. 다만 세계 정상의 무대를 실제로 경험한 선수가 있다는 것은 다음 세대에게 목표가 될 수 있습니다. 피겨 선수로 성장하는 길이 얼마나 긴지 생각해 보면 그 상징성은 쉽게 사라지지 않습니다. 한 사람이 지나간 빙판 위에 다른 사람의 발자국이 계속 이어질 수 있기 때문입니다. 스포츠의 힘은 기록이 주는 충격을 넘어 새로운 가능성을 보여 주는 데 있습니다.\n\n후배 선수들이 같은 빙판에 섰다고 해서 모두 같은 길을 걷는 것은 아닙니다. 한 사람의 성취가 가능성을 보여 주었다는 의미가 중요합니다.\n\n올림픽 금메달이 한국 피겨의 다음 세대에 남긴 의미는 단순한 인기도 이상의 것입니다. 정상의 길이 실제로 존재한다는 사례가 생겼기 때문입니다. 그렇다고 한국의 모든 후배 선수가 김연아 한 사람 덕분에 등장했다고 말할 수는 없습니다. 각 선수의 가정과 지도자, 연습 환경, 지원과 노력은 모두 다릅니다. 하지만 목표를 눈앞에서 보여 준 선배가 있다는 사실은 무시할 수 없습니다. 처음에는 멀게만 보이던 국제무대가 구체적인 경기 장면으로 바뀌는 경험입니다. 국가는 기록을 자랑할 수 있지만 개인은 그 기록을 자신의 새로운 질문으로 받아들일 수 있습니다. 다음에는 내가 무엇을 보여 줄 수 있을까 하는 질문입니다.","우리에게 밴쿠버의 그날은 오래된 기억의 한 장면일지 모릅니다. 가족이 텔레비전 앞에 모여 숨을 죽이던 시간, 마지막 동작이 끝나고 점수판이 뜨던 순간이 있습니다. 누군가의 실제 가족 경험이라고 꾸며 낼 필요는 없습니다. 많은 사람이 공유할 수 있는 그 시대의 풍경만으로도 충분합니다. 세계가 열광했던 장면은 점차 기록 영상이 되지만 그 장면이 열어 준 질문은 남습니다. 한국에서 태어난 한 선수가 세계의 가장 큰 빙판에서 무엇을 보여 줄 수 있는가. 김연아는 자신의 경기로 그 답을 적었습니다. 세계기록 228.56점은 숫자이고, 그 숫자 뒤의 시간은 한 나라가 오랫동안 기억할 이야기입니다.\n\n마지막 장면은 기록 숫자를 크게 외치는 것보다 2010년 당시 환호와 지금까지 남은 감정을 짧게 연결하는 편이 오래갑니다.\n\n어떤 시청자는 2010년의 화면을 볼 때 그때 자신이 어디에 있었는지 떠올릴 것입니다. 어떤 사람은 처음 보는 장면일 수도 있습니다. 세대가 달라도 같은 경기 기록을 통해 서로 다른 감정을 느낄 수 있습니다. 오래된 스포츠 영상의 특별함은 과거를 그대로 반복하는 데 있지 않습니다. 그때의 놀라움을 오늘의 질문과 다시 연결하는 데 있습니다. 세계의 큰 무대에서 우리 선수가 무엇을 할 수 있는지 궁금했던 사람들이 있었습니다. 김연아가 보여 준 것은 금메달과 점수뿐 아니라 준비한 기술을 흔들림 없이 실행하는 모습이었습니다. 그 장면을 보고 누군가 자신의 일을 다시 해 볼 용기를 얻었다면 그것도 스포츠가 남기는 가치일 것입니다. 사람의 마음을 움직이는 데에는 숫자보다 그 숫자를 만든 시간이 필요합니다."],"duration_target_sec":1020,"duration_measured_sec":null,"narration_chars":5454,"source_audio_confirmed":false,"source_in_out_confirmed":false,"rights_confirmed":false,"narration_synthesized":false,"provisional_srt":true,"emotion_curve":[3,3,2,3,4,3,5,5],"reference_group":"스포츠","foreign_opening_status":"2~4개 외국인 실음성 클립 미확보. 첫 12초 0:00-0:12 임시 배치 불가.","planned_srt":"1\n00:00:00,000 --> 00:00:09,000\n2010년 밴쿠버에서 김연아가 빙판에 섰습니다.\n\n2\n00:00:09,000 --> 00:00:16,615\n세계는 한국 선수의 연기를 지켜봤습니다.\n\n3\n00:00:16,615 --> 00:00:27,346\n그런데 금메달보다 더 놀라운 숫자가 기다리고 있었습니다.\n\n4\n00:00:27,346 --> 00:00:34,615\n두 차례 경기에서 무엇이 달라졌을까요.\n\n5\n00:00:34,615 --> 00:00:45,000\n그날의 기록은 지금도 한 세대의 기억에 남아 있습니다.\n\n6\n00:00:45,000 --> 00:00:51,464\n올림픽에 나서는 세계 정상급 선수에게 가장 어려운 것은 때로 기술보다 기대입니다.\n\n7\n00:00:51,464 --> 00:00:57,784\n경기가 시작되기 전부터 수많은 사람이 결과를 예상하고 모든 움직임을 지켜봅니다.\n\n8\n00:00:57,784 --> 00:01:03,817\n2010년 김연아는 세계선수권 우승 경험을 가진 유력한 금메달 후보였습니다.\n\n9\n00:01:03,817 --> 00:01:08,269\n그런데 유력하다는 말은 조금도 쉬워진다는 뜻이 아닙니다.\n\n10\n00:01:08,269 --> 00:01:14,159\n모두가 잘하리라 기대할수록 작은 실수 한 번이 더 크게 보이기 때문입니다.\n\n11\n00:01:14,159 --> 00:01:23,352\n열아홉 살의 선수가 감당해야 했던 무게를 생각하면 스케이트 날 아래에 놓인 것은 차가운 얼음만이 아니었을 것입니다.\n\n12\n00:01:23,352 --> 00:01:29,384\n본인이 실제로 말했다고 확인되지 않은 심정을 마음대로 인용할 수는 없습니다.\n\n13\n00:01:29,384 --> 00:01:35,561\n하지만 그 시합의 압박과 중요성은 공식 기록만으로도 충분히 느낄 수 있습니다.\n\n14\n00:01:35,561 --> 00:01:39,152\n경기 전 세계의 높은 기대는 부담을 더합니다.\n\n15\n00:01:39,152 --> 00:01:44,610\n강력한 우승 후보라는 표현이 어느 선수에게나 편안한 자리는 아닙니다.\n\n16\n00:01:44,610 --> 00:01:50,212\n세계 최고의 무대에 오르는 선수의 마음을 함부로 단정할 수는 없습니다.\n\n17\n00:01:50,212 --> 00:01:55,527\n그러나 올림픽이라는 대회가 가진 특별한 무게는 짐작할 수 있습니다.\n\n18\n00:01:55,527 --> 00:02:00,123\n네 해 동안 준비해 한 번의 경기에서 보여 주어야 합니다.\n\n19\n00:02:00,123 --> 00:02:05,007\n한 번의 작은 실수는 오랜 훈련의 결과를 바꿀 수도 있습니다.\n\n20\n00:02:05,007 --> 00:02:11,183\n김연아는 이미 국제무대에서 뛰어난 성적을 냈지만 올림픽은 다른 시험대였습니다.\n\n21\n00:02:11,183 --> 00:02:17,503\n그 무대를 기다린 한국의 많은 시청자에게도 긴장과 기대가 함께 있었을 것입니다.\n\n22\n00:02:17,503 --> 00:02:24,111\n그날의 경기 일정과 점수, 선수의 표정에는 말로 설명하기 어려운 긴장이 담겼습니다.\n\n23\n00:02:24,111 --> 00:02:30,000\n역사적인 스포츠 장면을 만드는 가장 좋은 재료는 기록과 순간의 리듬입니다.\n\n24\n00:02:30,000 --> 00:02:37,001\n피겨스케이팅에서는 쇼트프로그램과 프리스케이팅 점수를 합산해 순위를 결정합니다.\n\n25\n00:02:37,001 --> 00:02:49,701\n쇼트는 제한된 시간에 정해진 요소와 표현을 보여 줘야 하는 무대이고, 프리는 더 긴 프로그램 안에서 기술과 예술을 함께 완성하는 무대입니다.\n\n26\n00:02:49,701 --> 00:02:54,912\n김연아는 밴쿠버에서 쇼트프로그램 78.50점을 받았습니다.\n\n27\n00:02:54,912 --> 00:02:58,820\n그 점수는 당시 기록을 세운 공연이었습니다.\n\n28\n00:02:58,820 --> 00:03:03,867\n하지만 쇼트의 성공이 금메달을 확정한 것은 아니었습니다.\n\n29\n00:03:03,867 --> 00:03:08,100\n더 긴 프리 프로그램이 남아 있었기 때문입니다.\n\n30\n00:03:08,100 --> 00:03:18,033\n점수를 앞서고 있는 선수가 마지막 연기까지 끝내야 한다는 사실은 어쩌면 추격하는 것보다 더 큰 압박이 됩니다.\n\n31\n00:03:18,033 --> 00:03:26,174\n이제 남은 것은 첫 번째 숫자를 잊고 다시 자신이 준비한 움직임을 보여 주는 일이었습니다.\n\n32\n00:03:26,174 --> 00:03:31,058\n쇼트프로그램 기록만으로 금메달이 확정된 것은 아닙니다.\n\n33\n00:03:31,058 --> 00:03:36,269\n남은 프리 스케이팅을 기다리는 시간이 이야기의 긴장입니다.\n\n34\n00:03:36,269 --> 00:03:40,014\n쇼트프로그램은 짧다고 해서 쉽지 않습니다.\n\n35\n00:03:40,014 --> 00:03:47,015\n정해진 요소를 수행하면서 음악과 움직임을 하나의 프로그램으로 만들어야 합니다.\n\n36\n00:03:47,015 --> 00:03:53,365\n한 번의 점프를 성공한 뒤에도 다음 요소로 자연스럽게 이어져야 합니다.\n\n37\n00:03:53,365 --> 00:03:59,389\n김연아가 받은 당시 78.50점은 그날의 상황을 바꾸어 놓았습니다.\n\n38\n00:03:59,389 --> 00:04:06,391\n하지만 점수판에서 앞선다고 프리 프로그램의 실수가 용서되는 것은 아니었습니다.\n\n39\n00:04:06,391 --> 00:04:12,741\n그다음 경기에서 모든 선수가 다시 자신의 기술을 보여 주어야 했습니다.\n\n40\n00:04:12,741 --> 00:04:24,790\n스포츠를 보는 사람이 가장 긴장하는 순간은 때로 이미 좋은 결과를 얻은 선수가 또 한 번 완벽에 가까운 수행을 해내야 하는 때입니다.\n\n41\n00:04:24,790 --> 00:04:30,000\n이 긴장 때문에 시청자는 다음 프로그램을 기다리게 됩니다.\n\n42\n00:04:30,000 --> 00:04:36,829\n프리스케이팅은 여러 점프와 스핀, 스텝이 하나의 이야기처럼 이어져야 합니다.\n\n43\n00:04:36,829 --> 00:04:41,057\n기술의 난도만 높다고 감동이 생기지는 않습니다.\n\n44\n00:04:41,057 --> 00:04:46,748\n음악과 동작이 어우러지면서도 요소마다 정확한 수행이 필요합니다.\n\n45\n00:04:46,748 --> 00:04:56,341\n김연아가 밴쿠버에서 보여 준 프로그램은 트리플 러츠와 트리플 토루프의 연속 점프 같은 기술을 포함했습니다.\n\n46\n00:04:56,341 --> 00:04:59,919\n그리고 프리 150.06점을 받았습니다.\n\n47\n00:04:59,919 --> 00:05:04,309\n이 점수는 쇼트와 합쳐 228.56점이 됐습니다.\n\n48\n00:05:04,309 --> 00:05:08,211\n당시 채점 체계에서 세계 최고 점수였습니다.\n\n49\n00:05:08,211 --> 00:05:12,764\n'영원히 깨지지 않을 기록'이라고 말하면 틀립니다.\n\n50\n00:05:12,764 --> 00:05:19,431\n채점 규칙은 시간이 지나 바뀌기도 하고 기록도 새롭게 세워지기 때문입니다.\n\n51\n00:05:19,431 --> 00:05:27,073\n정확한 표현은 당시의 세계기록입니다. 그 숫자 앞에서 감탄이 나오는 것은 여전합니다.\n\n52\n00:05:27,073 --> 00:05:34,065\n정확한 점프와 동작을 하나씩 수행하는 동안 관객은 실수 하나에 숨을 죽입니다.\n\n53\n00:05:34,065 --> 00:05:38,455\n완성된 안무는 그 작은 집중이 이어진 결과입니다.\n\n54\n00:05:38,455 --> 00:05:43,984\n프리스케이팅에서 한 동작이 끝났다고 긴장을 풀 수는 없습니다.\n\n55\n00:05:43,984 --> 00:05:48,374\n다음 점프와 스핀, 스텝이 남아 있기 때문입니다.\n\n56\n00:05:48,374 --> 00:05:56,016\n시청자가 점프 이름을 모두 몰라도 준비 동작과 착지 순간의 긴장을 느낄 수 있습니다.\n\n57\n00:05:56,016 --> 00:06:01,382\n음악이 계속되는 동안 선수는 숨을 고르고 속도를 조절합니다.\n\n58\n00:06:01,382 --> 00:06:08,699\n한 프로그램 전체를 완성하는 일은 개별 기술을 잘하는 것과 또 다른 어려움입니다.\n\n59\n00:06:08,699 --> 00:06:15,203\n김연아가 연기를 마치고 받은 150.06점은 그날의 성적표에 남았습니다.\n\n60\n00:06:15,203 --> 00:06:19,756\n그리고 쇼트 점수와 합쳐 새로운 기록이 되었습니다.\n\n61\n00:06:19,756 --> 00:06:30,000\n높은 점수도 중요하지만 그보다 앞서 수행한 기술과 경기장의 반응을 함께 떠올릴 때 기록의 의미가 더 분명해집니다.\n\n62\n00:06:30,000 --> 00:06:35,850\n첫 번째 반전은 우승보다 기록의 방식에서 나옵니다.\n\n63\n00:06:35,850 --> 00:06:48,593\n김연아는 올림픽 금메달 하나를 얻은 데 그치지 않고 쇼트와 프리, 합계에서 당시 가장 높은 기록을 세웠습니다.\n\n64\n00:06:48,593 --> 00:06:55,070\n한 번의 행운만으로 설명하기 어려운 무대였다는 뜻입니다.\n\n65\n00:06:55,070 --> 00:07:06,560\n경기 직후 사람들은 금메달을 확인했지만 점수표에는 여러 기술 요소와 표현의 세부 평가가 남았습니다.\n\n66\n00:07:06,560 --> 00:07:18,259\n이 점수표가 중요한 이유는 승리의 크기뿐 아니라 어떤 수행이 높이 평가됐는지를 보여 주기 때문입니다.\n\n67\n00:07:18,259 --> 00:07:27,242\n국제올림픽위원회는 이 장면을 한국 피겨의 새로운 길을 연 순간으로 소개합니다.\n\n68\n00:07:27,242 --> 00:07:37,479\n해외의 공식 평가가 있는 사실을 억지 외국인 감탄사보다 앞세우면 이야기는 더 오래갑니다.\n\n69\n00:07:37,479 --> 00:07:42,702\n228.56이라는 합계는 당시 세계기록입니다.\n\n70\n00:07:42,702 --> 00:07:51,267\n올림픽과 채점 체계가 바뀐 뒤 현재 기록과 같다고 말하면 오해가 생깁니다.\n\n71\n00:07:51,267 --> 00:07:58,370\n피겨스케이팅은 예술적인 표현과 기술적 수행을 함께 평가합니다.\n\n72\n00:07:58,370 --> 00:08:06,309\n그래서 겉으로 아름다워 보이는 동작 뒤에도 복잡한 기준이 존재합니다.\n\n73\n00:08:06,309 --> 00:08:19,053\n점프를 했다는 사실 하나만이 아니라 얼마나 정확히 수행했는지, 프로그램 전체를 어떻게 구성했는지가 중요합니다.\n\n74\n00:08:19,053 --> 00:08:28,454\n김연아의 밴쿠버 경기 기록은 그 두 측면이 함께 높은 수준에 도달한 사례였습니다.\n\n75\n00:08:28,454 --> 00:08:34,095\n하지만 경기 규칙과 채점 체계는 이후 변했습니다.\n\n76\n00:08:34,095 --> 00:08:40,571\n따라서 당시 세계기록이라는 설명을 반드시 붙여야 합니다.\n\n77\n00:08:40,571 --> 00:08:49,554\n지금까지 누구도 넘어설 수 없었다는 식의 문구는 실제 역사를 잘못 전달합니다.\n\n78\n00:08:49,554 --> 00:09:00,000\n오히려 기준이 있었던 시대에 새로운 경지를 보여 주었다는 설명이 더 정확하고 감동적입니다.\n\n79\n00:09:00,000 --> 00:09:07,938\n당시 김연아의 무대를 기억하는 해외의 여러 방송 영상이 남아 있습니다.\n\n80\n00:09:07,938 --> 00:09:22,999\n하지만 해설자의 정확한 발언과 방송 권리를 확인하지 않은 상태에서 누군가가 '완벽하다'고 말했다는 식으로 대사를 만들 수는 없습니다.\n\n81\n00:09:22,999 --> 00:09:28,697\n방송사마다 중계 언어와 해설자가 달랐기 때문입니다.\n\n82\n00:09:28,697 --> 00:09:38,874\n영상 편집에서 좋은 방법은 공식 기록 화면과 실제로 확인한 원음을 짧게 연결하는 것입니다.\n\n83\n00:09:38,874 --> 00:09:46,608\n해설이 감탄한 직후 내레이션이 똑같은 칭찬을 반복할 이유는 없습니다.\n\n84\n00:09:46,608 --> 00:09:56,784\n그보다 경기 전의 압박, 점수의 의미, 당시 한국 피겨의 위치를 새롭게 알려 주면 됩니다.\n\n85\n00:09:56,784 --> 00:10:06,350\n서로 다른 정보가 이어져야 그 장면을 처음 보는 사람도 끝까지 관심을 놓지 않습니다.\n\n86\n00:10:06,350 --> 00:10:12,863\nIOC가 경기의 가치를 높이 평가했다는 자료는 확인됩니다.\n\n87\n00:10:12,863 --> 00:10:23,039\n그러나 특정 중계진의 와우 원음은 방송을 직접 확인하고 허락을 받은 뒤에만 넣어야 합니다.\n\n88\n00:10:23,039 --> 00:10:29,145\n세계 여러 나라의 방송사가 피겨스케이팅을 중계했습니다.\n\n89\n00:10:29,145 --> 00:10:35,047\n해설자마다 자신의 언어로 기술과 표정을 설명했습니다.\n\n90\n00:10:35,047 --> 00:10:47,870\n그런데 영상 제작자가 다른 중계 영상의 감탄사를 한데 섞어 한 사람이 연속해서 말했다고 소개한다면 문제가 됩니다.\n\n91\n00:10:47,870 --> 00:10:54,383\n실제 발언은 말한 사람과 원문 맥락이 중요하기 때문입니다.\n\n92\n00:10:54,383 --> 00:11:03,541\n각 방송의 평가를 구별할 때 그 시대의 분위기도 더 정확하게 이해할 수 있습니다.\n\n93\n00:11:03,541 --> 00:11:11,682\nIOC가 남긴 기록은 지금도 그날의 가치를 설명하는 중요한 출발점입니다.\n\n94\n00:11:11,682 --> 00:11:21,859\n그날의 짧은 환호가 오래 남는 이유는 경기의 과정이 이미 큰 이야기를 만들었기 때문입니다.\n\n95\n00:11:21,859 --> 00:11:30,000\n외국인의 평가를 신뢰하게 만드는 것은 목소리의 크기가 아니라 검증입니다.\n\n96\n00:11:30,000 --> 00:11:36,122\n두 번째 반전은 개인의 기록이 남긴 길입니다.\n\n97\n00:11:36,122 --> 00:11:47,388\n김연아가 금메달을 딴 뒤 한국에는 피겨스케이팅을 새롭게 바라보는 시선이 생겼습니다.\n\n98\n00:11:47,388 --> 00:11:56,449\n이는 후배 선수들의 모든 성과가 한 사람 덕분이라는 뜻은 아닙니다.\n\n99\n00:11:56,449 --> 00:12:02,816\n각자의 훈련과 지원, 재능, 노력도 존재합니다.\n\n100\n00:12:02,816 --> 00:12:16,041\n다만 세계 정상의 무대를 실제로 경험한 선수가 있다는 것은 다음 세대에게 목표가 될 수 있습니다.\n\n101\n00:12:16,041 --> 00:12:28,041\n피겨 선수로 성장하는 길이 얼마나 긴지 생각해 보면 그 상징성은 쉽게 사라지지 않습니다.\n\n102\n00:12:28,041 --> 00:12:39,306\n한 사람이 지나간 빙판 위에 다른 사람의 발자국이 계속 이어질 수 있기 때문입니다.\n\n103\n00:12:39,306 --> 00:12:50,082\n스포츠의 힘은 기록이 주는 충격을 넘어 새로운 가능성을 보여 주는 데 있습니다.\n\n104\n00:12:50,082 --> 00:13:00,367\n후배 선수들이 같은 빙판에 섰다고 해서 모두 같은 길을 걷는 것은 아닙니다.\n\n105\n00:13:00,367 --> 00:13:08,449\n한 사람의 성취가 가능성을 보여 주었다는 의미가 중요합니다.\n\n106\n00:13:08,449 --> 00:13:19,959\n올림픽 금메달이 한국 피겨의 다음 세대에 남긴 의미는 단순한 인기도 이상의 것입니다.\n\n107\n00:13:19,959 --> 00:13:27,551\n정상의 길이 실제로 존재한다는 사례가 생겼기 때문입니다.\n\n108\n00:13:27,551 --> 00:13:39,551\n그렇다고 한국의 모든 후배 선수가 김연아 한 사람 덕분에 등장했다고 말할 수는 없습니다.\n\n109\n00:13:39,551 --> 00:13:48,857\n각 선수의 가정과 지도자, 연습 환경, 지원과 노력은 모두 다릅니다.\n\n110\n00:13:48,857 --> 00:13:58,898\n하지만 목표를 눈앞에서 보여 준 선배가 있다는 사실은 무시할 수 없습니다.\n\n111\n00:13:58,898 --> 00:14:09,184\n처음에는 멀게만 보이던 국제무대가 구체적인 경기 장면으로 바뀌는 경험입니다.\n\n112\n00:14:09,184 --> 00:14:22,163\n국가는 기록을 자랑할 수 있지만 개인은 그 기록을 자신의 새로운 질문으로 받아들일 수 있습니다.\n\n113\n00:14:22,163 --> 00:14:30,000\n다음에는 내가 무엇을 보여 줄 수 있을까 하는 질문입니다.\n\n114\n00:14:30,000 --> 00:14:36,564\n우리에게 밴쿠버의 그날은 오래된 기억의 한 장면일지 모릅니다.\n\n115\n00:14:36,564 --> 00:14:47,181\n가족이 텔레비전 앞에 모여 숨을 죽이던 시간, 마지막 동작이 끝나고 점수판이 뜨던 순간이 있습니다.\n\n116\n00:14:47,181 --> 00:14:53,166\n누군가의 실제 가족 경험이라고 꾸며 낼 필요는 없습니다.\n\n117\n00:14:53,166 --> 00:14:59,923\n많은 사람이 공유할 수 있는 그 시대의 풍경만으로도 충분합니다.\n\n118\n00:14:59,923 --> 00:15:08,996\n세계가 열광했던 장면은 점차 기록 영상이 되지만 그 장면이 열어 준 질문은 남습니다.\n\n119\n00:15:08,996 --> 00:15:17,490\n한국에서 태어난 한 선수가 세계의 가장 큰 빙판에서 무엇을 보여 줄 수 있는가.\n\n120\n00:15:17,490 --> 00:15:22,124\n김연아는 자신의 경기로 그 답을 적었습니다.\n\n121\n00:15:22,124 --> 00:15:32,548\n세계기록 228.56점은 숫자이고, 그 숫자 뒤의 시간은 한 나라가 오랫동안 기억할 이야기입니다.\n\n122\n00:15:32,548 --> 00:15:45,676\n마지막 장면은 기록 숫자를 크게 외치는 것보다 2010년 당시 환호와 지금까지 남은 감정을 짧게 연결하는 편이 오래갑니다.\n\n123\n00:15:45,676 --> 00:15:54,942\n어떤 시청자는 2010년의 화면을 볼 때 그때 자신이 어디에 있었는지 떠올릴 것입니다.\n\n124\n00:15:54,942 --> 00:15:59,768\n어떤 사람은 처음 보는 장면일 수도 있습니다.\n\n125\n00:15:59,768 --> 00:16:07,683\n세대가 달라도 같은 경기 기록을 통해 서로 다른 감정을 느낄 수 있습니다.\n\n126\n00:16:07,683 --> 00:16:15,405\n오래된 스포츠 영상의 특별함은 과거를 그대로 반복하는 데 있지 않습니다.\n\n127\n00:16:15,405 --> 00:16:21,583\n그때의 놀라움을 오늘의 질문과 다시 연결하는 데 있습니다.\n\n128\n00:16:21,583 --> 00:16:30,463\n세계의 큰 무대에서 우리 선수가 무엇을 할 수 있는지 궁금했던 사람들이 있었습니다.\n\n129\n00:16:30,463 --> 00:16:40,888\n김연아가 보여 준 것은 금메달과 점수뿐 아니라 준비한 기술을 흔들림 없이 실행하는 모습이었습니다.\n\n130\n00:16:40,888 --> 00:16:52,085\n그 장면을 보고 누군가 자신의 일을 다시 해 볼 용기를 얻었다면 그것도 스포츠가 남기는 가치일 것입니다.\n\n131\n00:16:52,085 --> 00:17:00,000\n사람의 마음을 움직이는 데에는 숫자보다 그 숫자를 만든 시간이 필요합니다.\n","cuts":[{"shot":"S01","output_start":"00:00:00","output_end":"00:00:25","beat":"1","narration_prompt":"2010년 밴쿠버에서 김연아가 빙판에 섰습니다.","visual":"권리 확인된 실제 외국인 호평 클립 1~4초 2~4개가 확보될 때만 배치; 기본 상태는 승인 대기","source_candidates":"https://www.olympics.com/ioc/news/yuna-kim-blazes-an-icy-trail-for-the-republic-of-korea; https://www.olympedia.org/results/924268?id=14295","foreign_clip_id":"미확정","source_IN":"","source_OUT":"","source_audio_status":"UNVERIFIED","rights":"NOT_CLEARED","overlay":"외국인 실제 발언 (확인 전 빈칸)","emotion":"3","note":"4초 이하 컷은 목표, 저작권 보장 아님"},{"shot":"S02","output_start":"00:00:25","output_end":"00:00:50","beat":"1","narration_prompt":"그런데 금메달보다 더 놀라운 숫자가 기다리고 있었습니다.","visual":"권리 확인된 실제 외국인 호평 클립 1~4초 2~4개가 확보될 때만 배치; 기본 상태는 승인 대기","source_candidates":"https://www.olympics.com/ioc/news/yuna-kim-blazes-an-icy-trail-for-the-republic-of-korea; https://www.olympedia.org/results/924268?id=14295","foreign_clip_id":"미확정","source_IN":"","source_OUT":"","source_audio_status":"UNVERIFIED","rights":"NOT_CLEARED","overlay":"외국인 실제 발언 (확인 전 빈칸)","emotion":"3","note":"4초 이하 컷은 목표, 저작권 보장 아님"},{"shot":"S03","output_start":"00:00:50","output_end":"00:01:15","beat":"2","narration_prompt":"경기가 시작되기 전부터 수많은 사람이 결과를 예상하고 모든 움직임을 지켜봅니다.","visual":"자체 제작 지역 지도 + 연표 / 실사 후보는 승인 대기","source_candidates":"https://www.olympics.com/ioc/news/yuna-kim-blazes-an-icy-trail-for-the-republic-of-korea; https://www.olympedia.org/results/924268?id=14295","foreign_ windows":["00:00–00:45","00:45–02:30","02:30–04:30","04:30–06:30","06:30–09:00","09:00–11:30","11:30–14:30","14:30–17:00"]},{"id":"KIM","no":10,"slug":"ep10_kim","title":"튀르키예에서 인정받은 김연경, 세계 배구계가 평가한 저력","original_title":"튀르키예에서 인정받은 김연경, 세계 배구계가 평가한 저력","category":"스포츠·배구","angle":"해외 리그 활약과 FIVB의 구체적 업적 평가, 은퇴 뒤 유산","revised_outline":[{"t":"00:00–00:45","text":"해외 배구 전문가의 실제 호평","question":"국제배구연맹 또는 튀르키예 현지 관계자의 김연경 칭찬 장면부터 출발한다."},{"t":"00:45–02:30","text":"해외 클럽 진출 배경","question":"한국 선수가 왜 튀르키예에서 오랫동안 사랑받았나?"},{"t":"02:30–04:30","text":"튀르키예 리그 경쟁","question":"클럽과 국가대표에서는 어떤 역할이 달랐나?"},{"t":"04:30–06:30","text":"국가대표 국제무대","question":"세계 정상급 공격수를 평가하는 기준은?"},{"t":"06:30–09:00","text":"1차 반전 · 기술 뒤의 리더십","question":"1차 반전: 득점력 외에 동료 리더십이 핵심이었다."},{"t":"09:00–11:30","text":"FIVB의 경력 평가","question":"FIVB는 어떤 경력을 부각했나?"},{"t":"11:30–14:30","text":"2차 반전 · 은퇴 뒤 영향","question":"2차 반전: 은퇴 뒤에도 여자배구의 영향력은 남는다."},{"t":"14:30–17:00","text":"해외 현지 반응으로 회수","question":"외국 전문가의 말과 한국 선수가 일군 길을 회수한다."}],"hooks":["국제배구연맹 또는 튀르키예 현지 관계자의 김연경 칭찬 장면부터 출발한다.","한국 선수가 왜 튀르키예에서 오랫동안 사랑받았나?","클럽과 국가대표에서는 어떤 역할이 달랐나?","세계 정상급 공격수를 평가하는 기준은?","1차 반전: 득점력 외에 동료 리더십이 핵심이었다.","FIVB는 어떤 경력을 부각했나?","2차 반전: 은퇴 뒤에도 여자배구의 영향력은 남는다.","외국 전문가의 말과 한국 선수가 일군 길을 회수한다."],"source_links":[["국제배구연맹 FIVB","2020-08-17","2011 페네르바흐체 합류, 2012 CEV 챔피언스리그 우승 포함 해외 경력","https://www.fivb.com/kim-yeon-koung/","국제평가"],["국제배구연맹 FIVB","2026-03-07","2024 국가대표 은퇴·2025 프로 은퇴·2026 다음 세대 지원 활동","https://www.fivb.com/beyond-the-court-with-kim-yeon-koung/","국제평가"]],"correction":"2024 국가대표 은퇴와 2025 프로 은퇴 구별. FIVB의 평가를 공식 세계 랭킹 1위로 쓰지 않음.","parts":["한국의 김연경은 튀르키예 코트에서 이름을 알렸습니다. 국제배구연맹은 그녀의 활약을 꾸준히 기록했습니다. 강한 공격만으로 그런 평가를 받을 수 있을까요. 진짜 차이는 오랜 경기 속에서 드러납니다. 한국 선수가 세계 무대에 남긴 길을 따라갑니다.","한국에서 배구를 배우고 프로 무대에 선 선수가 일본을 거쳐 유럽으로 이동했습니다. 국제배구연맹의 기록에 따르면 김연경은 2011년 튀르키예의 페네르바흐체에 합류했습니다. 유럽 최고의 클럽들이 경쟁하는 무대에서 외국인 선수에게 요구되는 것은 아주 분명합니다. 팀이 어려울 때 점수를 내고, 동료와 호흡을 맞추며, 중요한 순간에 흔들리지 않아야 합니다. 뛰어난 공격수여도 새로운 리그에 적응하는 일은 또 다른 과제입니다. 팬들이 기대하는 모습과 감독이 원하는 역할이 다를 수도 있습니다. 김연경은 그 긴 시간 동안 유럽의 무대에서 자신의 가치를 증명해 왔습니다. 한국에서 길러진 선수가 세계 무대에서 경쟁할 수 있다는 사실을 실전으로 보여 준 것입니다.\n\n해외 생활의 어려움을 구체적인 인터뷰 없이 함부로 상상해 발언으로 쓰지 않습니다. 경기와 공식 기록만으로도 낯선 리그에서 쌓은 시간이 보입니다.\n\n유럽의 배구 리그는 세계 각국의 뛰어난 선수들이 한 팀에 모이는 무대입니다. 서로 다른 언어로 의사소통하고 서로 다른 훈련 방식에 익숙한 선수들이 한 방향으로 움직여야 합니다. 팀이 이기는 데 중요한 것은 한 선수가 공을 세게 때리는 능력만이 아닙니다. 수비수가 공을 살리고 세터가 공을 올리고 공격수가 득점으로 마무리하는 연결이 필요합니다. 김연경이 해외에서 장기간 뛸 수 있었다는 사실은 이런 협력 속에서 역할을 계속 맡았다는 의미입니다. 누구나 익숙한 환경에서 실력을 발휘하는 것은 아닙니다. 자신의 기량을 낯선 기준에 맞춰 증명하는 과정은 별도의 도전입니다. 그 시간이 쌓여 선수의 경력이 됩니다.","페네르바흐체에서의 활약은 국제 기록에도 남아 있습니다. 김연경은 2012년 유럽배구연맹 챔피언스리그 우승을 함께했습니다. 이후 다른 튀르키예 구단에서도 활약하며 국제 클럽대회에서 여러 차례 메달을 얻었습니다. 이런 성적은 감탄사가 아니라 공식 경기 기록으로 확인할 수 있습니다. 하지만 클럽 선수에게 경기란 국가대표 대회와 다릅니다. 클럽에서는 서로 다른 국적의 선수들이 오랜 시즌을 함께하고, 대표팀에서는 국가를 위해 짧고 큰 대회를 치릅니다. 한 사람은 두 무대에서 서로 다른 책임을 짊어집니다. 점수만 보는 사람에게는 이 차이가 잘 보이지 않을 수 있습니다. 그러나 팀 안에서 맡는 역할을 생각하면 훨씬 입체적인 선수의 모습이 보입니다.\n\n2012년 클럽 우승의 기록은 누군가의 소문이 아닙니다. 국제기구가 발표한 경력에서 확인할 수 있는 사실입니다.\n\n2012년의 유럽 클럽 우승을 이야기할 때에는 그날의 트로피 사진만 보여 줄 수도 있습니다. 하지만 그 트로피까지 가기 위해 수많은 경기와 훈련이 있었을 것입니다. 팀은 상대의 전술을 분석하고 선수의 몸 상태를 관리하며 승부를 준비합니다. 좋은 날의 공격 장면 하나로 선수 생활의 전체를 설명하기는 어렵습니다. 김연경은 일본과 튀르키예, 중국 등 여러 리그를 거치며 경력을 쌓았습니다. 서로 다른 팀의 요구와 환경을 경험했다는 사실이 그녀의 업적을 이해하는 데 중요합니다. 해외에서 인정받는다는 것은 한 번 크게 놀라게 하는 것과 다릅니다. 오랜 시간 함께 일하고 싶은 선수로 남는 것입니다.","배구에서 공격수의 가치는 득점 하나로 끝나지 않습니다. 상대 블로커를 어떻게 흔드는지, 어려운 볼을 어떻게 살리는지, 수비와 리시브에서 어떤 균형을 잡는지까지 중요합니다. 한 선수가 매번 강타만 날릴 수는 없습니다. 때로는 동료에게 기회를 만들고, 실수한 선수의 마음을 붙들고, 점수 차가 벌어졌을 때 팀 전체를 다시 모아야 합니다. 김연경이 오랫동안 높은 평가를 받은 데에는 이런 종합적인 경기 능력이 있습니다. 하지만 누군가가 그녀를 세계 공식 일 위로 선정했다고 단정하려면 정확한 대회와 수상 기준이 있어야 합니다. 국제연맹의 소개 기사와 특정 개인의 찬사는 서로 다른 자료입니다.\n\n공격 성공률과 수비 참여, 동료와의 연결은 서로 다른 경기 요소입니다. 득점 숫자 하나가 선수 전체를 정의하지는 않습니다.\n\n배구는 개인의 득점 기록이 눈에 잘 보이는 종목입니다. 강한 스파이크가 성공하면 관중의 함성도 크게 터집니다. 하지만 그 스파이크의 시작에는 수비와 연결 플레이가 있습니다. 동료가 어려운 공을 살렸기 때문에 공격 기회가 생길 수도 있습니다. 그래서 한 선수의 실력을 평가할 때는 여러 가지 요소를 보아야 합니다. 공식 대회가 인정한 수상 경력과 팬들이 느낀 감동은 서로 다른 종류의 평가입니다. 최고라는 수식어 한마디보다 공식 대회에서 남긴 기록과 동료들과 만든 결과가 훨씬 오래갑니다. 구체적인 기록은 과장된 칭찬보다 더 큰 설득력을 갖습니다.","첫 번째 반전은 눈에 잘 보이지 않는 리더십입니다. 김연경의 유명한 공격 장면을 모으면 화려한 영상이 만들어집니다. 그러나 한 시즌을 이끌어 가는 선수의 힘은 경기 사이의 긴 시간에도 나타납니다. 훈련에서 의사소통하고 후배를 다독이고 어려운 점수에서 다시 움직이는 모습입니다. 국제무대에서 오래 뛴 선수는 상대의 전술뿐 아니라 동료의 습관도 읽어야 합니다. 유럽의 서로 다른 팀에서 쌓은 경험은 이런 판단을 넓혔을 것입니다. 이것은 작가의 해석이지 특정 외국 코치의 발언으로 꾸민 말이 아닙니다. 실제 현지 감독이나 동료의 인터뷰를 찾는다면 그들이 무엇을 직접 평가했는지 정확히 옮겨야 합니다. 큰 소리의 칭찬보다 구체적인 경기 장면이 오래 남습니다.\n\n좋은 팀의 리더는 경기 중 크게 외치는 장면만으로 평가되지 않습니다. 꾸준한 훈련과 약속을 지키는 태도가 함께 쌓여야 합니다.\n\n힘든 순간에 선수는 단지 공을 잘 치는 것을 넘어 동료의 기세를 지켜야 할 때가 있습니다. 연속 실점이 이어지면 분위기가 한쪽으로 기울 수 있습니다. 그럴 때 경험 많은 선수가 움직임과 말로 팀을 다시 모으는 역할을 합니다. 다만 모든 경기에서 같은 방식으로 움직였다고 단정할 수는 없습니다. 경험 많은 선수에게 기대하는 역할과 실제로 벌어진 일은 엄연히 다르기 때문입니다. 진짜 감동은 확인되지 않은 눈물 한 방울을 덧붙여서 생기지 않습니다. 선수들의 움직임을 경기의 흐름 속에서 볼 때 평범한 동작도 달리 느껴집니다. 그러면 평범한 동작도 더 큰 의미를 갖게 됩니다.","김연경은 국제배구연맹이 주목해 온 한국 대표 선수입니다. 런던 올림픽에서 받은 개인상과 유럽 클럽에서 쌓은 기록은 서로 다른 시기의 성과입니다. 오랜 국가대표 경력에는 좋은 날만 있었던 것이 아닙니다. 우승하지 못한 경기와 아쉬운 순간도 있었습니다. 하지만 그런 날이 있었기 때문에 이후의 성적이 더 구체적인 의미를 갖습니다. 승리한 사진만 모아 놓으면 어느 선수가 얼마나 오래 버텼는지 알기 어렵습니다. 해외 경기에서 한국 선수 한 명이 상대 팀의 분석 대상이 되고, 오랜 시간 팬에게 기억되는 데에는 수많은 훈련의 날이 쌓여 있습니다. 이것이 국제연맹의 경력 소개가 가지는 힘입니다.\n\nFIVB가 소개한 경력에는 클럽과 대표팀에서의 시간들이 있습니다. 해외 기자·감독의 실명 발언을 추가할 때는 실제 인터뷰 날짜와 원문을 따로 확인해야 합니다.\n\n국가대표 유니폼을 입고 세계 무대에 나서는 일은 또 다른 무게를 가집니다. 클럽에서의 성적이 훌륭해도 대표팀에서는 다른 동료와 다른 전술이 필요합니다. 김연경은 오랜 기간 한국 대표팀에서 중심 역할을 했습니다. 국제배구연맹은 그녀의 경력을 소개하면서 유럽 클럽과 올림픽에서의 성과를 함께 다뤄 왔습니다. 오랫동안 선수 생활을 이어 가는 동안에는 부상과 체력 관리의 어려움도 있을 수 있습니다. 다만 구체적인 병명이나 개인의 고통을 자료 없이 만들어 낼 필요는 없습니다. 공식 경기와 대회 기록, 확인된 인터뷰만으로도 긴 경력의 밀도를 전달할 수 있습니다. 영광은 결과이고, 그 결과를 가능하게 한 것은 하루하루 쌓인 준비입니다.","두 번째 반전은 은퇴 후에 나옵니다. 김연경은 2024년 국가대표 생활을 마쳤고, 2025년 프로 선수로서도 은퇴했습니다. 마지막 시즌에는 흥국생명에서 우승을 경험했습니다. 그런데 2026년 국제배구연맹은 그녀가 코트 밖에서 다음 세대의 기회를 넓히는 이야기를 다뤘습니다. 최고의 공격수였다는 과거형에만 머무르지 않는다는 뜻입니다. 선수 한 사람의 기록은 시간이 지나 누군가에게 새로운 도전의 시작점이 될 수 있습니다. 물론 은퇴 뒤의 모든 활동이 성공으로 이어진다고 미리 단정할 수 없습니다. 그래도 이제 질문은 달라집니다. 얼마나 많은 점수를 냈느냐가 아니라 어떤 길을 남길 수 있느냐는 것입니다.\n\n2024년 국가대표 은퇴와 2025년 프로 은퇴는 서로 다른 시점입니다. 2026년 FIVB는 그녀의 이후 활동을 조명했습니다.\n\n2025년 프로 선수로서 은퇴했을 때, 김연경의 이름은 과거의 승부만으로 설명되기 어려워졌습니다. 오랫동안 최고 수준에서 경쟁한 선수는 코트 밖에서도 사람들에게 많은 질문을 받습니다. 젊은 선수들에게 무엇을 알려 줄 수 있는지, 배구를 더 많은 사람이 즐기게 할 방법이 무엇인지도 중요해집니다. 2026년 국제배구연맹이 은퇴 이후의 활동을 조명한 것은 이런 새로운 역할을 보여 주는 자료입니다. 선수의 명성은 때로 기록으로 남지만, 선수의 영향력은 주변 사람이 새로운 일을 시작할 때 나타날 수 있습니다. 김연경의 이야기가 은퇴식으로만 끝나지 않는 이유입니다. 새로운 역할은 또 다른 도전의 시작이 됩니다.","우리에게 김연경의 이름은 올림픽 중계의 기억과 이어질 수 있습니다. 한 점을 얻기 위해 몸을 날리고, 경기가 끝난 뒤 동료와 어깨를 맞대던 모습이 남습니다. 멀리 튀르키예의 코트에서도 한국 선수가 이름을 알렸다는 사실은 한 세대에게 새로운 가능성으로 다가왔을 것입니다. 그 마음을 표현하기 위해 확인되지 않은 터키 팬의 대사를 만들어 넣을 필요는 없습니다. 이미 남아 있는 경기 기록과 국제연맹의 평가가 충분히 말을 해 주기 때문입니다. 처음 질문으로 돌아갑니다. 김연경의 저력은 무엇이었을까요. 강한 스파이크는 눈앞의 점수를 바꿨고, 오랫동안 쌓은 노력은 다음 세대가 바라볼 목표를 바꿨습니다.\n\n누군가의 도전이 끝나도 그 사람의 기록과 경험은 다음 세대가 참고하는 길이 됩니다. 많은 세대가 기억하는 스포츠의 힘이 여기에 있습니다.\n\n많은 사람이 운동선수의 전성기를 짧은 순간으로 기억합니다. 결정적인 스파이크, 한 경기의 마지막 점수, 우승 트로피가 그렇습니다. 그러나 그 순간을 만들기 위해 선수는 긴 시간 동안 같은 동작을 반복하고 몸을 관리해야 합니다. 국제무대에서 한국 선수가 오랫동안 이름을 알렸다는 사실에는 그 반복의 시간이 들어 있습니다. 이제 경기를 떠난 뒤에는 그 경험이 다른 사람의 기회를 넓히는 방향으로 이어질 수 있습니다. 이 마지막 장면은 인위적인 외국 팬의 눈물이나 확인되지 않은 극찬보다도 더 깊은 여운을 남길 수 있습니다. 최고의 경력이 끝난 곳에서 다음 선수의 길이 시작된다는 사실, 스포츠는 그렇게 한 세대에서 다음 세대로 이어집니다."],"duration_target_sec":1020,"duration_measured_sec":null,"narration_chars":5441,"source_audio_confirmed":false,"source_in_out_confirmed":false,"rights_confirmed":false,"narration_synthesized":false,"provisional_srt":true,"emotion_curve":[3,3,2,3,4,3,5,5],"reference_group":"스포츠","foreign_opening_status":"2~4개 외국인 실음성 클립 미확보. 첫 12초 0:00-0:12 임시 배치 불가.","planned_srt":"1\n00:00:00,000 --> 00:00:09,962\n한국의 김연경은 튀르키예 코트에서 이름을 알렸습니다.\n\n2\n00:00:09,962 --> 00:00:19,237\n국제배구연맹은 그녀의 활약을 꾸준히 기록했습니다.\n\n3\n00:00:19,237 --> 00:00:28,168\n강한 공격만으로 그런 평가를 받을 수 있을까요.\n\n4\n00:00:28,168 --> 00:00:36,069\n진짜 차이는 오랜 경기 속에서 드러납니다.\n\n5\n00:00:36,069 --> 00:00:45,000\n한국 선수가 세계 무대에 남긴 길을 따라갑니다.\n\n6\n00:00:45,000 --> 00:00:51,168\n한국에서 배구를 배우고 프로 무대에 선 선수가 일본을 거쳐 유럽으로 이동했습니다.\n\n7\n00:00:51,168 --> 00:00:57,748\n국제배구연맹의 기록에 따르면 김연경은 2011년 튀르키예의 페네르바흐체에 합류했습니다.\n\n8\n00:00:57,748 --> 00:01:04,328\n유럽 최고의 클럽들이 경쟁하는 무대에서 외국인 선수에게 요구되는 것은 아주 분명합니다.\n\n9\n00:01:04,328 --> 00:01:11,319\n팀이 어려울 때 점수를 내고, 동료와 호흡을 맞추며, 중요한 순간에 흔들리지 않아야 합니다.\n\n10\n00:01:11,319 --> 00:01:16,390\n뛰어난 공격수여도 새로운 리그에 적응하는 일은 또 다른 과제입니다.\n\n11\n00:01:16,390 --> 00:01:21,325\n팬들이 기대하는 모습과 감독이 원하는 역할이 다를 수도 있습니다.\n\n12\n00:01:21,325 --> 00:01:26,945\n김연경은 그 긴 시간 동안 유럽의 무대에서 자신의 가치를 증명해 왔습니다.\n\n13\n00:01:26,945 --> 00:01:33,799\n한국에서 길러진 선수가 세계 무대에서 경쟁할 수 있다는 사실을 실전으로 보여 준 것입니다.\n\n14\n00:01:33,799 --> 00:01:39,967\n해외 생활의 어려움을 구체적인 인터뷰 없이 함부로 상상해 발언으로 쓰지 않습니다.\n\n15\n00:01:39,967 --> 00:01:44,628\n경기와 공식 기록만으로도 낯선 리그에서 쌓은 시간이 보입니다.\n\n16\n00:01:44,628 --> 00:01:50,385\n유럽의 배구 리그는 세계 각국의 뛰어난 선수들이 한 팀에 모이는 무대입니다.\n\n17\n00:01:50,385 --> 00:01:57,924\n서로 다른 언어로 의사소통하고 서로 다른 훈련 방식에 익숙한 선수들이 한 방향으로 움직여야 합니다.\n\n18\n00:01:57,924 --> 00:02:03,681\n팀이 이기는 데 중요한 것은 한 선수가 공을 세게 때리는 능력만이 아닙니다.\n\n19\n00:02:03,681 --> 00:02:10,398\n수비수가 공을 살리고 세터가 공을 올리고 공격수가 득점으로 마무리하는 연결이 필요합니다.\n\n20\n00:02:10,398 --> 00:02:17,937\n김연경이 해외에서 장기간 뛸 수 있었다는 사실은 이런 협력 속에서 역할을 계속 맡았다는 의미입니다.\n\n21\n00:02:17,937 --> 00:02:22,050\n누구나 익숙한 환경에서 실력을 발휘하는 것은 아닙니다.\n\n22\n00:02:22,050 --> 00:02:27,121\n자신의 기량을 낯선 기준에 맞춰 증명하는 과정은 별도의 도전입니다.\n\n23\n00:02:27,121 --> 00:02:30,000\n그 시간이 쌓여 선수의 경력이 됩니다.\n\n24\n00:02:30,000 --> 00:02:34,891\n페네르바흐체에서의 활약은 국제 기록에도 남아 있습니다.\n\n25\n00:02:34,891 --> 00:02:40,761\n김연경은 2012년 유럽배구연맹 챔피언스리그 우승을 함께했습니다.\n\n26\n00:02:40,761 --> 00:02:48,587\n이후 다른 튀르키예 구단에서도 활약하며 국제 클럽대회에서 여러 차례 메달을 얻었습니다.\n\n27\n00:02:48,587 --> 00:02:54,783\n이런 성적은 감탄사가 아니라 공식 경기 기록으로 확인할 수 있습니다.\n\n28\n00:02:54,783 --> 00:02:59,674\n하지만 클럽 선수에게 경기란 국가대표 대회와 다릅니다.\n\n29\n00:02:59,674 --> 00:03:09,783\n클럽에서는 서로 다른 국적의 선수들이 오랜 시즌을 함께하고, 대표팀에서는 국가를 위해 짧고 큰 대회를 치릅니다.\n\n30\n00:03:09,783 --> 00:03:14,511\n한 사람은 두 무대에서 서로 다른 책임을 짊어집니다.\n\n31\n00:03:14,511 --> 00:03:20,217\n점수만 보는 사람에게는 이 차이가 잘 보이지 않을 수 있습니다.\n\n32\n00:03:20,217 --> 00:03:27,228\n그러나 팀 안에서 맡는 역할을 생각하면 훨씬 입체적인 선수의 모습이 보입니다.\n\n33\n00:03:27,228 --> 00:03:32,283\n2012년 클럽 우승의 기록은 누군가의 소문이 아닙니다.\n\n34\n00:03:32,283 --> 00:03:37,174\n국제기구가 발표한 경력에서 확인할 수 있는 사실입니다.\n\n35\n00:03:37,174 --> 00:03:45,489\n2012년의 유럽 클럽 우승을 이야기할 때에는 그날의 트로피 사진만 보여 줄 수도 있습니다.\n\n36\n00:03:45,489 --> 00:03:51,848\n하지만 그 트로피까지 가기 위해 수많은 경기와 훈련이 있었을 것입니다.\n\n37\n00:03:51,848 --> 00:03:58,533\n팀은 상대의 전술을 분석하고 선수의 몸 상태를 관리하며 승부를 준비합니다.\n\n38\n00:03:58,533 --> 00:04:04,891\n좋은 날의 공격 장면 하나로 선수 생활의 전체를 설명하기는 어렵습니다.\n\n39\n00:04:04,891 --> 00:04:11,576\n김연경은 일본과 튀르키예, 중국 등 여러 리그를 거치며 경력을 쌓았습니다.\n\n40\n00:04:11,576 --> 00:04:19,402\n서로 다른 팀의 요구와 환경을 경험했다는 사실이 그녀의 업적을 이해하는 데 중요합니다.\n\n41\n00:04:19,402 --> 00:04:25,435\n해외에서 인정받는다는 것은 한 번 크게 놀라게 하는 것과 다릅니다.\n\n42\n00:04:25,435 --> 00:04:30,000\n오랜 시간 함께 일하고 싶은 선수로 남는 것입니다.\n\n43\n00:04:30,000 --> 00:04:35,240\n배구에서 공격수의 가치는 득점 하나로 끝나지 않습니다.\n\n44\n00:04:35,240 --> 00:04:46,419\n상대 블로커를 어떻게 흔드는지, 어려운 볼을 어떻게 살리는지, 수비와 리시브에서 어떤 균형을 잡는지까지 중요합니다.\n\n45\n00:04:46,419 --> 00:04:50,611\n한 선수가 매번 강타만 날릴 수는 없습니다.\n\n46\n00:04:50,611 --> 00:05:01,965\n때로는 동료에게 기회를 만들고, 실수한 선수의 마음을 붙들고, 점수 차가 벌어졌을 때 팀 전체를 다시 모아야 합니다.\n\n47\n00:05:01,965 --> 00:05:09,651\n김연경이 오랫동안 높은 평가를 받은 데에는 이런 종합적인 경기 능력이 있습니다.\n\n48\n00:05:09,651 --> 00:05:19,956\n하지만 누군가가 그녀를 세계 공식 일 위로 선정했다고 단정하려면 정확한 대회와 수상 기준이 있어야 합니다.\n\n49\n00:05:19,956 --> 00:05:26,245\n국제연맹의 소개 기사와 특정 개인의 찬사는 서로 다른 자료입니다.\n\n50\n00:05:26,245 --> 00:05:33,057\n공격 성공률과 수비 참여, 동료와의 연결은 서로 다른 경기 요소입니다.\n\n51\n00:05:33,057 --> 00:05:37,948\n득점 숫자 하나가 선수 전체를 정의하지는 않습니다.\n\n52\n00:05:37,948 --> 00:05:43,188\n배구는 개인의 득점 기록이 눈에 잘 보이는 종목입니다.\n\n53\n00:05:43,188 --> 00:05:48,428\n강한 스파이크가 성공하면 관중의 함성도 크게 터집니다.\n\n54\n00:05:48,428 --> 00:05:54,367\n하지만 그 스파이크의 시작에는 수비와 연결 플레이가 있습니다.\n\n55\n00:05:54,367 --> 00:06:00,830\n동료가 어려운 공을 살렸기 때문에 공격 기회가 생길 수도 있습니다.\n\n56\n00:06:00,830 --> 00:06:07,642\n그래서 한 선수의 실력을 평가할 때는 여러 가지 요소를 보아야 합니다.\n\n57\n00:06:07,642 --> 00:06:15,502\n공식 대회가 인정한 수상 경력과 팬들이 느낀 감동은 서로 다른 종류의 평가입니다.\n\n58\n00:06:15,502 --> 00:06:24,410\n최고라는 수식어 한마디보다 공식 대회에서 남긴 기록과 동료들과 만든 결과가 훨씬 오래갑니다.\n\n59\n00:06:24,410 --> 00:06:30,000\n구체적인 기록은 과장된 칭찬보다 더 큰 설득력을 갖습니다.\n\n60\n00:06:30,000 --> 00:06:35,699\n첫 번째 반전은 눈에 잘 보이지 않는 리더십입니다.\n\n61\n00:06:35,699 --> 00:06:42,822\n김연경의 유명한 공격 장면을 모으면 화려한 영상이 만들어집니다.\n\n62\n00:06:42,822 --> 00:06:51,777\n그러나 한 시즌을 이끌어 가는 선수의 힘은 경기 사이의 긴 시간에도 나타납니다.\n\n63\n00:06:51,777 --> 00:07:00,733\n훈련에서 의사소통하고 후배를 다독이고 어려운 점수에서 다시 움직이는 모습입니다.\n\n64\n00:07:00,733 --> 00:07:09,688\n국제무대에서 오래 뛴 선수는 상대의 전술뿐 아니라 동료의 습관도 읽어야 합니다.\n\n65\n00:07:09,688 --> 00:07:17,218\n유럽의 서로 다른 팀에서 쌓은 경험은 이런 판단을 넓혔을 것입니다.\n\n66\n00:07:17,218 --> 00:07:25,156\n이것은 작가의 해석이지 특정 외국 코치의 발언으로 꾸민 말이 아닙니다.\n\n67\n00:07:25,156 --> 00:07:36,147\n실제 현지 감독이나 동료의 인터뷰를 찾는다면 그들이 무엇을 직접 평가했는지 정확히 옮겨야 합니다.\n\n68\n00:07:36,147 --> 00:07:42,456\n큰 소리의 칭찬보다 구체적인 경기 장면이 오래 남습니다.\n\n69\n00:07:42,456 --> 00:07:50,190\n좋은 팀의 리더는 경기 중 크게 외치는 장면만으로 평가되지 않습니다.\n\n70\n00:07:50,190 --> 00:07:56,499\n꾸준한 훈련과 약속을 지키는 태도가 함께 쌓여야 합니다.\n\n71\n00:07:56,499 --> 00:08:06,676\n힘든 순간에 선수는 단지 공을 잘 치는 것을 넘어 동료의 기세를 지켜야 할 때가 있습니다.\n\n72\n00:08:06,676 --> 00:08:13,189\n연속 실점이 이어지면 분위기가 한쪽으로 기울 수 있습니다.\n\n73\n00:08:13,189 --> 00:08:21,533\n그럴 때 경험 많은 선수가 움직임과 말로 팀을 다시 모으는 역할을 합니다.\n\n74\n00:08:21,533 --> 00:08:29,064\n다만 모든 경기에서 같은 방식으로 움직였다고 단정할 수는 없습니다.\n\n75\n00:08:29,064 --> 00:08:38,223\n경험 많은 선수에게 기대하는 역할과 실제로 벌어진 일은 엄연히 다르기 때문입니다.\n\n76\n00:08:38,223 --> 00:08:45,957\n진짜 감동은 확인되지 않은 눈물 한 방울을 덧붙여서 생기지 않습니다.\n\n77\n00:08:45,957 --> 00:08:54,505\n선수들의 움직임을 경기의 흐름 속에서 볼 때 평범한 동작도 달리 느껴집니다.\n\n78\n00:08:54,505 --> 00:09:00,000\n그러면 평범한 동작도 더 큰 의미를 갖게 됩니다.\n\n79\n00:09:00,000 --> 00:09:06,184\n김연경은 국제배구연맹이 주목해 온 한국 대표 선수입니다.\n\n80\n00:09:06,184 --> 00:09:15,758\n런던 올림픽에서 받은 개인상과 유럽 클럽에서 쌓은 기록은 서로 다른 시기의 성과입니다.\n\n81\n00:09:15,758 --> 00:09:21,941\n오랜 국가대표 경력에는 좋은 날만 있었던 것이 아닙니다.\n\n82\n00:09:21,941 --> 00:09:27,128\n우승하지 못한 경기와 아쉬운 순간도 있었습니다.\n\n83\n00:09:27,128 --> 00:09:35,505\n하지만 그런 날이 있었기 때문에 이후의 성적이 더 구체적인 의미를 갖습니다.\n\n84\n00:09:35,505 --> 00:09:44,082\n승리한 사진만 모아 놓으면 어느 선수가 얼마나 오래 버텼는지 알기 어렵습니다.\n\n85\n00:09:44,082 --> 00:09:58,843\n해외 경기에서 한국 선수 한 명이 상대 팀의 분석 대상이 되고, 오랜 시간 팬에게 기억되는 데에는 수많은 훈련의 날이 쌓여 있습니다.\n\n86\n00:09:58,843 --> 00:10:04,029\n이것이 국제연맹의 경력 소개가 가지는 힘입니다.\n\n87\n00:10:04,029 --> 00:10:11,210\nFIVB가 소개한 경력에는 클럽과 대표팀에서의 시간들이 있습니다.\n\n88\n00:10:11,210 --> 00:10:21,383\n해외 기자·감독의 실명 발언을 추가할 때는 실제 인터뷰 날짜와 원문을 따로 확인해야 합니다.\n\n89\n00:10:21,383 --> 00:10:29,561\n국가대표 유니폼을 입고 세계 무대에 나서는 일은 또 다른 무게를 가집니다.\n\n90\n00:10:29,561 --> 00:10:37,939\n클럽에서의 성적이 훌륭해도 대표팀에서는 다른 동료와 다른 전술이 필요합니다.\n\n91\n00:10:37,939 --> 00:10:44,322\n김연경은 오랜 기간 한국 대표팀에서 중심 역할을 했습니다.\n\n92\n00:10:44,322 --> 00:10:54,495\n국제배구연맹은 그녀의 경력을 소개하면서 유럽 클럽과 올림픽에서의 성과를 함께 다뤄 왔습니다.\n\n93\n00:10:54,495 --> 00:11:04,269\n오랫동안 선수 생활을 이어 가는 동안에는 부상과 체력 관리의 어려움도 있을 수 있습니다.\n\n94\n00:11:04,269 --> 00:11:12,646\n다만 구체적인 병명이나 개인의 고통을 자료 없이 만들어 낼 필요는 없습니다.\n\n95\n00:11:12,646 --> 00:11:22,021\n공식 경기와 대회 기록, 확인된 인터뷰만으로도 긴 경력의 밀도를 전달할 수 있습니다.\n\n96\n00:11:22,021 --> 00:11:30,000\n영광은 결과이고, 그 결과를 가능하게 한 것은 하루하루 쌓인 준비입니다.\n\n97\n00:11:30,000 --> 00:11:34,925\n두 번째 반전은 은퇴 후에 나옵니다.\n\n98\n00:11:34,925 --> 00:11:46,498\n김연경은 2024년 국가대표 생활을 마쳤고, 2025년 프로 선수로서도 은퇴했습니다.\n\n99\n00:11:46,498 --> 00:11:53,146\n마지막 시즌에는 흥국생명에서 우승을 경험했습니다.\n\n100\n00:11:53,146 --> 00:12:06,689\n그런데 2026년 국제배구연맹은 그녀가 코트 밖에서 다음 세대의 기회를 넓히는 이야기를 다뤘습니다.\n\n101\n00:12:06,689 --> 00:12:14,569\n최고의 공격수였다는 과거형에만 머무르지 않는다는 뜻입니다.\n\n102\n00:12:14,569 --> 00:12:26,389\n선수 한 사람의 기록은 시간이 지나 누군가에게 새로운 도전의 시작점이 될 수 있습니다.\n\n103\n00:12:26,389 --> 00:12:36,484\n물론 은퇴 뒤의 모든 활동이 성공으로 이어진다고 미리 단정할 수 없습니다.\n\n104\n00:12:36,484 --> 00:12:40,670\n그래도 이제 질문은 달라집니다.\n\n105\n00:12:40,670 --> 00:12:50,766\n얼마나 많은 점수를 냈느냐가 아니라 어떤 길을 남길 수 있느냐는 것입니다.\n\n106\n00:12:50,766 --> 00:13:00,616\n2024년 국가대표 은퇴와 2025년 프로 은퇴는 서로 다른 시점입니다.\n\n107\n00:13:00,616 --> 00:13:08,003\n2026년 FIVB는 그녀의 이후 활동을 조명했습니다.\n\n108\n00:13:08,003 --> 00:13:21,300\n2025년 프로 선수로서 은퇴했을 때, 김연경의 이름은 과거의 승부만으로 설명되기 어려워졌습니다.\n\n109\n00:13:21,300 --> 00:13:32,873\n오랫동안 최고 수준에서 경쟁한 선수는 코트 밖 <script>
'use strict';
const D=JSON.parse(document.getElementById('sourceData').textContent);
const byId=Object.fromEntries(D.episodes.map(x=>[x.id,x]));
const state={id:D.episodes[0].id,tab:'script',playing:false,utterance:null};
const side=document.getElementById('sidebar'),main=document.getElementById('main');
const $=(q,root=document)=>root.querySelector(q),$$=(q,root=document)=>Array.from(root.querySelectorAll(q));
const esc=(s)=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const current=()=>byId[state.id];
const getParts=(ep)=>{try{let a=JSON.parse(localStorage.getItem('kpride-parts-'+ep.id));if(Array.isArray(a)&&a.length===8)return a}catch{}return ep.parts.slice()};
const saveParts=(ep,parts)=>{try{localStorage.setItem('kpride-parts-'+ep.id,JSON.stringify(parts));toast('해당 브라우저에 임시 저장됨')}catch{toast('브라우저 저장 불가. TXT 파일로 저장하세요')}};
function toast(msg){let a=$('#toast');a.textContent=msg;a.style.display='block';setTimeout(()=>a.style.display='none',2300)}
function blink(){return '<span class="badge y">실제 원음·IN/OUT 미확인</span><span class="badge r">사용권 미확보</span><span class="badge m">17분 목표 / 실측 아님</span>'}
const emoNames=['호평','배경','오해','근거','1차 반전','발견','2차 반전','감정 회수'];
function renderSide(){side.innerHTML=`<div class="nav-head">🗂️ 10편 × 8구간</div>`+D.episodes.map(ep=>`<button type="button" class="nav ${ep.id===state.id?'active':''}" data-ep="${ep.id}"><span class="idx">${String(ep.no).padStart(2,'0')}</span>${esc(ep.title)}<small>${esc(ep.category)} · ${ep.narration_chars.toLocaleString('ko-KR')}자 · 작업 원고</small></button>`).join('')+`<div class="fullnav">원고 수정은 브라우저에만 임시 저장됩니다. 이전 GitHub 파일은 수정되지 않습니다.</div>`}
function classify(s,role){if(/\?|까요|일까요|무엇|왜 |어떻게|어떤 이유|그렇다면|과연/.test(s))return 'yellow';if(/하지만|그러나|반전|우려|갈등|어려움|실패|불편|차별|무너|잘못|오해|제약/.test(s))return 'red';if(/평가|보도|기록|분석|수치|연구|기관|확인|시험|조건|201[0-9]|202[0-9]|OECD|IISS|FIVB|IOC|IEA|세계기록|기사/.test(s))return 'blue';if(/감동|자긍심|기억|인정|희망|노력|기쁨|함성|꿈|자랑|사랑|함께/.test(s))return 'green';return ({'위기':'red','검증':'blue','반전':'red','감동':'green','훅':'green'}[role]||'blue')}
function highlight(s,role){return s.split(/(?<=[.!?])\s+/u).map(z=>`<span class="role ${classify(z,role)}">${esc(z)}</span>`).join(' ')}
function emoChart(ep){const v=ep.emotion_curve;let coords=v.map((n,i)=>`${44+i*105},${175-30*n}`).join(' ');return `<svg class="emochart" viewBox="0 0 830 215" role="img" aria-label="17분 목표 감정곡선: ${v.join(',')}"><g stroke="#6a3d59" opacity=".65">${[35,65,95,125,155].map(y=>`<line x1="33" x2="800" y1="${y}" y2="${y}"/>`).join('')}</g><polyline points="${coords}" fill="none" stroke="#c4ff76" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>${v.map((n,i)=>`<circle cx="${44+i*105}" cy="${175-30*n}" r="6" fill="${i===4||i===6?'#ff668f':'#d9ff8d'}"/>`).join('')}<g font-size="12" fill="#ebc5d7">${emoNames.map((n,i)=>`<text x="${44+i*105}" y="205" text-anchor="middle">${n}</text>`).join('')}</g></svg>`}
const TABS=[['script','📝 대본 8구간'],['cuts','✂️ 편집 41컷'],['compare','🎣 원문 1:1 검수'],['sources','🌍 출처 검증'],['prompt','🟥 Claude/Codex 복사']];
function outline(ep){return `<details><summary>🌸 기존 8구간 아웃라인과 수정 사항 펼치기</summary><div class="segbody"><div class="notice">${esc(ep.correction)}</div><div class="tablebox"><table class="tbl"><thead><tr><th>시간</th><th>구간 주제</th><th>질문·궁금증</th></tr></thead><tbody>${ep.revised_outline.map(b=>`<tr><td>${esc(b.t)}</td><td>${esc(b.text)}</td><td>${esc(b.question)}</td></tr>`).join('')}</tbody></table></div></div></details>`}
function renderScript(ep){const p=getParts(ep);return `<div class="card"><div class="actions"><button class="red" id="copyCurrent">🔴 이 편 전체 원고 복사</button><button id="downloadTXT">📄 낭독 TXT</button><button id="downloadSRT">🟨 예상 SRT</button><button id="copyEdit">📋 Claude/Codex 패키지</button><button id="playAll">🔈 8구간 브라우저 미리듣기</button><button id="stopAudio">■ 정지</button><button id="toggleAll">▾ 8구간 전부 펼치기</button></div><div class="tiny muted" style="margin-top:9px">이 페이지의 브라우저 미리듣기는 운영체제 음성 엔진입니다. Edge TTS MP3가 아닙니다. 실제 낭독 시간이 17분과 다를 수 있습니다.</div><div class="audio" style="margin-top:10px"><label class="badge m">🎧 Edge TTS로 생성한 MP3 직접 선택 <input id="mp3Upload" type="file" accept=".mp3,audio/mpeg" style="max-width:290px"></label><audio id="listenMP3" controls preload="none"></audio></div></div>${p.map((txt,i)=>`<details class="segment seg" ${i===0?'open':''}><summary class="seghead"><span class="time">${ep.time_windows[i]}</span><strong>${i+1}구간 · ${emoNames[i]}</strong><span class="badge">${esc(ep.roles[i])}</span><span class="badge">${txt.length}자</span></summary><div class="segbody"><div class="actions"><button class="sm" data-play="${i}">▶ 이 구간 미리듣기</button><button class="sm" data-copyseg="${i}">복사</button><button class="sm" data-editseg="${i}">✏️ 수정</button><button class="sm" data-restseg="${i}">↶ 원본 복구</button></div><div class="script" data-highlight="${i}" style="margin-top:10px">${highlight(txt,ep.roles[i])}</div><textarea class="scriptedit hidden" data-editor="${i}" spellcheck="true">${esc(txt)}</textarea><div class="tiny muted" style="margin-top:8px">H${String(i+1).padStart(2,'0')} · 실제 외국인 원음/영상: 미확정 · 이 구간의 영상연출은 편집표 참조 · 색상은 역할별 시각 검수 보조</div></div></details>`).join('')}`}
function renderCuts(ep){return `<div class="card"><h3>✂️ 15~30초 편집용 장면표, 약 25초씩 41칸</h3><p class="smallmuted">영상 출력 시각은 계획값입니다. 외국인 원본 source IN/OUT은 전부 공란입니다. 허가받은 실제 클립 2~4개로 시작할 계획만 설정됐고 촬영·편집된 MP4는 아직 없습니다.</p><div class="actions"><button class="red" id="downloadCSV">🔴 전체 편집표 CSV</button><button id="copyTimeline">편집표 복사</button></div></div><div class="tablebox"><table class="tbl"><thead><tr><th>컷</th><th>출력 IN–OUT</th><th>구간</th><th>대본 연결</th><th>장면·효과</th><th>소스/권리</th></tr></thead><tbody>${ep.cuts.map(x=>`<tr><td>${esc(x.shot)}</td><td>${esc(x.output_start)}–${esc(x.output_end)}</td><td>${esc(x.beat)}</td><td>${esc(x.narration_prompt)}</td><td>${esc(x.visual)}<div class="tiny muted">${esc(x.overlay)}</div></td><td><span class="badge r">원음 ${esc(x.source_audio_status)}</span><span class="badge r">${esc(x.rights)}</span><div class="tiny muted">원본 IN/OUT: 미확정</div></td></tr>`).join('')}</tbody></table></div>`}
function renderCompare(ep){let parts=getParts(ep);return `<div class="card"><h3>🌸 참고 성공 자막 원문 ↔ 이번 대본 새 문장: 구조 역할별 1:1 매칭</h3><p>왼쪽은 **실제 첨부 자막 파일의 전사 문장**이며 글자 위치까지 확인했습니다. 영상의 진짜 자막 시각/화자/원음은 미확인입니다. 오른쪽은 완전히 새로 쓴 우리 원고입니다. 실제 사건이나 인물의 문구를 가져온 것이 아니라, <b>훅·전개 기능</b>만 비교합니다.</p><div class="swatches"><span><b style="border-color:var(--yellow)">노랑</b> 질문</span><span><b style="border-color:var(--red)">빨강</b> 갈등·반전</span><span><b style="border-color:var(--sky)">하늘</b> 근거</span><span><b style="border-color:var(--mint)">연두</b> 감동</span></div>${emoChart(ep)}</div>`+D.examples.map((x,i)=>`<div class="compare-row"><div class="actions"><span class="badge m">${i+1}구간 ${esc(ep.roles[i])}</span><span class="tiny muted">같은 기능, 다른 사실/줄거리 · 원음 시간 미확인</span></div><div class="compare-grid" style="margin-top:9px"><div class="quote"><b style="color:#ffadc7">◀ 참고 성공 자막 원문 (문장 그대로)</b><p class="role ${['green','blue','red','blue','red','blue','red','green'][i]}">${esc(x.quote)}</p><div class="tiny muted">${esc(x.label)} · 참고 TXT 문자 ${x.start_char}–${x.end_char} · 영상 분초 미검증</div></div><div class="quote"><b style="color:var(--mint)">▶ 새 원고 적용 문장</b><p class="role ${['green','blue','red','blue','red','blue','red','green'][i]}">${esc((parts[i].match(/[^.!?]+[.!?]/)||[parts[i].slice(0,150)])[0].trim())}</p><div class="tiny muted">새 원고 ${ep.id} / H${i+1} · 타임라인 ${ep.time_windows[i]}</div></div></div></div>`).join('')}
function renderSources(ep){return `<div class="card"><h3>🔎 현재 확인된 자료와 부족한 근거</h3><p>외신의 실제 평가, 객관적 사실, 국제기구 검토를 혼동하지 않습니다. 아래 자료는 원본 내용 확인용 링크이며 방송 영상 및 기사 사진 사용허락과는 별개입니다.</p><div class="notice">필수 추가 작업: 각 주제당 실제 외국인 <b>긍정 원음 7개</b> (원문/번역/화자/URL/날짜/조회수/IN·OUT) 확보. 현재 주제별로 7개 모두 확보했다고 표시하지 않습니다.</div>${ep.source_links.map(x=>`<div class="linkbox"><b>${esc(x[0])}</b><span class="badge">${esc(x[1])}</span><span class="badge y">${esc(x[4])}</span><div style="margin:7px 0">${esc(x[2])}</div><a href="${esc(x[3])}" target="_blank" rel="noopener noreferrer">${esc(x[3])}</a></div>`).join('')}<div class="notice good">실제 한국 호평은 외국 화자와 평가 내용이 확인된 경우만 사용합니다. 국내 기관 자체 홍보는 외국 칭찬으로 집계하지 않습니다.</div></div>`}
function makePack(ep){let p=getParts(ep);return `K PRIDE · by gpt 쓸모 소스\n제작 일자: 2026-11-16\n[해당 편] ${ep.no}. ${ep.title}\n[중요 수정] ${ep.correction}\n\n[절대 조건]\n1. 이미 작성된 8구간 대본의 사실과 톤을 유지하며 17분을 목표로 편집, 타임코드 실제 TTS 측정 뒤 다시 계산.\n2. 첫 12초는 실제 검증된 한국 칭찬 외국인 원음(1~4초×2~4개). 없는 원음이나 다른 화자의 발언을 합성하지 말 것.\n3. 30~60초마다 새 사실, 질문→답→다음 궁금증, 1차 반전과 2차 반전 서로 다른 새 근거.\n4. 내 한국어 내레이션 음성 비중 목표 60% 이상, 해외 출처 영상 목표 40%(저작권 허용분만), 자체 그래픽 목표 60%. 4초 미만 컷도 저작권 면책 아님.\n5. 제작 메모를 음성에 넣지 말고 자연스러운 낭독만 사용. 해외 언론/국제기구 평가와 한국 공적 수치를 구분.\n6. 원본 클립 IN/OUT과 화자, 번역, 일자, 조회수와 이용권은 실제 원본을 들은 뒤에만 입력.\n7. 컷 41개 CSV와 대본, 예측 SRT를 기반으로 영상 연출. 실제 TTS 뒤 SRT 리타이밍.\n8. Edge-TTS에서 한국어를 청크 합성하고 WAV/192kbps MP3, SRT, QC 제출. 사용자에게 게시 승인 받기 전 배포 금지.\n\n[8구간 원고 / TTS 입력]\n${p.map((v,i)=>`\n${i+1}구간 ${ep.time_windows[i]}\n${v}`).join('\n')}\n\n[소스와 검증]\n${ep.source_links.map(x=>`${x[0]} (${x[1]}) ${x[3]} | ${x[2]}`).join('\n')}\n\n[영상 편집 타임라인 / 소스 미확정]\n${ep.cuts.map(c=>`${c.shot} ${c.output_start}-${c.output_end} | H${c.beat} | ${c.narration_prompt} | ${c.visual} | 실제 원본 IN/OUT 미확정`).join('\n')}\n\n[검수 요약]\n영상/원음 권리: 미확인, TTS 합성: 미실행, 실제 분량: 미측정, SRT: 구조적 예상 시간.\n`}
function renderPrompt(ep){let s=makePack(ep);return `<div class="card"><h3>🔴 클로드·코덱스 원클릭 패키지</h3><p>선택한 편의 <b>8구간 원고 + 41컷 편집표 + 해외 출처 + Edge TTS 요청 + 권리 검수 지시</b>가 들어 있습니다. 단일 복사 버튼으로 작업에 넘길 수 있습니다.</p><div class="actions"><button class="red" id="copyPack">🔴 통합 프롬프트 전체 복사</button><button id="downloadPack">파일로 저장</button></div><pre class="pack">${esc(s)}</pre></div>`}
function render(){let ep=current(),chars=getParts(ep).join('\n\n').length;renderSide();let section=state.tab==='script'?renderScript(ep):state.tab==='cuts'?renderCuts(ep):state.tab==='compare'?renderCompare(ep):state.tab==='sources'?renderSources(ep):renderPrompt(ep);main.innerHTML=`<div class="hero"><div class="topline">🇰🇷 KOREA FOREIGN REACTIONS · SCRIPT / SUBTITLE / EDIT</div><h1>${esc(ep.title)}</h1><p>${esc(ep.angle)}</p><div>${blink()}</div><div class="toolbar"><button class="sm" id="prevEp">← 이전 편</button><button class="sm" id="nextEp">다음 편 →</button><button class="sm" id="allDetails">☰ 모든 구간 펼치기/접기</button></div></div><div class="metrics"><div class="metric"><strong>${String(ep.no).padStart(2,'0')} / 10</strong><small>신규 에피소드</small></div><div class="metric"><strong>8</strong><small>서사 구간</small></div><div class="metric"><strong>${chars.toLocaleString('ko-KR')}</strong><small>낭독 원고 문자 수</small></div><div class="metric"><strong>41</strong><small>약 25초 편집 컷</small></div></div><div class="notice"><b>꼭 확인:</b> ${esc(ep.correction)}<div class="tiny muted" style="margin-top:5px">지금 자료는 TTS·동영상 제작 전 단계입니다. 첫 원음 2~4개, 유효한 출처, 음성 길이, 저작권 모두 실제 확인이 필요합니다.</div></div>${outline(ep)}<nav class="tabs">${TABS.map(t=>`<button class="tab ${t[0]===state.tab?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</nav><section>${section}</section><div class="footer">by gpt 쓸모 소스 · Deep Wine Editor v1.0 · 생성된 대본은 창작 해설이며 실제 외국인 인용/리액션 음성이 아닙니다. 클립·기사 캡처·음원 상업적 이용권은 편집 전에 확인하세요.</div>`;}
function saveTextAs(name,text,type='text/plain;charset=utf-8'){let a=document.createElement('a'),b=new Blob([text],{type});a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function copy(s){try{await navigator.clipboard.writeText(s);toast('복사 완료!')}catch{let t=document.createElement('textarea');t.value=s;t.style.position='fixed';document.body.append(t);t.select();try{document.execCommand('copy');toast('복사 완료!')}catch{toast('복사가 차단되었습니다. TXT로 내려받으세요.')}t.remove()}}
function csv(ep){let a=ep.cuts,cols=Object.keys(a[0]);return '\uFEFF'+[cols.join(','),...a.map(o=>cols.map(c=>'"'+String(o[c]??'').replace(/"/g,'""')+'"').join(','))].join('\n')}
function narr(ep){return getParts(ep).join('\n\n')}
function play(text){if(!('speechSynthesis' in window)){toast('이 브라우저는 음성 미리듣기를 지원하지 않습니다.');return}speechSynthesis.cancel();let chunks=text.match(/.{1,180}(?:\s|$)/gs)||[text];chunks=chunks.flatMap(x=>x.length>190?[x.slice(0,180),x.slice(180)]:[x]);let ko=speechSynthesis.getVoices().find(v=>v.lang.startsWith('ko'));for(let s of chunks){let u=new SpeechSynthesisUtterance(s);u.lang='ko-KR';u.rate=1;u.pitch=1;if(ko)u.voice=ko;speechSynthesis.speak(u)}toast('운영체제 음성 미리듣기. Edge TTS 아님')}
function moveEp(step){let ix=D.episodes.findIndex(x=>x.id===state.id);state.id=D.episodes[(ix+step+D.episodes.length)%D.episodes.length].id;state.tab='script';render();window.scrollTo(0,0)}
window.addEventListener('click',e=>{let target=e.target.closest('button');if(!target)return;let ep=current(),parts=getParts(ep);if(target.dataset.ep){state.id=target.dataset.ep;state.tab='script';render();scrollTo(0,0)}else if(target.dataset.tab){state.tab=target.dataset.tab;render()}else if(target.dataset.play!==undefined){play(parts[+target.dataset.play])}else if(target.dataset.copyseg!==undefined){copy(parts[+target.dataset.copyseg])}else if(target.dataset.editseg!==undefined){let ix=+target.dataset.editseg;let el=$(`[data-editor="${ix}"]`);el.classList.toggle('hidden');$(`[data-highlight="${ix}"]`).classList.toggle('hidden');if(!el.classList.contains('hidden'))el.focus()}else if(target.dataset.restseg!==undefined){let ix=+target.dataset.restseg;parts[ix]=ep.parts[ix];saveParts(ep,parts);render()}else switch(target.id){case'prevEp':moveEp(-1);break;case'nextEp':moveEp(1);break;case'copyAll':copy(D.episodes.map(x=>`# ${x.no}. ${x.title}\n\n${narr(x)}`).join('\n\n-----\n\n'));break;case'copyCurrent':copy(narr(ep));break;case'copyEdit':case'copyPack':copy(makePack(ep));break;case'downloadTXT':saveTextAs(ep.slug+'_narration.txt',narr(ep));break;case'downloadSRT':saveTextAs(ep.slug+'_planned_NOT_SYNC.srt',ep.planned_srt);break;case'downloadCSV':saveTextAs(ep.slug+'_timeline.csv',csv(ep),'text/csv;charset=utf-8');break;case'downloadPack':saveTextAs(ep.slug+'_Claude_Codex_PROMPT.txt',makePack(ep));break;case'copyTimeline':copy(csv(ep));break;case'playAll':play(narr(ep));break;case'stopAudio':if('speechSynthesis'in window)speechSynthesis.cancel();toast('미리듣기 정지');break;case'toggleAll':case'allDetails':{let all=$$('details.seg');if(!all.length){state.tab='script';render();all=$$('details.seg')}let open=all.some(x=>!x.open);all.forEach(x=>x.open=open)}break;case'downloadZipHint':toast('HTML과 10편 TXT·SRT·CSV ZIP은 함께 제공되는 파일을 이용하세요');break;}}
);
window.addEventListener('change',e=>{if(e.target.id==='mp3Upload'){const f=e.target.files?.[0];if(f){const player=$('#listenMP3');player.src=URL.createObjectURL(f);player.play().catch(()=>{});toast('선택한 MP3를 불러왔습니다. 실제 합성된 오디오인지 확인하세요')}}});
window.addEventListener('input',e=>{let el=e.target;if(!el.matches('[data-editor]'))return;let ep=current(),parts=getParts(ep),ix=+el.dataset.editor;parts[ix]=el.value;saveParts(ep,parts);let h=$(`[data-highlight="${ix}"]`);if(h)h.innerHTML=highlight(el.value,ep.roles[ix]);});
render();
</script></body></html>
