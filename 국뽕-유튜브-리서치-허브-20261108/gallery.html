window.cp=async id=>{const t=await getSub(id);await navigator.clipboard.writeText(t.replace(/^\ufeff/,''));alert('자막 복사됨 → 구글 시트 탭 셀 A1에 붙여넣기')};
$('dl').onclick=async()=>{const ids=[...SEL];if(!ids.length){alert('먼저 카드 우하단 체크박스로 영상을 선택하세요');return}let out='';for(const id of ids){const t=await getSub(id);out+='\n\n==================================================\n'+t.replace(/^\ufeff/,'')}
 const b=new Blob(['\ufeff'+out],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='자막_'+ids.length+'편.txt';a.click()};
$('clr').onclick=()=>{SEL.clear();$('selc').textContent=0;draw()};
$('sheet').onclick=async()=>{const ids=[...SEL];if(!ids.length){alert('먼저 영상을 선택하세요');return}
 const rows=[['영상ID','제목','채널','조회','외국인%','나레이션%','시간','자막(한국어/원음)']];
 for(const id of ids){const m=D.find(x=>x.id==id)||{};const st=IDX[id]||{};const t=await getSub(id);const lines=t.split('\n').filter(l=>/^\[/.test(l)).map(l=>l.replace(/\t/g,' '));rows.push([id,m.t,m.ch,m.v,st.fo,st.ko,m.d,lines.join('\n')]);}
 const tsv=rows.map(r=>r.map(c=>String(c??'').replace(/\t/g,' ').replace(/\r?\n/g,' ⏎ ')).join('\t')).join('\n');
 await navigator.clipboard.writeText(tsv);alert(ids.length+'편을 탭 형식(TSV)으로 복사했습니다. 구글 시트 새 탭 A1에 붙여넣으면 열이 나뉩니다.\n(영상 1편당 탭 1개를 원하면 아래 📑 버튼 사용)')};
$('sheetsplit').onclick=async()=>{const ids=[...SEL];if(!ids.length){alert('먼저 영상을 선택하세요');return}
 const out=[];for(const id of ids){const m=D.find(x=>x.id==id)||{};const t=await getSub(id);out.push('### '+(m.t||id)+' ('+id+')\n'+t.replace(/^\ufeff/,''))}
 const b=new Blob(['\ufeff'+out.join('\n\n')],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='시트_영상별_'+ids.length+'편.txt';a.click();alert('받은 파일을 열어 영상별 ### 블록을 구글 시트 탭 하나씩에 붙여 넣으세요.')};
