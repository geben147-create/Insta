$('grp').innerHTML=GRPS.map(g=>'<button data-g="'+g+'"'+(g==grp?' class="on"':'')+'>'+g+'</button>').join('');
$('grp').onclick=e=>{if(e.target.dataset.g){grp=e.target.dataset.g;[...$('grp').children].forEach(b=>b.className=b.dataset.g==grp?'on':'');draw()}};
$('dir').onclick=()=>{desc=!desc;$('dir').textContent=desc?'↓ 내림차순':'↑ 오름차순';draw()};
['key','q','fo','ko','hk'].forEach(i=>$(i).oninput=draw);$('fo').oninput=()=>{$('fov').textContent=$('fo').value+'%';draw()};$('ko').oninput=()=>{$('kov').textContent=$('ko').value+'%';draw()};
$('sz').oninput=()=>document.documentElement.style.setProperty('--w',$('sz').value+'px');
$('tgl').onclick=()=>{const s=$('sel');s.classList.toggle('min');$('tgl').textContent=s.classList.contains('min')?'▸ 선택 바 펴기':'▾ 선택 바 접기'};
function uniq(L){const s=new Set();return L.filter(x=>s.has(x.id)?false:(s.add(x.id),true))}
function kval(x,key){if(key=='pc')return x.pc;if(key=='fo')return IDX[x.id]?.fo??-1;if(key=='ko')return IDX[x.id]?.ko??-1;if(key=='k')return x.k;return x[key]==null?-1:x[key]}
function filt(){let L=D.filter(x=>grp=='전체'||(x.grps||[x.grp]).includes(grp));if(grp=='전체')L=uniq(L);
 const fo=+$('fo').value,ko=+$('ko').value,q=$('q').value.toLowerCase();
 if(fo>0)L=L.filter(x=>(IDX[x.id]?.fo||0)>=fo);if(ko>0)L=L.filter(x=>(IDX[x.id]?.ko||0)>=ko);
 if(q)L=L.filter(x=>(x.t+x.ch).toLowerCase().includes(q));
 const key=$('key').value;L.sort((a,b)=>{const A=kval(a,key),B=kval(b,key);const r=A<B?-1:A>B?1:0;return desc?-r:r});return L}
function card(x,i){const st=IDX[x.id]||{};const cls=(i<3&&desc?' top'+(i+1):'')+(SEL.has(x.id)?' sel':'');
 const badge=(st.fo>=50?'<span class="bd" style="background:#dc2626">'+(MODE=='ja'?'🇯🇵 외국어 多':'🌐 외국인 多')+'</span>':'')+(st.ko>=70?'<span class="bd" style="background:#2563eb">🎙 나레이션 多</span>':'');
 const mix=st.fo!=null?'<div class="mix"><span class="fo" style="width:'+st.fo+'%"></span><span class="ko" style="width:'+st.ko+'%"></span></div><div class="mixl"><b class="r">외국 '+st.fo+'%</b><b class="bl">나레이션 '+st.ko+'%</b></div>':'<div class="nosub">자막 없음</div>';
 const hook=$('hk').checked&&x.h?'<div class="hk" style="font-size:10px;color:#ffe08a">🪝 '+esc(x.h)+'</div>':'';
 return '<div class="c'+cls+'" data-id="'+x.id+'"><input type="checkbox" class="ck" '+(SEL.has(x.id)?'checked':'')+' onchange="tog(\''+x.id+'\',this.checked)"><a class="th" href="https://www.youtube.com/watch?v='+x.id+'" target="_blank"><img loading="lazy" src="https://i.ytimg.com/vi/'+x.id+'/mqdefault.jpg"><span class="rk">'+(i+1)+'</span><span class="gp" style="background:'+(GC[x.grp]||'#1565c0')+'">'+x.grp+'</span></a><div class="b"><div class="ttl">'+esc(x.t)+'</div>'+hook+'<div class="m"><span class="v">'+nf(x.v)+'</span> 조회 · <span class="pc">구독 대비 '+pct(x.pc)+'</span></div><div class="m">'+esc(x.ch)+(x.s!=null?' · 구독 '+nf(x.s):'')+' · '+esc(x.d)+'</div>'+badge+'<div>'+mix+'</div><div class="btns"><button onclick="subs(\''+x.id+'\',this)">📄 자막</button>'+(MODE=='ja'?'<button onclick="setm(\''+x.id+'\',\'ja\')">🇯🇵 원문</button><button onclick="setm(\''+x.id+'\',\'ko\')">🇰🇷 번역</button>':'')+'<button onclick="cp(\''+x.id+'\')">📋 복사</button></div><div class="subs" id="s_'+x.id+'"></div></div></div>'}
function draw(){const L=filt();$('cnt').textContent=L.length+'개';$('g').innerHTML=L.map((x,i)=>card(x,i)).join('')}
window.tog=(id,v)=>{v?SEL.add(id):SEL.delete(id);$('selc').textContent=SEL.size;const c=document.querySelector('.c[data-id="'+id+'"]');if(c)c.classList.toggle('sel',v)};
async function getP(id){const p=IDX[id]?.p;if(p==null)return null;if(!PK[p])PK[p]=await (await fetch('packs/jp_'+p+'.json')).json();{let v=PK[p][id];if(typeof v==='string'){v=v.split('\n').filter(l=>/^\[/.test(l)).map(l=>{const m=l.match(/^\[(\d+:\d+)\] \((.+?)\) (.*)$/);return m?{t:m[1],l:/원음/.test(m[2])?'fo':'ko',x:m[3]}:null}).filter(Boolean)}return v||null}}
window.setm=async(id,m)=>{const box=$('s_'+id);box.dataset.mode=m;box.classList.add('on');renderSub(id)};
function lines(id){return PK_LINES[id]}
let PK_LINES={};
async function renderSub(id){const box=$('s_'+id);const m=box.dataset.mode||'ja';const data=await getP(id);if(!data){box.innerHTML='<div class="nosub">자막 없음</div>';return}
 const tr=TR[id]||{};let out='<div class="hint">'+(MODE=='ja'?'🇯🇵 원문: 일본어 자막 · 🇰🇷 번역: 한국어(번역된 구간만)':'🔴 외국어 발화(붉은 배경)는 번역이 있으면 빨간 칸에 한국어 번역')+'</div>';
 for(const l of data){const isFo=l.l=='ja'||l.l=='fo'||(!l.l&&!/한국어/.test(l.l));const t=l.t;let trn='';if(isFo&&tr[t]!==undefined&&m!=='ja')trn='<span class="tr">🇰🇷 '+esc(tr[t])+'</span>';
  if(MODE=='ja'&&m==='ko'){if(isFo){if(tr[t]!==undefined)out+='<div class="ln fo"><span class="t">'+t+'</span>'+esc(tr[t])+'</div>'}else out+='<div class="ln ko"><span class="t">'+t+'</span>'+esc(l.x)+'</div>';continue}
  out+='<div class="ln '+(isFo?'fo':'ko')+'"><span class="t">'+t+'</span>'+esc(l.x)+trn+'</div>'}
 box.innerHTML=out}
window.subs=async(id,btn)=>{const box=$('s_'+id);if(box.classList.contains('on')){box.classList.remove('on');btn.textContent='📄 자막';return}box.dataset.mode=box.dataset.mode||'ja';box.classList.add('on');btn.textContent='📄 접기';await renderSub(id)};
window.cp=async id=>{const data=await getP(id);if(!data){alert('자막 없음');return}const tr=TR[id]||{};const t=data.map(l=>'['+l.t+'] '+(l.x)+((l.l!='ko'&&tr[l.t]!==undefined)?'\n   → '+tr[l.t]:'')).join('\n');await navigator.clipboard.writeText(t);alert('자막 복사됨(원문+번역)')};
async function allText(ids){let out='';for(const id of ids){const m=D.find(x=>x.id==id)||{};const data=await getP(id)||[];const tr=TR[id]||{};out+='\n\n=== '+(m.t||id)+' ('+id+') ===\n'+data.map(l=>'['+l.t+'] '+l.x+((l.l!='ko'&&tr[l.t]!==undefined)?'\n   → '+tr[l.t]:'')).join('\n')}return out}
$('dl').onclick=async()=>{const ids=[...SEL];if(!ids.length){alert('먼저 영상을 선택하세요');return}const b=new Blob(['\ufeff'+await allText(ids)],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='일본자막_'+ids.length+'편.txt';a.click()};
$('clr').onclick=()=>{SEL.clear();$('selc').textContent=0;draw()};
$('sheet').onclick=async()=>{const ids=[...SEL];if(!ids.length){alert('먼저 영상을 선택하세요');return}const rows=[['영상ID','제목','채널','조회','구독자','구독대비%','게시','자막(원문→번역)']];for(const id of ids){const m=D.find(x=>x.id==id)||{};const data=await getP(id)||[];const tr=TR[id]||{};rows.push([id,m.t,m.ch,m.v,m.s,m.pc==null?'':m.pc.toFixed(1),m.d,data.map(l=>'['+l.t+'] '+l.x+((l.l!='ko'&&tr[l.t]!==undefined)?' ⏎→ '+tr[l.t]:'')).join(' ⏎ ')])}
 await navigator.clipboard.writeText(rows.map(r=>r.map(c=>String(c??'').replace(/\t/g,' ').replace(/\r?\n/g,' ⏎ ')).join('\t')).join('\n'));alert(ids.length+'편 탭 형식(TSV)으로 복사했습니다. 구글 시트에 붙여넣으면 열이 나뉩니다.')};
$('split').onclick=async()=>{const ids=[...SEL];if(!ids.length){alert('먼저 영상을 선택하세요');return}const out=[];for(const id of ids){const m=D.find(x=>x.id==id)||{};out.push('### '+(m.t||id)+' ('+id+')'+(await allText([id])).replace(/^\n\n=== .*? ===\n/,''))}const b=new Blob(['\ufeff'+out.join('\n\n')],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='일본자막_탭별_'+ids.length+'편.txt';a.click();alert('받은 파일의 ### 블록을 시트 탭 하나씩에 붙이세요.')};
draw();</script></body></html>
