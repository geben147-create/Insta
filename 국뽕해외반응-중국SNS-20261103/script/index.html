<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>📜 대본 · by Hermes Opus — 중국 SNS 한국 영상 자막</title>
<style>
:root{--bg:#0d0f14;--panel:#151922;--line:#2a3140;--tx:#e8ecf3;--mut:#9aa6b8;--acc:#e7c17b;--sw:300px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Pretendard","Malgun Gothic",system-ui,sans-serif}
a{color:#8fc3ff}
#side{position:fixed;left:0;top:0;bottom:0;width:var(--sw);background:var(--panel);border-right:1px solid var(--line);overflow:auto;z-index:20;transition:transform .15s}
body.hide #side{transform:translateX(-100%)}#main{margin-left:var(--sw);padding:10px 18px 60px;transition:margin .15s}body.hide #main{margin-left:0}
#brand{padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
#brand b{font-size:15px}#brand .by{display:inline-block;margin-top:3px;font-size:11px;padding:1px 7px;border-radius:10px;background:#3a2a10;color:var(--acc);border:1px solid #6b5326}
#brand .row{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
button,input,select{background:#1d2431;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px}button{cursor:pointer}button.on{background:#3b4a68;border-color:var(--acc)}
.cat{margin:6px 6px 0;border-radius:8px;overflow:hidden;border:1px solid #ffffff14}
.cat>.h{padding:7px 10px;font-weight:800;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.cat>.h:after{content:"▾";opacity:.7}.cat.closed>.h:after{content:"▸"}.cat.closed>.b{display:none}
.cat>.b{padding:2px 0 6px}
.vi{display:block;padding:5px 10px 5px 14px;font-size:12.5px;cursor:pointer;border-left:3px solid transparent;color:var(--tx);text-decoration:none;line-height:1.35}
.vi:hover{background:#ffffff12}.vi.on{background:#ffffff22;border-left-color:var(--acc)}.vi small{color:#ffffffa0;display:block;font-size:11px}
.vi.todo{opacity:.45}
.sub{margin:6px 0 2px 14px;border-left:1px dashed #ffffff40}.sub a{display:block;padding:2px 8px;font-size:11.5px;color:#ffffffc8;cursor:pointer;text-decoration:none}.sub a:hover{color:#fff;background:#ffffff10}
h1{font-size:19px;margin:6px 0 4px}.mut{color:var(--mut);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;margin-right:4px;color:#fff}
.legend span{margin-right:12px;font-size:12px}
mark.y{background:#fff35c;color:#111;padding:0 2px;border-radius:2px;box-shadow:0 0 0 1px #fff35c}
.red{color:#ff5a5a;font-weight:700}
.tg{font-size:10.5px;border-radius:4px;padding:0 4px;margin-right:4px;vertical-align:1px;font-weight:700}
.tg.good{background:#1f7a3a}.tg.bad{background:#a12b2b}.tg.eval{background:#6b4bb3}.tg.key{background:#b3261e}
details.ch{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:#11151d}
details.ch>summary{padding:6px 10px;cursor:pointer;font-weight:700;position:sticky;top:0;background:#1a2130;border-radius:8px;z-index:1}
details.ch>summary .mut{font-weight:400;margin-left:6px}
table{border-collapse:collapse;width:100%;table-layout:fixed}
td{border-top:1px solid #222a38;padding:4px 8px;vertical-align:top}
td.tc{width:92px;font-variant-numeric:tabular-nums;color:#8fc3ff;cursor:pointer;font-size:12px;white-space:nowrap}
td.tc:hover{text-decoration:underline}
td.zh{width:38%;color:#aeb8c8;font-size:13px}body.nozh td.zh{display:none}
td.ko{font-size:14.5px}
tr.dim{display:none}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#000c;padding:6px 14px;border-radius:8px;display:none;z-index:99}
.md h2{font-size:16px;margin:18px 0 6px;color:var(--acc)}.md table td,.md table th{border:1px solid var(--line);padding:5px 8px;font-size:13px;text-align:left;vertical-align:top}.md th{background:#202838}
footer{margin-top:30px;color:var(--mut);font-size:12px;text-align:right}
#open{position:fixed;left:6px;top:6px;z-index:15}
</style></head><body>
<div id="side"><div id="brand"><b>📜 대본</b> <span class="by">by Hermes · Opus</span>
<div class="mut" style="margin-top:4px">중국 SNS 한국 영상 · 중국어 원문 + 한국어 번역 · 타임코드</div>
<div class="row"><button id="exp">모두 펼치기</button><button id="col">모두 접기</button><button id="hide">◀ 숨기기</button></div>
<div class="row"><a href="../" style="font-size:12px">← 수집 허브로</a> · <a href="#guide" style="font-size:12px">📋 형식 비교·사용법</a></div></div>
<div id="menu"></div></div>
<button id="open" style="display:none">☰ 메뉴</button>
<div id="main"><div id="view"></div><footer>by Hermes · Opus — ASR: FunASR (fsmn-vad + paraformer-zh + ct-punc + fa-zh 강제정렬) · 번역·태깅·요약: Claude Opus</footer></div>
<div id="toast"></div>
<script>
var CATC={"여행":"#5a1a2b","쇼핑":"#123d2a","음식":"#6b3a12","게임/PC방":"#0b0b0b","뷰티":"#5b2150","의료":"#1b3a5c","건강":"#1b3a5c","자동차":"#3a3f47","가전":"#24414a","반도체/경제":"#2d2a5a","유학/생활":"#3d4a1a","문화":"#4a2a1a","기타":"#2a2f3a"};
var IDX=[],CUR=null,F={only:false,q:''};
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tc(ms){ms=+ms;var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':':'')+(h&&m<10?'0':'')+m+':'+(x<10?'0':'')+x}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(function(){e.style.display='none'},1400)}
function mmss(s){var p=String(s||'').split(':').map(Number);return p.length==3?(p[0]*3600+p[1]*60+p[2])*1000:(p[0]*60+(p[1]||0))*1000}
$('hide').onclick=function(){document.body.classList.add('hide');$('open').style.display='block'};
$('open').onclick=function(){document.body.classList.remove('hide');this.style.display='none'};
$('exp').onclick=function(){document.querySelectorAll('.cat').forEach(function(c){c.classList.remove('closed')});document.querySelectorAll('details.ch').forEach(function(d){d.open=true})};
$('col').onclick=function(){document.querySelectorAll('.cat').forEach(function(c){c.classList.add('closed')});document.querySelectorAll('details.ch').forEach(function(d){d.open=false})};
fetch('data/index.json?'+Date.now()).then(function(r){return r.json()}).then(function(j){IDX=j.videos;menu();route()});
window.onhashchange=route;
function menu(){var m=$('menu');m.innerHTML='';var g={};IDX.forEach(function(v){var c=v.cat||'기타';(g[c]=g[c]||[]).push(v)});
Object.keys(g).forEach(function(c){var d=document.createElement('div');d.className='cat';var col=CATC[c]||CATC['기타'];d.style.background=col;
var done=g[c].filter(function(v){return v.done}).length;
d.innerHTML='<div class="h">'+esc(c)+' <span class="mut" style="color:#ffffffb0;font-weight:400">'+done+'/'+g[c].length+'</span></div><div class="b"></div>';
d.firstChild.onclick=function(){d.classList.toggle('closed')};
g[c].forEach(function(v){var a=document.createElement('a');a.className='vi'+(v.done?'':' todo');a.href='#'+v.id;a.dataset.id=v.id;
a.innerHTML=esc(v.id)+' '+esc(v.title)+'<small>'+(v.done?('⏱ '+tc(v.dur_ms)+' · '+v.n+'줄 · 👍'+v.good+' 👎'+v.bad+' ★'+v.key):'⏳ 대기')+'</small>';
d.lastChild.appendChild(a);var s=document.createElement('div');s.className='sub';s.id='sub-'+v.id;d.lastChild.appendChild(s)});m.appendChild(d)})}
function route(){var h=decodeURIComponent(location.hash.slice(1));if(!h||h=='guide'){guide();return}var id=h.split('@')[0];var v=IDX.filter(function(x){return x.id==id})[0];if(!v){guide();return}
document.querySelectorAll('.vi').forEach(function(a){a.classList.toggle('on',a.dataset.id==id)});
if(!v.done){$('view').innerHTML='<h1>'+esc(v.id)+' '+esc(v.title)+'</h1><div class="card">⏳ 아직 처리 전입니다.</div>';return}
if(CUR&&CUR.id==id){jump(h);return}
fetch('data/'+encodeURIComponent(id)+'.json?'+Date.now()).then(function(r){return r.json()}).then(function(d){CUR=d;render(d);jump(h)})}
function jump(h){var p=h.split('@')[1];if(!p)return;var e=document.getElementById('L'+p);if(e){var dd=e.closest('details');if(dd)dd.open=true;e.scrollIntoView({block:'center'});e.style.outline='2px solid #e7c17b';setTimeout(function(){e.style.outline=''},1500)}}
function line(x,i){var ko=esc(x.ko),tag='';
if(x.t=='good'||x.t=='bad'||x.t=='eval'){ko='<mark class="y">'+ko+'</mark>';tag='<span class="tg '+x.t+'">'+({good:'👍 한국 좋음',bad:'👎 한국 나쁨',eval:'⚖ 비교평가'})[x.t]+'</span>'}
if(x.t=='key'){ko='<span class="red">'+ko+'</span>';tag='<span class="tg key">★ 핵심</span>'}
return '<tr id="L'+i+'" data-t="'+x.t+'"><td class="tc" data-ms="'+x.s+'" title="클릭: 타임코드 복사">'+tc(x.s)+'</td><td class="zh">'+esc(x.zh)+'</td><td class="ko">'+tag+ko+'</td></tr>'}
function render(d){var L=d.lines,ch=(d.chapters||[]).map(function(c){return{at:mmss(c.at),h:c.h}}).sort(function(a,b){return a.at-b.at});
if(!ch.length||ch[0].at>0)ch.unshift({at:0,h:'시작'});
var cnt={good:0,bad:0,eval:0,key:0};L.forEach(function(x){if(cnt[x.t]!=null)cnt[x.t]++});
var col=CATC[d.cat]||CATC['기타'],base='data/'+encodeURIComponent(d.id);
var h='<h1>'+esc(d.id)+' · '+esc(d.title)+'</h1><div><span class="badge" style="background:'+col+';border:1px solid #fff3">'+esc(d.cat||'기타')+'</span><span class="mut">⏱ '+tc(d.dur_ms)+' · '+L.length+'줄 · ASR '+d.asr_s+'초 · 번역: '+esc(d.mt)+' · <b style="color:var(--acc)">'+esc(d.by)+'</b></span></div>';
h+='<div class="card"><b>요약</b><div>'+esc(d.sum||'').replace(/\n/g,'<br>')+'</div>'+(d.review?'<div class="mut" style="margin-top:4px">'+esc(d.review)+'</div>':'')+'<div style="margin-top:6px"><b>한국 평가:</b> <mark class="y">'+esc(d.verdict||'')+'</mark></div>';
if(d.hooks&&d.hooks.length)h+='<div style="margin-top:6px"><b>훅 후보:</b><ul style="margin:3px 0">'+d.hooks.map(function(x){return '<li class="red">'+esc(x)+'</li>'}).join('')+'</ul></div>';
h+='<div style="margin-top:6px" class="mut">⬇ 편집용 파일: <a href="'+base+'.ko.srt" download>한국어 SRT</a> · <a href="'+base+'.zh.srt" download>중국어 SRT</a> · <a href="'+base+'.zh-ko.srt" download>이중 SRT</a> · <a href="'+base+'.script.tsv" download>대본 TSV(엑셀)</a> · <a href="'+base+'.json" target="_blank">JSON</a></div></div>';
h+='<div class="card legend"><span><mark class="y">노란 형광</mark> 한국 평가(👍좋음 👎나쁨 ⚖비교)</span><span class="red">빨간 글씨 = 핵심 문장</span><span class="mut">👍'+cnt.good+' 👎'+cnt.bad+' ⚖'+cnt.eval+' ★'+cnt.key+'</span><br>'
+'<label><input type="checkbox" id="only"> 표시된 문장만 보기</label> <label><input type="checkbox" id="nozh"> 중국어 숨기기</label> <input id="q" placeholder="검색 (한/중)" style="width:200px"> <button id="cpk">한국어 대본 전체 복사</button> <button id="cpm">표시 문장만 복사</button></div>';
for(var c=0;c<ch.length;c++){var a=ch[c].at,b=c+1<ch.length?ch[c+1].at:1e12;var rows='';var n=0;
L.forEach(function(x,i){if(x.s>=a&&x.s<b){rows+=line(x,i);n++}});if(!n)continue;
h+='<details class="ch" open id="C'+c+'"><summary>'+tc(a)+' '+esc(ch[c].h)+'<span class="mut">'+n+'줄</span></summary><table>'+rows+'</table></details>'}
$('view').innerHTML=h;window.scrollTo(0,0);
var sub=document.querySelectorAll('.sub');sub.forEach(function(s){s.innerHTML=''});var sb=$('sub-'+d.id);
if(sb)sb.innerHTML=ch.map(function(x,c){return '<a data-c="'+c+'">'+tc(x.at)+' '+esc(x.h)+'</a>'}).join('');
if(sb)sb.querySelectorAll('a').forEach(function(a){a.onclick=function(){var e=$('C'+a.dataset.c);if(e){e.open=true;e.scrollIntoView()}}});
$('only').onchange=function(){F.only=this.checked;filt()};$('q').oninput=function(){F.q=this.value.trim();filt()};
$('nozh').onchange=function(){document.body.classList.toggle('nozh',this.checked)};
$('cpk').onclick=function(){cp(L.map(function(x){return '['+tc(x.s)+'] '+x.ko}).join('\n'))};
$('cpm').onclick=function(){cp(L.filter(function(x){return x.t}).map(function(x){return '['+tc(x.s)+'] ('+x.t+') '+x.ko+'  / '+x.zh}).join('\n'))};
document.querySelectorAll('td.tc').forEach(function(t){t.onclick=function(){cp(t.textContent+' '+t.parentNode.querySelector('.ko').textContent)}})}
function filt(){document.querySelectorAll('#view tr').forEach(function(r){var ok=(!F.only||r.dataset.t)&&(!F.q||r.textContent.indexOf(F.q)>=0);r.classList.toggle('dim',!ok)})}
function cp(t){navigator.clipboard.writeText(t).then(function(){toast('복사됨')})}
function guide(){document.querySelectorAll('.vi').forEach(function(a){a.classList.remove('on')});
fetch('guide.html?'+Date.now()).then(function(r){return r.text()}).then(function(t){$('view').innerHTML='<div class="md">'+t+'</div>'})}
</script></body></html>
