<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/data.js"></script>
{% block pagejs %}{% endblock %}
<script src="assets/app.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html">🐾 김햄찌 떡상 분석</a>
    <nav class="pagenav">
      <a href="index.html" class="{{ 'on' if active == 'index' else '' }}">개요·Top10</a>
      {% for p in pages %}<a href="{{ p.key }}.html" class="{{ 'on' if active == p.key else '' }}">{{ p.rank }}위</a>{% endfor %}
    </nav>
    <div class="controls">
      <label for="animal">바꿀 동물</label><select id="animal" aria-label="바꿀 동물"></select>
      <span id="customWrap" class="hide"><input id="customAnimal" placeholder="영어 외형 묘사 (a fluffy ...)" aria-label="직접 입력 동물 묘사"><input id="customPun" placeholder="말장난 글자" style="width:6em" aria-label="말장난 글자"></span>
      <label for="acc">소품</label><select id="acc" aria-label="시그니처 소품"></select>
      <label for="heroName">이름</label><input id="heroName" style="width:7em" aria-label="주인공 이름">
      <button id="themeBtn" class="theme-btn" type="button" title="밝게/어둡게">◐</button>
    </div>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="wrap">
  분석 기준일 {{ today }} · 데이터: YouTube 공개 정보(yt-dlp), 프레임 분석(OpenCV), 음성 받아쓰기(로컬 faster-whisper), 모델 사양(Pollo 모델 목록 조회) ·
  원본 영상의 캡처는 분석·학습용 로컬 자료입니다. 외부 공유·재업로드 금지.
</footer>
</body>
</html>
